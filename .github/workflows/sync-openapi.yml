name: sync-openapi

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: chainupcloud/dex-os
          ref: main
          ssh-key: ${{ secrets.DEXOS_DEPLOY_KEY }}
          path: upstream
          sparse-checkout: web/gitbook
          fetch-depth: 1

      - id: diff
        run: |
          src=upstream/web/gitbook/openapi-v1.yaml
          src_zh=upstream/web/gitbook/openapi-v1.zh.yaml
          if [ ! -f "$src" ] || [ ! -f "$src_zh" ]; then
            echo "::notice::dex-os main has no web/gitbook/openapi-v1.yaml and openapi-v1.zh.yaml yet"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s "$src" api/openapi-v1.yaml && cmp -s "$src_zh" api/openapi-v1.zh.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git -C upstream rev-parse HEAD)
          branch="sync/openapi-${sha:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "sha=$sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.diff.outputs.sha }}
          BRANCH: ${{ steps.diff.outputs.branch }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml==6.0.2
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          cp upstream/web/gitbook/openapi-v1.yaml api/openapi-v1.yaml
          cp upstream/web/gitbook/openapi-v1.zh.yaml api/openapi-v1.zh.yaml
          sed -i -E "s|^(\`openapi-v1(\.zh)?\.yaml\` 原样复制自 dex-os )\`[a-z-]+\` 分支提交 \`[0-9a-f]{40}\`|\1\`main\` 分支提交 \`$SHA\`|" api/README.md
          [ "$(grep -c "\`main\` 分支提交 \`$SHA\`" api/README.md)" = 2 ]
          git add api/openapi-v1.yaml api/openapi-v1.zh.yaml api/README.md
          git commit -q -m "api: sync openapi-v1.yaml to dex-os main ${SHA:0:12}"
          spec=$(git rev-parse HEAD)

          pages=$(python3 scripts/gen_pages.py . "$spec")
          grep -rlE 'dex-os-docs/[0-9a-f]{40}/api/openapi-v1(\.zh)?\.yaml' content \
            | xargs sed -i -E "s#dex-os-docs/[0-9a-f]{40}/api/openapi-v1(\.zh)?\.yaml#dex-os-docs/$spec/api/openapi-v1\1.yaml#g"
          git add -A content
          git commit -q -m "docs(api): regenerate API pages pinned to ${spec:0:12}"
          git push -q origin "$BRANCH"

          body=$(printf '%s\n' \
            "Automated copy of \`web/gitbook/openapi-v1.yaml\` and \`openapi-v1.zh.yaml\` from dex-os \`main\` at \`$SHA\`." \
            "" \
            "- Spec copy and \`api/README.md\` source commit: first commit (\`$spec\`)." \
            "- API pages regenerated by \`scripts/gen_pages.py\` and every spec link pinned to \`$spec\`." \
            "- Operations per page: \`$pages\`" \
            "" \
            "Review the spec diff and the GitBook preview status before merging; merging publishes to GitBook.")
          url=$(gh pr create --base main --head "$BRANCH" --title "api: sync OpenAPI to dex-os main ${SHA:0:12}" --body "$body")

          gh pr list --state open --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"sync/openapi-\")) | select(.headRefName != \"$BRANCH\") | .number" \
            | while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by $url"; done
