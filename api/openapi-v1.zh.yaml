                      "$ref": "#/components/schemas/Price"
                  ts:
                    type: integer
                    format: int64
                    description: "Unix 毫秒"
                  window24h:
                    type:
                      - object
                      - "null"
                    description: "统计覆盖的滚动 24 小时窗口；统计不可用时为 `null`"
                    properties:
                      from:
                        type: integer
                        format: int64
                        description: "窗口起点（含，按分钟对齐），Unix 毫秒"
                      to:
                        type: integer
                        format: int64
                        description: "锚点：最新已投影区块的时间，Unix 毫秒"
  "/v1/requests/{requestId}":
    get:
      tags:
        - Account
      summary: "请求回执"
      description: |-
        查询发送到 `POST /v1/commands` 的命令的回执。查询参数：`digest` 或 `wait=match`。响应从不缓存。

        `status`：

        - `Accepted`（200）：已接纳，nonce 已消耗，尚无结果；继续轮询。
        - `Executed`（200）：已处理。`outcome` 为 `Succeeded` 或 `Failed`（`stableError` / `errorCode`）；详情见
          `events`（`{kind, data}`）、`businessRejected`、`seq` / `sub`，批量命令逐项见 `items`。`resultsPending`
          为 `true` 时，`outcome` / `events` 为 `null`：继续轮询。只表示命令本身完成：目标治理提案不一定已执行，
          提款不一定已最终到账。
        - `AuthorizationRejected`（200）：已定序但未通过授权；nonce 未被消耗；原因见 `stableError` / `errorCode`，
          日志位置见 `position`。仅在节点的近期结果窗口内这样报告，之后为 `Unknown`。
        - `Unknown`（404）：本节点没有记录。这**不能**证明命令从未执行；`nonceConsumed` 为 `null`。
        - `Conflict`（409）：账本记录的签名版本与你的 `digest` 不同（响应中返回）；不是你所签版本的成功。

        `source`：`ActionReceipt`（签名命令）、`RegistrationState`（账户注册：`accountId`、`policyId`、
        `policyHash`）、`CertifiedTimeState`（时间证书）、`ResultWindow` / `ResultHistory`（回执过期后留存的执行结果）。

        请发送 `x-dexos-min-seq: <seq>`，这样落后的节点返回 412 而不是 `Unknown`。预言机轮次和链上事实证书没有回执。
      operationId: v1_request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            pattern: "^(account:[0-9]+|agent:0x[0-9a-fA-F]{40}|owner:0x[0-9a-fA-F]{40})$"
          description: "不支持（400 `unsupported_request_parameter`）；请用 `digest` 锁定所签版本"
        - name: nonce
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "不支持（400 `unsupported_request_parameter`）；请用 `digest` 锁定所签版本"
        - name: commandHash
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "不支持（400 `unsupported_request_parameter`）；请用 `digest` 锁定所签版本"
        - name: digest
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
          description: "可选：`POST /v1/commands` 为你所签版本返回的 `digest`（同一请求 ID 可多次签名）；另一版本的回执返回 409 `Conflict`，其授权拒绝不返回"
        - name: wait
          in: query
          required: false
          schema:
            type: string
            enum:
              - match
          description: "`match`（不能与 `digest` 同用）：下单类命令撮合完成即返回结果，最多等 5 秒（`stage: \"matched\"`，`source: \"MatchReceipt\"`）；否则与不带该参数时相同，已落定的带 `stage: \"folded\"`"
      responses:
        "200":
          description: "请求已知：`status` 为 `Accepted`、`Executed` 或 `AuthorizationRejected`"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - executed
                          - rejected
                          - pending
                      epoch:
                        type: string
                      seq:
                        type: integer
                        format: uint64
                        description: "日志序号（与提交响应的 `seq` 及 `x-dexos-seq` 处于同一坐标轴）"
                      sub:
                        type: integer
                      requestId:
                        type: string
                      signer:
                        type: string
                      nonceScope:
                        type: string
                      nonce:
                        type: integer
                      nonceConsumed:
                        type: boolean
                      reason:
                        type: string
                        description: "仅被拒绝时出现：对应的 `CoreError`"
                      events:
                        type: array
                        items:
                          type: object
                      items:
                        type: array
                        items:
                          type: object
                        description: "每个批量输入一项：`inputIndex`、`kind`、`state`、`orderId` / `replacedOrderId`。`BatchReplace3` 中按位置引用更早命令新单的撤单或改单项，回显 `ref` `{market, seq, sub, item}`"
                      source:
                        type: string
                  - "$ref": "#/components/schemas/RequestMatched"
        "400":
          description: "请求 ID、`digest` 或 `x-dexos-min-seq` 格式错误，或使用了不支持的查询参数（`invalid_request_id`、`invalid_request_digest`、`invalid_min_seq`、`unsupported_request_parameter`）；不说明该请求的任何情况"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
        "404":
          description: "`status: \"Unknown\"`：本节点没有记录。这不能证明命令未执行；请保留原命令，稍后或换一个节点再查"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - "$ref": "#/components/schemas/Error"
        "409":
          description: "`status: \"Conflict\"`（`request_digest_conflict`）：账本记录的是另一个签名版本（响应中带其 `digest`）；不是你所签版本的成功"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - "$ref": "#/components/schemas/Error"
        "412":
          description: "`read_view_behind`：本节点（`hostLogIndex`）尚未到达你发送的 `x-dexos-min-seq`（`requiredSeq`）；稍后重试或换一个节点"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
        "503":
          description: "暂时无法读取回执（`ledger_state_unavailable`、`receipt_inconsistent`、`result_unavailable`），健康节点也可能出现。503 不代表失败：继续查询该 `requestId`；切勿重签"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
  /v1/tickers:
