        - 24 小时窗口是截至最新已投影区块时间（而非墙钟）的 1440 根一分钟 K 线，因此与 1 分钟 K 线一致。
        - 统计最多滞后 5 秒。统计不可用时，`window24h` 及六个 24 小时字段全部为 `null`；实时价格不受影响。
