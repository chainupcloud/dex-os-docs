            - Failed
        stableError:
          type: string
        errorCode:
          type: integer
        businessRejected:
          type: string
          nullable: true
          description: "订单被拒的原因（例如 `InsufficientMargin`、`PostOnlyWouldCross`）；被接受时为 `null`"
        items:
          type: array
          items:
