          description: "游标：上一页的 `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "首页返回的账本纪元；给出 `after` 时须与 `upper` 一起提供（账本已重置时返回 409 `history_epoch_mismatch`）"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "首页返回的固定上界；给出 `after` 时须与 `epoch` 一起提供（否则 400）。超出该副本的完整历史：400 `GatewayHistoryIncomplete`，请稍后重试"
