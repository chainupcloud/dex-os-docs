    get:
      tags:
        - Account
      summary: "账户价值与盈亏历史"
      description: |-
        账户价值、盈亏和净流入随时间的变化，以及窗口统计。各点来自每分钟一次的采样（不回填、不插值）。

        - `perp`：USDC 风险组的净保证金（= `/v1/account` 的 `equity`）；`total`：所有保证金组加金库份额，按最近的 USDC 现货成交价估值（无价格的代币见 `unvaluedTokens`）。
        - `pnl = accountValue - cumulative net inflow`；`history[]` 相对于窗口第一个点。
        - 跨越缺失执行历史的区间不计盈亏，列在 `gaps` 中。
      operationId: v1_portfolio
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "主钱包地址"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "0 = 主账户（该地址编号最小的单签账户）；N >= 1 = 其序号为 N 的子账户"
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum:
              - "24h"
              - "7d"
              - "30d"
              - all
          description: "采样间隔：`24h` → `5m`，`7d` → `1h`，`30d` → `4h`，`all` → 在 `5m` / `1h` / `4h` / `1d` 中取点数不超过 500 的最细间隔"
      responses:
