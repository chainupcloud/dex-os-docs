            manager:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "经理类余额 / 经理份额（比值）；没有份额时为 `null`"
        config:
          "$ref": "#/components/schemas/VaultConfig"
        whitelist:
          type:
            - array
            - "null"
          items:
            "$ref": "#/components/schemas/VaultMarket"
          description: "`null` = 允许所有市场；否则只允许这些（空列表 = 都不允许）"
        blacklist:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarket"
        maxLeverages:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMaxLeverage"
          description: "各市场的杠杆上限；无上限的市场不出现"
        depositorWhitelist:
          type: array
          items:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "为空 = 任何人都可以存入"
        depositorCount:
          type: integer
        createdAtMs:
          type:
            - integer
            - "null"
          description: "金库创建时的区块时间；首个区块之前为 `null`"
        aprPpm:
          type:
            - integer
            - "null"
          description: "统计窗口内的年化收益，ppm；无法计算时为 `null`"
        maxDrawdownPpm:
          type:
            - integer
            - "null"
          description: "统计窗口内每份额净值的最大回撤，ppm；无法计算时为 `null`"
        netReturnPpm:
          type:
            - integer
            - "null"
          description: "`pnl / totalDeposits`，ppm；没有本金时为 `null`"
        inceptionAprPpm:
          type:
            - integer
            - "null"
          description: "按金库存续时间年化的净收益，ppm；没有本金或成立不满一天时为 `null`"
        utilizationPpm:
          type:
            - integer
            - "null"
          description: "主账户初始保证金要求（IMR）/ 权益，ppm；权益不为正但已占用保证金时为 `null`"
        profitSharePpm:
          type: integer
          description: "`config.profitSharePpm` 的旧版别名"
        marketVaults:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarketStatus"
        authorizedManager:
          type:
            - string
            - "null"
          description: "账本已确认授权的经理主钱包；没有时为 `null`。权限检查以此字段为准"
        confirmedTradingHalt:
          type: boolean
          description: "账本最后确认的交易暂停状态；执行以 `tradingHalt` 为准"
        pendingClaim:
          type:
            - object
            - "null"
          required:
            - logIdx
            - ordinal
            - slot
            - status
          properties:
            logIdx:
              type: string
              pattern: "^[0-9]+$"
              description: "原始认领请求的日志索引；十进制字符串"
            ordinal:
              type: integer
              minimum: 0
              maximum: 65535
            slot:
              type: integer
              minimum: 0
              maximum: 4095
            status:
              type: string
              enum:
                - pending
          description: "等待确认的经理认领，没有时为 `null`；`logIdx` / `ordinal` 标识原始认领请求"
    VaultConfig:
      type: object
      required:
        - profitSharePpm
        - depositMinDurationMs
        - managerMinPortionPpm
        - managerLiqPortionPpm
        - withdrawWindowS
        - withdrawDurationS
        - depositCap
      properties:
        profitSharePpm:
          type: integer
          description: "金库经理的利润分成，ppm"
        depositMinDurationMs:
          type: integer
          description: "每笔存入的锁定期（毫秒）"
        managerMinPortionPpm:
          type:
            - integer
            - "null"
          description: "金库经理的最低持有比例，ppm；`null` = 不限"
        managerLiqPortionPpm:
          type:
            - integer
            - "null"
          description: "金库经理持有比例低于此值时金库停止交易（撤单并平仓），ppm；`null` = 不设"
        withdrawWindowS:
          type:
            - integer
            - "null"
          description: "赎回窗口周期，秒；`null` = 随时可赎回"
        withdrawDurationS:
          type:
            - integer
            - "null"
          description: "每个窗口中开放部分的时长，秒"
        depositCap:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "存入上限，USDC；`null` = 不限"
    VaultDepositors:
      type: object
      required:
        - vault
        - lpShares
        - managerShares
        - totalShares
        - depositors
        - count
        - truncated
      properties:
        vault:
          type: integer
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: "LP 份额单位"
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: "金库经理份额单位"
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: "全部份额"
        depositors:
          type: array
          items:
            type: object
            required:
              - address
              - class
              - shares
              - equity
              - sharePpm
            properties:
              address:
                type:
                  - string
                  - "null"
                pattern: "^0x[0-9a-f]{40}$"
                description: "存入者的主钱包；内部账户为 `null`"
              class:
                type: string
                enum:
                  - lp
                  - manager
              shares:
                type: string
                pattern: "^[0-9]+$"
                description: "份额单位（整数）"
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "份额价值，USDC"
              sharePpm:
                type:
                  - integer
                  - "null"
                description: "在其份额类别中的占比，ppm；该类别没有份额时为 `null`"
        count:
          type: integer
        truncated:
          type: boolean
    VaultDetail:
      allOf:
        - "$ref": "#/components/schemas/Vault"
        - type: object
          required:
            - nextNonce
            - availableToWithdraw
            - positions
            - nextWithdrawWindow
            - metricWindow
          properties:
            nextNonce:
              type: integer
              description: "金库主账户的下一个 nonce（= `GET /v1/account/nonce?vault=`）"
            availableToWithdraw:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "金库主账户可提取金额，USDC"
            positions:
              type: array
              items:
                "$ref": "#/components/schemas/Position"
              description: "金库仓位，与 `GET /v1/account/positions?vault=` 的行相同"
            nextWithdrawWindow:
              type:
                - object
                - "null"
              description: "`{opensAtMs, closesAtMs, open}`；`null` = 随时可赎回"
            metricWindow:
              type: object
              required:
                - fromMs
                - toMs
                - bucketMs
                - points
              properties:
                fromMs:
                  type: integer
                toMs:
                  type: integer
                bucketMs:
                  type: integer
                points:
                  type: integer
    VaultList:
      type: object
      required:
        - vaults
        - metricWindowMs
      properties:
        vaults:
          type: array
          items:
            "$ref": "#/components/schemas/Vault"
        metricWindowMs:
          type: integer
          description: "`aprPpm` / `maxDrawdownPpm` 的统计窗口"
    VaultMarket:
      type: object
      required:
        - symbol
        - kind
      properties:
        symbol:
          type: string
          description: "市场符号，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；永续和现货市场可能共用符号，`symbol` + `kind` 唯一确定一个市场"
    VaultMarketStatus:
      type: object
      required:
        - symbol
        - kind
        - status
      properties:
        symbol:
          type: string
          description: "市场代码，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；永续和现货市场可能同名，`symbol` + `kind` 唯一确定一个市场"
        status:
          type: string
          description: "各市场子金库的状态（`Quoting` / `StandBy` / `CloseOnly` / `Deactivated`）"
    VaultMaxLeverage:
      type: object
      required:
        - symbol
        - kind
        - maxLeverage
      properties:
        symbol:
          type: string
          description: "市场符号：`BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；`symbol` + `kind` 唯一确定一个市场（永续和现货市场可能同名）"
        maxLeverage:
          type: integer
    VaultNav:
      type: object
      required:
        - vault
        - bucketMs
        - fromMs
        - points
        - truncated
      properties:
        vault:
          type: integer
        bucketMs:
          type: integer
        fromMs:
          type: integer
        points:
          type: array
          items:
            type: object
            required:
              - tsMs
              - equity
              - totalShares
              - navPerShare
            properties:
              tsMs:
                type: integer
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "金库权益，USDC"
              totalShares:
                type: string
                pattern: "^[0-9]+$"
                description: "流通份额"
              navPerShare:
                type:
                  - string
                  - "null"
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "每份额权益；无份额时为 `null`"
        truncated:
          type: boolean
          description: "已达到 `limit`：请缩小 `from` 起的时间范围，或加大 `interval`"
    CommandAccepted:
      type: object
      required:
        - status
        - requestId
        - digest
        - commandHash
        - seq
        - sub
        - executionKnown
        - nonceConsumed
        - duplicate
        - networkId
        - genesisHash
        - manifestHash
        - ledgerEpoch
      properties:
        networkId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        genesisHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        manifestHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        ledgerEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: "账本纪元；十进制字符串"
        status:
          type: string
          enum:
            - Accepted
        requestId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        digest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        commandHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        seq:
          type: string
          pattern: "^[0-9]+$"
          description: "命令被定序时的日志位置（主机日志索引）；十进制字符串"
        sub:
          type: integer
          minimum: 0
          maximum: 65535
        executionKnown:
          type: boolean
          enum:
            - false
        nonceConsumed:
          type: boolean
          nullable: true
          enum:
            - null
        duplicate:
          type: boolean
          enum:
            - false
        resultsPending:
          type: boolean
          enum:
            - true
          description: "仅在 `wait=match` 时出现：限时内没有结果"
    RequestFact:
      type: object
      required:
        - networkId
        - genesisHash
        - manifestHash
        - ledgerEpoch
        - requestId
        - status
        - executionKnown
        - nonceConsumed
        - historyComplete
        - certification
        - anchor
        - position
        - digest
        - inputSeq
        - hostLogIndex
        - inputPrefix
      properties:
        networkId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        genesisHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        manifestHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        ledgerEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: "账本纪元；十进制字符串"
        requestId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        digest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          nullable: true
        status:
          type: string
          enum:
            - Unknown
            - Accepted
            - Executed
            - Conflict
        executionKnown:
          type: boolean
        nonceConsumed:
          type: boolean
          nullable: true
        historyComplete:
          type: boolean
          enum:
            - false
        certification:
          nullable: true
          enum:
            - null
          type: object
        anchor:
          nullable: true
          enum:
            - null
          type: object
        position:
          type: object
          nullable: true
          required:
            - inputSeq
            - hostLogIndex
            - commandOrdinal
            - relayOrdinal
          properties:
            inputSeq:
              type: string
              pattern: "^[0-9]+$"
              description: "十进制字符串"
            hostLogIndex:
              type: string
              pattern: "^[0-9]+$"
              description: "十进制字符串"
            commandOrdinal:
              type: integer
              minimum: 0
            relayOrdinal:
              type: integer
              nullable: true
              minimum: 0
        inputSeq:
          type: string
          pattern: "^[0-9]+$"
          description: "十进制字符串"
        hostLogIndex:
          type: string
          pattern: "^[0-9]+$"
          description: "十进制字符串"
        inputPrefix:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        source:
          type: string
          enum:
            - ActionReceipt
            - RegistrationState
            - CertifiedTimeState
        nonce:
          type: string
          pattern: "^[0-9]+$"
          description: "请求的 nonce；十进制字符串"
        outcome:
          type: string
          nullable: true
          description: "`Succeeded` 或 `Failed`；`resultsPending` 期间为 `null`。业务拒绝见 `businessRejected`。已覆盖该命令的结果来源缺少结果或报错时返回 503 `result_unavailable`"
          enum:
            - Succeeded
            - Failed
            - null
        resultsPending:
          type: boolean
          description: "尚无结果来源确认覆盖这条命令时为 `true`；此时 `events` / `outcome` 为 `null`，请继续轮询。503 绝不表示命令未执行，也不意味着可以安全重新提交"
        stableError:
          type: string
        errorCode:
          type: integer
          minimum: 0
          maximum: 255
        resultDigest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        accountId:
          type: integer
          minimum: 0
        policyId:
          type: string
          pattern: "^[0-9]+$"
          description: "策略 ID；十进制字符串"
        policyHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        certificateHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        setEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: "十进制字符串"
        globalSequence:
          type: string
          pattern: "^[0-9]+$"
          description: "十进制字符串"
        timestampMs:
          type: string
          pattern: "^[0-9]+$"
          description: "Unix 毫秒；十进制字符串"
        error:
          type: string
    CommandError:
      allOf:
        - "$ref": "#/components/schemas/Error"
        - type: object
          required:
            - executionKnown
            - nonceConsumed
          description: "命令端点在 `error` 旁另带结果字段；与原因相关的上下文（`clientOrderId`、被拒的 `leg` 等）在 `error.details` 里"
          properties:
            status:
              type: string
            submissionOutcome:
              type: string
              enum:
                - Unknown
            executionKnown:
              type: boolean
              enum:
                - false
            nonceConsumed:
              type: boolean
              nullable: true
            leader:
              type: string
              pattern: "^[0-9]+$"
              description: "当前主节点（若已知），十进制字符串"
              nullable: true
            hostLogIndex:
              type: string
              pattern: "^[0-9]+$"
              description: "十进制字符串"
            requiredSeq:
              type: string
              pattern: "^[0-9]+$"
              description: "十进制字符串"
    CommandResubmitted:
      allOf:
        - "$ref": "#/components/schemas/RequestFact"
        - type: object
          required:
            - duplicate
            - seq
            - sub
            - source
            - nonceConsumed
          properties:
            duplicate:
              type: boolean
              enum:
                - true
            source:
              type: string
              enum:
                - ActionReceipt
            seq:
              type: string
              pattern: "^[0-9]+$"
              description: "首次接受时的宿主日志索引（= `position.hostLogIndex`）；十进制字符串"
            sub:
              type: integer
              minimum: 0
              maximum: 65535
              description: "首次接受时的命令序数（= `position.commandOrdinal`）"
            nonceConsumed:
              type: boolean
              enum:
                - true
            events:
              type: array
              nullable: true
              items:
                type: object
              description: "首次执行产生的事件；结果确定前为 `null`，同时 `resultsPending: true`"
    LedgerCut:
      type: object
      description: "所有商户读取所依据的已发布账本快照"
      required:
        - networkId
        - genesisHash
        - ledgerEpoch
        - manifestHash
        - inputSeq
        - hostLogIndex
        - inputPrefix
      properties:
        networkId:
          type: string
          description: "网络 ID（`bytes32`，0x 开头的十六进制）"
        genesisHash:
          type: string
          description: "创世哈希（`bytes32`，0x 开头的十六进制）"
        ledgerEpoch:
          type: string
          description: "账本纪元，十进制字符串"
        manifestHash:
          type: string
          description: "Manifest 哈希（`bytes32`，0x 开头的十六进制）"
        inputSeq:
          type: string
          description: "该快照点的账本输入序号，十进制字符串"
        hostLogIndex:
          type: string
          description: "该快照点的宿主日志下标，十进制字符串"
        inputPrefix:
          type: string
          description: "该快照点的账本输入前缀（`bytes32`，0x 开头的十六进制）"
    DexRegistration:
      type: object
      required:
        - dex
        - shortName
        - state
        - tradingEnabled
        - disabled
        - configVersion
        - configHash
        - currentOwner
        - ownerKind
        - registration
        - privateFeeds
        - marketCount
      properties:
        dex:
          type: integer
          description: "交易所 ID"
        shortName:
          type: string
          description: "注册时确定的短名：2–8 位大写字母和数字，以字母开头，`MAIN` 为保留名；唯一"
          pattern: "^[A-Z][A-Z0-9]{1,7}$"
        state:
          type: string
          description: "注册状态"
          enum:
            - Configured
        tradingEnabled:
          type: boolean
        disabled:
          type: boolean
          description: "理事会已禁用该交易所"
        configVersion:
          type: string
          description: "交易所配置版本，十进制字符串"
        configHash:
          type: string
          description: "交易所配置哈希（`bytes32`，0x 开头的十六进制）"
        currentOwner:
          type: object
          required:
            - account
            - policyId
            - policyEpoch
            - ownerEpoch
          properties:
            account:
              type: integer
              description: "当前所有者账户；交易所归理事会所有时为 0"
            policyId:
              type: string
              nullable: true
              description: "所有者账户的策略 ID，十进制字符串；交易所归理事会所有时为 `null`"
            policyEpoch:
              type: string
              nullable: true
              description: "所有者的策略纪元，十进制字符串；交易所归理事会所有时为 `null`"
            ownerEpoch:
              type: string
              description: "交易所所有者纪元，十进制字符串"
        ownerKind:
          type: string
          enum:
            - account
            - council
          description: "交易所的所有者类型：`account`（由账户持有，见 `account` 字段）或 `council`（交易所已移交理事会（`TransferDexToCouncil`）；此时所有者账户为 0，策略字段为 `null`）。"
        registration:
          type: object
          description: "不可更改的原始注册信息"
          required:
            - registrationId
            - originalOwnerAccount
            - originalOwnerPolicyId
            - originalOwnerPolicyEpoch
            - expectedAdmissionVersion
            - payload
            - commitment
            - resultDigest
          properties:
            registrationId:
              type: string
              description: "注册 ID（`bytes32`，0x 开头的十六进制）"
            originalOwnerAccount:
              type: integer
              description: "注册该交易所的账户"
            originalOwnerPolicyId:
              type: string
              description: "注册账户的策略 ID，十进制字符串"
            originalOwnerPolicyEpoch:
              type: string
              description: "注册时的策略纪元，十进制字符串"
            expectedAdmissionVersion:
              type: string
              description: "注册执行时的商户准入名单版本（仅供审计），十进制字符串"
            payload:
              type: string
              description: "规范的 `RegisterDexV2` 载荷（0x 开头的十六进制）"
            commitment:
              type: string
              description: "注册承诺值（`bytes32`，0x 开头的十六进制）"
            resultDigest:
              type: string
              description: "注册结果摘要（`bytes32`，0x 开头的十六进制）"
        privateFeeds:
          type: object
          required:
            - count
            - max
          description: "该交易所拥有的私有喂价（所有者 `Dex(n)`）；`max` = 每个交易所的市场数上限（`maxMarketsPerDex`）。不占用共享资源池"
          properties:
            count:
              type: integer
            max:
              type: integer
        marketCount:
          type: integer
          description: "该交易所在账本上的市场数，含已冻结和已终局结算的市场；计入每个交易所的市场数上限"
    MerchantAdmission:
      type: object
      required:
        - version
        - accounts
      properties:
        version:
          type: string
          description: "准入列表版本，理事会每次修改、每次注册交易所时递增；十进制字符串"
        accounts:
          type: array
          items:
            type: integer
          description: "允许注册交易所的账户（升序）；完成注册后即移除"
    OracleRecipe:
      type: object
      required:
        - venues
        - minVenues
        - minWeightBps
        - maxVenueDeviationBps
      properties:
        venues:
          type: array
          description: "按价格来源编号排序"
          items:
            type: object
            required:
              - venue
              - venueName
              - symbol
              - quote
              - weightBps
            properties:
              venue:
                type: integer
                description: "价格来源编号"
              venueName:
                type:
                  - string
                  - "null"
                description: "该价格来源在账本价格来源表中的名称；不在表中时为 `null`"
              symbol:
                type: string
                description: "该价格来源自己的交易对写法，例如 `BTCUSDT` 或 `BTC-USDT`"
              quote:
                type: string
                enum:
                  - USD
                  - USDT
                  - USDC
              weightBps:
                type: integer
                description: "该价格来源的权重（基点）；一个配方的权重合计为 10000"
        minVenues:
          type: integer
        minWeightBps:
          type: integer
        maxVenueDeviationBps:
          type: integer
      description: "配方喂价的价格配方：由哪些价格来源报价、各自的交易对和权重，以及价格必须满足的门槛"
    RecommendedOraclePolicy:
      type: object
      required:
        - feeds
        - setOwner
        - setCurrentEpoch
        - algorithmId
        - algorithmVersion
        - minIndependentSources
        - freshnessMs
        - futureSkewMs
        - parameters
        - parametersHash
        - policyStatus
      properties:
        feeds:
          type: array
          description: "恰好一项：本喂价的当前版本，经平台报价者集合跟随报价"
          items:
            type: object
            required:
              - feedId
              - feedVersion
              - setId
              - setEpoch
            properties:
              feedId:
                type: string
                description: "喂价 ID（64 位整数，以十进制字符串表示）"
              feedVersion:
                type: string
                description: "喂价的当前版本（64 位整数，以十进制字符串表示）；上币时必须签入这个版本"
              setId:
                type: string
                description: "报价者集合 ID（64 位整数，以十进制字符串表示）"
              setEpoch:
                type: string
                description: "\"0\" = 跟随集合的当前纪元，报价者轮换时无需重设策略"
        setOwner:
          type: string
          enum:
            - Protocol
            - Dex
          description: "报价者集合的归属；市场策略只能使用 `Protocol` 集合"
        setCurrentEpoch:
          type: string
          description: "报价者集合的当前纪元（64 位整数，以十进制字符串表示）"
        algorithmId:
          type: integer
          description: "聚合算法（2 = 中位数）"
        algorithmVersion:
          type: integer
          description: "算法版本"
        minIndependentSources:
          type: integer
          description: "形成一轮所需的最少报价者数"
        freshnessMs:
          type: string
          description: "报价的最长有效时间，毫秒（64 位整数，以十进制字符串表示）"
        futureSkewMs:
          type: string
          description: "允许的未来时钟偏差上限，毫秒（64 位整数，以十进制字符串表示）"
        parameters:
          type: object
          required:
            - schemaId
            - schemaVersion
            - fields
          properties:
            schemaId:
              type: integer
              description: "参数结构 ID"
            schemaVersion:
              type: integer
              description: "参数结构版本"
            fields:
              type: array
              description: "中位数算法参数，按字段 ID 排序：1 最大偏离（ppm），2 过期时间（毫秒），3 确认轮数，4 确认窗口（毫秒），5 确认所需的最少来源族数，6 确认区间（ppm）"
              items:
                type: object
                required:
                  - fieldId
                  - kind
                  - value
                properties:
                  fieldId:
                    type: integer
                    description: "字段 ID"
                  kind:
                    type: string
                    description: "值类型：`u64`、`u128`、`i128`、`bool`、`hash` 或 `bytes`"
                  value:
                    type:
                      - string
                      - boolean
                    description: "整数为十进制字符串；`hash` 与 `bytes` 为 0x 开头的十六进制"
          description: "算法参数，按所列内容签名"
        parametersHash:
          type: string
          description: "参数的哈希（`bytes32`，0x 开头的十六进制），与参数一同签名"
        policyStatus:
          type: integer
          description: "1 = 生效"
      description: "市场引用该喂价时要签的预言机政策：平台对主流资产的默认取值，由平台自用的同一段 SDK 代码生成。"
    OracleFeed:
      type: object
      required:
        - instrumentId
        - assetIdentity
        - quoteIdentity
        - priceUnit
        - evidenceSchema
        - sourceType
        - recipe
        - recipeHash
        - recommendedPolicy
        - longTailPolicy
      properties:
        instrumentId:
          type:
            - string
            - "null"
          description: "具名标的资产的标的 ID（`bytes32`，0x 开头的十六进制），其他资产标识为 `null`。平台喂价使用大写基础币名的 keccak256，例如 `keccak256(\"BTC\")`；可直接用 `symbol` 过滤，无需自己计算。"
        assetIdentity:
          type: object
