              description: "代币小数位数；未知时为 `null`"
          additionalProperties: false
        lastPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        oraclePrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        markPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "每小时资金费率（`0.0001` = 0.01%）；现货为 `null`"
        fundingIndex:
          type:
            - string
            - "null"
        lastFundingMs:
          type:
            - integer
            - "null"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "持仓量，以基础单位计"
        openInterestCap:
          type:
            - object
            - "null"
          properties:
