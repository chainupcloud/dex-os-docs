openapi: "3.1.0"
info:
  title: "DEXOS 开放 API v1"
  version: "0.1.0"
  summary: "面向开发者、builder 和流动性提供者的公共 REST + WebSocket 接口"
  description: |-
    DEXOS 公共 API。读取：`GET` 和 WebSocket；**对账本的每一次改动都是一条发送到
    `POST /v1/commands` 的签名命令**，通过 `GET /v1/requests/{requestId}` 确认。旧版写入返回
    `410 legacy_write_disabled`。

    ## 快速上手

    1. `GET /v1/markets` → `symbol`、小数位、`signingMarketId`。
    2. `GET /v1/account/nonce?address=…&lane=trade` → `nonce`、`signingAccountId`（API 钱包签名时加 `&signer=`）。
    3. 用 SDK 签名；`POST /v1/commands` `{"command":"0x…"}` → `202 {requestId, digest, seq}`；轮询
       `GET /v1/requests/{requestId}`，直到 `Executed`。

    ## 签名命令与 nonce

    - 签名者：账户的签名策略（所有者加门限）或已获授权的 API 钱包；超出有效期：
      `SignatureExpired`。
    - 每个签名主体按 `lane` 各有一条独立的 nonce 序列：`trade`、`funds`、`management`（授权、子账户、治理）。
    - 每个 nonce 只能用一次，范围是 `high - 1023`（`high` 为已用最大值）到 `high + 1024` 与账本毫秒时间 + 1 天中的较大者；
      请发送返回的 `nonce`（`NonceBelowFloor`、`NonceAlreadyConsumed`、`AuthorizationNotYetValid`）。被拒不消耗 nonce。

    ## 提交与确认

    - `202` = 已定序，未执行；用 `?digest=` 读取回执。
    - 重发**完全相同**的字节是安全的（`200`，`duplicate: true`）。结果未知时，切勿用新 nonce 重签：两条都可能执行。
    - `421`（`not_leader` / `read_only_replica`）：换一个节点。带 `submissionOutcome: "Unknown"` 的 `503`（经代理时为
      `x-dexos-outcome: unknown`）：仍可能执行；先查询。
    - `x-dexos-expect-manifest: <manifestHash>` 锁定网络（`503 upstream_manifest_mismatch`）。

    ## 约定

    - JSON，`camelCase`，Unix 毫秒；64 位整数、价格、数量和金额都是十进制字符串。
    - 命令使用 `ticks = price × 10^priceDecimals`、`lots = size × 10^sizeDecimals`（须恰好整除）。
    - 市场用 `symbol`，账户用 `address` + `subaccount`（0 = 主账户），金库用 `vault` 标识。
    - 错误：`{error:{code, num, message, details?}}`（`num` 为 `1xxxx` 网关、`2xxxx` 执行层）；命令端点另带
      `nonceConsumed`（`false` 未动用，`null` 未知）。状态码 400、401、403、404、409、412（副本
      落后）、421（节点不对）、422、429。
    - 分页：`?limit=&after=` → `next`、`hasMore`；历史类接口另有 `upper`：后续各页原样传回。
    - 写后读：`x-dexos-min-seq` = 该写入的 `seq`（副本落后时返回 412）；不要用于行情数据。

    ## 限流

    固定 60 秒窗口；权重：读取 1，订单簿 / 价格 2，历史 5，命令 `1 + floor(n / 40)`（n 为订单、撤单、改单数）。

    - **按 IP**（1200）：所有 `/v1/*`；IP 为 TCP 对端或受信代理写入的 `x-real-ip`（忽略 `x-forwarded-for`）。
    - **按账户**（1200）：已验证签名的命令；API 钱包计入签发授权的账户。
    - **未验证**（60，按 IP）：签名者无法验证的命令；仍转交账本。

    超出预算：`429 GatewayRateLimited`，带 `retry-after`，不会定序；用量见 `ratelimit`、`ratelimit-policy`、
    `x-ratelimit-account`。新账户和新授权须等到 `Executed` 再使用。

    ## 错误码

    **`gateway`**

    | 错误码 | 编号 |
    |---|---|
    | `GatewayBadRequest` | 10400 |
    | `GatewayBuilderUnknown` | 10400 |
    | `GatewayHistoryIncomplete` | 10400 |
    | `GatewayBadSignature` | 10401 |
    | `GatewayBuilderDisabled` | 10403 |
    | `GatewayBuilderMarketCloseOnly` | 10403 |
    | `GatewayBuilderMarketNotListed` | 10403 |
    | `GatewayForbidden` | 10403 |
    | `GatewayBuilderNotFound` | 10404 |
    | `GatewayNotFound` | 10404 |
    | `GatewayConflict` | 10409 |
    | `GatewayDuplicateClientOrderId` | 10409 |
    | `GatewayReplicaBehind` | 10412 |
    | `GatewayNotLeader` | 10421 |
    | `GatewayCollateralTokenMismatch` | 10422 |
    | `GatewayRateLimited` | 10429 |
    | `GatewayError` | 10500 |
    | `GatewayUnavailable` | 10503 |

    **`execution`**: `20000 + execution error code`（只追加）；字符串代码即执行层错误名，例如 `InsufficientMargin`、`SignatureExpired`、`NonceBelowFloor`、`NonceAlreadyConsumed`、`PostOnlyWouldCross`
servers:
  - url: "https://dex-preview.unibook.site"
    description: "预览网络(只有测试资金)"
tags:
