        entryPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        markPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        notional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "名义价值，USDC"
        unrealizedPnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "USDC，带符号"
        fundingIndex:
          type: string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "`isolated`：独立保证金，单独清算；其亏损不会波及全仓余额"
        rawUsd:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：逐仓现金，含开仓对价（多头为负，空头为正）；全仓为 `null`"
        isolatedEquity:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：`rawUsd` + 按标记价计的仓位 + 应计资金费；全仓为 `null`"
        isolatedMarginUsed:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：初始保证金；全仓为 `null`"
        isolatedMaintenanceMargin:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：维持保证金；`isolatedEquity` 低于该值时被清算。全仓为 `null`"
        isolatedRemovable:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：`POST /v1/account/isolated-margin` 当前可移除的保证金 = `max`(0, `isolatedEquity` − `isolatedMarginUsed`)；`strictIsolated` 市场上为 0；全仓为 `null`"
        liquidationPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "仅逐仓：`isolatedEquity` 降至 `isolatedMaintenanceMargin` 时的标记价，按价格小数位截断。全仓、分级保证金市场或任何正价格都不会触发清算时为 `null`"
      required:
        - symbol
        - side
        - size
        - entryPrice
        - markPrice
        - notional
        - unrealizedPnl
        - fundingIndex
        - marginMode
        - rawUsd
        - isolatedEquity
        - isolatedMarginUsed
        - isolatedMaintenanceMargin
        - isolatedRemovable
        - liquidationPrice
    Price:
      type: object
      properties:
        symbol:
          type: string
          description: "市场代码，如 `BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "`symbol` + `kind` 唯一确定一个市场（永续市场和现货市场可能共用同一代码）"
        last:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        mark:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        oracle:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        fundingIndex:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+$"
          description: "最近一次结算后的累计资金费指数，整数字符串（同 `/v1/markets` 的 `fundingIndex`）；现货为 `null`"
        lastFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "最近一次资金费结算的区块时间（Unix 毫秒）；现货及首次结算前为 `null`"
        nextFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "下一次结算到期时间：`lastFundingMs` 之后第一个自 Unix 纪元起 资金费间隔的整数倍；实际结算可能晚一个采样间隔。现货及首次采样前为 `null`"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        prevDayPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时窗口的开盘价（第一根 1 分钟 K 线）；窗口内无 tick 或 24 小时统计不可用时为 `null`"
        change24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时的（收盘价 − 开盘价）/ 开盘价，比例（0.01 = 1%），8 位小数向零截断；无开盘价时为 `null`"
        high24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时窗口内的最高价"
        low24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时窗口内的最低价"
        volume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时成交数量，基础代币单位；无成交为 \"0\"，24 小时统计不可用为 `null`"
        quoteVolume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "滚动 24 小时的 Σ 价格 × 数量，计价代币单位；未知时为 `null`（无 24 小时统计，或窗口内只有迁移来的 K 线）"
    Subaccount:
      type: object
      properties:
        subaccount:
          type: integer
        isMain:
          type: boolean
        signingAccountId:
          type: integer
