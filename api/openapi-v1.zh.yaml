        strictIsolated:
          type: boolean
          description: "逐仓，且持仓期间不能修改杠杆。`isolated` + `false` = `noCross`；`isolated` + `true` = `strictIsolated`"
        quotePerTickLot:
          type: string
          pattern: "^[0-9]+$"
          description: "每 tick × lot 的计价代币最小单位数（整数字符串）：名义价值 = tick 数 × lot 数 × 本值"
        baseToken:
          type:
            - integer
            - "null"
          description: "仅现货：基础代币 ID；永续为 `null`"
        quoteToken:
          type:
            - integer
            - "null"
          description: "仅现货：计价代币 ID；永续为 `null`"
        basePerLot:
          type:
            - string
            - "null"
          pattern: "^[0-9]+$"
          description: "仅现货：每 lot 的基础代币最小单位数（整数字符串）；永续为 `null`"
        settleToken:
          type: object
          description: "结算代币：永续为所属交易所的保证金代币，现货为计价代币。`minNotional` 和 `openInterestCap.notional` 以其账本单位（`1e-6`）计"
          required:
