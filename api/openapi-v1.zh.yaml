    x-page-title: "市场行情"
    x-page-description: "市场、订单簿、成交、K 线、价格与资金费"
  - name: Account
    x-page-title: "账户"
    x-page-description: "余额、仓位、订单、成交、账本流水、nonce、子账户与 API 钱包"
  - name: Trading
    description: "需签名的写入接口"
    x-page-title: "交易"
    x-page-description: "下单、撤单与改单；批量订单与失联自动撤单"
  - name: Funds
    x-page-title: "资金"
    x-page-description: "入金、提款与转账"
  - name: Vaults
    x-page-title: "金库"
    x-page-description: "金库列表、存入与赎回"
  - name: Subscriptions
    x-page-title: "订阅"
    x-page-description: "实时数据的 WebSocket 频道"
    description: |-
      ## WebSocket

      在 API 主机上连接 `/v1/ws`（`wss://`）。

      ### 帧格式

      **`subscribe`**

      ```json
      {
        "method": "subscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 1
      }
      ```

      **`ack`**

      ```json
      {
        "channel": "subscribed",
        "data": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "epoch": "<ledger epoch>",
        "seq": 593504256,
        "id": 1
      }
      ```

      **`unsubscribe`**

      ```json
      {
        "method": "unsubscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 2
      }
      ```

      **`ping`**

      ```json
      {
        "method": "ping"
      }
      ```

      **`pong`**

      ```json
      {
        "channel": "pong",
        "data": {
          "ts": 0
        }
      }
      ```

      **`error`**

      ```json
      {
        "channel": "error",
        "data": {
          "code": "GatewayNotFound",
          "message": "no such subscription on this connection",
          "method": "unsubscribe",
          "subscription": {
            "channel": "book",
            "symbol": "BTC-USD",
            "depth": 50
          }
        },
        "id": 2
      }
      ```

      **`lagged`**

      ```json
      {
        "channel": "lagged",
        "data": {
          "dropped": 128,
          "epoch": "<ledger epoch>",
          "upper": "<seq>-<sub>-4294967295",
          "reason": "buffer"
        }
      }
      ```

      **`frame`**

      ```json
      {
        "channel": "<channel>",
        "data": {},
        "seq": 0,
        "isSnapshot": false,
        "epoch": "<private channels only>"
      }
      ```

      ### 规则

      - 快照频道（`book` / `bbo` / `prices` / `account` / `positions` / `orders`）订阅时发送 `isSnapshot:true`；此后除 `orders` 外仅在有变化时推送，`book` / `bbo` 每 250 毫秒至多一次，其余每个区块（约 1 秒）至多一次
      - 回应 `subscribe` / `unsubscribe` 的错误帧回显请求的 `id`、`data.method` 和 `data.subscription`。取消不存在的订阅会返回错误（`GatewayNotFound`）
      - `orders`：所有未成交订单的快照（条件单带 `trigger`），此后每次接受 / 成交 / 撤单 / 过期各一帧。按 `orderId` 应用：`status` 为 `open` 则保留，否则移除；快照替换整个集合
      - `candles`：每次成交一帧，内容为当前 K 线的最新状态（保留最后一帧即可）；周期滚动时开始新的 K 线
      - 时间序列频道（`trades` / `fills` / `ledger` / `events`）带 `seq`；每个事件一帧，带 `data.id`（`ledger`：每条命令一帧，带 `data.entries[]`）。这些 ID 即 REST 历史的 `after` 游标
      - 订阅确认带 `epoch`、`seq`：通过 REST 回补到 `upper=<seq>-65535-4294967295`，按 `id` 去重。`lagged` 表示帧已永久丢失：用其 `upper` 回补（400 `GatewayHistoryIncomplete`：重试）。`epoch` 变化：重建状态
      - 每个连接最多 200 个订阅；60 秒内未发送任何帧（`ping` 也算）的连接会被关闭
      - WebSocket 连接本身不计限流权重；REST 限流（429，带 `retry-after`）见总览
      - 私有频道接受用 `vault` 代替 `address` / `subaccount`（不可同时给出）；此时帧中带 `vault`
      - 带 `symbol` 的频道也接受 `kind`（`perp` | `spot`），永续和现货市场同名时必填；帧中带 `kind`
      - `orders` / `fills` 带 `stage:"matched"`：下单类命令的帧在撮合完成时推送，带 `stage`，`id` 不变，之后不再重推；其余帧在结果落定后推送。同一频道和账户只能选一种

      ### 频道

      | 频道 | 参数 | 数据 |
      |---|---|---|
      | `prices` | `delta?` | 与 `GET /v1/prices` 的响应体相同：`{prices:[Price], ts, window24h}`。`delta:true`：快照之后只推有变化的行（按 `kind` + `symbol` 替换）；市场集合变化时重发快照。每个连接只能订一种模式 |
      | `book` | `symbol`, `kind?`, `depth?`, `aggTicks?` | 订单簿，每侧 `depth` 档（1-100，默认 20），`aggTicks` 同 `GET /v1/markets/{symbol}/book`；两者均回显，无效值返回错误帧。同一连接可订阅多个 `aggTicks` |
      | `bbo` | `symbol`, `kind?` | 最优买卖价：`{symbol, kind, bid:[price,size]\|null, ask, ts}` |
      | `trades` | `symbol`, `kind?` | 每笔成交一帧：`{symbol, kind, id, price, size, side, ts}` |
      | `orders` | `address`, `subaccount?`, `vault?`, `stage?` | 快照：`{address, subaccount, orders:[OpenOrder]}`。更新：`{orderId, clientOrderId, symbol, kind, event, status, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}` |
      | `fills` | `address`, `subaccount?`, `vault?`, `stage?` | 成交（`GET /v1/account/fills` 的行）+ `address`、`subaccount` |
      | `account` | `address`, `subaccount?`, `vault?` | 账户（`GET /v1/account` 的响应体，同一视图） |
      | `positions` | `address`, `subaccount?`, `vault?` | `{address, subaccount, positions:[Position]}`（`GET /v1/account/positions` 的响应体） |
      | `candles` | `symbol`, `kind?`, `interval` | K 线 `{symbol, kind, i, t, T, o, h, l, c, v}`，每次成交发送当前 K 线；`interval` 取值同 REST（未知取值返回错误帧） |
      | `funding` | `symbol`, `kind?` | `{symbol, kind, rate, index, ts}`，每次资金费结算一帧 |
      | `ledger` | `address`, `subaccount?`, `vault?` | `{address, subaccount, entries:[LedgerEntry]}`（或 `{vault, entries}`）：每条命令一帧，含该账户的全部条目，与 `GET /v1/account/ledger` 的条目相同（含金库、ADL 和手续费分项） |
      | `events` | `symbol?`, `address?` | 原始执行层事件（`Event`），带 `symbol` |
  - name: Merchants
    description: "交易所登记、所有者提案、商户准入与 builder 登记"
    x-page-title: "商户"
    x-page-description: "交易所登记、所有者提案、准入与 builder 登记"
paths:
  /v1/account:
    get:
      tags:
        - Account
      summary: "账户概览"
      description: |-
        按钱包查询账户概览（`?address=&subaccount=`）：权益、保证金、可用余额、各项余额、按组风险、费率和计数；风险字段来自 `asOfSeq` 处的同一视图。响应不含账户 ID；从未入金的地址返回 404。

        - `fees`：各市场实际收取的费率。
        - `fees.pendingDeployer`：已排期的部署者费率覆盖上调，按（交易所，市场）升序；`symbol` 为 `null` = 交易所级别的行；`enabled: false` = 覆盖项正在移除；条目在 `effectiveAtMs` 生效后消失。
      operationId: v1_account
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；请求不区分大小写，响应中为小写"
          description: "主钱包地址（未给出 `vault` 时必填）"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户索引：0 = 主账户（编号最小的单签账户）；N >= 1 = 以索引 N 开设的子账户"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "金库 ID：读取金库自身的账户。与 `address` / `subaccount` 互斥（400）；未知金库 = 404。此时响应给出 `vault` 而非 `address` / `subaccount`"
        - name: builder
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "计算 `fees` 所针对的 builder ID。省略 = 入口域名绑定的 builder（未绑定 = 无 builder 费用）。未知 builder：404 `GatewayBuilderNotFound`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: "将 `fees.markets` 限定为该市场；省略 = 所有可交易市场。未知市场符号：404"
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/agents:
    get:
      tags:
        - Account
      summary: "已授权的 API 钱包"
      description: |-
        该账户已授权的 API 钱包；标签来自网关。

        - 各行是在当前策略纪元下签发、未撤销、授予 API 钱包且覆盖本账户的授权，另加本账户策略为其拥有的交易所签发的交易所管理授权（设置了 `dex`）。
        - 本列表是一份**清单**：已暂停、已过期和尚未生效的授权也会列出；请看 `executable`。命令仍可能因动作、范围或额度被拒绝。
      operationId: v1_agents
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址，不区分大小写"
          description: "主钱包地址"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户索引：0 = 主账户；N >= 1 = 第 N 号子账户"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址，小写"
                  subaccount:
                    type: integer
                  agents:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Agent"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/account/fills:
    get:
      tags:
        - Account
      summary: "成交历史"
      description: "持久化的成交历史，支持游标回补。首页会固定 `upper`，之后原样传回。只有 `hasMore=false` 才表示已全部取完。WebSocket 断线后，用最后一帧的 `id` 作为 `after`。"
      operationId: v1_fills
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "主钱包地址（未给出 `vault` 时必填）"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户序号：0 = 该地址的主账户（编号最小的单签账户）；N >= 1 = 其序号为 N 的子账户"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "金库 ID：读取金库自身的账户。与 `address` / `subaccount` 互斥（400）；未知金库 404。此时响应给出 `vault`，而非 `address` / `subaccount`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "市场符号：`BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写"
            examples:
              - BTC-USD
          description: "只返回该市场"
        - "$ref": "#/components/parameters/MarketKind"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "事件 ID `<seq>-<sub>-<idx>`，与 WebSocket 帧中的 `id` 相同"
          description: "游标：上一页的 `next` 值"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "首页返回的账本纪元；**给出 `after` 时须与 `upper` 一起提供**（账本重置后返回 409 `history_epoch_mismatch`）"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "首页返回的上界；**给出 `after` 时须与 `epoch` 一起提供**，否则 400。超出该副本的完整历史：400 `GatewayHistoryIncomplete`（请稍后重试）"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: "每页条数"
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = 最新在前，`next` 向更早的行翻页；`epoch` / `upper` / `hasMore` 与 `asc` 相同。同一次遍历的每一页须使用同一个 `order`"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FillsPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/funding:
    get:
      tags:
        - Account
      summary: "资金费收付记录"
      description: "本账户每次资金费结算一条带符号的 USDC 分录；= `/v1/account/ledger?kind=funding`。"
      operationId: v1_account_funding
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址（响应中为小写，请求中不区分大小写）"
          description: "主钱包地址（未给出 `vault` 时必填）"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户序号：0 = 该地址的主账户；N ≥ 1 = 其第 N 号子账户"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "金库 ID：读取金库自身的账户。与 `address` / `subaccount` 互斥（400）；未知金库返回 404；此时响应显示 `vault`"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "事件标识 `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 完全相同"
          description: "游标：上一页的 `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "第一页返回的账本纪元；**给出 `after` 时须与 `upper` 一起提供**（账本已重置时返回 409 `history_epoch_mismatch`）"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "第一页返回的固定上界；**给出 `after` 时须与 `epoch` 一起提供**（否则 400）。超出本副本的完整历史 → 400 `GatewayHistoryIncomplete`；请稍后重试"
        - name: limit
