                  - groups
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        hub:
                          type: object
                          properties:
                            chainId:
                              type: string
                            domain:
                              type:
                                - integer
                                - "null"
                            depositInbox:
                              type: string
                        open:
                          type: boolean
                        deposit:
                          type: object
                          properties:
                            bindingType:
                              type: string
                            bindingTypehash:
                              type: string
                            inboxMessageBytes:
                              type: integer
                            sources:
                              type: array
                              items:
                                type: object
                                properties:
                                  domain:
                                    type: integer
                                  chainId:
                                    type: string
                                  burnToken:
                                    type: string
                                  tokenMessenger:
                                    type:
                                      - string
                                      - "null"
                                  registered:
                                    type:
                                      - boolean
                                      - "null"
                                  registrationError:
                                    type: string
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  hubToken:
                                    type: string
                                  minDepositRaw:
                                    type:
                                      - string
                                      - "null"
                                  minDepositError:
                                    type: string
                                  depositEnabled:
                                    type: boolean
                                  chainEnabled:
                                    type:
                                      - boolean
                                      - "null"
                                  available:
                                    type: boolean
                        withdraw:
                          type: object
                          properties:
                            routes:
                              type: array
                              items:
                                type: object
                                properties:
                                  routeHash:
                                    type: string
                                  kind:
                                    type: string
                                  sourceToken:
                                    type: string
                                  destinationToken:
                                    type: string
                                  sourceMessenger:
                                    type: string
                                  sourceTransmitter:
                                    type: string
                                  destinationTransmitter:
                                    type: string
                                  destinationTokenMessenger:
                                    type: string
                                  destinationCaller:
                                    type: string
                                  hookDataHash:
                                    type: string
                                  destinationInbox:
                                    type: string
                                  refundRecipient:
                                    type: string
                                  maxBurnPerMessage:
                                    type: string
                                  routeConfigVersion:
                                    type: string
                                  destinationChainId:
                                    type: string
                                  routeKind:
                                    type: integer
                                  adapterVersion:
                                    type: integer
                                  sourceDomain:
                                    type: integer
                                  destinationDomain:
                                    type: integer
                                  minFinalityThreshold:
                                    type: integer
                                  beneficiaryAccountId:
                                    type: integer
                                  available:
                                    type: boolean
                  source:
                    type: string
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/exchange/cctp/quote:
    post:
      tags:
        - Funds
      summary: "CCTP 入金销毁报价"
      description: |-
        返回 CCTP 入金所需的 160 字节 `hookData` 及销毁调用数据。先授权（`burn.approve`），再把 `burn.calldata` 发送到 `burn.to`。

        - `maxFeeRaw` 默认取源链最低手续费（无法读取时返回 503）。
        - 错误：400 `beneficiary_forbidden`；404 `unknown_cctp_source`；409 `cctp_source_not_registered`、`custody_group_unavailable`、`deposit_not_enabled`；422 `min_deposit_not_configured`、`below_min_deposit`、`beneficiary_not_signable`、`max_fee_below_minimum`、`amount_unrepresentable`。
      operationId: v1_exchange_cctp_quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - custodyKeyHash
                - sourceDomain
                - assetId
                - assetVersion
                - amountRaw
                - beneficiary
              properties:
                custodyKeyHash:
                  type: string
                  description: "带 0x 前缀的 32 字节十六进制"
                sourceDomain:
                  type: integer
                  description: "源链 CCTP 域（CCTP 路由中的 `deposit.sources[].domain`）"
                assetId:
                  type: integer
                assetVersion:
                  type: string
                  pattern: "^[0-9]+$"
                amountRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "源链上销毁的数量，原始单位（十进制，> 0）"
                beneficiary:
                  type: string
                  description: "入金记入该地址的单签主账户；没有时自动开立"
                maxFeeRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "默认取源链的 `getMinFeeAmount(amountRaw)`"
      responses:
        "200":
          description: "报价"
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  sourceDomain:
                    type: integer
                  assetId:
                    type: integer
                  assetVersion:
                    type: string
                  amountRaw:
                    type: string
                  beneficiary:
                    type: string
                  binding:
                    type: object
                    properties:
                      destinationCustodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                      beneficiary:
                        type: string
                  bindingType:
                    type: string
                  hookData:
                    type: string
                  hookDataHash:
                    type: string
                  minDepositRaw:
                    type: string
                  fee:
                    type: object
                    properties:
                      minFeeRaw:
                        type:
                          - string
                          - "null"
                      minFeeError:
                        type: string
                      maxFeeRaw:
                        type: string
                  minCreditRaw:
                    type: string
                  burn:
                    type: object
                    properties:
                      chainId:
                        type: string
                      to:
                        type: string
                      function:
                        type: string
                        enum:
                          - depositForBurnWithHook
                      args:
                        type: object
                      calldata:
                        type: string
                      approve:
                        type: object
                        properties:
                          token:
                            type: string
                          spender:
                            type: string
                          amountRaw:
                            type: string
                  precheck:
                    type: string
                  source:
                    type: string
        "400":
          description: "请求体无效（`invalid_request`）或受益人被禁止（`beneficiary_forbidden`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: "托管组或 CCTP 来源不存在（`unknown_custody_group` / `unknown_cctp_source`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: "该路由当前不能入金（`cctp_source_not_registered` / `custody_group_unavailable` / `deposit_not_enabled`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: "入金被拒绝（`min_deposit_not_configured` / `below_min_deposit` / `beneficiary_not_signable` / `max_fee_below_minimum` / `amount_unrepresentable`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: "托管链 RPC 或账本状态不可用；请稍后重试（`chain_rpc_unavailable` / `ledger_state_unavailable`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/exchange/cctp/withdraw-quote:
    post:
      tags:
        - Funds
      summary: "CCTP 提款报价（仅限地址路由）"
      description: |-
        为提到普通地址的 CCTP 提款报价（路由选择同 SDK 的 `cctp_route`）。将 `destinationChainId`、`maxBridgeFeeRaw` 和 `minReceivedRaw` 填入 `RequestCashWithdrawal` 的 CCTP 路由；`debitRaw` = 本金 + 提款手续费。

        - 错误：400 `invalid_request`；404 `unknown_custody_group`、`no_cctp_route`；409 `custody_group_unavailable`；422 `too_many_chunks`（超过 32 块）、`above_burn_limit`、`amount_unrepresentable`、`withdrawal_fee_unrepresentable`；503 `chain_rpc_unavailable`。
      operationId: v1_exchange_cctp_withdraw_quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - custodyKeyHash
                - assetId
                - destinationChainId
                - principalRaw
              properties:
                custodyKeyHash:
                  type: string
                  description: "托管组密钥哈希，带 0x 前缀的 32 字节十六进制"
                assetId:
                  type: integer
                destinationChainId:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "目标链 ID（十进制）"
                principalRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "提款本金，代币原始单位（十进制字符串，> 0，须能放入 `u128`）"
      responses:
        "200":
          description: "报价"
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  assetId:
                    type: integer
                  assetVersion:
                    type: string
                  destinationChainId:
                    type: string
                  principalRaw:
                    type: string
                  route:
                    type: object
                    properties:
                      routeHash:
                        type: string
                      kind:
                        type: string
                      sourceToken:
                        type: string
                      destinationToken:
                        type: string
                      sourceMessenger:
                        type: string
                      sourceTransmitter:
                        type: string
                      destinationTransmitter:
                        type: string
                      destinationTokenMessenger:
                        type: string
                      destinationCaller:
                        type: string
                      hookDataHash:
                        type: string
                      destinationInbox:
                        type: string
                      refundRecipient:
                        type: string
                      maxBurnPerMessage:
                        type: string
                      routeConfigVersion:
                        type: string
                      destinationChainId:
                        type: string
                      routeKind:
                        type: integer
                      adapterVersion:
                        type: integer
                      sourceDomain:
                        type: integer
                      destinationDomain:
                        type: integer
                      minFinalityThreshold:
                        type: integer
                      beneficiaryAccountId:
                        type: integer
                  burnLimitPerMessageRaw:
                    type: string
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        amountRaw:
                          type: string
                        minFeeRaw:
                          type: string
                        maxFeeRaw:
                          type: string
                  maxBridgeFeeRaw:
                    type: string
                  minReceivedRaw:
                    type: string
                  withdrawalFee:
                    type: object
                    properties:
                      feeRaw:
                        type: string
                      recipient:
                        type: string
                  debitRaw:
                    type: string
                  rule:
                    type: string
                  source:
                    type: string
        "400":
          description: "请求格式错误（`invalid_request`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: "托管组或 CCTP 路由不存在（`unknown_custody_group` / `no_cctp_route`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: "托管组已冻结或有待处理的逃生（`custody_group_unavailable`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: "提款被拒绝（`too_many_chunks` / `above_burn_limit` / `amount_unrepresentable` / `withdrawal_fee_unrepresentable`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: "托管链 RPC 或账本状态不可用；请稍后重试（`chain_rpc_unavailable` / `ledger_state_unavailable`）"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  headers:
    x-dexos-seq:
      schema:
        type: integer
      description: "响应所基于的已应用序号；在写入回执上为该写入的提交序号"
    ratelimit:
      schema:
        type: string
      description: "每个 `/v1/*` 响应都带的按 IP 预算状态，如 `limit=1200, remaining=1187, reset=42`"
    ratelimit-policy:
      schema:
        type: string
      description: "按 IP 的权重预算，固定 60 秒窗口，如 `1200;w=60`（运营方配置，默认 1200）"
    x-ratelimit-account:
      schema:
        type: string
      description: "按账户预算（以被操作账户的主钱包为键），如 `limit=1200, remaining=1197, reset=42`；仅在通过签名预检的写请求上返回"
    retry-after:
      schema:
        type: integer
      description: "429 时：距窗口重置的秒数"
  parameters:
    MinSeq:
      name: x-dexos-min-seq
      in: header
      required: false
      schema:
        type: integer
      description: "写后读：某次写入的 `x-dexos-seq`，只在该写入之后的读取上发送；落后的副本返回 412。不要用于行情轮询或 `/trades` / `/candles`（投影按自己的进度推进）"
    MarketKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - perp
          - spot
      description: "市场类型，配合 `symbol` 使用；永续和现货市场同名时必填，否则返回 400 `GatewayBadRequest`（`details.rule = ambiguous_symbol`，可选项见 `details.kinds`）"
  responses:
    BadRequest:
      description: "请求格式错误（`GatewayBadRequest`，`num` 10400）；读取历史时，`upper` 超出本副本已完整的历史则返回 `GatewayHistoryIncomplete`：稍后重试"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "未知的市场代码、从未入金的地址或订单不存在（`GatewayNotFound`，`num` 10404；`details` 指明是哪一种）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ReplicaBehind:
      description: "副本落后于 `x-dexos-min-seq`（`GatewayReplicaBehind`，`num` 10412）；`details.source`：账本落后（换副本）或投影落后（等待追上）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: "读模型尚未就绪 / 分析数据不可用（`GatewayUnavailable`，`num` 10503）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Account:
      type: object
      required:
        - epoch
        - asOfSeq
        - token
        - collateral
        - equity
        - marginUsed
        - maintenanceMargin
        - openOrderMargin
        - availableToTrade
        - availableToWithdraw
        - balances
        - groups
        - feeTier
        - takerFee
        - makerFee
        - fees
        - positionsCount
        - ordersCount
        - leverage
        - nonce
        - ts
        - crossEquity
        - crossMarginUsed
        - crossMaintenanceMargin
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址；响应中为小写，请求中不区分大小写"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "请求按金库寻址（`vault=<id>`）时代替 `address` / `subaccount` 出现"
        token:
          type: string
          enum:
            - USDC
          description: "顶层汇总所用的结算代币；这些汇总只覆盖 USDC 组，持有其他结算代币的账户应读取 `groups[]`"
        collateral:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "USDC 保证金（仅 USDC 组；见 `groups[]`）"
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "账户总权益（USDC）：`crossEquity` + 各以 USDC 结算的逐仓仓位的 Σ `isolatedEquity`"
        marginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "已占用的初始保证金（IMR），全仓 + 逐仓"
        maintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "维持保证金（MMR），全仓 + 逐仓"
        crossEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "全仓净保证金（USDC）：现金 + 按标记价计的全仓仓位 + 应计资金费；不含逐仓仓位"
        crossMarginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "全仓仓位的初始保证金"
        crossMaintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "全仓仓位的维持保证金；`crossEquity` 低于该值时全仓可被强平"
        openOrderMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "挂着的非只减仓订单占用的初始保证金"
        availableToTrade:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "可用于新订单的全仓空闲保证金（= `availableToWithdraw`）：`max`(0, `crossEquity` − `crossMarginUsed` − 挂单保证金 − 现货冻结)；每个市场的挂单保证金 = 与仓位轧差后较大的一方，含逐仓市场"
        availableToWithdraw:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "同 `availableToTrade`；逐仓仓位中的保证金须先用 `POST /v1/account/isolated-margin` 移出才可提取"
        balances:
          type: array
          items:
            "$ref": "#/components/schemas/Balance"
        groups:
          type: array
          description: "按保证金组（每个结算代币一组）给出；持有 USDC 以外结算代币的账户以此为准"
          items:
            type: object
            properties:
              token:
                type: string
                description: "结算代币符号"
              collateral:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "该代币的现金余额"
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "该组全仓净保证金，含全仓仓位的未实现盈亏；逐仓仓位计入 `isolatedEquity`"
              imr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "初始保证金要求"
              mmr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "维持保证金要求"
              openOrderMargin:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "该组内挂单占用的初始保证金"
              withdrawable:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "该组可提取金额"
              isolatedEquity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "以该代币结算的逐仓仓位权益之和 Σ（逐仓现金 + 按标记价计的仓位 + 应计资金费）"
            required:
              - token
              - collateral
              - equity
              - imr
              - mmr
              - openOrderMargin
              - withdrawable
              - isolatedEquity
        feeTier:
          type:
            - integer
            - "null"
        takerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "账户费率档位的实际费率（小数）；有市场级费率的市场见 `/v1/markets.fees`"
        makerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        fees:
          type: object
          required:
            - builder
            - markets
          description: "本账户实际被收取的费率，与撮合引擎计费一致；只展示本账户自己的结果"
          properties:
            builder:
              type:
                - integer
                - "null"
              description: "计算费率所针对的 builder（`?builder=` 或入口域名对应的 builder）；`null` = 无 builder"
            markets:
              type: array
              items:
                type: object
                required:
                  - symbol
                  - maker
                  - taker
                  - source
                properties:
                  symbol:
                    type: string
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "市场类型；`symbol` + `kind` 唯一确定一个市场（永续和现货市场可能同名）"
                  maker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - builder
                      - deployer
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "挂单方总费率 = 协议 + builder（负值 = 返佣）"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "协议挂单方费率"
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "挂单方部署者费用，付给该交易所的手续费接收方"
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "经市场上限约束后的 builder 挂单方费率（负值 = 补贴；现货为 0）"
                  taker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - dex
                      - deployer
                      - builder
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "吃单方总费率 = 协议 + 交易所 + 部署者 + builder"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "协议吃单方费率"
                      dex:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "交易所附加费 = 协议吃单方费率 × 该交易所费率系数"
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "市场部署者分成（仅吃单方）"
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "经市场上限约束后的 builder 吃单方费率"
                  source:
                    type: object
                    required:
                      - protocol
                      - deployer
                      - builder
                    properties:
                      protocol:
                        type: string
                        enum:
                          - builderAddress
                          - builder
                          - marketBuilderAddress
                          - marketBuilder
                          - marketMaker
                          - market
                          - default
                          - tier
                          - base
                        description: "协议费率来源层：`builderAddress`（builder × 本账户 / 其主账户）、`builder`、`marketBuilderAddress` / `marketBuilder`（经交易所关联的 builder）、`marketMaker`（旧）、`market`（旧）、`default`、`tier`、`base`"
                      deployer:
                        type: string
                        enum:
                          - address
                          - addressDex
                          - market
                          - marketMaker
                        description: "吃单方部署者费用来源：`address` / `addressDex` = 本账户或其主账户在本市场 / 本交易所的行（替代 `deployer_ppm`，`taker.dex` 为 0）；`market` = `deployer_ppm` + 交易所附加费；`marketMaker` = 免除"
                      builder:
                        type: string
                        enum:
                          - account_market
                          - account
                          - ownerMarket
                          - owner
                          - market
                          - default
                          - unset
                          - none
                          - legacy
                          - marketMaker
                        description: "builder 部分来源层：账户×市场 > 账户 > `ownerMarket` > `owner`（主账户的行）> builder 市场层 > builder 默认层 > 未设置；`none` = 无 builder；`legacy` = 市场的 `builder_ppm`；`marketMaker` = 免除"
        positionsCount:
          type: integer
        ordersCount:
          type: integer
        leverage:
          type: array
          description: "设置了自定义杠杆或账户处于逐仓的市场（无自定义杠杆时为该市场的基础杠杆）"
          items:
            type: object
            properties:
              symbol:
                type: string
                description: "市场符号：`BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写"
                examples:
                  - BTC-USD
              kind:
                type: string
                enum:
                  - perp
                  - spot
                description: "市场类型；`symbol` + `kind` 唯一确定一个市场（永续和现货市场可能同名）"
              leverage:
                type: integer
              type:
                type: string
                enum:
                  - cross
                  - isolated
                description: "账户在该市场的保证金模式：持有逐仓仓位或该市场只允许逐仓（`marginMode` 为 `noCross` / `strictIsolated`）时为 `isolated`"
            required:
              - symbol
              - leverage
              - type
        nonce:
          type: integer
          description: "账户范围内的下一个 nonce（= `GET /v1/account/nonce`）"
        ts:
          type: integer
          format: int64
          description: "Unix 毫秒"
        epoch:
          type: string
          description: "风险视图所属的账本纪元；仅在节点重启 / 重置时变化"
        asOfSeq:
          type: integer
          format: uint64
          description: "风险字段（`equity`、各项保证金、`groups`）的日志位置；它们全部来自这同一个一致视图"
    AccountPnl:
      type: object
      description: "每个风险组在同一水位点的永续盈亏，金额为十进制字符串，以该组保证金代币计价；`equity = netInflow + spotTransfer + totalPnl` 严格成立。现货成交和现货手续费计入 `spotTransfer`，不计入盈亏"
      required:
        - epoch
        - asOfSeq
        - groups
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址（响应中为小写，请求中不区分大小写）"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "请求指定金库（`vault=<id>`）时出现，代替 `address` / `subaccount`"
        epoch:
          type: string
          description: "账本纪元"
        asOfSeq:
          type: integer
          format: uint64
          description: "快照覆盖到的日志位置；余额、仓位和账本累计均截至该位置"
        groups:
          type: array
          items:
            type: object
            required:
              - token
              - equity
              - netInflow
              - realizedPnl
              - unrealizedPnl
              - accruedFunding
              - settledFunding
              - fees
              - otherPnl
              - spotTransfer
              - totalPnl
            properties:
              token:
                type: string
                description: "风险组的保证金代币符号"
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "该组权益：全仓净保证金 + 以该代币结算的逐仓仓位权益"
              netInflow:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 外部分录：入金、提款、转账、金库资金进出"
              realizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 仓位对价（成交、强平、ADL、结算）+ Σ 未平仓位的成本"
              unrealizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ（按标记价计的仓位价值 − 成本）"
              accruedFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "已累计但尚未计入余额的资金费（仓位被触及时结算）"
              settledFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 已计入余额的资金费（负数 = 支付）"
              fees:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 永续交易手续费：吃单 / 挂单手续费、挂单返佣、builder 费和部署者费（负数 = 支付）"
              otherPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 其余非外部分录：强平手续费、坏账弥补、保险基金资金流、手续费收入"
              spotTransfer:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ 以该代币计的现货成交对价和现货手续费；属于永续侧与现货侧之间的划转，不是盈亏"
              totalPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "开户以来的永续盈亏：`realizedPnl + unrealizedPnl + accruedFunding + settledFunding + fees + otherPnl` = `equity − netInflow − spotTransfer`"
    Agent:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址（响应中为小写，请求中不区分大小写）"
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "`null` = 永不过期"
        expired:
          type: boolean
        scope:
          type: string
          enum:
            - account
            - owner
          description: "`account` = 旧版按账户授权；`owner` = 所有者级授权，覆盖 `subaccountMask` 中的子账户"
        subaccountMask:
          type: string
          description: "仅所有者级授权：十进制 `u64` 位图，第 i 位 = 子账户 i（可包含尚未创建的子账户）"
        subaccounts:
          type: array
          items:
            type: integer
          description: "仅所有者级授权：`subaccountMask` 中置位的子账户索引"
        executable:
          type: boolean
          description: "`true` = 账本当前会接受这条授权：当前策略纪元、状态 `active`、处于 `validFrom`..`validUntil` 之内，且 `dex` 授权需为当前所有者纪元。未生效的授权仍会列出，值为 `false`"
        dex:
          type:
            - integer
            - "null"
          description: "`dex` 范围管理授权所属的 `dex`（只能为该 `dex` 在 `management` nonce 序列上签名）；账户范围的交易授权为 `null`"
    AgentGrant:
      type: object
      required:
        - address
        - label
        - validUntil
        - expired
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "被代表账户的主钱包；金库则为金库经理的主钱包"
        subaccount:
          type: integer
          description: "`address` 下的子账户索引；金库授权和交易所管理授权没有此字段"
        vault:
          type: integer
          description: "授权作用于金库主账户时的金库 ID"
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "`null` = 永不过期"
        expired:
          type: boolean
          description: "过期后仍会列出：续期即可，它并未被撤销"
        executable:
          type: boolean
          description: "`true` = 账本此刻会接受该授权：当前策略纪元、`active`、处于 `validFrom`..`validUntil` 之内（交易所授权还需是当前所有者纪元）。命令仍可能因动作、范围或额度被拒"
        dex:
          type:
            - integer
            - "null"
          description: "交易所范围管理授权所属的交易所：只能为该交易所签署 `management` nonce 序列的命令。账户交易授权为 `null`"
    Balance:
      type: object
      properties:
        token:
          type: string
          description: "代币符号（`USDC` 等）"
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        hold:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "被挂着的现货订单冻结的部分"
        available:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "可用余额：`amount − hold`"
      required:
        - token
        - amount
        - hold
        - available
    Book:
      type: object
      required:
        - symbol
        - depth
        - bids
        - asks
        - seq
        - ts
      properties:
        symbol:
          type: string
          description: "市场符号，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；`symbol` + `kind` 唯一确定一个市场（永续与现货市场可能同名）"
        depth:
          type: integer
          description: "请求的每侧档位数（REST 或 WebSocket 的 `depth`）"
        bids:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: "按价格降序"
        asks:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: "按价格升序"
        seq:
          type: integer
          format: uint64
          description: "本快照对应的状态序号"
        ts:
          type: integer
          format: int64
          description: "Unix 毫秒"
        aggTicks:
          type: integer
          description: "每个价格桶的 tick 数；仅在请求了价格聚合时出现。此时各档位为桶边界，由整个订单簿合并而成"
    BookLevel:
      type: array
      prefixItems:
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "价格"
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "数量"
      minItems: 2
      maxItems: 2
      description: "一个价格档位：`[price, size]`"
    BuilderSummary:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址，小写"
        startTime:
          type: integer
          format: int64
          description: "Unix 毫秒"
        endTime:
          type: integer
          format: int64
          description: "Unix 毫秒"
        entries:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
              amount:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "十进制字符串"
        note:
          type: string
    BuilderView:
      type: object
      required:
        - builderId
        - status
        - catalog
        - categories
        - fees
        - asOfSeq
      properties:
        builderId:
          type: integer
          format: uint32
        status:
          type: string
          enum:
            - active
            - disabled
        catalog:
          type: object
          required:
            - version
            - markets
            - migrations
          properties:
            version:
              type: integer
              format: uint64
              description: "目录版本（0 = 从未写入）"
            markets:
              type: array
              description: "`listed` 和 `closeOnly` 市场，先按 `sort` 再按代码排序；隐藏市场和没有代码元数据的市场不列出"
              items:
                type: object
                required:
                  - symbol
                  - display
                  - status
                  - sort
                  - tags
                properties:
                  symbol:
                    type: string
                    description: "完整市场代码（商户交易所上为 `<dex code>:BASE-QUOTE`）；交易、撤单、平仓的唯一键"
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "`symbol` + `kind` 唯一确定一个市场（永续市场和现货市场可能共用同一代码）"
                  display:
                    type: string
                    description: "展示名称：builder 设置了自定义展示名时用它，否则为去掉 `<dex code>:` 前缀的代码。同一 `kind` 内唯一（不区分大小写），但两个都回退为去前缀代码的行可能相同；切勿把它反解回代码"
                    examples:
                      - BTC-USD
                  status:
                    type: string
                    enum:
                      - listed
                      - closeOnly
                    description: "`closeOnly` = 只接受只减仓订单（来源正在切换或被取消共享）；只提供平仓"
                  sort:
                    type: integer
                    format: int32
                  tags:
                    type: array
                    items:
                      type: string
                    description: "分类代码，按展示顺序（没有时为空）；名称见 `categories`"
            migrations:
              type: array
              description: "本目录的交易对迁移（同一资产迁移到另一个市场），先按 `fromSymbol`、再按 `kind`、再按 `toSymbol` 排序；没有时为空。迁移不会撤掉 `fromSymbol` 上的挂单；请提醒用户撤单"
              items:
                type: object
                required:
                  - fromSymbol
                  - fromDisplay
                  - toSymbol
                  - toDisplay
                  - kind
                  - state
                  - effectiveMs
                  - graceUntilMs
                properties:
                  fromSymbol:
                    type: string
                    description: "迁出市场的完整代码"
                  fromDisplay:
                    type: string
                    description: "`fromSymbol` 的展示名称：它在本目录中时取其 `markets[].display`，否则为去掉 `<dex code>:` 前缀的代码"
                    examples:
                      - BTC-USD
                  toSymbol:
                    type: string
                    description: "迁入市场的完整代码"
                  toDisplay:
                    type: string
                    description: "`toSymbol` 的展示名称，规则同 `fromDisplay`"
                    examples:
                      - BTC-USD
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "两个市场的类型"
                  state:
                    type: string
                    enum:
                      - scheduled
                      - postponed
                      - executed
                    description: "`scheduled`：已公告；到 `effectiveMs` 时，永续的 `fromSymbol` 转为 `closeOnly`，现货的移出目录。`postponed`：已到时间但未执行，时间待定。`executed`（永续）：已执行；`fromSymbol` 在 `graceUntilMs` 之前为 `closeOnly`"
                  effectiveMs:
                    type: integer
                    format: uint64
                    description: "Unix 毫秒：计划时间（`scheduled`、`postponed`）或生效时间（`executed`）"
                  graceUntilMs:
                    type:
                      - integer
                      - "null"
                    format: uint64
                    description: "`fromSymbol` 移出目录的 Unix 毫秒时间；仅 `executed` 有值，其余为 `null`"
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/CategoryView"
          description: "builder 自己的分类加上其展示行用到的平台模板，先按 `sort` 再按代码排序；builder 前端使用这些，而不是 `/v1/markets[].tags`"
        fees:
          type: object
          required:
            - default
            - markets
          description: "builder 的前端费率（名义价值的比例）；`default`（`null` = 未设置 = 0）适用于没有 `markets` 行的市场。仅在启用 builder 费用时收取；按市场受 `/v1/markets[].fees.builderRate` 封顶"
          properties:
            default:
              type:
                - object
                - "null"
              required:
                - takerRate
                - makerRate
              properties:
                takerRate:
                  type: string
                  pattern: "^[0-9]+(\\.[0-9]+)?$"
                  description: "十进制字符串（名义价值的比例）"
                makerRate:
                  type: string
                  pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                  description: "名义价值的比例；负值 = builder 向挂单方支付的补贴（仅限永续），每笔成交的上限为吃单方按名义价值分摊的净协议费减去挂单方自身的协议返佣"
            markets:
              type: array
              description: "单市场覆盖，按代码升序；没有代码元数据的市场不列出"
              items:
                type: object
                required:
                  - symbol
                  - takerRate
                  - makerRate
                properties:
                  symbol:
                    type: string
                    description: "完整市场代码"
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "`symbol` + `kind` 唯一确定一个市场（永续市场和现货市场可能共用同一代码）"
                  takerRate:
                    type: string
                    pattern: "^[0-9]+(\\.[0-9]+)?$"
                    description: "十进制字符串（名义价值的比例）"
                  makerRate:
                    type: string
                    pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                    description: "名义价值的比例；负值 = builder 向挂单方支付的补贴（仅限永续），每笔成交的上限为吃单方按名义价值分摊的净协议费减去挂单方自身的协议返佣"
        asOfSeq:
          type: integer
          format: uint64
          description: "本次读取所反映的日志位置（上界）"
        dex:
          type:
            - integer
            - "null"
          minimum: 1
          description: "该入口的商户交易所：目录中所有上架或只平仓市场都属于同一商户交易所时设置（忽略隐藏条目），否则为 `null`；白标前端默认读取用户在该交易所下的余额"
        market:
          type:
            - object
            - "null"
          description: "仅在带 `?market=` 时出现：所查市场在目录中的那一行；不在本 builder 目录中则为 `null`。`hidden` = 不列出，但可经深链打开和交易；`null` = 前端应只读展示"
          required:
            - signingMarketId
            - status
          properties:
            signingMarketId:
              type: integer
              format: uint16
            status:
              type: string
              enum:
                - listed
                - hidden
                - closeOnly
    PlatformEntry:
      type: object
      required:
        - builderId
        - domain
        - homeDex
      description: "在未绑定 builder 的入口域名上不带 `?builder=` 调用 `GET /v1/builder`：平台自身的入口（市场见 `/v1/markets`）"
      properties:
        builderId:
          type: "null"
        domain:
          type: string
          description: "请求解析到的入口域名"
        homeDex:
          type:
            - string
            - "null"
          description: "在 `dex-admin` 中配置的默认交易所的短名；前端展示其市场时可省略 `<code>:` 前缀。未配置时为 `null`。仅用于展示"
    Candle:
      type: object
      description: "K 线（OHLCV）"
      properties:
        t:
          type: integer
          format: int64
          description: "开盘时间"
        T:
          type: integer
          format: int64
          description: "收盘时间，不含（= 下一根 K 线的开盘时间；`1M` / `1Y` 按自然月 / 自然年）"
        i:
          type: string
        o:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        h:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        l:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        c:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        v:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "成交量，以基础资产为单位"
    CategoryView:
      type: object
      required:
        - code
        - names
        - sort
      properties:
        code:
          type: string
          pattern: "^[a-z0-9-]{1,24}$"
        names:
          type: object
          additionalProperties:
            type: string
          description: "按语言标签（`en`、`zh-CN`……）给出的显示名称；语言回退由前端决定"
        sort:
          type: integer
          format: int32
          description: "显示顺序，升序；相同时按代码"
      description: "分类定义。某一层的 `categories` 为其自有定义加上它引用的平台模板；自有定义覆盖代码相同的模板。"
    Dex:
      type: object
      properties:
        dex:
          type: integer
        code:
          type:
            - string
            - "null"
          description: "账本短名，即该交易所市场符号的前缀（`<code>:BASE-QUOTE`）：2–8 位大写字母和数字，`MAIN` 为保留名。仅在账本读取不可用时为 `null`"
        owner:
          type: string
        collateralToken:
          type: integer
        insuranceAccount:
          type: integer
        feeRecipient:
          type: integer
        status:
          type: string
          enum:
            - Active
            - Disabled
        markets:
          type: array
          items:
            type: integer
          description: "该交易所的永续市场"
        spotMarkets:
          type: array
          items:
            type: integer
          description: "该交易所的现货市场"
        insurance:
          type: object
          description: "该交易所的保险基金（平台交易所的保险基金也在其中）"
          required:
            - balance
            - equity
            - positions
            - principal
            - minAmount
            - withdrawDelayMs
            - pendingWithdraw
            - reduceOnly
            - uncoveredLoss
          properties:
            balance:
              type: string
              pattern: "^-?[0-9]+$"
              description: "基金现金余额；持有接管仓位期间可能为负"
            equity:
              type: string
              pattern: "^-?[0-9]+$"
              description: "现金 + 按标记价计的接管仓位；只减仓最低额度和提款以此为准"
            positions:
              type: array
              description: "从被强平账户接管、尚未平掉的仓位"
              items:
                type: object
                required:
                  - market
                  - lots
                  - costBasis
                properties:
                  market:
                    type: integer
                  lots:
                    type: integer
                    format: int64
                    description: "带符号的数量；负数 = 空头"
                  costBasis:
                    type: string
                    pattern: "^-?[0-9]+$"
                    description: "带符号的开仓成本，以保证金代币最小单位计"
            principal:
              type: string
              pattern: "^-?[0-9]+$"
              description: "可提取本金：注资减提款（不含强平手续费）"
            minAmount:
              type: string
              pattern: "^-?[0-9]+$"
              description: "平台设定的最低额度；低于该值时该交易所所有永续市场只减仓"
            withdrawDelayMs:
              type: integer
              format: uint64
              description: "从发起到执行提款之间的时间锁"
            pendingWithdraw:
              type:
                - object
                - "null"
              properties:
                to:
                  type: integer
                amount:
                  type: string
                  pattern: "^-?[0-9]+$"
                  description: "整数字符串，以保证金代币最小单位计"
                unlockMs:
                  type: integer
                  format: uint64
            reduceOnly:
              type: boolean
              description: "因基金低于最低额度，该交易所有永续市场处于只减仓状态"
            uncoveredLoss:
              type: string
              pattern: "^-?[0-9]+$"
              description: "该交易所市场上基金未能覆盖的亏空"
      additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - num
            - message
          properties:
            code:
              type: string
              description: "稳定的字符串码：`Gateway*`（网关）、`CoreError` 名（执行层，如 `InsufficientMargin`），或该端点响应里列出的 小写下划线形式的原因码（如 `unknown_account`）；见 `x-error-codes`"
            num:
              type: integer
              description: "稳定的数字错误码：`1xxxx` = 10000 + HTTP 状态码（网关）；`2xxxx` = 20000 + 编解码错误码（执行层）"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: "上下文，如 `symbol` / `address`；412 时说明哪个水位落后、落后多少。`cause`：内部故障的原始文本，可能不是英文；`message` 始终是英文"
      description: "所有非 `2xx` 响应的结构"
    Event:
      type: object
      properties:
        seq:
          type: integer
          format: uint64
          description: "日志序号，与回执的 `seq` 及 `x-dexos-seq` 响应头同轴"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "事件名（`Fill` / `OrderAccepted` / `OrderCanceled` / `Deposited` / `FundingTickSettled` 等）"
        data:
          type: object
          additionalProperties: true
          description: "内容取决于 `kind`；带 `market` 的事件也带有其 `symbol`"
    EventsPage:
      type: object
      properties:
        epoch:
          type: string
        completeSeq:
          type: integer
          format: uint64
          description: "日志序号，与回执的 `seq` 及 `x-dexos-seq` 响应头同轴"
        upper:
          type: string
        events:
          type: array
          items:
            "$ref": "#/components/schemas/Event"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
        finality:
          type: string
    Exchange:
      description: "EIP-712 签名域和完整代币表（`/config` 返回过滤后的表），每个托管资产一行 `deposit.tokens`。代币 0 恒为 6 位小数的 USDC；无元数据时 `symbol` / `decimals` 为 `null`"
      properties:
        chainId:
          type: integer
          description: "EIP-712 签名域的链 ID"
        conventions:
          type: object
          additionalProperties:
            type: string
        deposit:
          type: object
          properties:
            tokens:
              type: array
              items:
                type: object
                properties:
                  token:
                    type: integer
                  assetId:
                    type: integer
                    description: "托管资产 ID；`token` 是它入账的账本代币"
                  erc20:
                    type:
                      - string
                      - "null"
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "以 EVM 地址表示的代币合约；无法表示时为 `null`"
                  symbol:
                    type:
                      - string
                      - "null"
                  decimals:
                    type:
                      - integer
                      - "null"
                  extraWeiDecimals:
                    type:
                      - integer
                      - "null"
                    description: "兼容字段；小数位差超出 `u8` 时为 `null`。请改用 `extraDecimals`"
                  finalized:
                    type: boolean
                  homeChain:
                    type: integer
                    format: uint64
                    minimum: 0
                    maximum: 18446744073709552000
                  contract:
                    type: string
                    pattern: "^(0x)?[0-9a-fA-F]{64}$"
                    description: "完整代币合约，32 字节十六进制（EVM 地址左侧补零）"
                  extraDecimals:
                    type: integer
                    description: "链上代币与账本代币的有符号小数位差，-6..38"
                  withdrawDests:
                    type: array
                    items:
                      type: integer
                      format: uint64
                      minimum: 0
                      maximum: 18446744073709552000
                    description: "除本链外允许的提款目标链；列入并不代表中继路由已启用"
                  origin:
                    type: string
                    enum:
                      - legacy
                      - v2
            protocol:
              type: string
              const: v2
            routing:
              type: string
              const: /v1/exchange
            ledgerEpoch:
              type: string
          required:
            - protocol
            - routing
            - ledgerEpoch
            - tokens
        docs:
          type: string
        domain:
          type: object
          properties:
            name:
              type: string
              const: dex-os
            version:
              type: string
            verifyingContract:
              type: string
              pattern: "^0x[0-9a-f]{40}$"
              description: "EVM 地址；响应中为小写，请求中不区分大小写"
        finalityMode:
          type: string
          description: "仅为兼容保留；不表示入金终局性策略"
        fundingTickSec:
          type: integer
          description: "资金费结算周期（秒），所有永续市场相同（与 `/config` 一致）；现货无资金费。永不为 `null`：节点尚不知道该值时，整个响应为 503 `GatewayUnavailable`，请重试"
          minimum: 1
        serverTime:
          type: integer
          format: int64
          description: "Unix 毫秒"
        vault:
          type: object
          description: "执行层强制执行的金库经济参数（`/config` 中没有）；请从这里读取，切勿硬编码"
          properties:
            creationFee:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "创建金库时向创建者收取的费用，USDC 十进制字符串；在初始存入之外另收"
            minDeposit:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "每笔金库存入、认领和创建初始存入的最低金额，USDC 十进制字符串；低于此值以 `VaultDepositTooSmall` 拒绝"
          required:
            - creationFee
            - minDeposit
        version:
          type: object
          properties:
            pkg:
              type: string
            snapshotVer:
              type: integer
            codecVer:
              type: integer
            buildId:
              type: string
            api:
              type: string
              const: v1
      required:
        - chainId
        - domain
        - deposit
        - serverTime
        - fundingTickSec
        - vault
        - version
        - conventions
        - docs
      type: object
    Fill:
      type: object
      required:
        - id
        - symbol
        - side
        - role
        - price
        - size
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "事件标识 `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 完全相同"
        orderId:
          type:
            - string
            - "null"
        symbol:
          type: string
          description: "市场符号，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；`symbol` + `kind` 唯一确定一个市场（永续与现货市场可能同名）"
        side:
          type: string
          enum:
            - buy
            - sell
        role:
          type: string
          enum:
            - taker
            - maker
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        fee:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "本方手续费，以 `feeToken` 计；负数 = 挂单方返佣。与 `/v1/account/ledger` 中的 `taker_fee` / `maker_fee` 条目一致"
        feeToken:
          type: string
          description: "实际收取手续费的代币。现货：本方收到的代币（买方 → 基础代币，卖方 → 计价代币）。永续：该市场的结算代币（即其所属交易所的结算代币）"
          examples:
            - USDC
            - ETH
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: "Unix 毫秒"
        seq:
          type: integer
          format: uint64
          description: "日志序号（与回执中的 `seq`、`x-dexos-seq` 同一序号轴）"
    FillsPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址（响应中为小写，请求中不区分大小写）"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "请求指定金库（`vault=<id>`）时出现，代替 `address` / `subaccount`"
        epoch:
          type: string
        upper:
          type: string
          description: "本次遍历的固定上界；后续各页原样传回"
        fills:
          type: array
          items:
            "$ref": "#/components/schemas/Fill"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
          description: "**只有 `false` 才表示已拿到全部数据**"
        finality:
          type: string
    FundingPoint:
      type: object
      properties:
        ts:
          type: integer
          format: int64
          description: "Unix 毫秒"
        seq:
          type: integer
          format: uint64
          description: "日志序号，与回执的 `seq` 及 `x-dexos-seq` 响应头同轴"
        rate:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "本次结算适用的费率（十进制）"
        index:
          type: string
          description: "累计资金费指数"
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "事件 ID `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 相同"
        seq:
          type: integer
          format: uint64
          description: "Raft 日志序号；与回执的 `seq` 及 `x-dexos-seq` 响应头同轴"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "经济分类：`deposit` / `withdraw` / `taker_fee` / `maker_fee` / `funding` / `transfer_out` / `transfer_in` / `liquidation` / `builder_fee` …"
          enum:
            - deposit
            - withdrawal
            - send_asset
            - transfer_in
            - transfer_out
            - trade
            - liquidation_trade
            - adl
            - spot_trade
            - taker_fee
            - maker_fee
            - maker_rebate
            - fee_revenue
            - rebate_paid
            - deployer_fee
            - deployer_fee_revenue
            - builder_fee
            - builder_fee_revenue
            - liquidation_fee
            - insurance_fund
            - bad_debt_cover
            - funding
            - settlement
            - vault_deposit
            - vault_redeem
            - vault_profit_share
            - vault_refund
            - vault_allocate
            - vault_retrieve
            - vault_fee
        token:
          type: string
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "带符号，以代币单位计"
        symbol:
          type:
            - string
            - "null"
        signingMarketId:
          type:
            - integer
            - "null"
          description: "市场 ID（`/v1/markets` 中的 `signingMarketId`）；用于区分共用符号的永续和现货市场"
        order:
          type:
            - integer
            - "null"
          format: uint64
          description: "成交 / 手续费分录中本账户的订单"
        counterOrder:
          type:
            - integer
            - "null"
          format: uint64
          description: "成交分录中对手方的订单"
        reference:
          type:
            - string
            - "null"
          description: "转账和提款的托管 / 发件箱 ID"
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: "执行时的区块时间，Unix 毫秒"
        outboxStatus:
          type: string
          enum:
            - pending
            - acked
          description: "仅 `send_asset`：发件箱条目是否已确认"
        ackedAt:
          type: string
          description: "仅 `send_asset`：确认事件的 ID"
        deposit:
          type:
            - object
            - "null"
          description: "仅 `deposit` 分录：这笔入账的链上来源，用于确认某笔具体入金已入账；运营方或测试入账时为 `null`；其他类型不含此字段"
          required:
            - chain
            - depositId
            - source
          properties:
            chain:
              type: string
              description: "入金所在链 ID，十进制字符串"
            depositId:
              type: string
              description: "入金去重键，带 0x 前缀的 32 字节十六进制（对链和来源做 keccak）"
            source:
              oneOf:
                - type: object
                  required:
                    - kind
                    - txId
                    - indexInTx
