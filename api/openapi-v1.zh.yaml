  "/v1/vaults/{id}/transitions/{source}/{ordinal}":
    get:
      tags:
        - Vaults
      summary: "查询金库异步任务状态"
      operationId: v1_vault_transition
      description: |-
        按原请求的日志序号（`source`）和逻辑命令序号（`ordinal`）查询金库认领或存入任务的状态：`pending`，或最终状态 `succeeded` / `rejected`。

        - 付款请求的 `wait=fold` 回执不表示铸造、退款或授权已到最终状态；请在此查询。
        - 503：历史不可用或读模型尚未到达 `source`；请稍后重试。
        - 404：读模型已越过 `source` 但没有该任务的记录；并非业务失败。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: "金库 ID"
        - name: source
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
            description: "日志序号，十进制字符串"
          description: "原请求的完整日志序号（不是确认命令的）"
        - name: ordinal
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: "原请求内的逻辑命令序号（不是物理记录子索引）"
      responses:
        "200":
          description: "待处理状态或持久化的最终状态"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "日志序号，十进制字符串"
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                      - errorCode
                      - confirmationSeq
                      - confirmationSub
                    properties:
                      status:
                        type: string
                        enum:
                          - succeeded
                          - rejected
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "日志序号，十进制字符串"
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                      errorCode:
                        type: integer
                        minimum: 0
                        maximum: 65535
                        description: "成功为 0；否则为原命令的数字账本错误码"
                      confirmationSeq:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "日志序号，十进制字符串"
                      confirmationSub:
                        type: integer
                        minimum: 0
                        maximum: 65535
        "400":
          description: "路径参数无效"
        "404":
          description: "读模型已越过 `source`，但历史中没有该任务的记录；不表示 `rejected`"
        "500":
          description: "执行历史中的确认记录已损坏"
        "503":
          description: "读模型或历史不可用，或读模型尚未到达 `source`；请稍后重试"
  /v1/account/subaccounts/name:
    post:
      tags:
        - Account
      summary: "重命名子账户"
      operationId: v1_subaccount_name
      description: |-
        设置子账户的显示名称，仅由网关保存（不经过定序：没有 `seq` / `requestId`）；可在 `GET /v1/account/subaccounts` 的 `name` 读回。
        - 策略签名：第一个 `oneOf` 分支；主账户策略成员在域 `DEXOS/SubaccountName` 下对 `x-eip712.ledgerTypeString` 签名，签名数达到门限。
        - 旧版账本：第二个分支；由所有者对 `x-eip712.typeString` 签名。
        - `nonce` 必须大于该子账户上一次名称写入的值，否则返回 409 `GatewayConflict`。

        **EIP-712 结构体**

        ```
        SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ```

        **账本签名结构体**（签名域 `DEXOS/SubaccountName`）

        ```
        SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ```
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                oneOf:
                  - title: "策略签名"
                    type: object
                    required:
                      - status
                      - account
                      - subaccount
                      - name
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      account:
                        type: integer
                        format: int64
                        description: "主账户 ID，与请求一致"
                      subaccount:
                        type: integer
                        description: "子账户索引，与请求一致（0 = 主账户）"
                      name:
                        type: string
                        description: "已保存的名称，与签名内容完全一致"
                  - title: "旧版账本"
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      address:
                        type: string
                        pattern: "^0x[0-9a-f]{40}$"
                        description: "EVM 地址（响应中为小写，请求中不区分大小写）"
                      subaccount:
                        type: integer
                      name:
                        type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          description: "`GatewayBadSignature`：未达门限、签名者非成员或重复、签名数多于成员数，或域 / 消息不符"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "`GatewayConflict`：nonce 不大于该子账户上一次名称写入（`details.subaccount`），或（策略签名）`policyEpoch` 已过时（`details.policyEpoch` = 当前值）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: "策略签名"
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - policyEpoch
                    - signatures
                  properties:
                    account:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 4294967295
                      description: "主账户（策略账户）ID；子账户或派生账户 ID 返回 400，未知账户返回 404"
                    subaccount:
                      type: integer
                      minimum: 0
                      maximum: 65535
                      description: "子账户索引（0 = 主账户本身）；从未开设的索引返回 404"
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: "1–32 个 Unicode 标量值；首尾不能有空白，不能含控制或格式字符（`Cc` / `Cf`）。网关不裁剪：按签名内容原样发送；违反规则返回 400，而非 401"
                    nonce:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                          maximum: 9223372036854776000
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "整数或十进制字符串，取值 [0, 2^63)，须大于该子账户上一次被接受的名称写入（否则 409 `GatewayConflict`）；可用 Unix 毫秒"
                    policyEpoch:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "签名所用的账户策略纪元（`GET /v1/accounts/{id}` 的 `policyEpoch`）；非当前纪元时返回 409 `GatewayConflict`，`details.policyEpoch` = 当前纪元"
                    signatures:
                      type: array
                      minItems: 1
                      maxItems: 16
                      items:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{130}$"
                      description: "65 字节签名（r ‖ s ‖ v，v = 27/28 或 0/1），对 `x-eip712.ledgerDomain` 下的 `x-eip712.ledgerTypeString` 签名，顺序不限。门限 ≤ 数量 ≤ 成员数且不重复，否则 401 `GatewayBadSignature`；超过 16 个返回 400"
                - title: "旧版账本"
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - signature
                  properties:
                    account:
                      type: string
                      pattern: "^0x[0-9a-f]{40}$"
                      description: "EVM 地址（响应中为小写，请求中不区分大小写）"
                    subaccount:
                      type: integer
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                    nonce:
                      type: integer
                      format: int64
                      description: "任何大于上一次名称写入的值（可用 Unix 毫秒）"
                    signature:
                      type: string
                      pattern: "^0x[0-9a-fA-F]{130}$"
                  description: "仅旧版账本：所有者对 `SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)`（`x-eip712.typeString`）签名。本网络返回 400。"
      x-eip712:
        typeString: SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ledgerTypeString: SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ledgerDomain: DEXOS/SubaccountName
  /v1/commands:
    post:
      tags:
        - Trading
      summary: "提交签名命令"
      description: |-
        提交一条完整签名的命令：`{"command": "0x…"}`（SDK 生成的规范编码，小写十六进制）。
        nonce、有效期和签名都必须已在命令中。查询参数只接受
        `wait=match`，其他参数返回 400 `unsupported_submission_parameter`。

        - `202` = 仅已定序；`200` 且带 `duplicate: true` = 已被准入。400 / 403 / 409 / 422 / 429 = 定序前被拒绝，
          nonce 未动用（例如 `malformed_signed_command`、`unsupported_command`、
          `invalid_signature`、`nonce_below_floor`、`grant_expired`）。421：换一个节点。
        - **确认**：轮询 `GET /v1/requests/{requestId}`，直到 `Executed` 或 `AuthorizationRejected`。超时（约 10 秒）
          或收到带 `submissionOutcome: "Unknown"` 的 503 后，只能重新提交完全相同的字节。
        - **网络锁定**：只发送一次 `x-dexos-expect-manifest`；不匹配：503 `upstream_manifest_mismatch`。
        - **权重** `1 + floor(n / 40)`（n 为订单、撤单、改单数）；签名者未验证的命令计入按 IP 的 `unverified`
          预算。
        - **`clientOrderId`**：1-36 个字符，取自 `[A-Za-z0-9._:/-]`；同一账户在准入后复用：409
          `GatewayDuplicateClientOrderId`（并发的重复 ID 可能都被准入）。TWAP 和 TP/SL 订单没有该 ID；撤单和改单用
          `orderId`。索引不可用：503 `client_order_index_unavailable`。
        - **builder**：400 `GatewayBuilderUnknown`；403 `GatewayBuilderDisabled`、`builder_not_approved`、
          `GatewayBuilderMarketNotListed`、`GatewayBuilderMarketCloseOnly`（非只减仓订单；改单按原订单的 builder
          检查）。上架列表不可用：503 `GatewayUnavailable`。
        - **结算代币**：账户有余额、但其中没有结算代币且在该市场无仓位时，新的永续订单返回
          422 `GatewayCollateralTokenMismatch`。
        - **背压**：503 `GatewayHistoryBackpressure` 加 `Retry-After`，暂停除撤单外的写入。
      operationId: v1_commands
      parameters:
        - name: wait
          in: query
          required: false
          schema:
            type: string
            enum:
              - match
          description: "只适用于下单类命令（其他命令返回 400 `wait_match_unsupported_command`）：撮合完成后以 `200` 返回结果（`stage`）；余额和仓位随后很快落定。超时：`202` 且带 `resultsPending: true`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command
              properties:
                command:
                  type: string
                  pattern: "^0x[0-9a-f]+$"
                  minLength: 6
                  maxLength: 2097154
                  description: "规范二进制编码的签名命令：`0x` + 小写十六进制，解码后最多 1 MiB。非规范字节：400 `malformed_signed_command`"
      responses:
        "200":
          description: "完全相同的命令（相同的 `requestId` 和 `digest`）已被准入：返回首次回执，带 `duplicate: true`；`seq` / `sub` / `x-dexos-seq` 均为首次准入时的值；带 `wait=match` 时为执行结果"
          headers:
            x-dexos-seq:
              "$ref": "#/components/headers/x-dexos-seq"
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/CommandResubmitted"
                  - "$ref": "#/components/schemas/CommandMatched"
        "202":
          description: "已定序（`seq`、`sub`；`seq` 也在 `x-dexos-seq` 中），尚未授权或执行（`executionKnown: false`，`nonceConsumed: null`）。请用 `GET /v1/requests/{requestId}` 确认；`wait=match` 超时也返回 202"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandAccepted"
        "400":
          description: "定序前被拒绝，nonce 未动用：`malformed_signed_command`、`unsupported_command`、`invalid_command_identity`、`unsupported_submission_parameter`、`wait_match_unsupported_command`、`invalid_signature_encoding`、`invalid_signature`、`signature_order`、`threshold_not_met`、`authority_epoch_mismatch`、`grant_revoked`、`grant_expired`、`nonce_below_floor`、`nonce_too_far_ahead`、`address_already_has_account`、`precheck_rejected`、`GatewayBuilderUnknown`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "403":
          description: "builder 预检拒绝，未定序，nonce 未动用：`GatewayBuilderDisabled`、`builder_not_approved`、`GatewayBuilderMarketNotListed`、`GatewayBuilderMarketCloseOnly`（订单非只减仓）；`details`：`builder`、`markets`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "408":
          description: "读取请求体超时（`command_body_timeout`）；未提交任何内容"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "409":
          description: "`GatewayDuplicateClientOrderId`：该账户此前一条已准入的命令用过这个 `clientOrderId`；未定序，`nonceConsumed: false`。重发已准入命令的相同字节则返回 200"
        "413":
          description: "请求体或命令超出大小限制（`command_too_large`、`command_body_unavailable`）；未提交任何内容"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "415":
          description: "`content-type` 必须为 `application/json`（`json_content_type_required`）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "421":
          description: "本节点不接受写入（`read_only_replica`、`not_leader`；已知时 `leader` 为主节点的节点 ID，十进制字符串）；把同一命令发往另一个节点"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "422":
          description: "`GatewayCollateralTokenMismatch`（`num` 10422）：账户有正余额，但其中没有该永续市场的结算代币，且在该市场无仓位。未定序；nonce 未被消耗"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "`GatewayRateLimited`，带 `retry-after`；未定序。`details.bucket`：`ip`、`account`（已验证的签名主体）或 `unverified`（按 IP 计的较小预算，用于签名者尚未验证的命令）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "`submission_timeout` / `submission_outcome_unknown`：仍可能执行；只重发完全相同的字节。已拒绝：`GatewayHistoryBackpressure`、`client_order_index_unavailable`、`upstream_manifest_mismatch`、`GatewayUnavailable`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
  /v1/merchant-admission:
    get:
      tags:
        - Merchants
      summary: "商户准入"
      description: "允许注册交易所的账户，以及实例身份（`networkId` / `genesisHash` / `ledgerEpoch` / `manifestHash`）和快照位置（`inputSeq` / `hostLogIndex` / `inputPrefix`），读自同一个账本快照。"
      operationId: v1_merchant_admission
      parameters: []
      responses:
        "200":
          description: "账本快照视图；64 位整数为十进制字符串"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - admission
                    properties:
                      admission:
                        "$ref": "#/components/schemas/MerchantAdmission"
        "503":
          description: "账本读视图尚未就绪；请稍后重试"
  "/v1/builder-registrations/{id}":
    get:
      tags:
        - Merchants
      summary: "builder 注册信息"
      description: "builder 注册信息，来自同一个账本快照：所有者账户及其策略纪元、收款账户、`configVersion`、`ownerActive` / `councilDisabled` / `active`（= `ownerActive && !councilDisabled`）、`configHash`。`configVersion` 和所有者策略纪元是修改收款账户或状态的治理操作的前置条件。"
      operationId: v1_builder_registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "builder ID（十进制，>= 1）"
      responses:
        "200":
          description: "一个一致的账本快照"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "builder ID 格式错误或为 0（`invalid_builder`）"
        "404":
          description: "未注册（`unknown_resource`）"
        "503":
          description: "账本读视图尚未就绪；请稍后重试"
  "/v1/dex-registrations/{id}":
    get:
      tags:
        - Merchants
      summary: "商户交易所注册"
      description: "按提交原样给出的交易所注册及其状态"
      operationId: v1_dex_registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "注册 ID（带 0x 前缀的 32 字节十六进制）"
      responses:
        "200":
          description: "已发布的账本快照（只读）"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - authority
                      - dex
                    properties:
                      authority:
                        type: string
                        enum:
                          - Council
                          - Owner
                        description: "当前治理方：账户所有的交易所为 `Owner`，已移交理事会的交易所为 `Council`"
                      dex:
                        "$ref": "#/components/schemas/DexRegistration"
        "400":
          description: "路径参数格式错误（`invalid_registration_id`）"
        "404":
          description: "未找到（`unknown_resource`）"
        "503":
          description: "账本读视图尚未就绪；请稍后重试"
  "/v1/dex-owner-proposals/{id}":
    get:
      tags:
        - Merchants
      summary: "交易所所有权转让提案"
      description: "交易所所有权转移提案：原始提案、首个被接受的信封、摘要、策略纪元以及认证时间下的状态。未知 ID 或非所有权转移提案返回 404。"
      operationId: v1_dex_owner_proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "提案 ID（0x 前缀的 32 字节十六进制）"
      responses:
        "200":
          description: "已发布的账本状态。`authorKind` / `oldOwnerKind` 表示提案方 / 原所有者是账户还是理事会；理事会对应的 `oldOwner` 为 0"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "路径参数格式错误（`invalid_proposal_id`）"
        "404":
          description: "未找到"
        "503":
          description: "账本读视图不可用或尚未就绪；稍后重试"
  "/v1/custody/{key}":
    get:
      tags:
        - Funds
      summary: "托管组"
      description: "托管组的账本状态：目录版本、`mode`（`normal` / `escapePending` / `frozen`）、下一个根序号和上次快照点时间、包含该组且已切出但尚未被接受的根、最近被接受的根、逃生和冻结状态、链上观测，以及按资产统计的入金 / 退款 / 支付计数及累计哈希。另含 `registration`（十六进制）、`registrationHash`（= 注册该组的治理操作的 `configHash`）和 `firstCheckpointSeq`（创世组为 1）。"
      operationId: v1_custody_group
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "托管组的 `custodyKeyHash`，0x 32 字节十六进制"
      responses:
        "200":
          description: "账本快照视图"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "路径参数格式错误（`invalid_custody_key_hash`）"
        "404":
          description: "未知托管组（`unknown_custody_group`）"
        "503":
          description: "账本读视图未就绪；请重试"
  /v1/accounts:
    get:
      tags:
        - Account
      summary: "按策略成员查询账户"
      description: "策略成员包含该地址的账户，按策略 ID 升序，用 `after` / `limit` → `next` 分页：账户 ID、策略 ID 与纪元、门限、成员、退出地址。只有 `soleSigner` 账户（唯一成员、门限 1）会经 `?address=` 归属到该地址，因为任何人都能把你的地址加进多成员策略。"
      operationId: v1_accounts_of_member
      parameters:
        - name: member
          in: query
          required: true
          schema:
            type: string
          description: "成员地址（0x + 40 位十六进制）"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "取自 `next` 的策略 ID（十进制）；本页从它之后开始"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000，默认 100"
      responses:
        "200":
          description: "已发布的账本状态"
          content:
            application/json:
              schema:
                type: object
                required:
                  - member
                  - accounts
                  - next
                properties:
                  member:
                    type: string
                  accounts:
                    type: array
                    items:
                      type: object
                  next:
                    type:
                      - string
                      - "null"
                    description: "作为 `after` 传入以取下一页；最后一页为 `null`"
        "400":
          description: "查询参数格式错误：`invalid_member_address` / `invalid_after` / `invalid_limit`"
        "503":
          description: "本节点的账本读视图不可用或尚未就绪；请稍后重试"
  "/v1/accounts/{id}":
    get:
      tags:
        - Account
      summary: "按 ID 读账本账户"
      description: |-
        账户的退出策略：策略 ID 和纪元、退出地址、门限和成员。

        - `id` 可以是主账户或派生账户（子账户 / 商户分桶）；`account` 始终是根账户，`queried` 描述 `id`，`derived` 列出派生账户及其拥有的交易所保险基金（`dexFund`）。
        - 没有账户根的 ID（保险基金、平台账户、未分配的 ID）返回 404。
        - `builderApprovals`：根账户的 builder 费用批准 `[{builder, maxFeePpm}]`，按 builder 升序。
      operationId: v1_account_by_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户 ID（十进制 32 位整数）"
      responses:
        "200":
          description: "已发布的账本状态（只读）"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "路径参数格式错误（`invalid_account_id`）"
        "404":
          description: "未找到（`unknown_account`）"
        "503":
          description: "本节点的账本读视图尚未就绪；请稍后重试"
  "/v1/accounts/{id}/tickets/{ticket}":
    get:
      tags:
        - Account
      summary: "提款票据"
      description: "账本是否仍为该账户持有这张提款票据；票据被取消或付款结算后 `ticket` 为 `null`。"
      operationId: v1_account_ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户 ID（十进制 `u32`）"
        - name: ticket
          in: path
          required: true
          schema:
            type: string
          description: "票据 ID，0x 32 字节十六进制"
      responses:
        "200":
          description: "账本快照视图"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "路径参数格式错误"
        "503":
          description: "账本读视图未就绪；请重试"
  /v1/grants:
    get:
      tags:
        - Account
      summary: "账户策略签发的授权"
      description: |-
        账户策略签发的授权（含已撤销的），带配置的限额和当前窗口用量；另有签发方的纪元及未撤销授权数与上限。

        - `resourceOwnerEpoch`：交易所范围的管理授权为签发时的交易所所有者纪元，否则为 0。
        - `reclaimable`：名额可回收的原因：`revoked` / `expired` / `issuerEpochStale` / `resourceOwnerEpochStale`（该交易所已更换所有者）。
      operationId: v1_grants
      parameters:
        - name: policy
          in: query
          required: true
          schema:
            type: string
          description: "策略 ID（十进制）"
      responses:
        "200":
          description: "一个一致的账本快照；整数为十进制字符串"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "查询参数格式错误（`invalid_policy_id`）"
        "404":
          description: "策略不存在（`unknown_principal`）"
        "503":
          description: "账本视图尚未就绪；请稍后重试"
  /v1/nonces:
    get:
      tags:
        - Account
      summary: "nonce 窗口"
      description: "签名主体当前纪元中某条 nonce 序列的窗口：`floor`、已用最高的 `high`（未使用时为 `null`）和建议的 `next`。`agent` / `service` 主体必须传 `grant`；`principal=council` 返回理事会 `management` nonce 序列的窗口，不接受主体 ID 或授权。带 `nonce` 时，`consumed` 表示该 nonce 是否已被消耗：`true`、`false`，低于 `floor` 时为 `null`（无法判定）。"
      operationId: v1_nonces
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
            enum:
              - account
              - agent
              - service
              - council
          description: "签名主体类型：`account` / `agent` / `service` / `council`"
        - name: policy
          in: query
          required: false
          schema:
            type: string
          description: "策略 ID（用于 `account` / `agent`）"
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: "服务 ID（用于 `service`）"
        - name: lane
          in: query
          required: true
          schema:
            type: string
          description: "nonce 序列（`lane`）：`trade` / `funds` / `management`"
        - name: grant
          in: query
          required: false
          schema:
            type: string
          description: "授权 ID（用于 `agent` / `service`）"
        - name: grantEpoch
          in: query
          required: false
          schema:
            type: string
          description: "授权纪元（用于 `agent` / `service`）"
        - name: nonce
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "可选，要查询的 nonce（64 位无符号十进制）；应答多一个 `consumed`（格式错误为 `invalid_nonce`）"
      responses:
        "200":
          description: "账本快照视图；64 位整数为十进制字符串"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "查询参数格式错误"
        "404":
          description: "未找到签名主体"
        "503":
          description: "本节点账本状态尚不可用；请稍后重试"
  "/v1/accounts/{id}/escape-preview":
    get:
      tags:
        - Account
      summary: "逃生叶子预览"
      description: |-
        基于当前账本视图估算该账户每种资产的逃生叶子：`own`、`inTransit`（在途资金，如托管中暂扣的提款）、`vaults[]`（金库份额价值按冻结估值穿透计入）、`vaultAmount`、`ledgerTotal`、`claimable` / `withdrawReserved` / `paidObserved`（原始单位，向下取整）。

        - **仅为估算**：准确值以逃生时基于冻结根的计算为准。
        - 金库账户返回 404 `vault_account_has_no_leaf`；未知账户或平台账户返回 `unknown_account`。
      operationId: v1_account_escape_preview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户 ID（十进制 32 位整数）"
      responses:
        "200":
          description: "一致的账本快照视图；64 位整数和金额为十进制字符串"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "`id` 不是十进制数（`invalid_account_id`）"
        "404":
          description: "`unknown_account`（未知账户或平台账户）或 `vault_account_has_no_leaf`（金库账户）"
        "503":
          description: "读视图尚未就绪，或无法在其上计算叶子（`escape_preview_unavailable`）；请稍后重试"
  /v1/custody:
    get:
      tags:
        - Funds
      summary: "托管组发现"
      description: |-
        托管组：合约地址（`checkpointRegistry`、`custodyVault`、`depositInbox`）、资产、路由、提款手续费策略、CCTP 常量（入金消息 536 字节）和检查点进度。请从这里读取地址，不要硬编码。

        - `assets[].depositEnabled`（账本）与 `chainEnabled`（链上）同为 `true` 时才开放入金。
        - `withdrawalFee`：现金提款的 `sourceFeeRaw` / `sourceFeeRecipient` 必须与之相符；把它原样传给 WASM 库的 `withdrawalFee`。
      operationId: v1_custody_groups
      parameters: []
      responses:
        "200":
          description: "已发布的账本状态；整数为十进制字符串"
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        custodyChainId:
                          type: string
                        contracts:
                          type: object
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              assetId:
                                type: integer
                              assetVersion:
                                type: string
                                description: "十进制字符串"
                              depositEnabled:
                                type: boolean
                                description: "仅账本侧：被接受的检查点已到 `enabledFromCut`。不读链；见 `chainEnabled`"
                              minDepositRaw:
                                type:
                                  - string
                                  - "null"
                                description: "`DepositInbox` 最低入金额，原始单位；`\"0\"` = 未配置，不接受入金；链上读取失败时为 `null`。低于它时直接入金回滚（`DepositBelowMinimum`），CCTP 入金作为迟到入金退款"
                              minDepositError:
                                type: string
                                description: "最低入金额读取失败的原因（仅当 `minDepositRaw` 为 `null` 时出现）"
                              chainRegistered:
                                type:
                                  - boolean
                                  - "null"
                                description: "`CustodyVault` 已按此 `assetVersion` 登记该资产；链上读取失败时为 `null`"
                              chainDepositEnabled:
                                type:
                                  - boolean
                                  - "null"
                                description: "`CustodyVault` 已开启该资产入金（已登记且已执行 `enableCashAsset`）；链上读取失败时为 `null`"
                              chainEnabled:
                                type:
                                  - boolean
                                  - "null"
                                description: "托管链接受该资产的直接入金：`chainDepositEnabled` 为真且 `minDepositRaw` > 0。任一读数显示未开即为 `false`；无法判定时为 `null`"
                              chainAssetError:
                                type: string
                                description: "金库读取失败的原因（仅当 `chainRegistered` 为 `null` 时出现）"
                        routes:
                          type: array
                          items:
                            type: object
                        cctp:
                          type: object
                          properties:
                            inboxMessageBytes:
                              type: integer
                              description: "CCTP 入金消息字节长度（536 = 376 + 160 字节钩子数据）"
                            bindingType:
                              type: string
                              description: "绑定类型字符串：`CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)`"
                            bindingTypehash:
                              type: string
                            beneficiaryForbidden:
                              type: array
                              items:
                                type: string
                              description: "禁止作为受益人的地址：零地址及该组的 `Inbox` / `Vault` / `Registry` 合约"
                        withdrawalFee:
                          type: object
                          properties:
                            version:
                              type: string
                            policyHash:
                              type: string
                            recipient:
                              type: string
                            schedules:
                              type: array
                              items:
                                type: object
                                properties:
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  fixedRaw:
                                    type: string
                                  ratePpm:
                                    type: integer
                                  capRaw:
                                    type: string
                            formula:
                              type: string
                            rounding:
                              type: string
                        policy:
                          type: object
                        status:
                          type: object
                        registration:
                          type: string
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - groups
        "400":
          description: "请求格式错误"
        "404":
          description: "未找到（`unknown_custody_group`）"
        "503":
          description: "本节点的账本读视图不可用或尚未就绪；请稍后重试"
  "/v1/custody/{key}/deposits/{asset}/{version}/{id}":
    get:
      tags:
        - Funds
      summary: "按回执查询入金状态"
      description: "按回执（资产、资产版本、`depositId`）查询一笔入金：账本侧状态及延迟原因（如有）、包含它的快照点和退款原因。链上详细状态（托管中 / 已退款 / 已入账）不由账本跟踪；`chain` 说明如何从 `DepositInbox.depositReceipt` 读取。入金按地址进行：受益人是回执的 `refundRecipient`，入账到其主账户；没有主账户时，首笔入账的入金会自动开立一个。"
      operationId: v1_custody_deposit
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "托管组的 `custodyKeyHash`，0x 32 字节十六进制"
        - name: asset
          in: path
          required: true
          schema:
            type: string
          description: "`assetId`（十进制 `u32`）"
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: "`assetVersion`（十进制 `u64`）"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "`depositId`（十进制 `u64`，从 1 开始）"
      responses:
        "200":
          description: "入金状态"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit:
                    type: object
                    properties:
                      custodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                        description: "十进制字符串"
                      depositId:
                        type: string
                        description: "十进制字符串"
                      nextDepositId:
                        type: string
                        description: "十进制字符串"
                      status:
                        type: string
                        enum:
                          - awaiting
                          - credited
                          - rejected
                          - refundPending
                          - refunded
                          - refundedBeforeProcessing
                          - consumed
                        description: "`awaiting`：尚未处理；`credited`：根尚未被接受；`rejected` / `refunded`：仍在队列中；`refundPending`：等待退款（含 `tellerRejected`）；`refundedBeforeProcessing`：处理前已退款；`consumed`：根已被接受（见 `chain`）"
                      queuePosition:
                        type: string
                        description: "在账本处理队列中的位置（0 = 下一个）"
                      refundRequested:
                        type: boolean
                      deferral:
                        type: object
                        description: "队首入金此刻是否会被延迟及原因：`wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                      accountId:
                        type:
                          - integer
                          - "null"
                        description: "回执解析到的账户：已入账的账户，被拒绝的回执则为受益人的主账户；没有时（或回执指定了账户号）为 `null`"
                      amountRaw:
                        type: string
                      receiptHash:
                        type: string
                      refundRecipient:
                        type: string
                        description: "回执中受益人字段的原始名称；同 `beneficiary`"
                      includedInCut:
                        type:
                          - string
                          - "null"
                        description: "包含该行的快照点序号（已切出但尚未被接受时）；否则为 `null`"
                      confirmed:
                        type: boolean
                      reason:
                        type: string
                        enum:
                          - userRequested
                          - accountUnregistered
                          - amountUnrepresentable
                          - creditCapExceeded
                          - liabilityCapExceeded
                          - tellerRejected
                          - unknown
                      chain:
                        type: object
                        description: "在托管链上读取链上详细状态的方式（合约、调用、状态码）；网关不会替你读取"
                      beneficiary:
                        type: string
                        description: "受益人地址，等于回执的 `refundRecipient`；被拒绝的入金退回该地址"
                      creditedAccountId:
                        type:
                          - integer
                          - "null"
                        description: "`status` = `credited` 时的入账账户（含自动开立的主账户）；否则为 `null`"
                      reasonDetail:
                        type:
                          - string
                          - "null"
                        enum:
                          - accountOpeningUnavailable
                          - explicitAccountUnsupported
                          - firstDepositOverAccountCap
                          - accountCapExceeded
                          - null
                        description: "细分 `reason`：`accountOpeningUnavailable` / `explicitAccountUnsupported`（`accountUnregistered`；无法判断时为 `null`，见 `deposits/by-tx/{tx}`）或 `firstDepositOverAccountCap` / `accountCapExceeded`（`tellerRejected`）"
                      reasonMessage:
                        type: string
                        description: "`reason` 和 `reasonDetail` 的可读说明"
                    required:
                      - custodyKeyHash
                      - assetId
                      - assetVersion
                      - depositId
                      - status
                      - chain
                required:
                  - deposit
        "400":
          description: "路径参数格式错误（`invalid_receipt`）"
        "404":
          description: "未知托管组或资产（`unknown_custody_asset`）"
        "503":
          description: "账本读视图未就绪；请重试"
  "/v1/custody/{key}/deposits/by-tx/{tx}":
    get:
      tags:
        - Funds
      summary: "按交易查询入金状态"
      description: "某笔托管链交易产生的入金：本托管组的 `InboxDeposited` 日志，各附其账本状态。已回滚的交易没有入金。"
      operationId: v1_custody_deposit_by_tx
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "托管组的 `custodyKeyHash`（带 0x 前缀的 32 字节十六进制）"
        - name: tx
          in: path
          required: true
          schema:
            type: string
          description: "托管链交易哈希（0x 前缀的 32 字节十六进制）"
      responses:
        "200":
          description: "该交易中本托管组的入金回执，各附账本状态"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  success:
                    type: boolean
                  blockNumber:
                    type: string
                  source:
                    type: string
                  deposits:
                    type: array
                    items:
                      type: object
                      properties:
                        logIndex:
                          type: string
                          description: "十进制字符串"
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: "十进制字符串"
                        depositId:
                          type: string
                          description: "十进制字符串"
                        receiptAccountId:
                          type: integer
                          description: "链上回执中的账户编号；总是 0，因为入金按地址入账。非零的回执会被退款（`reason` = `accountUnregistered`，`reasonDetail` = `explicitAccountUnsupported`）"
                        beneficiary:
                          type: string
                          description: "受益人地址；同回执中的 `refundRecipient`"
                        refundRecipient:
                          type: string
                          description: "回执中受益人字段的原名；值与 `beneficiary` 相同"
                        amountRaw:
                          type: string
                        sourceKind:
                          type: integer
                        sourceMessageId:
                          type: string
                        receiptHash:
                          type: string
                        deposit:
                          type: object
                          properties:
                            custodyKeyHash:
                              type: string
                            assetId:
                              type: integer
                            assetVersion:
                              type: string
                              description: "十进制字符串"
                            depositId:
                              type: string
                              description: "十进制字符串"
                            nextDepositId:
                              type: string
                              description: "十进制字符串"
                            status:
                              type: string
                              enum:
                                - awaiting
                                - credited
                                - rejected
                                - refundPending
                                - refunded
                                - refundedBeforeProcessing
                                - consumed
                              description: "账本状态：`awaiting` 未处理；`credited` 所在根尚未被接受；`rejected` / `refunded` 仍在队列中；`refundPending` 含因上限被拒的入账；`consumed` 入账已确认或退款已结算（见 `chain`）"
                            queuePosition:
                              type: string
                              description: "在账本处理队列中的位置（0 = 下一个）；十进制字符串"
                            refundRequested:
                              type: boolean
                            deferral:
                              type: object
                              description: "队首入金此刻是否会被推迟及原因：`wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                            accountId:
                              type:
                                - integer
                                - "null"
                              description: "回执对应的账户：已入账的账户，被拒时为受益人的主账户；没有主账户（或回执指定了账户编号）时为 `null`"
                            amountRaw:
                              type: string
                            receiptHash:
                              type: string
                            refundRecipient:
                              type: string
                              description: "回执中受益人字段的原名；值与 `beneficiary` 相同"
                            includedInCut:
                              type:
                                - string
                                - "null"
                              description: "包含该行的快照点序号（已生成但尚未被接受时）；否则为 `null`"
                            confirmed:
                              type: boolean
                            reason:
                              type: string
                              enum:
                                - userRequested
                                - accountUnregistered
                                - amountUnrepresentable
                                - creditCapExceeded
                                - liabilityCapExceeded
                                - tellerRejected
                                - unknown
                            chain:
                              type: object
                              description: "账本不跟踪的链上明细状态去哪里读（合约、调用、状态码表）；网关不代为读取"
                            beneficiary:
                              type: string
                              description: "受益人地址，同回执中的 `refundRecipient`；被拒的入金退还到该地址"
                            creditedAccountId:
                              type:
                                - integer
                                - "null"
                              description: "`status` = `credited` 时的入账账户（含由首笔入金自动开设的主账户）；否则为 `null`"
                            reasonDetail:
                              type:
                                - string
                                - "null"
                              enum:
                                - accountOpeningUnavailable
                                - explicitAccountUnsupported
                                - firstDepositOverAccountCap
                                - accountCapExceeded
                                - null
                              description: "`accountUnregistered`：`accountOpeningUnavailable`（无法开户）或 `explicitAccountUnsupported`（账户编号非零）；此处无法区分时为 `null`（按交易查询可区分）。`tellerRejected`：单账户上限"
                            reasonMessage:
                              type: string
                              description: "退款原因的可读说明（依据 `reason` 和 `reasonDetail`）"
                          required:
                            - custodyKeyHash
                            - assetId
                            - assetVersion
                            - depositId
                            - status
                            - chain
                required:
                  - transactionHash
                  - success
                  - deposits
        "400":
          description: "路径参数格式错误（`invalid_transaction_hash`）"
        "404":
          description: "未知托管组或交易（`transaction_not_found`）"
        "502":
          description: "托管链 RPC 返回错误（`chain_rpc_failed`）"
        "503":
          description: "托管链未配置 RPC 端点（`chain_rpc_unavailable`），或账本读视图尚未就绪"
  "/v1/accounts/{id}/tickets":
    get:
      tags:
        - Account
      summary: "账户提款票据"
      description: "该账户的全部提款票据（金额、资产、托管组、取消计划）；`groups` 给出每个组的根接受进度。链上状态和预留时间需在托管链上从 `CustodyVault.ticketTerminal` 和 `TicketReserved` 读取（见每张票据的 `chain`）；最早在预留时间 + `ordinaryPaymentWaitMs` 之后付款。"
      operationId: v1_account_tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户 ID（十进制 `u32`）"
      responses:
        "200":
          description: "票据列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        ticketId:
                          type: string
                        custodyKeyHash:
                          type: string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: "十进制字符串"
                        debitRaw:
                          type: string
                        payloadHash:
                          type: string
                        cancelPlanned:
                          type: boolean
                        cancelId:
                          type:
                            - string
                            - "null"
                        ledgerStatus:
                          type: string
                        chain:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - tickets
                  - groups
        "400":
          description: "路径参数格式错误（`invalid_account_id`）"
        "404":
          description: "未找到（`unknown_account`）"
        "503":
          description: "账本读视图尚未就绪；请稍后重试"
  "/v1/accounts/{id}/funds-history":
    get:
      tags:
        - Account
      summary: "账户资金历史"
      description: |-
        账户的入金、退款和提款事件；分页同 `/v1/events`。

        - 类型：`CashDepositCredited`、`DepositRefundPlanned`、`DepositRefundAccounted`、`CashWithdrawalReserved`、`CashWithdrawalCancelPlanned`、`CashWithdrawalAccounted`、`CashWithdrawalCancelled`、`EscapeClaimAccounted`。
        - 退款计划带 `refund{status, reason}`；已预留的提款带 `ticket` 检查点进度，其中 `estimatedPayableAtMs` 为估计值（准确值为 `TicketReserved` 的区块时间）。
      operationId: v1_account_funds_history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户 ID（十进制）"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "事件 ID `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 相同"
          description: "游标：上一页的 `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "第一页返回的账本纪元；给出 `after` 时须与 `upper` 一同提供（账本已重置时返回 409 `history_epoch_mismatch`）"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "第一页返回的固定上界；给出 `after` 时须与 `epoch` 一同提供，否则返回 400。超出本副本的完整历史：400 `GatewayHistoryIncomplete`，稍后重试"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: "每页条数"
      responses:
        "200":
          description: "一页资金历史"
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        data:
                          type: object
                        ts: {}
                        refund:
                          type: object
                        ticket:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - items
        "400":
          description: "路径或查询参数格式错误"
        "404":
          description: "找不到账户（`unknown_account`）"
        "503":
          description: "本节点账本状态尚不可用；请稍后重试"
  "/v1/custody/{key}/deposit-precheck":
    get:
      tags:
        - Funds
      summary: "入金预检"
      description: |-
        在发送前预检一笔入金（资产、金额、受益人）。每个问题都有一个 `effect`：

        - `revert`：合约会拦截；直接入金交易失败，资金留在钱包中。
        - `late`（CCTP）：资金已在源链销毁；作为迟到入金接收并退还给受益人。
        - `refund`：账本拒绝并退款（见 `reason`）；`defer`：被推迟。

        `ok` = 没有 `revert`、`late` 或 `refund` 问题。仅供参考：以合约和账本判定为准，状态可能变化。
      operationId: v1_custody_deposit_precheck
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "托管组的 `custodyKeyHash`（带 0x 前缀的 32 字节十六进制）"
        - name: assetId
          in: query
          required: true
          schema:
            type: string
          description: "资产 ID（十进制 `u32`）"
        - name: assetVersion
          in: query
          required: true
          schema:
            type: string
          description: "资产版本（十进制 `u64`）"
        - name: amountRaw
          in: query
          required: true
          schema:
            type: string
          description: "入金金额，以原始单位计（十进制 `uint256`）"
        - name: beneficiary
          in: query
          required: true
          schema:
            type: string
          description: "受益人地址；使用默认入金入口时即发送交易的钱包"
        - name: route
          in: query
          required: false
          schema:
            type: string
            enum:
              - direct
              - native
              - cctp
          description: "默认 `direct`；为 `cctp` 时，合约侧拦截变为迟到退款（`effect` = `late`）"
      responses:
        "200":
          description: "预检结果"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: "问题码。链上：金库未开启入金，受益人被禁止或无法签名，未配置最低入金额或未达到。账本：金额无法用账本单位表示，超过入账 / 负债 / 账户上限，无法开户，将被延后。"
                          enum:
                            - chainDepositDisabled
                            - beneficiaryForbidden
                            - beneficiaryNotSignable
                            - minDepositNotConfigured
                            - belowMinDeposit
                            - amountUnrepresentable
                            - creditCapExceeded
                            - liabilityCapExceeded
                            - accountOpeningUnavailable
                            - firstDepositOverAccountCap
                            - accountCapExceeded
                            - wouldDefer
                        effect:
                          type: string
                          enum:
                            - revert
                            - late
                            - refund
                            - defer
                        reason:
                          type: string
                          description: "账本退款原因（`effect` = `refund` 时）"
                        message:
                          type: string
                  chain:
                    type: object
                    properties:
                      checked:
                        type: boolean
                      depositEnabled:
                        type:
                          - boolean
                          - "null"
                        description: "金库侧入金是否已开启（同 `/v1/custody` 的 `chainDepositEnabled`）；读取失败时为 `null`"
                      minDepositRaw:
                        type:
                          - string
                          - "null"
                      beneficiarySignable:
                        type:
                          - boolean
                          - "null"
                  ledger:
                    type: object
                    properties:
                      beneficiaryAccountId:
                        type:
                          - integer
                          - "null"
                        description: "受益人的单签主账户；没有则为 `null`（入账时自动开设）"
                      willOpenAccount:
                        type: boolean
                      registrationEnabled:
                        type: boolean
                      maxAccountRaw:
                        type: string
                      maxUnconfirmedCreditRaw:
                        type: string
                      rawQuantum:
                        type: string
                      deferral:
                        type: object
                  route:
                    type: string
                  beneficiary:
                    type: string
                  amountRaw:
                    type: string
        "400":
          description: "`invalid_custody_key_hash`，或 `invalid_query`（参数缺失或格式错误，或无法识别 `route`）"
        "404":
          description: "`unknown_custody_asset`：账本中没有该托管组或资产"
        "503":
          description: "`ledger_state_unavailable`（账本状态暂不可用）"
  /v1/exchange/cctp/routes:
    get:
      tags:
        - Funds
      summary: "CCTP 入金来源与提款路由"
      description: "按托管组给出 CCTP 路由：中枢链（托管链 ID、CCTP 域、`DepositInbox`）、入金来源和提款路由。来源给出其域、链 ID、`burnToken`、中枢链资产、`minDepositRaw` 和要调用的 `tokenMessenger`；读取 `Inbox` 失败时 `registered` 为 `null` 并设置 `registrationError`。`available` = 托管组未冻结且无逃生、来源已注册、`depositEnabled` 与 `chainEnabled` 均为真。提款路由只含地址路由，字段同 `/v1/custody`。仅供参考。"
