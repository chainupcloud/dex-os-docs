                    kind:
                      type: string
                      enum:
                        - tx
                    txId:
                      type: string
                      description: "来源交易 ID，带 0x 前缀的十六进制（EVM 链上为交易哈希）"
                    indexInTx:
                      type: integer
                      description: "在交易回执 `logs` 数组中的下标（不是区块范围的日志下标）"
                - type: object
                  required:
                    - kind
                    - sourceDomain
                    - nonce
                  properties:
                    kind:
                      type: string
                      enum:
                        - cctp
                    sourceDomain:
                      type: integer
                      description: "CCTP 源域"
                    nonce:
                      type: string
                      description: "CCTP nonce，带 0x 前缀的 32 字节十六进制"
        vault:
          type:
            - integer
            - "null"
          description: "仅 `vault_*` 分录：资金往来的金库（用 `vault=` 读取时为所查金库，否则为对手方的金库）；对手方不是金库时为 `null`（创建者的 `vault_fee`）。其他类型不含此字段"
    LedgerPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址，小写"
        subaccount:
          type: integer
        vault:
