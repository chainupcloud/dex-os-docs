              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串"
            notional:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串"
        dex:
          type: integer
          description: "市场所属的交易所（每个交易所都经过注册；不存在 0 号交易所）"
        dexCode:
          type: string
          description: "该市场所属交易所的账本短名（即 `/v1/dexes` 中的 `code`）：有短名的交易所，其每个市场符号均为 `<dexCode>:BASE-QUOTE`。平台市场与其他市场一样带有平台交易所的短名。"
        fees:
          type: object
          description: "适用于无 builder 归属的订单。`rateSource`：`market` = 遗留费率，`default` = 平台默认，`tier` = 创世基础费率。账户费率见 `GET /v1/account`。部署者 / builder 费率：对其归属订单加收的附加费"
          properties:
            rateSource:
              type: string
              enum:
                - market
                - default
                - tier
            takerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串；平台默认（`rateSource=default`）或创世基础费率（`tier`）"
            makerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "负数 = 返佣；平台默认（`rateSource=default`）或创世基础费率（`tier`）"
            deployerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串"
            deployerMakerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "向挂单方收取的部署者费率，十进制字符串"
            builderRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串。builder 模型开启后：各 builder 自身费率（`/v1/builder.fees`；未设置 = 0）的**上限**；开启前：对有归属的吃单成交收取的固定费率"
            pendingDeployerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串。待生效的吃单部署者费率，在 `pendingEffectiveAtMs`（上调后 7 天）生效。下调、以及市场在任何交易之前第一次设的费率立即生效；两项都不上调的变更会撤销它。`null` = 无"
            pendingDeployerMakerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串；`pendingDeployerRate` 的挂单部分；`null` = 无待生效变更"
            pendingEffectiveAtMs:
              type:
                - integer
                - "null"
              format: int64
              description: "`pendingDeployerRate` 生效的认证 Unix 毫秒时间；`null` = 无待生效变更"
        platformLocked:
          type: boolean
          description: "理事会锁定该商户市场期间为 `true`：交易所所有者及其 API 钱包无法修改市场状态。归理事会所有的交易所恒为 `false`"
        tags:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9-]{1,24}$"
          maxItems: 8
          description: "市场所属交易所的分类代码，按设置顺序排列；显示名称见 `GET /v1/dexes/{id}`（在 builder 入口背后用 `GET /v1/builder`）。仅用于展示"
        priceSource:
          type:
            - array
            - "null"
          items:
            type: object
            required:
              - source
              - symbol
            properties:
              source:
                type: string
                description: "价格来源名称（`coinbase`、`binance`、`kraken`、`okx`、`hyperliquid`、`hyperliquid-testnet`）"
              symbol:
                type: string
                description: "该来源自己的代码，原样使用"
          maxItems: 8
          description: "绑定到该永续市场的价格来源；预言机价格取其中位数。`null` = 未绑定（由市场代码推导）；现货恒为 `null`"
        aggTicks:
          type:
            - array
            - "null"
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 6
          description: "订单簿聚合档位，以每档 tick 数表示（1 tick = 10^-`priceDecimals`），递增；`GET /v1/markets/{symbol}/book` 和 WebSocket `book` 的 `aggTicks` 只接受这些值。`null` = 仅原始订单簿"
          examples:
            -
              - 10
              - 100
              - 1000
              - 10000
              - 100000
        subticksPerTick:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: "以基础价格单位计的价格增量；`tickSize` = 本值 × 10^-`priceDecimals`"
        tradingRulesVersion:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: "单调递增的交易规则版本号：变更进入待处理时 +1，结果确认时（含失败）再 +1。十进制字符串"
        tickChangePending:
          type: boolean
          description: "为 `true` 时禁止新下单；撤单仍可用"
    MyVaultPosition:
      type: object
      properties:
        vault:
          type: integer
        dex:
          type:
            - integer
            - "null"
          description: "金库所属的交易所：`null` = 协议金库，交易所 ID = 该交易所的商户金库。两种情况下份额都记在该地址自己的账户上"
        name:
          type: string
        class:
          type: string
          enum:
            - lp
            - manager
        shares:
          type: string
          pattern: "^[0-9]+$"
          description: "份额单位（整数，不是代币数量）"
        balanceShare:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "份额的当前价值，USDC"
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "同 `balanceShare`，USDC"
        initialEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "向存入者展示的本金，USDC"
        allTimePnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "累计盈亏（USDC）：`equity − initialEquity`"
        lockUntilMs:
          type: integer
        locked:
          type: boolean
        lockedShares:
          type: string
          pattern: "^[0-9]+$"
        withdrawable:
          type: object
          properties:
            ok:
              type: boolean
            reason:
              type:
                - string
                - "null"
        nextWithdrawWindow:
          type:
            - object
            - "null"
    Nonce:
      type: object
      required:
        - scope
        - nonce
      properties:
        scope:
          type: string
          enum:
            - account
            - agent
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址（响应中为小写，请求中不区分大小写）"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "请求指定金库（`vault=<id>`）时出现，代替 `address` / `subaccount`"
        signer:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM 地址（响应中为小写，请求中不区分大小写）"
        nonce:
          type:
            - integer
            - "null"
          description: "下一个期望的 nonce；该 nonce 序列已用尽（`exhausted: true`）或 API 钱包读取匹配到零个或多个授权时为 `null`"
        signingAccountId:
          type: integer
          description: "**仅用于签名。** 填入 EIP-712 结构体的 `accountId`（API 钱包路径下也填入内层命令的 `account`）。切勿用它寻址端点；v1 按钱包地址寻址账户"
        exhausted:
          type:
            - boolean
            - "null"
          description: "`true` = 下一个值将是 2^64 - 1，会被拒绝（`CounterExhausted`）：该 nonce 序列不再接受写入。API 钱包读取时，除非恰好匹配一个授权，否则为 `null`；见 `grants[]`"
    Order:
      type: object
      required:
        - orderId
        - symbol
        - side
        - price
        - size
        - status
      properties:
        orderId:
          type: string
          description: "订单序号，十进制字符串"
        clientOrderId:
          type:
            - string
            - "null"
          description: "可选、经签名的客户端订单 ID，1–36 个 `[A-Za-z0-9._:/-]` 字符。同一账户重用已被接纳的 `cid` 返回 409 `GatewayDuplicateClientOrderId`（并发竞争可能漏过）。不支持按 `cid` 撤单或改单"
        symbol:
          type: string
          description: "市场代码，如 `BTC-USD`（永续）、`BTC-USDC`（现货），商户交易所为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；永续与现货市场可能同名，`symbol` + `kind` 唯一确定市场"
        side:
          type: string
          enum:
            - buy
            - sell
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        tif:
          type:
            - string
            - "null"
          enum:
            - gtc
            - ioc
            - alo
            - fok
            - null
          description: "有效期类型。待触发的条件单：取其子订单的值。挂上订单簿后为 `null`（挂单中的 `alo` 与 `gtc` 行为相同）"
        reduceOnly:
          type:
            - boolean
            - "null"
          description: "只减仓；仅当未成交订单账本中没有该订单时为 `null`"
        trigger:
          type:
            - object
            - "null"
          description: "待触发的条件单（止损 / 止盈，含仓位 TP/SL）：预言机价格穿越 `price` 时以限价单（`price`、`size`、`side`、`tif`）进入订单簿。订单簿上的订单为 `null`"
          required:
            - price
            - above
            - positionTpsl
          properties:
            price:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "十进制字符串"
            above:
              type: boolean
              description: "`true` = 预言机价格 >= `price` 时触发；`false` = <= 时触发"
            positionTpsl:
              type: boolean
              description: "仓位级 TP/SL；仓位归零时自动撤销"
        status:
          type: string
          enum:
            - open
            - partiallyFilled
            - filled
            - canceled
            - expired
    OrderEvent:
      type: object
      description: "每行一个订单事件；按 `orderId` 归并即得每个订单一行"
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "事件标识 `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 完全相同"
        seq:
          type: integer
          format: uint64
          description: "日志序号，与回执的 `seq` 及 `x-dexos-seq` 响应头同轴"
        orderId:
          type: string
        symbol:
          type: string
          description: "市场代码，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "市场类型；永续和现货市场可能同名，`symbol` + `kind` 唯一确定一个市场"
        event:
          type: string
          enum:
            - accepted
            - fill
            - canceled
            - expired
            - placed
            - triggered
            - rejected
            - autocanceled
            - twapPlaced
          description: "`twapPlaced` = 下了 TWAP 母单（`size` = 总量，`slices` = 切片数）；切片是复用母单 `orderId` 的子订单，其 `accepted` / `fill` 行归并到该订单"
        side:
          type:
            - string
            - "null"
          enum:
            - buy
            - sell
            - null
          description: "订单方向，见于 `accepted`、`fill`（本账户一方）、`placed`（子订单方向）和 `twapPlaced` 行；其他行为 `null`（取该订单更早的行）；读不出下单命令时也为 `null`"
        source:
          type: string
          enum:
            - twap
          description: "仅出现在 TWAP 切片（`twap`）的 `accepted` / `fill` 行上"
        slices:
          type: integer
          format: uint32
          description: "切片数；仅 `twapPlaced` 行"
        startMs:
          type:
            - integer
            - "null"
          format: uint64
          description: "TWAP 开始时间，Unix 毫秒（下单命令的 `nowMs`；第一个切片此时执行）；仅 `twapPlaced` 行；读不出下单命令时为 `null`"
        durationMs:
          type:
            - integer
            - "null"
          format: uint64
          description: "计划运行时长 = `slices` × 切片间隔（毫秒）；仅 `twapPlaced` 行，读不出下单命令时为 `null`。没有结束事件：无 `canceled` 行的 TWAP 在 `startMs + durationMs` 之后结束"
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: "事件所在区块的账本时间，Unix 毫秒（与成交的 `ts` 同一时钟）；未知时为 `null`（之前无区块或存在历史缺口）"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        resting:
          type: boolean
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        role:
          type: string
          enum:
            - taker
            - maker
        fillId:
          type: string
    PendingWithdrawalV2:
      type: object
      additionalProperties: false
      properties:
        outboxId:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
        token:
