    GatewayBadSignature: 10401
    GatewayBuilderDisabled: 10403
    GatewayBuilderMarketCloseOnly: 10403
    GatewayBuilderMarketNotListed: 10403
    GatewayForbidden: 10403
    GatewayBuilderNotFound: 10404
    GatewayNotFound: 10404
    GatewayConflict: 10409
    GatewayDuplicateClientOrderId: 10409
    GatewayReplicaBehind: 10412
    GatewayNotLeader: 10421
    GatewayCollateralTokenMismatch: 10422
    GatewayRateLimited: 10429
    GatewayError: 10500
    GatewayUnavailable: 10503
  execution: "`20000 + execution error code`（只追加）；字符串代码即执行层错误名，例如 `InsufficientMargin`、`SignatureExpired`、`NonceBelowFloor`、`NonceAlreadyConsumed`、`PostOnlyWouldCross`"
x-websocket:
  url: /v1/ws
  protocol:
    subscribe:
      method: subscribe
      params:
        channel: book
        symbol: BTC-USD
        depth: 50
      id: 1
    ack:
      channel: subscribed
      data:
        channel: book
        symbol: BTC-USD
        depth: 50
      epoch: "<ledger epoch>"
      seq: 593504256
      id: 1
    unsubscribe:
      method: unsubscribe
      params:
        channel: book
        symbol: BTC-USD
        depth: 50
      id: 2
    ping:
      method: ping
    pong:
      channel: pong
      data:
        ts: 0
    error:
      channel: error
      data:
        code: GatewayNotFound
        message: no such subscription on this connection
        method: unsubscribe
        subscription:
          channel: book
          symbol: BTC-USD
          depth: 50
      id: 2
    lagged:
      channel: lagged
      data:
        dropped: 128
        epoch: "<ledger epoch>"
        upper: "<seq>-<sub>-4294967295"
        reason: buffer
    frame:
      channel: "<channel>"
      data: {}
      seq: 0
      isSnapshot: false
      epoch: "<private channels only>"
  rules:
    - "快照频道（`book` / `bbo` / `prices` / `account` / `positions` / `orders`）订阅时发送 `isSnapshot:true`；此后除 `orders` 外仅在有变化时推送，`book` / `bbo` 每 250 毫秒至多一次，其余每个区块（约 1 秒）至多一次"
    - "回应 `subscribe` / `unsubscribe` 的错误帧回显请求的 `id`、`data.method` 和 `data.subscription`。取消不存在的订阅会返回错误（`GatewayNotFound`）"
    - "`orders`：所有未成交订单的快照（条件单带 `trigger`），此后每次接受 / 成交 / 撤单 / 过期各一帧。按 `orderId` 应用：`status` 为 `open` 则保留，否则移除；快照替换整个集合"
    - "`candles`：每次成交一帧，内容为当前 K 线的最新状态（保留最后一帧即可）；周期滚动时开始新的 K 线"
    - "时间序列频道（`trades` / `fills` / `ledger` / `events`）带 `seq`；每个事件一帧，带 `data.id`（`ledger`：每条命令一帧，带 `data.entries[]`）。这些 ID 即 REST 历史的 `after` 游标"
    - "订阅确认带 `epoch`、`seq`：通过 REST 回补到 `upper=<seq>-65535-4294967295`，按 `id` 去重。`lagged` 表示帧已永久丢失：用其 `upper` 回补（400 `GatewayHistoryIncomplete`：重试）。`epoch` 变化：重建状态"
    - "每个连接最多 200 个订阅；60 秒内未发送任何帧（`ping` 也算）的连接会被关闭"
    - "WebSocket 连接本身不计限流权重；REST 限流（429，带 `retry-after`）见总览"
    - "私有频道接受用 `vault` 代替 `address` / `subaccount`（不可同时给出）；此时帧中带 `vault`"
    - "带 `symbol` 的频道也接受 `kind`（`perp` | `spot`），永续和现货市场同名时必填；帧中带 `kind`"
    - "`orders` / `fills` 带 `stage:\"matched\"`：下单类命令的帧在撮合完成时推送，带 `stage`，`id` 不变，之后不再重推；其余帧在结果落定后推送。同一频道和账户只能选一种"
  channels:
    prices:
      params:
        - "delta?"
      data: "与 `GET /v1/prices` 的响应体相同：`{prices:[Price], ts, window24h}`。`delta:true`：快照之后只推有变化的行（按 `kind` + `symbol` 替换）；市场集合变化时重发快照。每个连接只能订一种模式"
    book:
      params:
        - symbol
        - "kind?"
        - "depth?"
        - "aggTicks?"
      data: "订单簿，每侧 `depth` 档（1-100，默认 20），`aggTicks` 同 `GET /v1/markets/{symbol}/book`；两者均回显，无效值返回错误帧。同一连接可订阅多个 `aggTicks`"
    bbo:
      params:
        - symbol
        - "kind?"
      data: "最优买卖价：`{symbol, kind, bid:[price,size]|null, ask, ts}`"
    trades:
      params:
        - symbol
        - "kind?"
      data: "每笔成交一帧：`{symbol, kind, id, price, size, side, ts}`"
    orders:
      params:
        - address
        - "subaccount?"
        - "vault?"
        - "stage?"
      data: "快照：`{address, subaccount, orders:[OpenOrder]}`。更新：`{orderId, clientOrderId, symbol, kind, event, status, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}`"
    fills:
      params:
        - address
        - "subaccount?"
        - "vault?"
