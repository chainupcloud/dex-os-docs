      required:
        - outboxId
        - token
        - amount
        - amountWei
        - recipient
        - homeChain
        - tokenContract
        - destChain
        - recipientBytes32
        - maxBridgeFee
        - maxBridgeFeeWei
        - fallbackToHub
        - routed
        - status
    Portfolio:
