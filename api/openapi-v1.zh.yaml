  /v1/account/nonce:
    get:
      tags:
        - Account
      summary: "下一个 nonce 与签名账户 ID"
      description: |-
        下一个 nonce 及 `signingAccountId`（签名时填入 `accountId` 的值）。

        - 只带 `?address=`：账户 nonce（自签名）；加 `&signer=<agent>`：该 API 钱包的 nonce（委托）。两者搞混会得到 `NonceMismatch`。
        - 按签名主体和 `lane` 计，`nonce` = `high + 1`（未使用过时为 `floor`）；到达 2^64 - 1 时 `nonce` 为空、`exhausted` 为真（`CounterExhausted`）。
        - 带 `signer` 时，`grants[]` 列出该钱包的授权；仅当恰好匹配一条时才填写顶层 `grantId` / `grantEpoch` / `nonce`。
      operationId: v1_nonce
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址，不区分大小写"
          description: "主钱包地址（未给出 `vault` 时必填）"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户索引：0 = 主账户；N >= 1 = 第 N 号子账户"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "金库 ID：读取金库自己的账户。与 `address` / `subaccount` 互斥（400）；未知金库返回 404；此时响应显示 `vault`"
        - name: signer
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址，不区分大小写"
          description: "API 钱包地址"
        - name: lane
          in: query
          required: false
          schema:
            type: string
            enum:
              - trade
              - funds
              - management
            default: trade
          description: "nonce 序列（`lane`）：`trade`（下单、撤单）、`funds`（提款、转账）、`management`（授权、子账户、治理）；未知的 `lane`返回 400"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Nonce"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
