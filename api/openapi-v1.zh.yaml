        - maxLeverage
        - initialMarginFraction
        - maintenanceMarginFraction
        - marginMode
        - strictIsolated
        - quotePerTickLot
        - baseToken
        - quoteToken
        - basePerLot
        - settleToken
        - lastPrice
        - oraclePrice
        - markPrice
        - bestBid
        - bestAsk
        - fundingRate
        - fundingIndex
        - lastFundingMs
        - openInterest
        - openInterestCap
        - dex
        - dexCode
        - fees
        - tags
        - priceSource
        - aggTicks
        - subticksPerTick
        - tradingRulesVersion
        - tickChangePending
      properties:
        symbol:
          type:
            - string
            - "null"
          description: "市场代码，如 `BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写；市场还没有目录名称时为 `null`（用 `signingMarketId` 指代）"
          examples:
            - BTC-USD
        signingMarketId:
          type: integer
          description: "**仅用于签名。** EIP-712 结构体中的 `market` 字段；接口一律用 `symbol` 寻址"
        kind:
          type: string
          enum:
            - perp
            - spot
        status:
          type: string
          description: "`Active` / `Paused` / `CancelOnly` / `PostOnly` / `FinalSettlement` / `Halted` / `Delisted` / `ReduceOnly` / `OracleStale`。`ReduceOnly` 和 `OracleStale`（无有效预言机价格）只接受只减仓订单"
        priceDecimals:
          type: integer
        sizeDecimals:
          type: integer
        tickSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "价格增量 = `subticksPerTick` × 10^-`priceDecimals`；签名价格和 `aggTicks` 仍以 10^-`priceDecimals` 为单位"
        lotSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "数量增量 = 10^-`sizeDecimals`"
        minNotional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "最小名义价值（USDC）；`0` = 无下限"
        maxLeverage:
          type:
            - integer
            - "null"
          description: "`1e6 / initialMarginPpm`；现货为 `null`"
        initialMarginFraction:
