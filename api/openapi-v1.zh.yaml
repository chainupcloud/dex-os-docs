      operationId: v1_subaccounts
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "主钱包地址"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址；响应中为小写，请求中不区分大小写"
                  subaccounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Subaccount"
        "400":
          "$ref": "#/components/responses/BadRequest"
  "/v1/account/by-address/{address}":
    get:
      tags:
        - Account
      summary: "地址下的账户"
      description: |-
        与该地址关联的账户：`main`（`?address=` 读取的账户，连同子账户）、`legacyExtra`（额外的单签账户，无法通过 `?address=` 访问）和 `multisig`（包含该地址的多成员策略账户；门限 k / 成员数 n）。
        - `legacyExtra` + `multisig` 按策略 ID 升序合并分页（`next` → `after`）；`main` 在每页重复出现。
        - 无账户：返回 200，`main: null`，列表为空。
        - 分页基于实时数据而非快照；账本变化时请从第一页重新开始。
      operationId: v1_account_by_address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "要查询的地址"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: "每页 `legacyExtra` + `multisig` 的行数"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "从该策略 ID 之后继续（上一页的 `next`）"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址（响应中为小写，请求中不区分大小写）"
                  main:
                    type:
                      - object
                      - "null"
                    properties:
                      signingAccountId:
                        type: integer
                        description: "**仅用于签名。** 签名命令中作为 `inner_account` 的账户编号（子账户由主策略签名）"
                      policyId:
                        type: string
                        description: "账户策略 ID，十进制字符串；供 `/v1/nonces?principal=account&policy=` 和 `/v1/grants?policy=` 使用"
                      policyEpoch:
                        type: string
                        description: "签名策略的当前纪元，十进制字符串；每次更换密钥时递增"
                      subaccounts:
                        type: array
                        items:
                          type: object
                          properties:
                            subaccount:
                              type: integer
                              minimum: 1
                              description: "子账户序号（`?address=&subaccount=N`）"
                            signingAccountId:
                              type: integer
                              description: "**仅用于签名。** 签名命令中作为 `inner_account` 的账户编号（子账户由主策略签名）"
                            policyEpoch:
                              type: string
                              description: "签名策略的当前纪元，十进制字符串；每次更换密钥时递增"
                  legacyExtra:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**仅用于签名。** 签名命令中作为 `inner_account` 的账户编号（子账户由主策略签名）"
                        policyId:
                          type: string
                          description: "账户策略 ID，十进制字符串；供 `/v1/nonces?principal=account&policy=` 和 `/v1/grants?policy=` 使用"
                        policyEpoch:
                          type: string
                          description: "签名策略的当前纪元，十进制字符串；每次更换密钥时递增"
                  multisig:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**仅用于签名。** 签名命令中作为 `inner_account` 的账户编号（子账户由主策略签名）"
                        policyId:
                          type: string
                          description: "账户策略 ID，十进制字符串；供 `/v1/nonces?principal=account&policy=` 和 `/v1/grants?policy=` 使用"
                        policyEpoch:
                          type: string
                          description: "签名策略的当前纪元，十进制字符串；每次更换密钥时递增"
                        threshold:
                          type: integer
                          description: "k：所需签名数"
                        memberCount:
                          type: integer
                          description: "n：策略成员数"
                  next:
                    type:
                      - string
                      - "null"
                    description: "作为 `after` 传入以获取下一页；最后一页为 `null`"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/account/vaults:
    get:
      tags:
        - Vaults
      summary: "我的金库持仓"
      description: "该地址主账户及其各商户余额的金库持仓；`dex` 表示份额由哪份余额持有（商户金库总在其所属交易所下）。金额为 USDC 十进制字符串；份额数为整数。"
      operationId: v1_my_vaults
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "主钱包地址"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址；响应中为小写，请求中不区分大小写"
                  positions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MyVaultPosition"
        "400":
          "$ref": "#/components/responses/BadRequest"
  /v1/account/withdrawals:
    get:
      tags:
        - Account
      summary: "待处理提款"
      description: "该地址 / 子账户在所有链上的待处理提款，封装为 `{address, subaccount, withdrawals}`：已被账本扣款、尚未确认，含路由和金额。CCTP 条目消失并不代表资金已到达目标链。"
      operationId: v1_withdrawals
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；响应中为小写，请求中不区分大小写"
          description: "主钱包地址"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "子账户序号：0 = 该地址的主账户（编号最小的单签账户）；N >= 1 = 其序号为 N 的子账户"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址；响应中为小写，请求中不区分大小写"
                  subaccount:
                    type: integer
                  withdrawals:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PendingWithdrawalV2"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/v1/agents/{address}":
    get:
      tags:
        - Account
      summary: "API 钱包代为操作的账户"
      description: |-
        授权了该 API 钱包的账户，以主钱包 + 子账户索引表示（或金库经理 + `vault`）；没有授权时为空列表（不是 404）。

        - 每个（可用授权，所覆盖账户）一行，每个可用的交易所范围授权也各一行，并附授权字段；签名策略不是单一地址的账户不列出。
        - 已暂停、已过期和尚未生效的授权也会列出；`executable` = 账本此刻会接受该授权（命令仍可能因范围或额度被拒绝）。
      operationId: v1_agent_grants
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；请求不区分大小写，响应中为小写"
          description: "API 钱包地址"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                required:
                  - agent
                  - grants
                properties:
                  agent:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM 地址；请求不区分大小写，响应中为小写"
                  grants:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AgentGrant"
        "400":
          "$ref": "#/components/responses/BadRequest"
  /v1/builder:
    get:
      tags:
        - Market data
      summary: "该入口背后的 builder"
      description: |-
        返回本请求解析到的 builder（白标前端）及其市场。`?builder=` 可显式指定；否则由入口域名决定（`Host`，或受信任代理之后的 `X-Forwarded-Host`）。
        - 未绑定 builder 的域名返回 200 `PlatformEntry`（`builderId: null`），不是错误。
        - 只出现 `listed` / `closeOnly` 市场（`closeOnly` = 只减仓）。交易用 `symbol`，展示用 `display`；`fees` = 前端费率。
        - 无法解析 → 404 `GatewayBuilderNotFound`。
      operationId: v1_builder
      parameters:
        - name: builder
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "`builderId`（十进制）；默认按入口域名"
        - name: market
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "`signingMarketId`（0–65535）：多返回 `market` = 该市场在本目录中的那一行（含 `hidden`）；不在目录中则为 `null`（经本 builder 路由的订单会被 403 `GatewayBuilderMarketNotListed` 拒绝）。对 `PlatformEntry` 不生效"
      responses:
        "200":
          description: "builder 视图；入口域名未绑定 builder 且未给出 `?builder=` 时为 `PlatformEntry`"
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/BuilderView"
                  - "$ref": "#/components/schemas/PlatformEntry"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "`GatewayBuilderNotFound`（`num` 10404）：`?builder=` 指定的 builder 不存在（`details.builder`），或入口域名绑定的 builder 不存在（`details.domain`）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/builders/{address}/summary":
    get:
      tags:
        - Market data
      summary: "builder 费用汇总"
      description: "该 builder 主账户收到的 `builder_fee` 账本分录，按代币汇总，按 `startTime` / `endTime` 过滤。归属于该 builder 的成交量尚未提供（计划于 v1.1）。"
      operationId: v1_builder_summary
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；请求不区分大小写，响应中为小写"
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: "Unix 毫秒"
          description: "起始（含）"
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: "Unix 毫秒"
          description: "结束（不含）"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
          description: "每页条数"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BuilderSummary"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/dexes:
    get:
      tags:
        - Market data
      summary: "builder 交易所列表"
      description: "按 ID 列出每个交易所，用 `after` / `limit` → `next` 分页：所有者、保证金代币、保险账户、附加费、保证金表、市场和短代码 `code`（其市场代码前缀）。`markets` 仅含永续；`spotMarkets` 为现货交易对。每行另带账本登记（`DexLedgerRow`：所有者、配置、私有喂价配额、`marketCount`、`authority`）；账本快照在顶层。"
      operationId: v1_dexes
      parameters:
        - name: ownerAccount
          in: query
          required: false
          schema:
            type: string
          description: "当前所有者账户 ID（十进制）；省略则列出全部"
        - name: shortName
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,7}$"
          description: "精确短名；此时列表有 0 或 1 条。账本会拒绝的短名（小写、长度不符、保留名 `MAIN`）返回 400 `invalid_short_name`"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000，默认 100"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "从该交易所 ID（十进制）之后开始；省略则从头开始。下一页：传入响应中的 `next`"
      responses:
        "200":
          description: "某个已发布的账本快照；`u64` 值为十进制字符串"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - ownerAccount
                      - dexes
                      - next
                    properties:
                      ownerAccount:
                        type:
                          - integer
                          - "null"
                        description: "`ownerAccount` 筛选条件，未提供时为 `null`"
                      dexes:
                        type: array
                        items:
                          allOf:
                            - "$ref": "#/components/schemas/Dex"
                            - "$ref": "#/components/schemas/DexLedgerRow"
                      next:
                        type:
                          - integer
                          - "null"
                        description: "作为 `after` 传入以获取下一页；最后一页为 `null`"
        "400":
          description: "查询参数格式错误：`invalid_owner_account` / `invalid_short_name` / `invalid_limit` / `invalid_after` / `unsupported_parameter`"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/dexes/{id}":
    get:
      tags:
        - Market data
      summary: "单个交易所"
      description: "`/v1/dexes` 中的一行（`markets` = 永续，`spotMarkets` = 现货），外加 `categories`：该交易所自有分类及其市场 `tags` 用到的平台模板，按 `sort` 再按代码排序，即 `/v1/markets[].tags` 的显示名称。最多滞后 2 秒。"
      operationId: v1_dex
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Dex"
                  - type: object
                    required:
                      - dex
                      - categories
                    properties:
                      dex:
                        type: integer
                      categories:
                        type: array
                        items:
                          "$ref": "#/components/schemas/CategoryView"
                  - "$ref": "#/components/schemas/DexLedgerRow"
                  - "$ref": "#/components/schemas/LedgerCut"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/events:
    get:
      tags:
        - Account
      summary: "事件回补"
      description: |-
        执行层原始事件，结构与 WebSocket `events` 频道相同。仅升序（`order=desc` 返回 400）。

        - 带 `address`：该账户的事件，每页是满的；`symbol` 进一步限定到一个市场。
        - 不带 `address`：完整日志；`symbol` 在每页内过滤，页面可能稀疏或为空。沿 `next` 翻页直到 `hasMore=false`。
        - `OrderAttributed` / `FillAttributed` 不在此处或 WebSocket 上发布。
      operationId: v1_events
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "市场符号，如 `BTC-USD`（永续）或 `BTC-USDC`（现货）；商户交易所的市场为 `<code>:BTC-USD`（`:` 可编码为 `%3A`）；不区分大小写"
            examples:
              - BTC-USD
          description: ""
        - "$ref": "#/components/parameters/MarketKind"
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM 地址；不区分大小写，响应中为小写"
          description: ""
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "事件 ID `<seq>-<sub>-<idx>`；与回补游标及 WebSocket 帧中的 `id` 相同"
          description: "游标：上一页的 `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "第一页返回的账本纪元；给出 `after` 时须与 `upper` 一同提供（账本已重置时返回 409 `history_epoch_mismatch`）"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "第一页返回的固定上界；给出 `after` 时须与 `epoch` 一同提供，否则返回 400。超出本副本的完整历史：400 `GatewayHistoryIncomplete`，稍后重试"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: "每页条数"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventsPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/fees:
    get:
      tags:
        - Market data
      summary: "费率表"
      description: "标准流动性档位表；账户费率见 `GET /v1/account`，市场级覆盖见 `GET /v1/markets`。交易所部署者在 `RegisterDexAsset` 中只能用 `dexSelectableTiers`；其他档位以 `UnknownLiquidityTier` 失败。"
      operationId: v1_fees
      parameters: []
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  liquidityTiers:
                    type: object
                    properties:
                      tiers:
                        type: array
                        items:
                          type: object
                          properties:
                            tier:
                              type: integer
                            initialMarginPpm:
                              type: integer
                            maintenanceFractionPpm:
                              type: integer
                              description: "MMR = IMR × 本值 / `1e6`"
                            impactNotionalQuote:
                              type: string
                            oiLowerCapQuote:
                              type: string
                              description: "\"0\" = 关闭 OIMF"
                            oiUpperCapQuote:
                              type: string
                            maxLeverage:
                              type: integer
                              description: "`1e6 / initialMarginPpm`，仅供展示"
                            dexSelectable:
                              type: boolean
                              description: "部署者可在 `RegisterDexAsset` 中选用此档位"
                      defaultTier:
                        type: integer
                        description: "7 = `IML_5x`；`RegisterDexAsset` 未指定档位时也用它"
                      dexSelectableTiers:
                        type: array
                        items:
                          type: integer
                        description: "部署者可选的档位，升序"
                  note:
                    type: string
  /v1/markets:
    get:
      tags:
        - Market data
      summary: "市场列表"
      description: "账本上的每个市场，按 `signingMarketId` 排列；市场有目录名称之前 `symbol` 为 `null`。价格和数量是按 `priceDecimals` / `sizeDecimals` 精确换算的十进制字符串。每行另带账本规格（`MarketLedger`：规格与资产版本、准入、预言机状态与策略）；账本快照在顶层。每个交易所已用的市场数：`/v1/dexes` 的 `marketCount`。"
      operationId: v1_markets
      parameters:
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                allOf:
