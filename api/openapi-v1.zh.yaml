          description: "每页条数"
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = 最新在前（`next` 向更早的行翻页）；`epoch` / `upper` / `hasMore` 的用法与 `asc` 相同。一次遍历中保持同一个 `order`"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: "成功"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LedgerPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
