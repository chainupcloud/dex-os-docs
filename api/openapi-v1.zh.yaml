        name:
          type: string
          description: "在创建时或通过 `POST /v1/account/subaccounts/name` 设置的标签；从未命名时为空"
    Ticker:
      type: object
      properties:
        symbol:
          type: string
          description: "市场代码，如 `BTC-USD`（永续）、`BTC-USDC`（现货）、`<code>:BTC-USD`（商户交易所；`:` 可编码为 `%3A`）；不区分大小写"
          examples:
            - BTC-USD
        signingMarketId:
          type: integer
          description: "**仅用于签名。** 该市场的 `signingMarketId`，与 `/v1/markets` 中对应行的值相同（即 EIP-712 结构体中的 `market` 字段）"
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "`symbol` + `kind` 唯一确定一个市场（永续市场和现货市场可能共用同一代码）"
        open:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内第一笔成交价；无成交时为 `null`"
        high:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内最高成交价；无成交时为 `null`"
        low:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内最低成交价；无成交时为 `null`"
        last:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内最后一笔成交价；无成交时为 `null`"
        volume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内总成交数量（基础资产）"
        quoteVolume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "窗口内的 Σ 价格 × 数量（计价资产）"
        trades:
          type: integer
          description: "窗口内成交笔数"
    Trade:
      type: object
      properties:
        id:
          type: string
          description: "成交 ID `<seq>-<sub>-<idx>`，与 WebSocket `trades` 中相同"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "十进制字符串"
        side:
          type: string
          enum:
            - buy
            - sell
          description: "吃单方方向"
        ts:
          type: integer
          format: int64
          description: "Unix 毫秒"
    Vault:
      type: object
      description: "一个金库。USDC 金额为十进制字符串，每份额净值为比值，份额为整数字符串，比率为 ppm。金库签名所用的账户 ID 是 `GET /v1/account/nonce?vault=` 返回的 `signingAccountId`"
      required:
        - vault
        - address
        - dex
        - name
        - description
        - creator
        - creatorSubaccount
        - manager
        - managerSubaccount
        - hasManager
        - leader
        - tradingHalt
        - lpShares
        - managerShares
        - totalShares
        - lpBalance
        - managerBalance
        - lastCheckedEquity
        - hwm
        - equity
        - unattributed
        - totalDeposits
        - pnl
        - managerPortionPpm
        - navPerShare
        - navPerShareByClass
        - config
        - whitelist
        - blacklist
        - maxLeverages
        - depositorWhitelist
        - depositorCount
        - createdAtMs
        - aprPpm
        - maxDrawdownPpm
        - netReturnPpm
        - inceptionAprPpm
        - utilizationPpm
        - profitSharePpm
        - marketVaults
        - authorizedManager
        - confirmedTradingHalt
        - pendingClaim
      properties:
        vault:
          type: integer
          description: "金库 ID，即 `?vault=` 读取、写请求信封和 WebSocket 订阅中的金库编号"
        address:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "金库自身的地址（无私钥）：`?address=<this>&subaccount=0` 读取该金库，地址级手续费规则也适用。经理及其 API 钱包以该地址签名来交易它。请直接读取，不要自行推导"
        dex:
          type:
            - integer
            - "null"
          description: "创建时固定。`null` = 协议金库（由理事会创建）；交易所 ID = 商户金库，只交易该交易所的市场。所有人都使用各自账户的余额"
        name:
          type: string
        description:
          type: string
        creator:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "创建账户的主钱包；内部账户为 `null`"
        creatorSubaccount:
          type:
            - integer
            - "null"
          description: "创建账户在 `creator` 名下的子账户编号"
        manager:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "资金侧记录的经理主钱包；可能先于 `authorizedManager` 设置，切勿用它判断权限"
        managerSubaccount:
          type:
            - integer
            - "null"
          description: "认领账户在 `manager` 名下的子账户编号；未认领时为 `null`"
        hasManager:
          type: boolean
        leader:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "旧版别名：即 `manager`，未认领时为 `creator`"
        tradingHalt:
          type: boolean
          description: "低于暂停阈值而暂停：订单已撤销、仓位已平，只允许撤单"
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: "LP 份额单位（整数；不是代币数量）"
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: "经理份额单位（整数）"
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: "份额总数：`lpShares + managerShares`"
        lpBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "归属于 LP 类的余额，USDC"
        managerBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "归属于经理类的余额，USDC"
        lastCheckedEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "上次账本同步时的权益，USDC"
        hwm:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "业绩分成的高水位线，USDC"
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "金库权益（主账户净保证金），USDC"
        unattributed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − lpBalance − managerBalance`（尚未同步到各类别的盈亏），USDC"
        totalDeposits:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "向每位存入者展示的本金之和，USDC"
        pnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − totalDeposits`（带符号），USDC"
        managerPortionPpm:
          type:
            - integer
            - "null"
          description: "经理余额 / 已归属余额，ppm；无已归属余额时为 `null`"
        navPerShare:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "每份额权益，比值（1 = 首次存入时的面值）；没有份额时为 `null`"
