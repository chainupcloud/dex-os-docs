        seq:
          type: string
          pattern: "^[0-9]+$"
          description: "命令定序所在的日志位置（宿主日志下标）；十进制字符串"
        sub:
          type: integer
          minimum: 0
          maximum: 65535
        executionKnown:
          type: boolean
        nonceConsumed:
          type: boolean
          nullable: true
        outcome:
          type: string
          enum:
            - Succeeded
            - Failed
        stableError:
          type: string
        errorCode:
          type: integer
        businessRejected:
          type: string
          nullable: true
          description: "订单被拒的原因（例如 `InsufficientMargin`、`PostOnlyWouldCross`）；被接受时为 `null`"
        items:
          type: array
          items:
            type: object
          description: "批量命令的逐项结果"
        events:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              data:
                type: object
          description: "这条命令的成交、已接受和已撤销的订单；`matched` 时不含余额和仓位事件"
        source:
          type: string
          enum:
