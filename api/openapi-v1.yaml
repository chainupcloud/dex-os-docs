  "/v1/account/by-address/{address}":
    get:
      tags:
        - Account
      summary: Accounts of an address
      description: |-
        Accounts linked to this address: `main` (what `?address=` reads, with subaccounts), `legacyExtra` (extra single-signer accounts, not reachable via `?address=`) and `multisig` (multi-member policies including it; threshold k of n).
        - `legacyExtra` + `multisig` page together by ascending policy id (`next` → `after`); `main` repeats on every page.
        - No account: 200 with `main: null` and empty lists.
        - Live pages, not a snapshot; restart if the ledger changes.
      operationId: v1_account_by_address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: The address to look up
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: "Rows of `legacyExtra` + `multisig` per page"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "Policy id to continue after (the previous page's `next`)"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: EVM address (lower-case in responses, case-insensitive in requests)
                  main:
                    type:
                      - object
                      - "null"
                    properties:
                      signingAccountId:
                        type: integer
                        description: "**Signing only.** Account number a signed command uses as `inner_account` (subaccounts are signed by the main policy)"
                      policyId:
                        type: string
                        description: "Account policy id, decimal string; used by `/v1/nonces?principal=account&policy=` and `/v1/grants?policy=`"
                      policyEpoch:
                        type: string
                        description: "Current signing-policy epoch, decimal string; increments on every rekey"
                      subaccounts:
                        type: array
                        items:
                          type: object
                          properties:
                            subaccount:
                              type: integer
                              minimum: 1
                              description: "Subaccount index (`?address=&subaccount=N`)"
                            signingAccountId:
                              type: integer
                              description: "**Signing only.** Account number a signed command uses as `inner_account` (subaccounts are signed by the main policy)"
                            policyEpoch:
                              type: string
                              description: "Current signing-policy epoch, decimal string; increments on every rekey"
                  legacyExtra:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**Signing only.** Account number a signed command uses as `inner_account` (subaccounts are signed by the main policy)"
                        policyId:
                          type: string
                          description: "Account policy id, decimal string; used by `/v1/nonces?principal=account&policy=` and `/v1/grants?policy=`"
                        policyEpoch:
                          type: string
                          description: "Current signing-policy epoch, decimal string; increments on every rekey"
                  multisig:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**Signing only.** Account number a signed command uses as `inner_account` (subaccounts are signed by the main policy)"
                        policyId:
                          type: string
                          description: "Account policy id, decimal string; used by `/v1/nonces?principal=account&policy=` and `/v1/grants?policy=`"
                        policyEpoch:
                          type: string
                          description: "Current signing-policy epoch, decimal string; increments on every rekey"
                        threshold:
                          type: integer
                          description: "k: signatures needed"
                        memberCount:
                          type: integer
                          description: "n: policy members"
                  next:
                    type:
                      - string
                      - "null"
                    description: "Pass as `after` for the next page; null on the last page"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
