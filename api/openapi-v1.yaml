  /v1/account/nonce:
    get:
      tags:
        - Account
      summary: Next nonce and signing account id
      description: "Two scopes: `?address=` alone is the account nonce (self-signed requests); adding `&signer=<agent>` returns that API wallet's own nonce (delegated requests). Mixing them up yields `NonceMismatch`. Both scopes also return `signingAccountId`, the value the EIP-712 struct's `accountId` field (or the inner command's `account`) must carry; a pure v1 client needs nothing else to sign. **Secure ledger** (a node started on a security Manifest): the nonce is the next value of the `AuthenticatedCommand` nonce window of the signing principal on one lane (`lane`, default `trade`; `floor` / `high` are the window, `nonce` = `high + 1`, or `floor` before anything was accepted). `exhausted` is always present on the secure ledger: when `high + 1` would be 2^64 - 1, which the ledger always refuses (`CounterExhausted`), `nonce` is null and `exhausted` is true; otherwise `exhausted` is false. Unused values below `high` are not recommended. Without `signer` the principal is the account's root signing policy (a subaccount answers its main account's policy, `policyId`); with `signer` the principal is the API wallet's grant: `grants[]` lists every 141 grant to that wallet that is not revoked and was issued under the current policy epoch, paused, expired and not-yet-valid ones included (each row has `status`, `expired` and `executable`, the last true only when the ledger would accept the grant itself now) (on the account when `address` is given, on every account otherwise) with its own `grantId` / `grantEpoch` / `nonce` (and `dex` for a Dex-scope management grant, which signs on the `management` lane and is matched on the dex owner's account), and the top-level `grantId` / `grantEpoch` / `nonce` / `exhausted` are filled only when exactly one grant matches (null otherwise)."
      operationId: v1_nonce
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account instead of a wallet's. Mutually exclusive with `address` / `subaccount` (400); an unknown vault returns 404. The response then shows `vault` instead of `address` / `subaccount`."
        - name: signer
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: API wallet address
        - name: lane
          in: query
          required: false
          schema:
            type: string
            enum:
              - trade
              - funds
              - management
            default: trade
          description: "Nonce lane of the signed command (`trade` orders and cancels, `funds` withdrawals and transfers, `management` grants, subaccounts and governance). An unknown lane is 400."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Nonce"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
