      description: "The caller's per-dex balances (merchant fund isolation, #295; same model as Hyperliquid's per-perp-dex balances): one per (subaccount, merchant dex) that has been funded. After the exchange-wide switch `merchantIsolation` is on, orders on a merchant dex's markets are filled from the signing subaccount's balance under that dex. A balance is opened by the owner's first `POST /v1/account/dex-transfer` into it."
