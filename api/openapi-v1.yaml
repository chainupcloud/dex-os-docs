                  - "$ref": "#/components/schemas/LedgerSnapshot"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/markets/{symbol}/book":
    get:
      tags:
        - Market data
      summary: Order book snapshot
      description: "Order book at state point `seq`, `depth` levels per side (default 20, max 200). 503, not an empty book, when no complete snapshot is available. `aggTicks` merges the **whole** book into buckets of that many ticks (bids rounded down, asks up, sizes summed) before taking `depth` buckets per side; the response echoes it."
      operationId: v1_book
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` on a merchant dex (`:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Market symbol
        - "$ref": "#/components/parameters/MarketKind"
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          description: Number of levels
        - name: aggTicks
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Ticks per price bucket (1 tick = 10^-priceDecimals); must be one of the market's `aggTicks` (`GET /v1/markets/{symbol}`), else 400 `GatewayBadRequest` with `details.allowed`. Omit for raw levels"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Book"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/markets/{symbol}/candles":
    get:
      tags:
        - Market data
      summary: Candles
      description: |-
        OHLCV candles built from trades only (oracle updates are not samples), so a minute without trades has no bar.

        - `interval` ∈ 1m 5m 15m 30m 1h 2h 4h 8h 12h 1d 1w 1M 1Y; anything else is 400 (no fallback to 1m).
        - Bars align in UTC from midnight (4h starts 00/04/08/…); 1w starts Monday; 1M / 1Y are calendar months / years, so `T − t` varies.
      operationId: v1_candles
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); a merchant dex market is `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Market symbol
        - "$ref": "#/components/parameters/MarketKind"
        - name: interval
          in: query
          required: false
          schema:
            type: string
            enum:
              - "1m"
              - "5m"
              - "15m"
              - "30m"
              - "1h"
              - "2h"
              - "4h"
              - "8h"
              - "12h"
              - "1d"
              - "1w"
              - "1M"
              - "1Y"
            default: "1m"
          description: Interval
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix ms
          description: Start (inclusive)
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix ms
          description: End (exclusive)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 300
          description: Page size
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); a merchant dex market is `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
                    examples:
                      - BTC-USD
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "Market type; a perp and a spot market may share a symbol, `symbol` + `kind` is unique"
                  interval:
                    type: string
                  candles:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Candle"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
