  "/v1/security/custody/{key}":
    get:
      tags:
        - Security
      summary: Custody group
      description: "托管组的目录版本、组模式 mode(M8-4:normal / escapePending / frozen,与链上 CheckpointRegistry 的 Normal / Pending / Frozen 对应,账本侧视图)、全局下一根序号与上次切根时间、全局 cut 环里本组已切未被本链接受的根(每根带本组窗口行数 rows、切时链上观察与资金验证者集合代次)、最近被接受的根、逃生申请与冻结状态、链上观察,以及每资产入金 / 退款 / 付款的条数与累计哈希;ChainFact 见证者凭它确认事实已生效。 M8-8:另带 registration(组登记原件规范字节 hex)、registrationHash(= 147 kind 9 的 configHash)与 firstCheckpointSeq(组从这一根起进全局 cut;创世组 1),运行期登记的组同样可查。"
      operationId: v1_security_custody_group
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "custodyKeyHash(0x 开头的 32 字节十六进制)"
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/checkpoints/latest:
    get:
      tags:
        - Security
      summary: Global checkpoint progress
      description: "全局根进度(M8-4 T8.4.8):账本按全局根周期切一根覆盖全部未冻结托管组的全局 cut,各托管链独立接受(可跳过中间的根),所以各组被接受的序号可以不同。返回全局下一根序号 nextCheckpointSeq、上次切根时间、根周期、最新的全局 cut latestCut {seq, inputEnd, cutTimeMs, groups = 这一根覆盖的 custodyKeyHash}(还没切过根为 null),以及每个托管组的 acceptedSeq(没有被接受的根为 null)、acceptedCheckpointId 与组模式 mode(normal / escapePending / frozen)。同一已发布 CTX 的只读投影,不作信任来源。 M8-8:另带 groupCatalogVersion(组目录版本,链下轮询它发现 GovOp 24 新登记的组,原件到 /v1/security/custody/{key} 取),各组另带 registrationHash 与 firstCheckpointSeq。"
      operationId: v1_security_checkpoints_latest
      parameters: []
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  nextCheckpointSeq:
                    type: string
                  lastCutTimeMs:
                    type: string
                  checkpointPeriodMs:
                    type: string
                  latestCut:
                    type: object
                    nullable: true
                    properties:
                      seq:
                        type: string
                      inputEnd:
                        type: string
                      cutTimeMs:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        acceptedSeq:
                          type: string
                          nullable: true
                        acceptedCheckpointId:
                          type: string
                          nullable: true
                        mode:
                          type: string
                          enum:
                            - normal
                            - escapePending
                            - frozen
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - nextCheckpointSeq
                  - latestCut
                  - groups
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/network:
    get:
      tags:
        - Security
      summary: Network identity
      description: "本节点钉住的 Manifest 与网络身份。把 `canonicalManifest` 交给 sdk-wasm `network(manifestHex)` 得到各构造函数的 `network` 参数,不要硬编码。只在安全 profile 下挂载(公开、管理、内部三个端口都有)。"
      operationId: v1_security_network
      parameters:
        - name: x-dexos-expect-manifest
          in: header
          required: false
          description: "可选:调用方期望的 Manifest 哈希(0x + 64 位 hex)。给了且与本节点不同,或给了多个,回 503"
          schema:
            type: string
      responses:
        "200":
          description: "Manifest 与网络身份(bytes 为 0x hex,u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
                required:
                  - canonicalEncoding
                  - canonicalManifest
                  - manifestHash
                  - profile
                  - networkId
                  - genesisHash
                  - ledgerEpoch
                  - nodeChainId
                  - nodeVerifier
                  - localTrustValidated
                  - activationStatus
                  - businessReady
                properties:
                  canonicalEncoding:
                    type: string
                    enum:
                      - hex
                  canonicalManifest:
                    type: string
                    description: "Manifest 规范字节(0x hex)"
                  manifestHash:
                    type: string
                    description: "Manifest 哈希(bytes32)"
                  profile:
                    type: integer
                    description: "Manifest 的 profile 编号"
                  networkId:
                    type: string
                    description: bytes32
                  genesisHash:
                    type: string
                    description: bytes32
                  ledgerEpoch:
                    type: string
                    description: "u64 十进制"
                  nodeChainId:
                    type: string
                    description: "EIP-712 domain 的 chainId(uint256,0x hex)"
                  nodeVerifier:
                    type: string
                    description: "EIP-712 domain 的 verifyingContract(address)"
                  localTrustValidated:
                    type: boolean
                  activationStatus:
                    type: string
                  businessReady:
                    type: boolean
        "503":
          description: "`x-dexos-expect-manifest` 与本节点钉住的 Manifest 不符:`{error: \"upstream_manifest_mismatch\", manifestHash}`"
