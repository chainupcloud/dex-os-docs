openapi: "3.1.0"
info:
  title: DEXOS Open API v1
  version: "0.1.0"
  summary: "Public REST + WebSocket API for developers, builders and LPs"
  description: |-
    DEXOS public API. Reads: `GET` and WebSocket; **every ledger change is a signed command sent
    to `POST /v1/commands`**, confirmed via `GET /v1/requests/{requestId}`. Legacy writes answer
    `410 legacy_write_disabled`.

    ## Quick start

    1. `GET /v1/network` → `canonicalManifest` for the SDK.
    2. `GET /v1/markets` → `symbol`, decimals, `signingMarketId`; `GET /v1/exchange` → tokens.
    3. `GET /v1/account/nonce?address=…&lane=trade` → `nonce`, `signingAccountId` (`&signer=` for an API wallet).
    4. Sign with the SDK; `POST /v1/commands` `{"command":"0x…"}` → `202 {requestId, digest, seq}`; poll
       `GET /v1/requests/{requestId}` until `Executed`.

    ## Signed commands and nonces

    - Signer: the account policy (owners + threshold) or a granted API wallet; outside the validity window:
      `SignatureExpired`.
    - Lanes per principal: `trade`, `funds`, `management` (grants, subaccounts, governance).
    - A nonce works once, from `high - 1023` (`high`: highest used) to max(`high + 1024`, ledger ms + 1 day);
      send the returned `nonce` (`NonceBelowFloor`, `NonceAlreadyConsumed`, `AuthorizationNotYetValid`).

    ## Submitting and confirming

    - `202` = sequenced, not executed; read the receipt with `?digest=`.
    - Resending **identical** bytes is safe (`200`, `duplicate: true`). Never re-sign with a new nonce while the
      outcome is unknown: both may execute.
    - `421` (`not_leader` / `read_only_replica`): use another node. `503` with `submissionOutcome: "Unknown"` (proxy:
      `x-dexos-outcome: unknown`): may still execute; look it up.
    - `x-dexos-expect-manifest: <manifestHash>` pins the network (`503 upstream_manifest_mismatch`).

    ## Conventions

    - JSON, camelCase, Unix ms; 64-bit integers, prices, sizes and amounts are decimal strings.
    - Commands use `ticks = price × 10^priceDecimals`, `lots = size × 10^sizeDecimals` (exact).
    - Markets by `symbol`, accounts by `address` + `subaccount` (0 = main), vaults by `vault`.
    - Errors: `{error:{code, num, message, details?}}` (`num` `1xxxx` gateway, `2xxxx` execution); command endpoints
      add `nonceConsumed` (`false` untouched, `null` unknown). Statuses 400, 401, 403, 404, 409, 412 (replica
      behind), 421 (wrong node), 422, 429.
    - Pages: `?limit=&after=` → `next`, `hasMore`; history adds `upper`: pass it back unchanged.
    - Read-your-writes: `x-dexos-min-seq` = the write's `seq` (412 while the replica lags); not for market data.

    ## Rate limits

    Fixed 60 s windows; weight: reads 1, book / prices 2, history 5, commands `1 + floor(n / 40)` (n = orders,
    cancels, modifies).

    - **Per IP** (1200): all `/v1/*`; TCP peer or trusted-proxy `x-real-ip` (`x-forwarded-for` ignored).
    - **Per account** (1200): verified commands; API wallets charge the granting account.
    - **Unverified** (60, per IP): commands with unverifiable signers; still sent to the ledger.

    Over budget: `429 GatewayRateLimited` with `retry-after`, not sequenced; usage in `ratelimit`, `ratelimit-policy`,
    `x-ratelimit-account`. Wait for new accounts and grants to be `Executed`.

    ## Error codes

    **`gateway`**

    | Code | num |
    |---|---|
    | `GatewayBadRequest` | 10400 |
    | `GatewayBuilderUnknown` | 10400 |
    | `GatewayHistoryIncomplete` | 10400 |
    | `GatewayBadSignature` | 10401 |
    | `GatewayBuilderDisabled` | 10403 |
    | `GatewayBuilderMarketCloseOnly` | 10403 |
    | `GatewayBuilderMarketNotListed` | 10403 |
    | `GatewayForbidden` | 10403 |
    | `GatewayBuilderNotFound` | 10404 |
    | `GatewayNotFound` | 10404 |
    | `GatewayConflict` | 10409 |
    | `GatewayDuplicateClientOrderId` | 10409 |
    | `GatewayReplicaBehind` | 10412 |
    | `GatewayNotLeader` | 10421 |
    | `GatewayCollateralTokenMismatch` | 10422 |
    | `GatewayRateLimited` | 10429 |
    | `GatewayError` | 10500 |
    | `GatewayUnavailable` | 10503 |

    **`execution`**: `20000 + execution error code` (append-only); the string code is the execution-layer error name, e.g. `InsufficientMargin`, `SignatureExpired`, `NonceBelowFloor`, `NonceAlreadyConsumed`, `PostOnlyWouldCross`
servers:
  - url: "https://{host}"
    description: DEXOS gateway
    variables:
      host:
        default: api.dexos.invalid
        description: Host of the DEXOS gateway you integrate with
tags:
  - name: Exchange
    x-page-title: Exchange
    x-page-description: Signing domain, chain and token tables, exchange-wide configuration
  - name: Market data
    x-page-title: Market data
    x-page-description: Markets, order books, trades, candles, prices and funding
  - name: Account
    x-page-title: Account
    x-page-description: Balances, positions, orders, fills, ledger, nonces, subaccounts and API wallets
  - name: Trading
    description: Signed write endpoints
    x-page-title: Trading
    x-page-description: "Place, cancel and replace orders; batch orders and the dead man's switch"
  - name: Funds
    x-page-title: Funds
    x-page-description: Deposits, withdrawals and transfers
  - name: Vaults
    x-page-title: Vaults
    x-page-description: Vault listing, deposits and redemptions
  - name: Subscriptions
    x-page-title: Subscriptions
    x-page-description: WebSocket channels for real-time data
    description: |-
      ## WebSocket

      Connect to `/v1/ws` on the API host (`wss://`).

      ### Frames

      **`subscribe`**

      ```json
      {
        "method": "subscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 1
      }
      ```

      **`ack`**

      ```json
      {
        "channel": "subscribed",
        "data": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "epoch": "<ledger epoch>",
        "seq": 593504256,
        "id": 1
      }
      ```

      **`unsubscribe`**

      ```json
      {
        "method": "unsubscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 2
      }
      ```

      **`ping`**

      ```json
      {
        "method": "ping"
      }
      ```

      **`pong`**

      ```json
      {
        "channel": "pong",
        "data": {
          "ts": 0
        }
      }
      ```

      **`error`**

      ```json
      {
        "channel": "error",
        "data": {
          "code": "GatewayNotFound",
          "message": "no such subscription on this connection",
          "method": "unsubscribe",
          "subscription": {
            "channel": "book",
            "symbol": "BTC-USD",
            "depth": 50
          }
        },
        "id": 2
      }
      ```

      **`lagged`**

      ```json
      {
        "channel": "lagged",
        "data": {
          "dropped": 128,
          "epoch": "<ledger epoch>",
          "upper": "<seq>-<sub>-4294967295",
          "reason": "buffer"
        }
      }
      ```

      **`frame`**

      ```json
      {
        "channel": "<channel>",
        "data": {},
        "seq": 0,
        "isSnapshot": false,
        "epoch": "<private channels only>"
      }
      ```

      ### Rules

      - Snapshot channels (`book` / `bbo` / `prices` / `account` / `positions` / `orders`) send `isSnapshot:true` on subscribe; all but `orders` then push at most once per block (about 1 s), only on change
      - Errors answering `subscribe` / `unsubscribe` echo the request `id`, `data.method` and `data.subscription`. Unsubscribing an unknown subscription is an error (`GatewayNotFound`)
      - `orders`: snapshot of all open orders (conditional ones with `trigger`), then one frame per accept / fill / cancel / expiry. Apply by `orderId`: keep if `status` is `open`, else drop; a snapshot replaces the set
      - `candles`: one frame per fill with the current bar's latest state (keep the last frame); a new bar starts when the interval rolls over
      - Time series (`trades` / `fills` / `ledger` / `events`) carry `seq`; one frame per event with `data.id` (`ledger`: per command, `data.entries[]`). These ids are the `after` cursors of the REST history
      - Ack has `epoch`, `seq`: backfill REST to `upper=<seq>-65535-4294967295`, dedupe by `id`. `lagged` = frames lost for good: refetch with its `upper` (400 `GatewayHistoryIncomplete`: retry). New `epoch`: rebuild
      - At most 200 subscriptions per connection; a connection that sends no frame (pings count) for 60 s is closed
      - The WebSocket connection carries no rate-limit weight; REST limits (429 with `retry-after`) are in the overview
      - Private channels accept `vault` instead of `address` / `subaccount` (not both); frames then carry `vault`
      - Channels with `symbol` also take `kind` (`perp` | `spot`), required when a perp and a spot market share the symbol; frames carry `kind`

      ### Channels

      | Channel | Params | Data |
      |---|---|---|
      | `prices` | — | Same body as `GET /v1/prices`: `{prices:[Price], ts, window24h}` |
      | `book` | `symbol`, `kind?`, `depth?`, `aggTicks?` | Book with `depth` levels per side (1-100, default 20) and `aggTicks` as on `GET /v1/markets/{symbol}/book`; both echoed, invalid ones are an error frame. Several `aggTicks` may share a connection |
      | `bbo` | `symbol`, `kind?` | Best bid and offer: `{symbol, kind, bid:[price,size]\|null, ask, ts}` |
      | `trades` | `symbol`, `kind?` | One frame per trade: `{symbol, kind, id, price, size, side, ts}` |
      | `orders` | `address`, `subaccount?`, `vault?` | Snapshot: `{address, subaccount, orders:[OpenOrder]}`. Update: `{orderId, clientOrderId, symbol, kind, event, status, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}` |
      | `fills` | `address`, `subaccount?`, `vault?` | Fill (the `GET /v1/account/fills` row) + `address`, `subaccount` |
      | `account` | `address`, `subaccount?`, `vault?` | Account (the `GET /v1/account` body, same view) |
      | `positions` | `address`, `subaccount?`, `vault?` | `{address, subaccount, positions:[Position]}` (the `GET /v1/account/positions` body) |
      | `candles` | `symbol`, `kind?`, `interval` | Candle `{symbol, kind, i, t, T, o, h, l, c, v}`, current bar on every fill; `interval` as in REST (unknown: error frame) |
      | `funding` | `symbol`, `kind?` | `{symbol, kind, rate, index, ts}`, one frame per funding settlement |
      | `ledger` | `address`, `subaccount?`, `vault?` | `{address, subaccount, entries:[LedgerEntry]}` (or `{vault, entries}`): one frame per command with this account's entries, identical to `GET /v1/account/ledger` rows (vault, ADL and fee legs included) |
      | `events` | `symbol?`, `address?` | Raw execution-layer events (Event) with `symbol` |
