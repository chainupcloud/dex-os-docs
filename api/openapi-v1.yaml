  /v1/security/markets:
    get:
      tags:
        - Security
      summary: Market spec versions
      description: "各市场的规格版本(代理授予的市场表须带当前版本,M7-7 T7.10)、精度、合约乘数与准入状态。 永续(MarketSpec v2)带账本名称 baseSymbol(同一 dex 内未终结算的永续不重名),现货与 v1 规格为 null;顶层 maxMarketsPerDex 是每 dex 市场上限,dexMarketCounts 是每个有市场的 dex 已用数量(按 dex 升序,未列出 = 0)。 每个市场另带 oracleStale(账本的陈旧标记:上市即陈旧的永续在第一轮生效价之前为 true,撮合状态同为 OracleStale,只收只减仓单)、oraclePriceAtMs(最近生效价的时间,0 = 从没有过)与 oraclePolicy(当前报价政策的版本、状态、算法与逐个 Feed 的归属 feedOwner / feedDex;没有政策为 null;version 填进 GovOp 14 的 expectedVersion)。"
      operationId: v1_security_markets
      parameters: []
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets:
                    type: array
                    items:
                      type: object
                      properties:
                        market:
                          type: integer
                        dex:
                          type: integer
                        baseSymbol:
                          type:
                            - string
                            - "null"
                          description: "永续名称(1–16 位大写字母与数字);现货 / v1 规格为 null"
                        marketSpecVersion:
                          type: string
                        assetVersion:
                          type: string
                        priceDecimals:
                          type: integer
                        sizeDecimals:
                          type: integer
                        quotePerTickLot:
                          type: string
                        admission:
                          type: integer
                        admissionVersion:
                          type: string
                        oracleStale:
                          type: boolean
                          description: "Ledger oracle-stale flag; a perpetual listed without an enabled test policy stays stale until its first effective round"
                        oraclePriceAtMs:
                          type: string
                          description: "Block time of the last effective oracle price (ms, u64 decimal); 0 = never"
                        oraclePolicy:
                          type:
                            - object
                            - "null"
                          description: "Current market oracle policy; null for spot markets and markets without a policy"
                          required:
                            - version
                            - status
                            - algorithmId
                            - algorithmVersion
                            - feeds
                          properties:
                            version:
                              type: string
                              description: "Policy version; GovOp 14 expectedVersion"
                            status:
                              type: integer
                              description: "0 draft / 1 enabled / 2 disabled"
                            algorithmId:
                              type: integer
                            algorithmVersion:
                              type: integer
                            feeds:
                              type: array
                              items:
                                type: object
                                required:
                                  - feedId
                                  - feedVersion
                                  - setId
                                  - setEpoch
                                  - feedOwner
                                  - feedDex
                                properties:
                                  feedId:
                                    type: string
                                  feedVersion:
                                    type: string
                                  setId:
                                    type: string
                                  setEpoch:
                                    type: string
                                  feedOwner:
                                    type:
                                      - string
                                      - "null"
                                    enum:
                                      - Protocol
                                      - Dex
                                      - null
                                    description: "Owner of the feed resource; null when the feed is not configured"
                                  feedDex:
                                    type:
                                      - integer
                                      - "null"
                                    description: "The owning dex when feedOwner = Dex"
                      required:
                        - market
                        - dex
                        - baseSymbol
                        - marketSpecVersion
                        - oracleStale
                        - oraclePolicy
                  maxMarketsPerDex:
                    type: object
                    description: "GovOp 27 kind 8 每 dex 市场上限(一个 dex 的全部市场,含冻结与已终结算,达到 max 后上币拒 MarketsHardCapReached);version 填进 expectedVersion"
                    properties:
                      max:
                        type: integer
                      version:
                        type: string
                    required:
                      - max
                      - version
                  dexMarketCounts:
                    type: array
                    items:
                      type: object
                      properties:
                        dex:
                          type: integer
                        markets:
                          type: integer
                      required:
                        - dex
                        - markets
                required:
                  - markets
                  - maxMarketsPerDex
                  - dexMarketCounts
        "400":
          description: "查询参数格式错误"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/escape-preview:
    get:
      tags:
        - Security
      summary: Escape leaf preview
      description: "逃生叶预览(E6a2):按当前已折叠视图,用与构根同一批纯函数(`dex_checkpoint::equity::account_preview`)重算该账户每种资产的叶构成 —— `own`(自有权益,账本单位)、`inTransit`(在途现金:出金托管、金库两阶段存赎 / 认领的付款方、出账方为金库账户的赎回付款收款方)、`vaults[]`(每个金库 `{vault, mainAccount, role: lp|manager, shares, amount}`,金库份额价值按冻结口径穿透进持有人自己的叶,金库账户本身没有叶)、`vaultAmount`(穿透额合计)、`ledgerTotal`,与叶上的 `claimable` / `withdrawReserved` / `paidObserved`(raw 单位,= 账本单位按资产换算后向下取整)。另给身份 `exitAddress` / `policyHash` 与最近被接受的根号 `latestRootSeq`(无则 null)。**预估**:精确值以 `dex-escape` 对冻结根的结果为准。种类 4(金库主库 / 子库)账户 404 `vault_account_has_no_leaf`;未知账户与平台账户 404 `unknown_account`。"
      operationId: v1_security_escape_preview
      parameters:
        - name: account
          in: query
          required: true
          description: "账户号(十进制)"
          schema:
            type: string
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 与金额为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "account 缺失或不是十进制数"
        "404":
          description: "unknown_account(未知账户 / 平台账户)或 vault_account_has_no_leaf(种类 4 金库账户)"
        "503":
          description: "未启用安全 profile / 读视图未就绪 / 该视图上构根口径算不出(escape_preview_unavailable)"
  /v1/security/custody:
    get:
      tags:
        - Security
      summary: Custody group discovery
      description: "托管组发现(M7-5 T5.1):每个托管组的身份、托管链号、三个合约地址与 Inbox 代码哈希、资产(含运行期登记、depositEnabled 与流量上限)、路由(全部字段 = routePolicyHash 的前像,另有 destinationChainId:路由 3 = 证据表里目标 domain 的链号,直付 / 原生币 = 托管链)、提款手续费政策 withdrawalFee(M7-5 T5.10,GovOp 28:version、policyHash、recipient、逐资产 schedules {assetId, assetVersion, fixedRaw, ratePpm, capRaw}、公式与向上取整;163 签入的 sourceFeeRaw / sourceFeeRecipient 必须等于按它算出的值,对象原样传给 WASM 协议库的 withdrawalFee / cashWithdrawal)、CCTP 构造常量(hubDomain、finalizedThreshold、绑定类型串 bindingType 与 typehash、入金消息 536 字节(hook 160 字节,绑定只留受益地址)、beneficiaryForbidden 禁止的受益地址:零地址与三个托管合约)与 domain ↔ 链号证据表 domains(M7-5 T5.5)、政策参数、终局政策、提交者与根接受进度(status:frozen、escapePending、mode(M8-4:normal / escapePending / frozen)、本组被接受的全局根序号 acceptedSeq、全局下一根序号 nextCheckpointSeq)。Manifest 托管组 + 账本资金段同一份已发布 CTX;前端 / SDK 不再手抄地址。 M8-8:组从账本资金段的组登记原件出(创世组 = Manifest 托管组,GovOp 24 运行中登记的组不在 Manifest 里),每组另带 registration(登记原件规范字节 hex,与 Manifest 托管组同形,链下按它构组配置)、registrationHash(= 147 kind 9 的 configHash)与 firstCheckpointSeq(组从这一根起进全局 cut 与组树,创世组 1);顶层 groupCatalogVersion(组目录版本,创世 1,每条生效的 GovOp 24 加 1)。 入金按地址(deposit-by-address):每个资产另带 minDepositRaw —— 该组 DepositInbox 的最低入金额(raw,链上 `minDepositRaw(assetId, assetVersion)` 经 `PUBLIC_RPC_URL` / `CUSTODY_RPC_URLS` 读,10 秒缓存;\"0\" = 未配置 = 合约不收这个资产的入金;读链失败时为 null 并带 minDepositError)。 每个资产另带 symbol:GovOp 31 设的账本资产符号(大写字母、数字与 `.`,账本内唯一),未设为 null。"
      operationId: v1_security_custody_groups
      parameters: []
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        custodyChainId:
                          type: string
                        contracts:
                          type: object
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              assetId:
                                type: integer
                              assetVersion:
                                type: string
                                description: "u64 十进制字符串"
                              depositEnabled:
                                type: boolean
                              minDepositRaw:
                                type:
                                  - string
                                  - "null"
                                description: "Inbox 最低入金额(raw,十进制;\"0\" = 未配置、不收入金;读链失败为 null)。直接入金低于它 revert `DepositBelowMinimum`,CCTP 入金低于它按 Late 退回受益地址"
                              minDepositError:
                                type: string
                                description: "读最低额失败的原因(只在 minDepositRaw 为 null 时出现)"
                        routes:
                          type: array
                          items:
                            type: object
                        cctp:
                          type: object
                          properties:
                            inboxMessageBytes:
                              type: integer
                              description: "CCTP 入金消息长度(536 = 376 + 160 字节 hook)"
                            bindingType:
                              type: string
                              description: CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)
                            bindingTypehash:
                              type: string
                            beneficiaryForbidden:
                              type: array
                              items:
                                type: string
                              description: "不能作受益地址的地址:零地址、本组 Inbox / Vault / Registry"
                        withdrawalFee:
                          type: object
                          properties:
                            version:
                              type: string
                            policyHash:
                              type: string
                            recipient:
                              type: string
                            schedules:
                              type: array
                              items:
                                type: object
                                properties:
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  fixedRaw:
                                    type: string
                                  ratePpm:
                                    type: integer
                                  capRaw:
                                    type: string
                            formula:
                              type: string
                            rounding:
                              type: string
                        policy:
                          type: object
                        status:
                          type: object
                        registration:
                          type: string
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - groups
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  "/v1/security/custody/{key}/deposits/{asset}/{version}/{id}":
    get:
      tags:
        - Security
      summary: Deposit status by receipt
      description: "按收据(资产、资产版本、depositId)查入金:账本侧状态与推迟原因、所在 cut、拒收原因;链上细分状态(托管 / 已退 / 已入账)标明从 `DepositInbox.depositReceipt` 读。 入金按地址(deposit-by-address):收据账户号恒 0,受益地址即 refundRecipient(另以 beneficiary 给出);账本把它解析到该地址的单签主账户,没有就在首笔入账时自动开户(accountId / creditedAccountId 即开出的账户)。"
      operationId: v1_security_deposit_by_receipt
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "custodyKeyHash(0x 开头的 32 字节十六进制)"
        - name: asset
          in: path
          required: true
          schema:
            type: string
          description: "assetId(十进制 u32)"
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: "assetVersion(十进制 u64)"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "depositId(十进制 u64,从 1 起)"
      responses:
        "200":
          description: "入金状态"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit:
                    type: object
                    properties:
                      custodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                        description: "u64 十进制字符串"
                      depositId:
                        type: string
                        description: "u64 十进制字符串"
                      nextDepositId:
                        type: string
                        description: "u64 十进制字符串"
                      status:
                        type: string
                        enum:
                          - awaiting
                          - credited
                          - rejected
                          - refundPending
                          - refunded
                          - refundedBeforeProcessing
                          - consumed
                        description: "账本侧状态:awaiting 链上收据还没被 159 处理(带 queuePosition / refundRequested / deferral);credited 已入账、所在根未被接受(confirmed=false);rejected 拒收、行还在待消费队列;refundPending 待链上退款(含柜员入账失败 tellerRejected);refunded 链上已退款、行还在队列;refundedBeforeProcessing 处理前已退;consumed 被接受的根已消费(入账确认或退款已核销,账本不再区分,链上细分看 `chain`)"
                      queuePosition:
                        type: string
                        description: "u64 十进制字符串"
                      refundRequested:
                        type: boolean
                      deferral:
                        type: object
                        description: "队首入金此刻会不会被推迟、为什么:wouldDefer / frozen / assetNotEnabled / consumptionBudgetFull / noAcceptedRoot / rootStale / unconfirmedHeadroomRaw"
                      accountId:
                        type:
                          - integer
                          - "null"
                        description: "收据解析到的账户:入账的账户,或拒收时受益地址的主账户;受益地址没有主账户(或收据点名了账户号)时为 null"
                      amountRaw:
                        type: string
                      receiptHash:
                        type: string
                      refundRecipient:
                        type: string
                        description: "收据原字段名,值同 beneficiary"
                      includedInCut:
                        type:
                          - string
                          - "null"
                        description: "所在的已切未接受 cut 序号"
                      confirmed:
                        type: boolean
                      reason:
                        type: string
                        enum:
                          - userRequested
                          - accountUnregistered
                          - amountUnrepresentable
                          - creditCapExceeded
                          - liabilityCapExceeded
                          - tellerRejected
                          - unknown
                      chain:
                        type: object
                        description: "账本不记的链上细分状态从哪里读:合约、调用与状态码表(来源 = 托管链,网关不代读)"
                      beneficiary:
                        type: string
                        description: "受益地址 = 收据 refundRecipient(入金按地址:合约把受益地址写进这个字段,被拒收时也退回它)"
                      creditedAccountId:
                        type:
                          - integer
                          - "null"
                        description: "入账的账户(status = credited 时;首笔入金自动开出的主账户也在这里);没入账为 null"
                      reasonDetail:
                        type:
                          - string
                          - "null"
                        enum:
                          - accountOpeningUnavailable
                          - explicitAccountUnsupported
                          - firstDepositOverAccountCap
                          - accountCapExceeded
                          - null
                        description: "拒因细分:拒因 2 accountUnregistered 分「收据账户号 0、受益地址无主账户且无法开户(注册关闭 / 容量满)」与「收据点名了账户号(≠ 0,入金只按地址)」—— 只凭账本行分不出时为 null,按交易查(by-tx)时按收据原文给准;拒因 6 tellerRejected 分「新地址首笔超单账户上限(不开户)」与「已有账户入账超上限」"
                      reasonMessage:
                        type: string
                        description: "拒因的英文说明(按 reason 与 reasonDetail)"
                    required:
                      - custodyKeyHash
                      - assetId
                      - assetVersion
                      - depositId
                      - status
                      - chain
                required:
                  - deposit
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
