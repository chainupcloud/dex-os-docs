  /v1/account/portfolio:
    get:
      tags:
        - Account
      summary: Account value and PnL history
      description: |-
        Account value, PnL and net inflow over time, plus window statistics, for the performance card of a portfolio page (spec `public-api-v1-1.md` §4.8; compare Hyperliquid `info type=portfolio`, Lighter `/api/v1/pnl`, Aster's portfolio chart). Every point comes from a per-minute account value sample; the curve starts when sampling started for this account (no backfill), buckets without a sample produce no point, and nothing is interpolated.

        Two scopes are returned side by side. `perp` = the USDC risk group's net collateral (the same number as `/v1/account` `equity`); USDC moved by spot trades counts as a transfer between perp and spot. `total` = all collateral groups, other token balances valued at the token's latest USDC spot trade price, and vault shares; vault deposits / redemptions are internal moves there. Tokens without a USDC price are excluded and listed in `unvaluedTokens`.

        `pnl = accountValue − cumulative net inflow`, so deposits, withdrawals and transfers never show up as PnL. `history[].pnl` and `history[].netInflow` are relative to the first point of the window. When two samples straddle missing execution history, that interval's PnL is not counted (its value change is carried by `netInflow`) and it is listed in `gaps`.
      operationId: v1_portfolio
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: Main wallet address
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read under a merchant dex (number or dex code): each (address, subaccount) has one balance per merchant dex after the merchant isolation switch, same as `dex` on `/v1/account`. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404."
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum:
              - "24h"
              - "7d"
              - "30d"
              - all
          description: "Window. Bucket width: 24h → 5m, 7d → 1h, 30d → 4h, all → the finest of 5m / 1h / 4h / 1d with at most 500 points"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Portfolio"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/account/positions:
    get:
      tags:
        - Account
      summary: Positions
      description: "Non-zero positions only; `entryPrice = |costBasis / size|`, `unrealizedPnl = mark × size − costBasis`."
      operationId: v1_positions
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read under a merchant dex (number or dex code): each (address, subaccount) has one balance per merchant dex after the merchant isolation switch, same as `dex` on `/v1/account`. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404. Ignored when `vault` is given."
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account instead of a wallet's (specification v1.1 §4.3). Mutually exclusive with `address` / `subaccount` (400); an unknown vault is 404. The response then shows `vault` instead of `address` / `subaccount`."
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  subaccount:
                    type: integer
                  dex:
                    type: integer
                    description: The merchant dex whose balance was read. Present only when the request named a dex other than 0.
                  vault:
                    type: integer
                    description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`, specification v1.1 §4.3)"
                  positions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Position"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/subaccounts:
    get:
      tags:
        - Account
      summary: Subaccounts
      description: "0 is the main account (the lowest-numbered account whose policy has this address as its only member, threshold 1); the others are that account's subaccounts (derived accounts opened by the main policy with 0xD3), listed by their index. Indices are chosen at creation and may have gaps. `signingAccountId` is the account number the main policy signs for."
      operationId: v1_subaccounts
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: Main wallet address
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  subaccounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Subaccount"
        "400":
          "$ref": "#/components/responses/BadRequest"
  "/v1/account/by-address/{address}":
    get:
      tags:
        - Account
      summary: Accounts of an address
      description: "Security ledger only. Everything the ledger links to this address, read from one published view: `main` = the lowest-numbered account whose policy has this address as its only member with threshold 1 (the account `?address=` reads as subaccount 0), with its subaccounts (0xD3) and merchant buckets (one per (subaccount, dex), 0 = the main account; bucket account numbers are not exposed, same as `/v1/account/dex-buckets`); `legacyExtra` = further single-signer accounts of the same address (ledgers from before the one-account-per-address rule; not reachable through `?address=`); `multisig` = accounts whose policy lists this address among two or more members, with threshold k and member count n. Every row carries the current policy epoch. `legacyExtra` and `multisig` are paged together in ascending policy id: pass `next` back as `after`; `main` is repeated on every page. An address with no account answers 200 with `main: null` and empty lists. The index page lookup for `legacyExtra` + `multisig` is bounded by `limit` other rows plus one probe (excluding `main`), with O(limit · log n) cost. Once per new queried read-model generation, the gateway also compares all P policies in O(P) and updates changed memberships; a cold index builds all memberships. The repeated `main` projection is not paged: it reads all S subaccounts and B buckets using the generation's parent-keyed maps, with O(log(U + 1) + S + (S + 1) · log(D + 1) + B) work for U total subaccount mappings and D total bucket mappings. These are live-index keyset pages, not a snapshot across requests: a client needing a consistent set restarts from the first page if the ledger changes between pages."
      operationId: v1_account_by_address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: The address to look up
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: "Rows of `legacyExtra` + `multisig` per page"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "Policy id to continue after (the previous page's `next`)"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  main:
                    type:
                      - object
                      - "null"
                    properties:
                      signingAccountId:
                        type: integer
                        description: "**Signing only.** The account number a 139 envelope names as `inner_account` for this account (subaccounts are signed by the main policy)"
                      policyId:
                        type: string
                        description: "Account policy id (u64 as a decimal string); `/v1/security/nonces?principal=account&policy=` and `/v1/security/grants?policy=` take it"
                      policyEpoch:
                        type: string
                        description: "Current epoch of the signing policy (u64 as a decimal string); bumps on every rekey"
                      subaccounts:
                        type: array
                        items:
                          type: object
                          properties:
                            subaccount:
                              type: integer
                              minimum: 1
                              description: "Subaccount index (`?address=&subaccount=N`)"
                            signingAccountId:
                              type: integer
                              description: "**Signing only.** The account number a 139 envelope names as `inner_account` for this account (subaccounts are signed by the main policy)"
                            policyEpoch:
                              type: string
                              description: "Current epoch of the signing policy (u64 as a decimal string); bumps on every rekey"
                      dexBuckets:
                        type: array
                        items:
                          type: object
                          properties:
                            subaccount:
                              type: integer
                              description: "Index of the subaccount the bucket belongs to (0 = main)"
                            dex:
                              type: integer
                              minimum: 1
                            policyEpoch:
                              type: string
                              description: "Current epoch of the signing policy (u64 as a decimal string); bumps on every rekey"
                  legacyExtra:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**Signing only.** The account number a 139 envelope names as `inner_account` for this account (subaccounts are signed by the main policy)"
                        policyId:
                          type: string
                          description: "Account policy id (u64 as a decimal string); `/v1/security/nonces?principal=account&policy=` and `/v1/security/grants?policy=` take it"
                        policyEpoch:
                          type: string
                          description: "Current epoch of the signing policy (u64 as a decimal string); bumps on every rekey"
                  multisig:
                    type: array
                    items:
                      type: object
                      properties:
                        signingAccountId:
                          type: integer
                          description: "**Signing only.** The account number a 139 envelope names as `inner_account` for this account (subaccounts are signed by the main policy)"
                        policyId:
                          type: string
                          description: "Account policy id (u64 as a decimal string); `/v1/security/nonces?principal=account&policy=` and `/v1/security/grants?policy=` take it"
                        policyEpoch:
                          type: string
                          description: "Current epoch of the signing policy (u64 as a decimal string); bumps on every rekey"
                        threshold:
                          type: integer
                          description: "k: signatures needed"
                        memberCount:
                          type: integer
                          description: "n: policy members"
                  next:
                    type:
                      - string
                      - "null"
                    description: "Pass as `after` for the next page; null on the last page"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/account/dex-buckets:
