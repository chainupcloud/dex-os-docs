  /v1/cluster/members:
    get:
      tags:
        - Security
      summary: Cluster members
      description: "当前 Raft 成员的编号、角色(voter / learner)、钉值(证书 SPKI 的 SHA-256)与节点种类,**不含地址**(M8 §5.2,D8-12:钉值随 Raft 成员记录、Manifest 不记节点)。按应答节点已应用的成员配置答。新节点入网时据此填 `PEER_JOIN_PINS`;`dex-custody-ops council-check` 拿 voter 钉值与 Council 留存的期望清单比对。运营方计算节点的服务口(`SERVICE_LISTEN`)也答同一形状,`council-check --members-urls` 据此交叉核对平台的答案。"
      operationId: v1_cluster_members
      parameters: []
      responses:
        "200":
          description: "成员"
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type:
                      - integer
                      - "null"
                    format: uint64
                    description: "成员配置所在的日志位置"
                  committed:
                    type: boolean
                  joint:
                    type: boolean
                    description: "联合共识进行中(换 voter 的中间态)"
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: uint64
                          description: "节点号(单调、不复用)"
                        role:
                          type: string
                          enum:
                            - voter
                            - learner
                        spki:
                          type:
                            - string
                            - "null"
                          pattern: "^[0-9a-f]{64}$"
                          description: "证书 SPKI 的 SHA-256(64 位小写十六进制);只有单节点形态(不开对等口、没有证书)为 null"
                        kind:
                          type:
                            - string
                            - "null"
                          enum:
                            - core
                            - edge
                            - elastic
                            - compute
                            - null
                          description: "节点种类(成员记录的 `#role=` 后缀:core / edge / elastic / compute,只有 core 能被换成 voter);记录没带时为 null"
                      required:
                        - id
                        - role
                        - spki
                required:
                  - members
