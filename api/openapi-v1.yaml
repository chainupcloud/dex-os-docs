  /v1/account/portfolio:
    get:
      tags:
        - Account
      summary: Account value and PnL history
      description: |-
        Account value, PnL and net inflow over time, plus window stats. Points come from per-minute samples (no backfill or interpolation).

        - `perp`: USDC risk group net collateral (= `/v1/account` `equity`); `total`: all collateral groups plus vault shares, at latest USDC spot prices (unpriced tokens in `unvaluedTokens`).
        - `pnl = accountValue - cumulative net inflow`; `history[]` is relative to the window's first point.
