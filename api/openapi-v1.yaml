  "/v1/security/custody/{key}/late-deposits":
    get:
      tags:
        - Security
      summary: Late deposit receipts
      description: "Late 收据(M7-5 T5.6):托管组冻结、逃生等待期到期之后,或到账净额不是 quantum 整数倍、低于该资产 Inbox 最低额(含未配置)或受益地址不可签名(有代码且不是 7702 委托)的 CCTP 入金,链上原样留在 Vault、不进账本(`CustodyVault` 的 `LateDepositReceived`)。网关经 `PUBLIC_RPC_URL` 的上游按区间读 `LateDepositReceived` 并合上 `LateDepositRefunded`;退款任何人可调、收款人与金额取自收据,`dex-submitter` 自动退。只读、不作信任来源;区间之前的退款不合并,单张的当前状态读 `/late-deposits/{id}`。"
      operationId: v1_security_late_deposits
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "custodyKeyHash(0x 开头的 32 字节十六进制)"
        - name: fromBlock
          in: query
          required: false
          schema:
            type: string
          description: "u64 十进制;缺省 = toBlock − 9 999"
        - name: toBlock
          in: query
          required: false
          schema:
            type: string
          description: "u64 十进制;缺省 = 托管链最新块"
        - name: beneficiary
          in: query
          required: false
          schema:
            type: string
          description: "0x 开头的 20 字节地址;只列这个受益地址的(按 indexed beneficiary 过滤)"
      responses:
        "200":
          description: "区间内本组的 Late 收据"
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  custodyVault:
                    type: string
                  fromBlock:
                    type: string
                    description: "u64 十进制字符串"
                  toBlock:
                    type: string
                    description: "u64 十进制字符串"
                  source:
                    type: string
                  lateDeposits:
                    type: array
                    items:
                      type: object
                      properties:
                        lateDepositId:
                          type: string
                          description: "Late 收据号 = keccak256(abi.encode(keccak256(\"DEXOS/LateDeposit/v1\"), custodyKeyHash, sourceMessageId))"
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: "u64 十进制字符串"
                        beneficiary:
                          type: string
                          description: "受益地址:源链 burn 时签进 160 字节 hook 的唯一身份,Late 退款只付给它"
                        amountRaw:
                          type: string
                          description: "到账净额(amount − feeExecuted),现金币原始单位"
                        sourceMessageId:
                          type: string
                        bindingHash:
                          type: string
                        blockNumber:
                          type: string
                          description: "u64 十进制字符串"
                        transactionHash:
                          type: string
                        refunded:
                          type: boolean
                          description: "本区间里看到了 LateDepositRefunded"
                        refundBlockNumber:
                          type:
                            - string
                            - "null"
                          description: "u64 十进制字符串;没退为 null"
                        refundTransactionHash:
                          type:
                            - string
                            - "null"
        "400":
          description: "`invalid_custody_key_hash` / `invalid_query`(数字只收十进制)/ `invalid_block_range`(fromBlock > toBlock)/ `block_range_too_large`(一次至多 100 000 块)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "`unknown_custody_group`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "`chain_rpc_failed`:上游 RPC 出错"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "`chain_rpc_unavailable`:没配 `PUBLIC_RPC_URL`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/security/custody/{key}/late-deposits/{id}":
