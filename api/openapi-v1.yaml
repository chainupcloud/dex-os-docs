          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum:
                      - dexos-gov-signatures/v1
                  manifestHash:
                    type: string
                    pattern: "^0x[0-9a-f]+$"
                  unsigned:
                    type: string
                    pattern: "^0x[0-9a-f]+$"
                  signatures:
                    type: array
                    items:
                      type: object
                  membership:
                    type: object
                    nullable: true
                  members:
                    type: array
                    items:
                      type: string
                  command:
                    type: string
                    nullable: true
                  requestId:
                    type: string
                    pattern: "^0x[0-9a-f]+$"
                  digest:
                    type: string
                    pattern: "^0x[0-9a-f]+$"
                  category:
                    type: string
                    enum:
                      - proposal
                      - root
                      - legacy
                  payloadKind:
                    type: string
                  operation:
                    type: string
                    nullable: true
                  proposalId:
                    type: string
                    nullable: true
                  market:
                    type: integer
                    nullable: true
                  nonce:
                    type: string
                    pattern: "^[0-9]+$"
                  validUntilMs:
                    type: string
                    pattern: "^[0-9]+$"
                  authorityEpoch:
                    type: string
                    pattern: "^[0-9]+$"
                  epochCurrent:
                    type: boolean
                  threshold:
                    type: integer
                    nullable: true
                  ready:
                    type: boolean
                  status:
                    type: string
                    enum:
                      - landed
                      - withdrawn
                      - staleEpoch
                      - expired
                      - nonceBelowFloor
                      - nonceUsed
                      - ready
                      - collecting
                  ledger:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                          - Accepted
                          - Executed
                      outcome:
                        type: string
                        nullable: true
                      stableError:
                        type: string
                        nullable: true
                      errorCode:
                        type: integer
                        nullable: true
                      nonce:
                        type: string
                        pattern: "^[0-9]+$"
                      digestMatches:
                        type: boolean
                  nonceConsumed:
                    type: boolean
                    nullable: true
                  withdrawn:
                    type: object
                    nullable: true
                    properties:
                      reason:
                        type: string
                        enum:
                          - withdrawn
                          - superseded
                      replacedBy:
                        type: string
                        nullable: true
                      atMs:
                        type: string
                        pattern: "^[0-9]+$"
                  meta:
                    type: object
                    nullable: true
                    additionalProperties: false
                    properties:
                      reference:
                        type: string
                      kind:
                        type: string
                      label:
                        type: string
                      group:
                        type: string
                      groupIndex:
                        type: integer
                      groupSize:
                        type: integer
                      after:
                        type: array
                        items:
                          type: string
                  source:
                    type: string
                    enum:
                      - admin
                      - public
                      - migrated
                  registeredBy:
                    type: string
                    nullable: true
                  createdMs:
                    type: string
                    pattern: "^[0-9]+$"
                  updatedMs:
                    type: string
                    pattern: "^[0-9]+$"
        "400":
          description: "Malformed request body (`missing_unsigned`, `malformed_command`, `no_signatures`, `invalid_signature`, `invalid_json`)"
        "409":
          description: "Epoch, nonce (`nonce_conflict` with `conflictsWith` and `nextNonce`, `nonce_span_exceeded` with `lowest` and `highest`, both in `error.details`), `conflicting_unsigned`, or the original is expired, landed or withdrawn"
        "422":
          description: "`network_mismatch`, `inconsistent_envelope`, out of scope (`not_a_governance_command`, `execute_proposal_not_collected`, `not_a_council_request`), validity (`maxValidUntilMs`), or a bad signer"
        "503":
          description: "Ledger read view or signature store (`signature_store_unavailable`) unavailable; retry later"
