          description: On-chain state of the receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  source:
                    type: string
                  lateDeposit:
                    type: object
                    properties:
                      lateDepositId:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                        description: Decimal string
