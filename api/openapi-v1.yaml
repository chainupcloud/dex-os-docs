      description: "One row of `/v1/dexes` (`markets` (perpetuals only) and `spotMarkets` (spot only) are listed separately) plus `categories`: the dex's own category definitions ∪ the platform templates used by its markets' `tags` (dex 0 included), by `sort` then code — the display names for `/v1/markets[].tags`. Read with the symbol table (cached up to 2 s)."
      operationId: v1_dex
      parameters:
