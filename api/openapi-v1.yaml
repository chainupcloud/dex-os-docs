          "$ref": "#/components/responses/Unavailable"
  "/v1/orders/client/{clientOrderId}":
    get:
      tags:
        - Account
      summary: Order by client order id
      description: "Looks up an order by its signed client order id. A resting order returns `Order`; a filled or canceled one returns status `closed`. 404 if no admitted order has this id; 503 if execution history is unavailable."
      operationId: v1_order_by_client_id
      parameters:
        - name: clientOrderId
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; lower-case in responses, case-insensitive in requests"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = its subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404. The response then has `vault` instead of `address` / `subaccount`"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/orders/{orderId}":
    get:
      tags:
        - Account
      summary: Single open order
      description: "Resting orders only; filled / canceled / expired orders are in `GET /v1/account/orders/history`."
      operationId: v1_order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; case-insensitive, lower-case in responses"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account (lowest-numbered single-signer account); N >= 1 = subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404. The response then has `vault` instead of `address` / `subaccount`"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/prices:
    get:
      tags:
        - Market data
      summary: Price snapshot for all markets
      description: |-
        Last, mark, oracle, best bid/ask, funding rate and schedule, and open interest for every market, plus rolling 24h statistics.

        - The 24h window is the 1440 one-minute candles ending at the latest projected block time (not wall clock), so it matches the 1-minute candles.
        - Statistics may be up to 5 s old. When unavailable, `window24h` and all six 24h fields are null; live prices are unaffected.
      operationId: v1_prices
      parameters:
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Price"
                  ts:
                    type: integer
                    format: int64
                    description: Unix ms
                  window24h:
                    type:
                      - object
                      - "null"
                    description: "Rolling 24h window of the statistics; null when they are unavailable"
                    properties:
                      from:
                        type: integer
                        format: int64
                        description: Window start (inclusive, minute-aligned), Unix ms
                      to:
                        type: integer
                        format: int64
                        description: "Anchor: latest projected block time, Unix ms"
  "/v1/requests/{requestId}":
    get:
      tags:
        - Account
      summary: Request receipt
      description: |-
        Returns the receipt of a command sent to `POST /v1/commands`. Only query parameter: `digest`. Never cached.

        `status`:

        - `Accepted` (200): admitted, nonce consumed, no result yet; keep polling.
        - `Executed` (200): processed. `outcome` is `Succeeded` or `Failed` (`stableError` / `errorCode`); details in
          `events` (`{kind, data}`), `businessRejected`, `seq` / `sub`, and `items` per batch item. While `resultsPending`
          is `true`, `outcome` / `events` are `null`: keep polling. Only the command completed: a targeted governance
          proposal may not be executed, a withdrawal may not be final.
        - `AuthorizationRejected` (200): sequenced but failed authorization; nonce not consumed; reason in
          `stableError` / `errorCode`, log position in `position`. Only within the node's recent-results window, then
          `Unknown`.
        - `Unknown` (404): no record on this node. **Not** proof it never executed; `nonceConsumed` is `null`.
        - `Conflict` (409): the ledger holds a different signed version than your `digest` (returned); not your success.

        `source`: `ActionReceipt` (signed command), `RegistrationState` (account registration: `accountId`, `policyId`,
        `policyHash`), `CertifiedTimeState` (time certificate), `ResultWindow` (`AuthorizationRejected`).

        Send `x-dexos-min-seq: <seq>` so a lagging node answers 412, not `Unknown`. Oracle rounds and chain-fact
        certificates have no receipt; check an oracle round via `currentRound` on `GET /v1/oracle/markets/{id}`.
      operationId: v1_request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            pattern: "^(account:[0-9]+|agent:0x[0-9a-fA-F]{40}|owner:0x[0-9a-fA-F]{40})$"
          description: "Not supported (400 `unsupported_request_parameter`); use `digest` to pin the signed version"
        - name: nonce
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Not supported (400 `unsupported_request_parameter`); use `digest` to pin the signed version"
        - name: commandHash
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "Not supported (400 `unsupported_request_parameter`); use `digest` to pin the signed version"
        - name: digest
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
          description: "Optional: the `digest` `POST /v1/commands` returned for your signed version (one request id may be signed more than once); another version's receipt answers 409 `Conflict`, its authorization refusal is not returned"
      responses:
        "200":
          description: "Known request: `status` is `Accepted`, `Executed` or `AuthorizationRejected`"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - executed
                          - rejected
                          - pending
                      epoch:
                        type: string
                      seq:
                        type: integer
                        format: uint64
                        description: "Log sequence number (same axis as the submission's `seq` and `x-dexos-seq`)"
                      sub:
                        type: integer
                      requestId:
                        type: string
                      signer:
                        type: string
                      nonceScope:
                        type: string
                      nonce:
                        type: integer
                      nonceConsumed:
                        type: boolean
                      reason:
                        type: string
                        description: "Rejected only: the CoreError"
                      events:
                        type: array
                        items:
                          type: object
                      items:
                        type: array
                        items:
                          type: object
                      source:
                        type: string
        "400":
          description: "Malformed request id, `digest` or `x-dexos-min-seq`, or an unsupported query parameter (`invalid_request_id`, `invalid_request_digest`, `invalid_min_seq`, `unsupported_request_parameter`); says nothing about the request"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
        "404":
          description: "`status: \"Unknown\"`: no record on this node. Not proof it did not execute; keep the command and query again later or on another node"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - "$ref": "#/components/schemas/Error"
        "409":
          description: "`status: \"Conflict\"` (`request_digest_conflict`): the ledger recorded a different signed version (its `digest` is returned); not a success of yours"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/RequestFact"
                  - "$ref": "#/components/schemas/Error"
        "412":
          description: "`read_view_behind`: this node (`hostLogIndex`) has not reached your `x-dexos-min-seq` (`requiredSeq`); retry later or on another node"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
        "503":
          description: "Receipt unreadable now (`ledger_state_unavailable`, `receipt_inconsistent`, `result_unavailable`), even on healthy nodes. A 503 is not a failure: re-query the `requestId`; never re-sign"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/CommandError"
                  - "$ref": "#/components/schemas/Error"
