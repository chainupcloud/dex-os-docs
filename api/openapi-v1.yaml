      channel: lagged
      data:
        dropped: 128
        epoch: "<ledger epoch>"
        upper: "<seq>-<sub>-4294967295"
        reason: buffer
    frame:
      channel: "<channel>"
      data: {}
      seq: 0
      isSnapshot: false
      epoch: "<private channels only>"
  rules:
    - "Snapshot channels (`book` / `bbo` / `prices` / `account` / `positions` / `orders`) send `isSnapshot:true` on subscribe; all but `orders` then push at most once per block (about 1 s), only on change"
    - "Errors answering `subscribe` / `unsubscribe` echo the request `id`, `data.method` and `data.subscription`. Unsubscribing an unknown subscription is an error (`GatewayNotFound`)"
    - "`orders`: snapshot of all open orders (conditional ones with `trigger`), then one frame per accept / fill / cancel / expiry. Apply by `orderId`: keep if `status` is `open`, else drop; a snapshot replaces the set"
    - "`candles`: one frame per fill with the current bar's latest state (keep the last frame); a new bar starts when the interval rolls over"
    - "Time series (`trades` / `fills` / `ledger` / `events`) carry `seq`; one frame per event with `data.id` (`ledger`: per command, `data.entries[]`). These ids are the `after` cursors of the REST history"
    - "Ack has `epoch`, `seq`: backfill REST to `upper=<seq>-65535-4294967295`, dedupe by `id`. `lagged` = frames lost for good: refetch with its `upper` (400 `GatewayHistoryIncomplete`: retry). New `epoch`: rebuild"
    - "At most 200 subscriptions per connection; a connection that sends no frame (pings count) for 60 s is closed"
    - "The WebSocket connection carries no rate-limit weight; REST limits (429 with `retry-after`) are in the overview"
    - "Private channels accept `vault` instead of `address` / `subaccount` (not both); frames then carry `vault`"
    - "Channels with `symbol` also take `kind` (`perp` | `spot`), required when a perp and a spot market share the symbol; frames carry `kind`"
  channels:
    prices:
      params: []
      data: "Same body as `GET /v1/prices`: `{prices:[Price], ts, window24h}`"
    book:
      params:
        - symbol
        - "kind?"
        - "depth?"
        - "aggTicks?"
      data: "Book with `depth` levels per side (1-100, default 20) and `aggTicks` as on `GET /v1/markets/{symbol}/book`; both echoed, invalid ones are an error frame. Several `aggTicks` may share a connection"
    bbo:
      params:
        - symbol
        - "kind?"
      data: "Best bid and offer: `{symbol, kind, bid:[price,size]|null, ask, ts}`"
    trades:
      params:
        - symbol
        - "kind?"
      data: "One frame per trade: `{symbol, kind, id, price, size, side, ts}`"
    orders:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "Snapshot: `{address, subaccount, orders:[OpenOrder]}`. Update: `{orderId, clientOrderId, symbol, kind, event, status, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}`"
    fills:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "Fill (the `GET /v1/account/fills` row) + `address`, `subaccount`"
    account:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "Account (the `GET /v1/account` body, same view)"
    positions:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "`{address, subaccount, positions:[Position]}` (the `GET /v1/account/positions` body)"
    candles:
      params:
        - symbol
        - "kind?"
        - interval
      data: "Candle `{symbol, kind, i, t, T, o, h, l, c, v}`, current bar on every fill; `interval` as in REST (unknown: error frame)"
    funding:
      params:
        - symbol
        - "kind?"
      data: "`{symbol, kind, rate, index, ts}`, one frame per funding settlement"
    ledger:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "`{address, subaccount, entries:[LedgerEntry]}` (or `{vault, entries}`): one frame per command with this account's entries, identical to `GET /v1/account/ledger` rows (vault, ADL and fee legs included)"
    events:
      params:
        - "symbol?"
        - "address?"
      data: "Raw execution-layer events (Event) with `symbol`"
