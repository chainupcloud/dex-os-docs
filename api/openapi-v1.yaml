      summary: Account withdrawal tickets
      description: "账户持有的全部提款票据(持票柜员):金额、资产、所在托管组、取消计划;`groups` 给各组根接受进度。链上进度(未预留 / 已预留 / 已付 / 已 burn / 已取消)与预留时刻标明从 `CustodyVault.ticketTerminal` 与 `TicketReserved` 读,到账不早于预留时刻 + ordinaryPaymentWaitMs。"
      operationId: v1_security_account_tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户号(十进制 u32)"
      responses:
        "200":
          description: "票据列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        ticketId:
                          type: string
                        custodyKeyHash:
                          type: string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: "u64 十进制字符串"
                        debitRaw:
                          type: string
                        payloadHash:
                          type: string
                        cancelPlanned:
                          type: boolean
                        cancelId:
                          type:
                            - string
                            - "null"
                        ledgerStatus:
                          type: string
                        chain:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - tickets
                  - groups
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  "/v1/security/accounts/{id}/funds-history":
    get:
      tags:
        - Security
      summary: Account funds history
      description: "账户的入金、退款与提款历史(执行历史的账户事件索引,分页参数与尾部同 `/v1/events`):CashDepositCredited / DepositRefundPlanned / CashWithdrawalReserved / CashWithdrawalPaid 等八类。退款计划按 159 行的收据归到受益账户,并注上当前退款进度 `refund{status: pending|refunded, reason}`;预留成功的票据注上根进度 `ticket{inAcceptedRoot, acceptedSeq, cutSeq, estimatedPayableAtMs, estimateBasis}`(预计 = 最近被接受根的 cut 时间 + 付款等待期,精确值取链上 TicketReserved 块时间)。"
      operationId: v1_security_account_funds_history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "账户号(十进制 u32)"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Execution-layer event identity `<seq>-<sub>-<idx>`; the backfill cursor and the `id` in WebSocket frames are character-for-character the same"
          description: "Cursor: the `next` value of the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; **required together with `upper` when `after` is given** (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; **required together with `epoch` when `after` is given**, otherwise 400. Beyond this replica's complete history prefix → 400 `GatewayHistoryIncomplete` (retry later)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
      responses:
        "200":
          description: "资金历史一页"
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        data:
                          type: object
                        ts: {}
                        refund:
                          type: object
                        ticket:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - items
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/governance:
