# Generated by scripts/gen-gitbook-openapi.mjs from web/openapi-v1.json and web/gitbook/overlay-v1.json. Do not edit;
# change the source or the overlay and run: node scripts/gen-gitbook-openapi.mjs
openapi: "3.1.0"
info:
  title: DEXOS Open API v1
  version: "0.1.0"
  summary: "The standard public interface (REST + WebSocket) for builders, developers and liquidity providers"
  description: |-
    The DEXOS public API for third-party developers, builders and liquidity providers. Reads are HTTP `GET`s
    and WebSocket subscriptions. **Every change to the ledger is a signed command submitted to `POST /v1/commands`**;
    its outcome is read back from the receipt at `GET /v1/requests/{requestId}`. Write routes of earlier API versions
    answer `410 legacy_write_disabled`. The few other `POST` routes are gateway-side helpers that do not write to the
    ledger (quotes, governance simulation and signature collection, subaccount names); each documents its own behavior.

    ## Quick start

    1. `GET /v1/security/network` → the network identity (`networkId`, `genesisHash`, `ledgerEpoch`, `manifestHash`)
       and `canonicalManifest`. Pass `canonicalManifest` to the SDK (sdk-wasm `network(manifestHex)`) instead of
       hard-coding any of these values.
    2. `GET /v1/markets` → per market `symbol`, `priceDecimals` / `sizeDecimals` and `signingMarketId`;
       `GET /v1/exchange` → the token table and exchange-wide parameters.
    3. `GET /v1/account/nonce?address=<your address>&lane=trade` → the next `nonce` on that nonce lane and
       `signingAccountId` (add `&signer=<API wallet>` when an API wallet signs).
    4. Build and sign the command with the SDK, then `POST /v1/commands` with `{"command":"0x…"}` →
       `202 {requestId, digest, seq, …}`.
    5. `GET /v1/requests/{requestId}` (with `x-dexos-min-seq: <seq>`) until `status` is `Executed` (or
       `AuthorizationRejected`); the business result (fills, order rejections) is in `outcome`, `businessRejected`
       and `events`.
    6. Subscriptions: `GET /v1/ws` → `{"method":"subscribe","params":{"channel":"book","symbol":"BTC-USD"}}`.
       After a disconnect, resume from the last `id` you saw with `/v1/account/fills?after=` or
       `/v1/events?after=`.

    ## Signed commands and nonces

    - A command is authorized by its principal: an account's signing policy (one or more owner addresses and a
      threshold), or an API wallet acting under a grant issued by the account. The signature binds the command to
      the network identity above, the principal and its current epoch, a nonce lane and nonce, the command payload,
      and a validity window that the ledger checks against its certified time (outside the window:
      `SignatureExpired`).
    - Nonces are kept **per principal and per nonce lane**: `trade` (orders and cancels), `funds` (withdrawals and
      transfers) and `management` (grants, subaccounts and governance). Lanes are independent of each other.
    - Within a lane every nonce is accepted at most once, inside a sliding window of 1024 values that ends at the
      highest nonce used so far (`high`). A nonce below the window (`floor`) is rejected with `NonceBelowFloor`, a
      reused one with `NonceAlreadyConsumed`; a nonce above `high` is accepted and moves the window forward. Use
      `high + 1`, which `GET /v1/account/nonce` returns as `nonce`; leaving unused values below `high` is not
      recommended.
    - A command that fails authorization (bad signature, wrong epoch, outside its validity window, reused nonce, …)
      does not consume its nonce.

    ## Submitting and confirming

    - `202 Accepted` only means the command was sequenced; the outcome comes from `GET /v1/requests/{requestId}`.
      The response's `digest` identifies the exact signed version; pass it as `?digest=` so the receipt you read is
      for the version you signed.
    - Resubmitting the **identical** command bytes is always safe: if the ledger already admitted it the gateway
      answers `200` with the first receipt (`duplicate: true`), and any other replay is rejected by the ledger's
      nonce check, so it never executes twice. Do not sign the same intent again with a new nonce while the first
      command's outcome is unknown: both could execute.
    - Network pinning: send `x-dexos-expect-manifest: <manifestHash>` on any request; a node bound to a different
      network answers `503 upstream_manifest_mismatch` (with its own `manifestHash`) instead of serving it.
    - `421` (`not_leader` / `read_only_replica`) means this node cannot sequence writes: send the same command to
      another node. A `503` with `submissionOutcome: "Unknown"` in the body (or, from a proxy, `details.outcome:
      "unknown"` with the header `x-dexos-outcome: unknown`) means the command may still execute: look it up with
      `GET /v1/requests/{requestId}` before sending anything new.

    ## Conventions

    - Path prefix `/v1`; JSON; camelCase field names; timestamps in Unix milliseconds. 64-bit integers in ledger
      responses (`seq`, `ledgerEpoch`, nonces, …) are decimal strings: never parse them as floating point.
    - **Prices, sizes and amounts are decimal strings**. Signed commands carry scaled integers:
      `ticks = price × 10^priceDecimals`, `lots = size × 10^sizeDecimals` (both must divide exactly), with
      `priceDecimals` / `sizeDecimals` from `GET /v1/markets`.
    - Markets are addressed by **`symbol`** (`BTC-USD` / `BTC-USDC`), accounts by **`address`**
      (+ `subaccount`, 0 = main account), vaults by **`vault`** (the vault id). The numeric ids returned by
      `/v1/account/nonce`, `/v1/account/subaccounts` (`signingAccountId`), `/v1/markets` (`signingMarketId`) and
      `/v1/exchange` (`token`) are inputs to signing, not addresses.
    - Errors: most endpoints answer `{error:{code, num, message, details?}}`, where `code` is a stable string
      (`Gateway*` for the gateway, the execution-layer error name otherwise) and `num` a stable number
      (1xxxx gateway / 2xxxx execution layer). `POST /v1/commands` and `GET /v1/requests/{requestId}` answer their
      own rejections as `{error: "<code>", status?, executionKnown, nonceConsumed, …}`, where `nonceConsumed: false`
      means the nonce is untouched and `null` means unknown. HTTP status: 400 malformed request · 401 bad signature ·
      403 ownership / scope · 404 · 409 · 412 replica behind · 421 wrong node · 422 business rejection ·
      429 rate limited · 5xx.
    - Pagination: `?limit=&after=<cursor>` → `{…, next, hasMore}`; execution-history endpoints also
      return a fixed upper bound `upper`, which you pass back unchanged on the following pages.
    - Read consistency: write and read responses carry `x-dexos-seq`; a **read after a write** sends
      `x-dexos-min-seq` = the write's `seq` and gets 412 when the replica has not reached it yet. Do not send it
      on market-data polling.

    ## Rate limiting

    Budgets are fixed 60-second windows counted in request weights:

    - **Per IP**: every `/v1/*` request. The IP is the TCP peer of the gateway; behind the deployment's own
      reverse proxy it is the `x-real-ip` that proxy writes. `x-forwarded-for`, and an `x-real-ip` sent by
      anyone other than a trusted proxy, are ignored. IPv6 clients are grouped by network prefix.
    - **Per account**: `POST /v1/commands` only, charged after the gateway has verified the signatures against the
      signing principal: a single-signer account is keyed by its signing address, a multi-signer account by its
      policy, and API-wallet commands are charged to the account that issued the grant. A command signed by
      someone else cannot pass this check, so it never touches your budget.
    - **Unverified**: commands whose signers the gateway cannot verify yet (signature not from a member, fewer
      signatures than the threshold, a grant or a new account the gateway has not seen yet) are charged at full
      weight to a separate, smaller per-IP budget and still passed to the ledger, which decides.

    Weights: reads 1, order book and prices 2, history endpoints 5, commands `1 + floor(n / 40)` where `n` is the
    number of orders, cancels and modifications in the command. The per-IP and per-account budgets default to 1200
    per minute and the unverified budget to 60; the operator can raise a budget for a given IP or account
    (market-maker tiers). Every `/v1/*` response carries `ratelimit: limit=…, remaining=…, reset=…` and
    `ratelimit-policy: <limit>;w=60` for the IP budget; a command charged to an account budget also carries
    `x-ratelimit-account: limit=…, remaining=…, reset=…`. Exceeding a budget returns `429 GatewayRateLimited` with
    `retry-after` and `details.bucket` = `ip` | `account` | `unverified`; the command is not sequenced. After
    creating an account or granting an API wallet, wait until its receipt is `Executed` before relying on it.

    ## Error codes

    **gateway**

    | Code | num |
    |---|---|
    | `GatewayBadRequest` | 10400 |
    | `GatewayBuilderUnknown` | 10400 |
    | `GatewayHistoryIncomplete` | 10400 |
    | `GatewayBadSignature` | 10401 |
    | `GatewayBuilderDisabled` | 10403 |
    | `GatewayBuilderMarketCloseOnly` | 10403 |
    | `GatewayBuilderMarketNotListed` | 10403 |
    | `GatewayForbidden` | 10403 |
    | `GatewayBuilderNotFound` | 10404 |
    | `GatewayNotFound` | 10404 |
    | `GatewayConflict` | 10409 |
    | `GatewayDuplicateClientOrderId` | 10409 |
    | `GatewayReplicaBehind` | 10412 |
    | `GatewayNotLeader` | 10421 |
    | `GatewayCollateralTokenMismatch` | 10422 |
    | `GatewayRateLimited` | 10429 |
    | `GatewayError` | 10500 |
    | `GatewayUnavailable` | 10503 |

    **execution**: `20000 + execution error code`; the numbering is append-only, and the string code is the execution-layer error name. Common ones: InsufficientMargin / NonceMismatch / SignatureExpired / AgentScopeViolation / MarketNotTrading / PostOnlyWouldCross / FokInsufficientLiquidity / ReduceOnlyWrongSide / OrderNotAligned / EquityTierLimitExceeded / InvalidLeverage / UnknownOrder / NotOrderOwner / SubaccountIndexMismatch / SubaccountLimitReached / AgentLimitReached / NonceOutOfWindow / NonceBelowFloor / NonceAlreadyConsumed / UnknownAccount.
servers:
  - url: "https://{host}"
    description: DEXOS gateway
    variables:
      host:
        default: api.dexos.invalid
        description: Host of the DEXOS gateway you integrate with
tags:
  - name: Exchange
    x-page-title: Exchange
    x-page-description: Signing domain, chain and token tables, exchange-wide configuration
  - name: Market data
    x-page-title: Market data
    x-page-description: Markets, order books, trades, candles, prices and funding
  - name: Account
    x-page-title: Account
    x-page-description: Balances, positions, orders, fills, ledger, nonces, subaccounts and API wallets
  - name: Trading
    description: Signed write endpoints
    x-page-title: Trading
    x-page-description: "Place, cancel and replace orders; batch orders and the dead man's switch"
  - name: Funds
    x-page-title: Funds
    x-page-description: Deposits, withdrawals and transfers
  - name: Vaults
    x-page-title: Vaults
    x-page-description: Vault listing, deposits and redemptions
  - name: Subscriptions
    x-page-title: Subscriptions
    x-page-description: WebSocket channels for real-time data
    description: |-
      ## WebSocket

      Connect to `/v1/ws` on the API host (`wss://`).

      ### Frames

      **subscribe**

      ```json
      {
        "method": "subscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 1
      }
      ```

      **ack**

      ```json
      {
        "channel": "subscribed",
        "data": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "epoch": "<ledger epoch>",
        "seq": 593504256,
        "id": 1
      }
      ```

      **unsubscribe**

      ```json
      {
        "method": "unsubscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 2
      }
      ```

      **ping**

      ```json
      {
        "method": "ping"
      }
      ```

      **pong**

      ```json
      {
        "channel": "pong",
        "data": {
          "ts": 0
        }
      }
      ```

      **error**

      ```json
      {
        "channel": "error",
        "data": {
          "code": "GatewayNotFound",
          "message": "no such subscription on this connection",
          "method": "unsubscribe",
          "subscription": {
            "channel": "book",
            "symbol": "BTC-USD",
            "depth": 50
          }
        },
        "id": 2
      }
      ```

      **lagged**

      ```json
      {
        "channel": "lagged",
        "data": {
          "dropped": 128,
          "epoch": "<ledger epoch>",
          "upper": "<seq>-<sub>-4294967295",
          "reason": "buffer"
        }
      }
      ```

      **frame**

      ```json
      {
        "channel": "<channel>",
        "data": {},
        "seq": 0,
        "isSnapshot": false,
        "epoch": "<private channels only>"
      }
      ```

      ### Rules

      - Snapshot channels (book / bbo / prices / account / positions / orders) send one frame with `isSnapshot:true` on subscribe. book / bbo / prices / account / positions are then coalesced per block: at each block boundary (`BlockBegun`, about once a second) each is read once and pushed only if its data changed (`isSnapshot:false`). account / positions of an account that holds positions are also re-read when marks or funding move, and those of any account whose ledger moved in the block (e.g. a vault redemption, whose events do not name the vault) are re-read at the block boundary.
      - Error frames answering a `subscribe` / `unsubscribe` carry the request `id` (when the request had one), `data.method` and `data.subscription` (the request's `params` verbatim), so a client can tell which request was refused. Unsubscribing a subscription the connection does not have is an error (`GatewayNotFound`), not `unsubscribed`. Error frames without `id` or `subscription` only answer malformed frames.
      - orders: the snapshot is all open orders across markets; after it every accept / fill / cancel / expiry is one frame with `clientOrderId` (if any) and `status` (open / filled / canceled / expired). Apply frames idempotently by `orderId`: a snapshot replaces the set, any other frame keeps the order if `status` is `open` and removes it otherwise. Order events already covered by the snapshot's view are not sent. `status` and `remaining` are always present: a taker's fill frames repeat the order's state at the end of the command (the same as its `accepted` frame); fills of protocol orders (liquidation, vault halt; `orderId` `"0"`, no `accepted`) are `filled` with `remaining` 0. When the connection cannot work them out it sends a fresh `isSnapshot:true` frame instead of an incomplete one. Pending conditional orders are part of the snapshot (rows with `trigger`); when one is placed, triggered, rejected or auto-cancelled a fresh snapshot is sent (those events carry no side / price / size), and cancelling one sends a `canceled` frame.
      - The candles channel sends one frame per fill with **the latest state of the current bar** (o/h/l/c/v accumulated; clients keep the last frame); a new bar starts automatically when the interval rolls over.
      - Time-series channels (trades / fills / ledger / events) carry `seq`; trades / fills / events send one frame per event with `data.id`, ledger one frame per command with `data.entries[]`. The fills `data.id`, and the last `data.entries[].id` of a ledger frame, are the `after` cursors of `/v1/account/fills` and `/v1/account/ledger`.
      - Resume: the subscribe ack carries the ledger `epoch` and the start position `seq`: every event after `seq` is sent on the subscription (unless a `lagged` follows); backfill time series up to `upper=<seq>-65535-4294967295` over REST and de-duplicate by `id` to join without gaps. Private frames carry `epoch` and `seq`, public book / bbo frames carry `seq`. `lagged{dropped, epoch, upper, reason}` means frames were not sent: `reason: buffer` = the server-side broadcast fell behind and `dropped` events were dropped; `reason: render` = the connection could not render time-series frames (execution history unreadable, market metadata missing; `dropped` is 0). **Frames not sent are never resent**. Right after it every snapshot subscription receives one `isSnapshot:true` frame, and fills / ledger frames at or before `upper` are no longer sent: backfill them with `after=<last id received>&epoch=<epoch>&upper=<upper>` (retry later on 400 `GatewayHistoryIncomplete`); the two parts join without gaps or duplicates. If `epoch` changed after a reconnect, rebuild state instead of resuming old cursors.
      - At most 200 subscriptions per connection; the server closes a connection that has sent no frame (pings count) for 60 s.
      - Rate limiting: REST uses fixed 60-second windows per IP and, for writes, per main wallet (weights: reads 1, order book / prices 2, history 5, writes 1 + floor(n / 40); default 1200 per minute each); every response carries `ratelimit` / `ratelimit-policy`, writes also `x-ratelimit-account`, and exceeding a budget yields 429 with `retry-after`. The WebSocket connection itself carries no weight.
      - Private channels (orders / fills / account / positions / ledger) accept `vault` instead of `address` / `subaccount` (giving both is an error frame); their frames then show `vault` in place of `address` / `subaccount`.
      - Channels that take `symbol` (book / bbo / trades / candles / funding) also take `kind` (`perp` | `spot`). A perp and a spot market may share a symbol; subscribing to such a symbol without `kind` is an error frame naming the choices (the gateway never picks one). Market frames carry `kind` next to `symbol`.

      ### Channels

      | Channel | Params | Data |
      |---|---|---|
      | `prices` | — | `{prices:[Price], ts, window24h}` (same body as `GET /v1/prices`, including the 24h fields) |
      | `book` | `symbol`, `kind?`, `depth?`, `aggTicks?` | Book (`depth` levels per side, 1..=100, default 20, echoed as `depth`; out of range is an error frame). `aggTicks` as on `GET /v1/markets/{symbol}/book`: checked once when subscribing (a value outside the allowed set is an error frame listing the allowed values), echoed in every frame's `data`; the same symbol can be subscribed raw and at several `aggTicks` on one connection |
      | `bbo` | `symbol`, `kind?` | `{symbol, kind, bid:[price,size]\|null, ask, ts}` |
      | `trades` | `symbol`, `kind?` | `{symbol, kind, id, price, size, side, ts}` |
      | `orders` | `address`, `subaccount?`, `vault?` | Snapshot: `{address, subaccount, orders:[OpenOrder]}`. Update: `{address, subaccount, orderId, clientOrderId, symbol, kind, event: accepted\|fill\|canceled\|expired, status: open\|filled\|canceled\|expired, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}` (`status` and `remaining` always present) |
      | `fills` | `address`, `subaccount?`, `vault?` | Fill (the `GET /v1/account/fills` row) + `address`, `subaccount` |
      | `account` | `address`, `subaccount?`, `vault?` | Account (the `GET /v1/account` body, same view) |
      | `positions` | `address`, `subaccount?`, `vault?` | `{address, subaccount, positions:[Position]}` (the `GET /v1/account/positions` body) |
      | `candles` | `symbol`, `kind?`, `interval` | Candle (`{symbol, kind, i, t, T, o, h, l, c, v}`); the current bar is sent on every fill. `interval` takes the same values as REST; an unknown one is an error frame |
      | `funding` | `symbol`, `kind?` | `{symbol, kind, rate, index, ts}`, one frame per funding settlement |
      | `ledger` | `address`, `subaccount?`, `vault?` | `{address, subaccount, entries:[LedgerEntry]}` (or `{vault, entries}`): the `GET /v1/account/ledger` body without the paging tail, one frame per command with all of this account's entries in it, each identical to the REST entry. Read from the execution history's per-account ledger index — every entry the REST endpoint returns after the subscribe ack's `seq` is sent (vault deposits / redemptions, ADL and fee legs included) |
      | `events` | `symbol?`, `address?` | Raw execution-layer events (Event) with `symbol` |
  - name: Security
    description: "Signed command submission and ledger state: accounts, grants, nonces, custody, governance and network identity."
    x-page-title: Security
    x-page-description: Signed commands, custody, governance and cluster reads
paths:
  /v1/account:
    get:
      tags:
        - Account
      summary: Account summary
      description: |-
        Addressed by wallet (`?address=&subaccount=`). Returns equity, margin, available balance, balances, per-group risk, fee rates and counts, all as decimal strings; the risk fields come from one view at `asOfSeq` (in `epoch`). The response carries **no account id**. An address that has never deposited returns 404.

        `fees` = the rates this account is actually charged, per market. `fees.pendingDeployer` = scheduled increases of this account's per-account deployer fee overrides: `[{dex, symbol, enabled, takerPpm, makerPpm, effectiveAtMs}]`, ascending by (dex, symbol). `symbol` is null for a dex-level row or when the market has no metadata; `enabled: false` means the override row is being removed. An entry disappears once it takes effect at `effectiveAtMs`.
      operationId: v1_account
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read this subaccount's balance under a merchant dex (number or dex code), like Hyperliquid's `clearinghouseState{dex}`: each (address, subaccount) has one balance per merchant dex after the merchant isolation switch. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404."
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account instead of a wallet's. Mutually exclusive with `address` / `subaccount` (400); an unknown vault returns 404. The response then shows `vault` instead of `address` / `subaccount`."
        - name: builder
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Builder id the `fees` block is computed for. Omitted = the builder bound to the request's entry domain (the same attribution an order placed through this entry gets); an entry with no builder = no builder leg. An unknown builder is 404 `GatewayBuilderNotFound`."
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: "Limit `fees.markets` to this market; omitted = every tradable market. An unknown symbol is 404."
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/agents:
    get:
      tags:
        - Account
      summary: Approved API wallets
      description: "The list is authoritative from the execution layer; labels come from the gateway. **Secure ledger**: the rows are the usable 141 grants (not revoked, issued under the current policy epoch) whose grantee is an API wallet and whose account set covers this account, plus the Dex-scope management grants issued by this account's policy when this account owns the dex (`dex` set, `subaccounts` empty; a grant whose dex has changed owner is dead and no longer listed): `scope: \"grant\"`, `grantId`, `grantEpoch`, `status` (`active` / `paused`), `actions` (namespace-1 action ids), `subaccounts` (every index the same grant covers), `validFrom` / `validUntil` (ms, null = unbounded), `expired` (judged on certified ledger time) and `executable`. These rows are an **inventory**, not the set of grants that can execute right now: paused, expired and not-yet-valid grants are listed with their `status` / `expired` / `validFrom`; `executable` is true only when the ledger would accept the grant itself at the current certified time (issued under the current policy epoch, `active`, inside `validFrom`..`validUntil`). A command can still be refused for its action, account or market scope or limits."
      operationId: v1_agents
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: Main wallet address
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  subaccount:
                    type: integer
                  agents:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Agent"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/account/fills:
    get:
      tags:
        - Account
      summary: Fill history
      description: "Durable execution history with cursor-based backfill: the first page fixes an upper bound `upper` that you pass back unchanged; only `hasMore=false` means you have everything. After a disconnect, use the last `id` seen in WebSocket frames as `after`."
      operationId: v1_fills
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read under a merchant dex (number or dex code): each (address, subaccount) has one balance per merchant dex after the merchant isolation switch, same as `dex` on `/v1/account`. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404. Ignored when `vault` is given."
