                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - authority
                      - dex
                    properties:
                      authority:
                        type: string
                        enum:
                          - Owner
                        description: "Who governs the dex now: always Owner for a registered dex (dex 0 included once GovOp 30 binds it)"
                      dex:
                        "$ref": "#/components/schemas/SecurityMerchantDex"
        "400":
          description: "路径参数格式错误"
        "404":
          description: "不存在"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  "/v1/security/dex-owner-proposals/{id}":
