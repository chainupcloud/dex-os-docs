          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/custody/{key}/deposit-precheck":
    get:
      tags:
        - Funds
      summary: Deposit precheck
      description: |-
        Checks a deposit (asset, amount, beneficiary) before you send it. Each issue has an `effect`:

        - `revert`: the contract blocks it; a direct deposit tx fails and the funds stay in the wallet.
        - `late` (CCTP): funds are already burned; accepted as a late deposit and refunded to the beneficiary.
        - `refund`: the ledger refuses and refunds it (see `reason`); `defer`: deferred.

        `ok` = no `revert`, `late` or `refund` issue. Advisory: the contract and ledger decide, and state can change.
      operationId: v1_custody_deposit_precheck
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the custody group (0x-prefixed 32-byte hex)"
        - name: assetId
          in: query
          required: true
          schema:
            type: string
          description: Asset id (decimal u32)
        - name: assetVersion
          in: query
          required: true
          schema:
            type: string
          description: Asset version (decimal u64)
        - name: amountRaw
          in: query
          required: true
          schema:
            type: string
          description: Deposit amount in raw units (decimal uint256)
        - name: beneficiary
          in: query
          required: true
          schema:
            type: string
          description: "Beneficiary address; with the default inbox entry point, the wallet that sends the transaction"
        - name: route
          in: query
          required: false
          schema:
            type: string
            enum:
              - direct
              - native
              - cctp
          description: "Default `direct`; with `cctp`, contract-side blocks become late refunds (`effect` = `late`)"
      responses:
        "200":
          description: Pre-check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: "Issue code. On-chain: vault deposits off, beneficiary forbidden or cannot sign, minimum missing or not met. Ledger: amount unrepresentable, credit / liability / account cap exceeded, no account can be opened, deferred."
                          enum:
                            - chainDepositDisabled
                            - beneficiaryForbidden
                            - beneficiaryNotSignable
                            - minDepositNotConfigured
                            - belowMinDeposit
                            - amountUnrepresentable
                            - creditCapExceeded
                            - liabilityCapExceeded
                            - accountOpeningUnavailable
                            - firstDepositOverAccountCap
                            - accountCapExceeded
                            - wouldDefer
                        effect:
                          type: string
                          enum:
                            - revert
                            - late
                            - refund
                            - defer
                        reason:
                          type: string
                          description: "Ledger refund reason (when `effect` = `refund`)"
                        message:
                          type: string
                  chain:
                    type: object
                    properties:
                      checked:
                        type: boolean
                      depositEnabled:
                        type:
                          - boolean
                          - "null"
                        description: "Vault-side deposit opening (same as `chainDepositEnabled` in `/v1/custody`); `null` if the read failed"
                      minDepositRaw:
                        type:
                          - string
                          - "null"
                      beneficiarySignable:
                        type:
                          - boolean
                          - "null"
                  ledger:
                    type: object
                    properties:
                      beneficiaryAccountId:
                        type:
                          - integer
                          - "null"
                        description: "Beneficiary's single-signer main account; null if none (opened automatically on credit)"
                      willOpenAccount:
                        type: boolean
                      registrationEnabled:
                        type: boolean
                      maxAccountRaw:
                        type: string
                      maxUnconfirmedCreditRaw:
                        type: string
                      rawQuantum:
                        type: string
                      deferral:
                        type: object
                  route:
                    type: string
                  beneficiary:
                    type: string
                  amountRaw:
                    type: string
        "400":
          description: "`invalid_custody_key_hash`, or `invalid_query` (missing or malformed parameter, unknown `route`)"
        "404":
          description: "`unknown_custody_asset`: custody group or asset not in the ledger"
        "503":
          description: ledger_state_unavailable
