      summary: Governance proposal detail
      description: "一个提案的详情:操作的全部字段(与 WASM `inspect` 同一份解码)、前提表、执行窗口、入队原件 `originalEnvelope`(带签名的 139 规范编码,任何人可用 WASM / `dex-custody-ops gov-verify` 重算摘要并恢复签名者)。"
