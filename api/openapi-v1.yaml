      tags:
        - Security
      summary: Market oracle signing parameters
      description: "可信安全profile：市场报价政策的签名参数，与STF判定用的同一份已发布CTX。174 TestOracle与156 SubmitOracleRound的报告都按这里取值签名：报告的round = currentRound + 1，policyVersion、feedId/feedVersion、setId/setEpoch（156的报告者集合）、unitHash（M1 §6.2前像）必须与当前值逐一相等。algorithmId/algorithmVersion = (1,1)为测试报价，(2,1)为生产聚合MedianOfSourceMediansV1（按来源家族取下中位数，再在家族间取下中位数）。顶层另带networkId/genesisHash/ledgerEpoch/manifestHash与inputSeq/hostLogIndex/inputPrefix；u64均为字符串。市场不存在或没有报价政策→404；未启用安全profile→503。 另带 marketDex、oracleStale 与 Feed / 报告者集合的归属(feedOwner / feedDex、setOwner / setDex;Protocol 或 Dex)。"
      operationId: v1_testnet_market_oracle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: "市场号（u16）"
      responses:
        "200":
          description: "签名参数"
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  inputSeq:
                    type: string
                  hostLogIndex:
                    type: string
                  inputPrefix:
                    type: string
                  testOracle:
                    type: object
                    properties:
                      marketId:
                        type: integer
                      policyVersion:
                        type: string
                      policyStatus:
                        type: integer
                      feedId:
                        type: string
                      feedVersion:
                        type: string
                      sourceType:
                        type: integer
                      setId:
                        type: string
                      setEpoch:
                        type: string
                      algorithmId:
                        type: integer
                      algorithmVersion:
                        type: integer
                      currentRound:
                        type: string
                      unitHash:
                        type: string
                      priceDecimals:
                        type: integer
                      priceUnit:
                        type: object
                        properties:
                          numerator:
                            type: string
                          denominator:
                            type: string
                      parameters:
                        type: object
                        description: "Algorithm parameters (schemaId / schemaVersion / fields `{fieldId, kind, value}`). For the test oracle (1,1) fields 1 / 2 are the TestControlled min / max price atoms (u128 strings); 174 outside them is rejected"
                        properties:
                          schemaId:
                            type: integer
                          schemaVersion:
                            type: integer
                          fields:
                            type: array
                            items:
                              type: object
                              properties:
                                fieldId:
                                  type: integer
                                kind:
                                  type: string
                                value: {}
                      marketDex:
                        type: integer
                        description: Dex the market belongs to (its dex authority issues GovOp 14)
                      oracleStale:
                        type: boolean
                        description: Ledger oracle-stale flag of the market
                      feedOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: Owner of the policy feed
                      feedDex:
                        type:
                          - integer
                          - "null"
                      setOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: "Owner of the reporter set; null when the set is not configured"
                      setDex:
                        type:
                          - integer
                          - "null"
        "404":
          description: "市场不存在或没有报价政策"
        "503":
          description: "节点未启用安全profile"
  "/v1/security/markets/{id}/oracle":
    get:
      tags:
        - Security
      summary: Market oracle round parameters (reporters / relays)
      description: "可信安全profile(M7-3):报价轮 156 的读口,给报价者 `dex-reporter` 签报告、搬运者凑轮次。`oracle` 含 `GET /v1/testnet/markets/{id}/oracle` 的全部签名参数(报告的 round = currentRound + 1,policyVersion / feed / set / unitHash 逐一相等),另加集合门槛 `threshold`、最少独立家族数、新鲜度窗口、算法参数、证据上限、上一轮生效参照价,以及集合成员逐个的绑定来源 / 来源家族 / 最近一次被接受的 `reporterSequence`(下一份报告须严格更大)。只读投影,能否成轮仍由 STF 判;u64 均为字符串。市场不存在或没有报价政策→404;未启用安全profile→503。 另带 marketDex、oracleStale 与 Feed / 报告者集合的归属(feedOwner / feedDex、setOwner / setDex;Protocol 或 Dex)。 `setCurrentEpoch` is the reporter set's current epoch (reports sign it; sequences are read at it) and `setFollowing` says whether the policy follows the set (`setEpoch` = \"0\"). A recipe feed (`sourceType` 3) also carries its `recipe` and `recipeHash` (the hash DXR2 evidence must start with); other feeds have both null."
      operationId: v1_security_market_oracle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: "市场号（u16）"
      responses:
        "200":
          description: "报价轮参数"
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  inputSeq:
                    type: string
                  hostLogIndex:
                    type: string
                  inputPrefix:
                    type: string
                  oracle:
                    type: object
                    properties:
                      marketId:
                        type: integer
                      policyVersion:
                        type: string
                      policyStatus:
                        type: integer
                      feedId:
                        type: string
                      feedVersion:
                        type: string
                      sourceType:
                        type: integer
                      setId:
                        type: string
                      setEpoch:
                        type: string
                      setCurrentEpoch:
                        type:
                          - string
                          - "null"
                        description: "Current epoch of the reporter set (u64 string); null when the set is missing"
                      setFollowing:
                        type: boolean
                        description: "The policy follows the reporter set's current epoch (setEpoch = \"0\")"
                      recipe:
                        type:
                          - object
                          - "null"
                        description: Price recipe of a recipe feed (sourceType 3), null otherwise
                        properties:
                          venues:
                            type: array
                            description: In venue number order
                            items:
                              type: object
                              properties:
                                venue:
                                  type: integer
                                  description: Price venue number (GET /v1/security/price-venues)
                                symbol:
                                  type: string
                                quote:
                                  type: string
                                  enum:
                                    - USD
                                    - USDT
                                    - USDC
                                weightBps:
                                  type: integer
                          minVenues:
                            type: integer
                          minWeightBps:
                            type: integer
                          maxVenueDeviationBps:
                            type: integer
                      recipeHash:
                        type:
                          - string
                          - "null"
                        description: "0x hex of the recipe hash (domain DEXOS/PriceRecipe/v1); null for other feeds"
                      algorithmId:
                        type: integer
                      algorithmVersion:
                        type: integer
                      currentRound:
                        type: string
                      unitHash:
                        type: string
                      priceDecimals:
                        type: integer
                      priceUnit:
                        type: object
                        properties:
                          numerator:
                            type: string
                          denominator:
                            type: string
                      minIndependentSources:
                        type: integer
                        description: "一轮至少几个独立来源家族"
                      freshnessMs:
                        type: string
                        description: "报告新鲜度窗口(ms,u64 字符串)"
                      futureSkewMs:
                        type: string
                        description: "观测时刻最多领先可信时间多少(ms)"
                      parameters:
                        type: object
                        description: "算法参数原样:schemaId / schemaVersion / fields[{fieldId, kind, value}](u64 / u128 / i128 为十进制字符串)"
                      maxEvidenceBytes:
                        type: integer
                        description: "证据原文字节上限"
                      reference:
                        type:
                          - object
                          - "null"
                        description: "同一政策版本上一轮生效价 {policyVersion, priceAtoms};新版本首轮为 null"
                        properties:
                          policyVersion:
                            type: string
                          priceAtoms:
                            type: string
                      threshold:
                        type:
                          - integer
                          - "null"
                        description: "报告者集合门槛(一轮至少几份报告);集合不存在为 null"
                      reporters:
                        type: array
                        description: "集合成员(升序):地址、最近一次被接受的序号(当前集合 epoch,没有为 \"0\")、绑定的来源与来源家族"
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            sequence:
                              type: string
                            sources:
                              type: array
                              items:
                                type: object
                                properties:
                                  sourceId:
                                    type: string
                                  sourceFamily:
                                    type: string
                      marketDex:
                        type: integer
                        description: Dex the market belongs to (its dex authority issues GovOp 14)
                      oracleStale:
                        type: boolean
                        description: Ledger oracle-stale flag of the market
                      feedOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: Owner of the policy feed
                      feedDex:
                        type:
                          - integer
                          - "null"
                      setOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: "Owner of the reporter set; null when the set is not configured"
                      setDex:
                        type:
                          - integer
                          - "null"
        "404":
          description: "市场不存在或没有报价政策"
        "503":
          description: "节点未启用安全profile"
