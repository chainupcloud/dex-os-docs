  /v1/site:
    get:
      tags:
        - Exchange
      summary: Homepage for this entry
      description: |-
        Homepage content and brand for this entry domain (from `Host`, or `X-Forwarded-Host` behind trusted proxies). Any query parameter: 400 `GatewayBadRequest`.

        - `source`: `tenant` or `default`; `defaultLayer`: `image` (built-in) or `platform`; `sha` = SHA-256 of `content`.
        - `ETag` = SHA-256 of the body; a matching `If-None-Match` returns 304.
        - A published tenant homepage that fails re-check or cannot be read yet returns 503 `GatewayUnavailable`, never the default.
      operationId: v1_site
      responses:
        "200":
          description: The homepage
          headers:
            ETag:
              schema:
                type: string
              description: "\"<sha256 of the body>\""
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                required:
                  - source
                  - defaultLayer
                  - version
                  - sha
                  - schemaVersion
                  - content
                  - mediaOrigins
                properties:
                  source:
                    type: string
                    enum:
                      - tenant
                      - default
                  defaultLayer:
                    type: string
                    enum:
                      - image
                      - platform
                  version:
                    type:
                      - integer
                      - "null"
                  sha:
                    type: string
                    description: "SHA-256 of `content` (lowercase hex)"
                  schemaVersion:
                    type: integer
                  content:
                    type: object
                    description: Homepage content, schema v1
                  mediaOrigins:
                    type: array
                    items:
                      type: string
        "304":
          description: "Not modified (`If-None-Match` matched the current `ETag`)"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/site/preview-parents:
    get:
      tags:
        - Exchange
      summary: Who may frame the console preview
      description: "Origins that may frame the console preview `https://<site domain>/app/preview/` (`parents`, same list as its `Content-Security-Policy: frame-ancestors`; empty = none) and allowed media origins (`mediaOrigins`, as in `/v1/site`). The Host header selects the tenant; any query parameter returns 400 `GatewayBadRequest`. Sent with `Cache-Control: no-store`; counts against the per-IP rate limit."
      operationId: v1_site_preview_parents
      responses:
        "200":
          description: The console origins and media origins
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - parents
                  - mediaOrigins
                properties:
                  parents:
                    type: array
                    items:
                      type: string
                    description: "Serialized origins (`https://host[:port]`; `http` only on loopback), matched as strings against `?parent=`"
                  mediaOrigins:
                    type: array
                    items:
                      type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
components:
  headers:
    x-dexos-seq:
      schema:
        type: integer
      description: "Sequence number the response was served at; on a write receipt, the write's commit sequence number"
    ratelimit:
      schema:
        type: string
      description: "Per-IP budget state on every `/v1/*` response, e.g. `limit=1200, remaining=1187, reset=42`"
    ratelimit-policy:
      schema:
        type: string
      description: "Per-IP weight budget per fixed 60 s window, e.g. `1200;w=60` (operator-set, default 1200)"
    x-ratelimit-account:
      schema:
        type: string
      description: "Per-account budget (keyed by the main wallet of the account acted on), e.g. `limit=1200, remaining=1197, reset=42`; only on writes that passed the signature pre-check"
    retry-after:
      schema:
        type: integer
      description: "On 429: seconds until the window resets"
  parameters:
    MinSeq:
      name: x-dexos-min-seq
      in: header
      required: false
      schema:
        type: integer
      description: "Read-your-writes: a write's `x-dexos-seq`, sent only on a read after that write; a lagging replica answers 412. Not for market-data polling or `/trades` / `/candles` (the projection advances on its own)"
    MarketKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - perp
          - spot
      description: "Market type for `symbol`; required when a perp and a spot market share the symbol, else 400 `GatewayBadRequest` (`details.rule = ambiguous_symbol`, choices in `details.kinds`)"
  responses:
    BadRequest:
      description: "Malformed request (`GatewayBadRequest`, num 10400); on history reads, an `upper` beyond this replica's complete history is `GatewayHistoryIncomplete`: retry later"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Unknown symbol, never-deposited address or no such order (`GatewayNotFound`, num 10404; `details` says which)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ReplicaBehind:
      description: "Replica behind `x-dexos-min-seq` (`GatewayReplicaBehind`, num 10412); `details.source`: ledger (switch replica) or projection (wait for it)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: "Read model not ready / analytics unavailable (`GatewayUnavailable`, num 10503)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Account:
      type: object
      required:
        - epoch
        - asOfSeq
        - token
        - collateral
        - equity
        - marginUsed
        - maintenanceMargin
        - openOrderMargin
        - availableToTrade
        - availableToWithdraw
        - balances
        - groups
        - feeTier
        - takerFee
        - makerFee
        - fees
        - positionsCount
        - ordersCount
        - leverage
        - nonce
        - ts
        - crossEquity
        - crossMarginUsed
        - crossMaintenanceMargin
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address; lower-case in responses, case-insensitive in requests"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Replaces `address` / `subaccount` when the request addressed a vault (`vault=<id>`)"
        token:
          type: string
          enum:
            - USDC
          description: "Settlement token of the top-level totals, which cover the USDC group only; an account holding other settlement tokens should read `groups[]`"
        collateral:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "USDC collateral (USDC group only; see `groups[]`)"
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Total equity, USDC: `crossEquity` + Σ `isolatedEquity` of USDC-settled isolated positions"
        marginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Initial margin in use (IMR), cross + isolated"
        maintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Maintenance margin (MMR), cross + isolated"
        crossEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Cross net collateral, USDC: cash + cross positions at mark + accrued funding; excludes isolated positions"
        crossMarginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Initial margin of the cross positions
        crossMaintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Maintenance margin of cross positions; cross is liquidatable when `crossEquity` falls below it"
        openOrderMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Initial margin reserved by resting non-reduce-only orders
        availableToTrade:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Free cross margin for new orders (= `availableToWithdraw`): max(0, `crossEquity` − `crossMarginUsed` − open-order margin − spot holds); open-order margin per market = larger side net of position, isolated included"
        availableToWithdraw:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Same as `availableToTrade`; isolated margin must first be moved out with `POST /v1/account/isolated-margin`"
        balances:
          type: array
          items:
            "$ref": "#/components/schemas/Balance"
        groups:
          type: array
          description: "Per collateral group (one per settlement token); authoritative for accounts holding settlement tokens other than USDC"
          items:
            type: object
            properties:
              token:
                type: string
                description: Settlement token symbol
              collateral:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Cash balance of this token
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Group cross net collateral, incl. unrealised PnL of cross positions; isolated positions are in `isolatedEquity`"
              imr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Initial margin requirement
              mmr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Maintenance margin requirement
              openOrderMargin:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Initial margin reserved by resting orders in this group
              withdrawable:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Withdrawable from this group
              isolatedEquity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ equity of isolated positions settled in this token (bag cash + position at mark + accrued funding)"
            required:
              - token
              - collateral
              - equity
              - imr
              - mmr
              - openOrderMargin
              - withdrawable
              - isolatedEquity
        feeTier:
          type:
            - integer
            - "null"
        takerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Effective rate of the account's fee tier, decimal; for markets with market-level rates see `/v1/markets.fees`"
        makerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fees:
          type: object
          required:
            - builder
            - markets
          description: "Rates actually charged to this account, as the matching engine bills them; only this account's own result"
          properties:
            builder:
              type:
                - integer
                - "null"
              description: "Builder the rates are computed for (`?builder=` or the entry domain's); null = no builder"
            markets:
              type: array
              items:
                type: object
                required:
                  - symbol
                  - maker
                  - taker
                  - source
                properties:
                  symbol:
                    type: string
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
                  maker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - builder
                      - deployer
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Total maker rate = protocol + builder (negative = rebate)"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Protocol maker rate
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Maker-side deployer fee, paid to the dex fee recipient
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Builder maker rate after the market cap (negative = subsidy; 0 on spot)"
                  taker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - dex
                      - deployer
                      - builder
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Total taker rate = protocol + dex + deployer + builder"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Protocol taker rate
                      dex:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Dex surcharge = protocol taker × the dex fee scale"
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Market deployer share (taker side only)
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Builder taker rate after the market cap
                  source:
                    type: object
                    required:
                      - protocol
                      - deployer
                      - builder
                    properties:
                      protocol:
                        type: string
                        enum:
                          - builderAddress
                          - builder
                          - marketBuilderAddress
                          - marketBuilder
                          - marketMaker
                          - market
                          - default
                          - tier
                          - base
                        description: "Layer of the protocol rate: `builderAddress` (builder × account / main account), `builder`, `marketBuilderAddress` / `marketBuilder` (via the dex's builder), `marketMaker` (old), `market` (old), `default`, `tier`, `base`"
                      deployer:
                        type: string
                        enum:
                          - address
                          - addressDex
                          - market
                          - marketMaker
                        description: "Origin of the taker deployer fee: `address` / `addressDex` = account or main-account row for this market / dex (replaces `deployer_ppm`, `taker.dex` 0); `market` = `deployer_ppm` + dex surcharge; `marketMaker` = waived"
                      builder:
                        type: string
                        enum:
                          - account_market
                          - account
                          - ownerMarket
                          - owner
                          - market
                          - default
                          - unset
                          - none
                          - legacy
                          - marketMaker
                        description: "Builder-leg layer: account×market > account > `ownerMarket` > `owner` (main account rows) > builder market > builder default > unset; `none` = no builder; `legacy` = market `builder_ppm`; `marketMaker` = waived"
        positionsCount:
          type: integer
        ordersCount:
          type: integer
        leverage:
          type: array
          description: "Markets with a custom leverage or where the account is isolated (without a custom leverage, the market's base leverage)"
          items:
            type: object
            properties:
              symbol:
                type: string
                description: "Market symbol: `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
                examples:
                  - BTC-USD
              kind:
                type: string
                enum:
                  - perp
                  - spot
                description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
              leverage:
                type: integer
              type:
                type: string
                enum:
                  - cross
                  - isolated
                description: "Margin mode here: `isolated` if the account holds an isolated bag or the market is isolated-only (`marginMode` `noCross` / `strictIsolated`)"
            required:
              - symbol
              - leverage
              - type
        nonce:
          type: integer
          description: "Next nonce in the account scope (= `GET /v1/account/nonce`)"
        ts:
          type: integer
          format: int64
          description: Unix ms
        epoch:
          type: string
          description: "Ledger epoch of the risk view; changes only on node restart / reset"
        asOfSeq:
          type: integer
          format: uint64
          description: "Log position of the risk fields (`equity`, margins, `groups`); all come from this one consistent view"
    AccountPnl:
      type: object
      description: "Perpetual PnL per risk group at one watermark, decimal strings in the group's collateral token; `equity = netInflow + spotTransfer + totalPnl` holds exactly. Spot trades and spot fees count as `spotTransfer`, not PnL"
      required:
        - epoch
        - asOfSeq
        - groups
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address (lower-case in responses, case-insensitive in requests)
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request named a vault (`vault=<id>`)"
        epoch:
          type: string
          description: Ledger epoch
        asOfSeq:
          type: integer
          format: uint64
          description: "Log position the snapshot covers; balances, positions and ledger totals are as of it"
        groups:
          type: array
          items:
            type: object
            required:
              - token
              - equity
              - netInflow
              - realizedPnl
              - unrealizedPnl
              - accruedFunding
              - settledFunding
              - fees
              - otherPnl
              - spotTransfer
              - totalPnl
            properties:
              token:
                type: string
                description: Collateral token symbol of the risk group
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Group equity: cross net collateral + equity of isolated positions settled in this token"
              netInflow:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ external entries: deposits, withdrawals, transfers, vault flows"
              realizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ position consideration (trades, liquidations, ADL, settlement) + Σ cost basis of open positions"
              unrealizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ(position value at mark price − cost basis)"
              accruedFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Funding accrued, not yet applied to the balance (settled when the position is touched)
              settledFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ funding applied to the balance (negative = paid)"
              fees:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ perpetual trading fees: taker / maker fees, maker rebates, builder and deployer fees (negative = paid)"
              otherPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ other non-external entries: liquidation fees, bad-debt cover, insurance-fund flows, fee revenue"
              spotTransfer:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ spot-trade consideration and spot fees in this token; a transfer between the perp and spot sides, not PnL"
              totalPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Perpetual PnL since account opening: `realizedPnl + unrealizedPnl + accruedFunding + settledFunding + fees + otherPnl` = `equity − netInflow − spotTransfer`"
    Agent:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address (lower-case in responses, case-insensitive in requests)
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "null = no expiry"
        expired:
          type: boolean
        scope:
          type: string
          enum:
            - account
            - owner
          description: "`account` = legacy per-account approval; `owner` = owner-level approval covering the subaccounts in `subaccountMask`"
        subaccountMask:
          type: string
          description: "Owner-level only: decimal u64 bitmap, bit i = subaccount i (may include subaccounts not yet created)"
        subaccounts:
          type: array
          items:
            type: integer
          description: "Owner-level only: subaccount indexes set in `subaccountMask`"
        executable:
          type: boolean
          description: "true = the ledger accepts this grant now: current policy epoch, `active`, inside `validFrom`..`validUntil` and, for a `dex` grant, the current owner epoch. Inactive grants stay listed as false"
        dex:
          type:
            - integer
            - "null"
          description: "Dex of a dex-scoped management grant (signs on the `management` nonce lane for that dex only); null for account-scoped trading grants"
    AgentGrant:
      type: object
      required:
        - address
        - label
        - validUntil
        - expired
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet of the represented account; for a vault, the manager's main wallet"
        subaccount:
          type: integer
          description: "Subaccount index under `address`; absent for a vault or a dex management grant"
        vault:
          type: integer
          description: "Vault id when the grant is on a vault's main account"
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "`null` = no expiry"
        expired:
          type: boolean
          description: "Listed even when expired; renew it (it was not revoked)"
        executable:
          type: boolean
          description: "`true` = the ledger would accept the grant now: current policy epoch, `active`, within `validFrom`..`validUntil` (dex grants: current owner epoch). Commands can still fail on action, scope or limits"
        dex:
          type:
            - integer
            - "null"
          description: "Dex of a dex-scoped management grant: signs `management` lane commands for that dex only. `null` for account trading grants"
    Balance:
      type: object
      properties:
        token:
          type: string
          description: "Token symbol (`USDC`, …)"
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        hold:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Held by resting spot orders
        available:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Available balance: `amount − hold`"
      required:
        - token
        - amount
        - hold
        - available
    Book:
      type: object
      required:
        - symbol
        - depth
        - bids
        - asks
        - seq
        - ts
      properties:
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); merchant dex markets are `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        depth:
          type: integer
          description: "Levels per side requested (REST or WebSocket `depth`)"
        bids:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: Price descending
        asks:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: Price ascending
        seq:
          type: integer
          format: uint64
          description: State sequence this snapshot was taken at
        ts:
          type: integer
          format: int64
          description: Unix ms
        aggTicks:
          type: integer
          description: "Ticks per price bucket; present only when aggregation was requested. Levels are then bucket boundaries over the whole book"
    BookLevel:
      type: array
      prefixItems:
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Price
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Size
      minItems: 2
      maxItems: 2
      description: "One price level: `[price, size]`"
    BuilderSummary:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address, lower-case
        startTime:
          type: integer
          format: int64
          description: Unix ms
        endTime:
          type: integer
          format: int64
          description: Unix ms
        entries:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
              amount:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Decimal string
        note:
          type: string
    BuilderView:
      type: object
      required:
        - builderId
        - status
        - catalog
        - categories
        - fees
        - asOfSeq
      properties:
        builderId:
          type: integer
          format: uint32
        status:
          type: string
          enum:
            - active
            - disabled
        catalog:
          type: object
          required:
            - version
            - markets
          properties:
            version:
              type: integer
              format: uint64
              description: "Catalog version (0 = never written)"
            markets:
              type: array
              description: "`listed` and `closeOnly` markets, by `sort` then symbol; hidden markets and those without symbol metadata are omitted"
              items:
                type: object
                required:
                  - symbol
                  - display
                  - status
                  - sort
                  - tags
                properties:
                  symbol:
                    type: string
                    description: "Full symbol (`<dex code>:BASE-QUOTE` on a merchant dex); the only key for trading, cancelling or closing"
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "`symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
                  display:
                    type: string
                    description: "Name to show: the builder's custom display name if set, else the symbol without the `<dex code>:` prefix. Unique per `kind` (case-insensitive) except between two prefix-stripped fallbacks; never map it back to a symbol"
                    examples:
                      - BTC-USD
                  status:
                    type: string
                    enum:
                      - listed
                      - closeOnly
                    description: "`closeOnly` = reduce-only orders only (source being switched or unshared); offer close only"
                  sort:
                    type: integer
                    format: int32
                  tags:
                    type: array
                    items:
                      type: string
                    description: "Category codes in display order (empty if none); names in `categories`"
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/CategoryView"
          description: "The builder's categories plus the platform templates its shown rows use, by `sort` then code; builder front ends use these, not `/v1/markets[].tags`"
        fees:
          type: object
          required:
            - default
            - markets
          description: "Builder front-end fee rates (fraction of notional); `default` (null = unset = 0) applies where no `markets` row exists. Charged only if builder fees are enabled; capped per market by `/v1/markets[].fees.builderRate`"
          properties:
            default:
              type:
                - object
                - "null"
              required:
                - takerRate
                - makerRate
              properties:
                takerRate:
                  type: string
                  pattern: "^[0-9]+(\\.[0-9]+)?$"
                  description: Decimal string (fraction of notional)
                makerRate:
                  type: string
                  pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                  description: "Fraction of notional; negative = a builder-paid subsidy to the resting side (perps only), capped per fill at the taker's pro-rated net protocol fee minus the maker's protocol rebate"
            markets:
              type: array
              description: "Per-market overrides, ascending by symbol; markets without symbol metadata are omitted"
              items:
                type: object
                required:
                  - symbol
                  - takerRate
                  - makerRate
                properties:
                  symbol:
                    type: string
                    description: Full market symbol
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "`symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
                  takerRate:
                    type: string
                    pattern: "^[0-9]+(\\.[0-9]+)?$"
                    description: Decimal string (fraction of notional)
                  makerRate:
                    type: string
                    pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                    description: "Fraction of notional; negative = a builder-paid subsidy to the resting side (perps only), capped per fill at the taker's pro-rated net protocol fee minus the maker's protocol rebate"
        asOfSeq:
          type: integer
          format: uint64
          description: Log position this read reflects (upper bound)
        dex:
          type:
            - integer
            - "null"
          minimum: 1
          description: "The entry's merchant dex when every listed or close-only catalog market belongs to one (hidden ignored), else null; white-label front ends read the user's balance under it by default"
        market:
          type:
            - object
            - "null"
          description: "Only with `?market=`: the asked market's catalog row, or null when the market is not in this builder's catalog. `hidden` = not listed but may be deep-linked and traded; null = a front end should show it read-only"
          required:
            - signingMarketId
            - status
          properties:
            signingMarketId:
              type: integer
              format: uint16
            status:
              type: string
              enum:
                - listed
                - hidden
                - closeOnly
    PlatformEntry:
      type: object
      required:
        - builderId
        - domain
        - homeDex
      description: "`GET /v1/builder` without `?builder=` on an entry domain with no builder: the platform's own entry (markets via `/v1/markets`)"
      properties:
        builderId:
          type: "null"
        domain:
          type: string
          description: Entry domain the request resolved to
        homeDex:
          type:
            - string
            - "null"
          description: "Short name of the home dex configured in dex-admin; a front end may show its markets without the `<code>:` prefix. Null when none is configured. Display only"
    Candle:
      type: object
      description: OHLCV candle
      properties:
        t:
          type: integer
          format: int64
          description: Open time
        T:
          type: integer
          format: int64
          description: "Close time, exclusive (= next candle's open; `1M` / `1Y` follow calendar months / years)"
        i:
          type: string
        o:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        h:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        l:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        c:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        v:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Volume in base units
    CategoryView:
      type: object
      required:
        - code
        - names
        - sort
      properties:
        code:
          type: string
          pattern: "^[a-z0-9-]{1,24}$"
        names:
          type: object
          additionalProperties:
            type: string
          description: "Display names by language tag (`en`, `zh-CN`, …); language fallback is up to the front end"
        sort:
          type: integer
          format: int32
          description: "Display order, ascending; ties by code"
      description: "A category definition. A layer's `categories` are its own definitions plus the platform templates it references; an own definition overrides a template with the same code."
    Dex:
      type: object
      properties:
        dex:
          type: integer
        code:
          type:
            - string
            - "null"
          description: "Ledger short name, the prefix of the dex's market symbols (`<code>:BASE-QUOTE`): 2–8 upper-case letters and digits, `MAIN` reserved. Null only while the ledger read is unavailable"
        owner:
          type: string
        collateralToken:
          type: integer
        insuranceAccount:
          type: integer
        feeRecipient:
          type: integer
        status:
          type: string
          enum:
            - Active
            - Disabled
        markets:
          type: array
          items:
            type: integer
          description: Perpetual markets of this dex
        spotMarkets:
          type: array
          items:
            type: integer
          description: Spot markets of this dex
        insurance:
          type: object
          description: "Insurance fund of this dex (the platform dex's fund included)"
          required:
            - balance
            - equity
            - positions
            - principal
            - minAmount
            - withdrawDelayMs
            - pendingWithdraw
            - reduceOnly
            - uncoveredLoss
          properties:
            balance:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Fund cash; negative while it holds taken-over positions"
            equity:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Cash + taken-over positions at mark; the reduce-only minimum and withdrawals use this"
            positions:
              type: array
              description: Positions taken over from liquidated accounts, not yet unwound
              items:
                type: object
                required:
                  - market
                  - lots
                  - costBasis
                properties:
                  market:
                    type: integer
                  lots:
                    type: integer
                    format: int64
                    description: "Signed size; negative = short"
                  costBasis:
                    type: string
                    pattern: "^-?[0-9]+$"
                    description: "Signed entry cost, collateral token's smallest unit"
            principal:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Withdrawable principal: funding minus withdrawals (liquidation fees excluded)"
            minAmount:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Platform-set minimum; below it every perp market of the dex is reduce-only"
            withdrawDelayMs:
              type: integer
              format: uint64
              description: Timelock between requesting and executing a withdrawal
            pendingWithdraw:
              type:
                - object
                - "null"
              properties:
                to:
                  type: integer
                amount:
                  type: string
                  pattern: "^-?[0-9]+$"
                  description: "Integer string, collateral token's smallest unit"
                unlockMs:
                  type: integer
                  format: uint64
            reduceOnly:
              type: boolean
              description: A perp market of the dex is reduce-only because the fund is below its minimum
            uncoveredLoss:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Shortfall on this dex's markets the fund could not cover"
      additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - num
            - message
          properties:
            code:
              type: string
              description: "Stable code: `Gateway*` (gateway), a `CoreError` name (execution layer, e.g. `InsufficientMargin`) or a snake_case reason listed under the endpoint (e.g. `unknown_account`); see `x-error-codes`"
            num:
              type: integer
              description: "Stable numeric code: 1xxxx = 10000 + HTTP status (gateway); 2xxxx = 20000 + codec error code (execution layer)"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: "Context, e.g. `symbol` / `address`; on 412, which watermark is behind and by how much. `cause`: original text of an internal failure, possibly not English; `message` is always English"
      description: The shape of every non-2xx response
    Event:
      type: object
      properties:
        seq:
          type: integer
          format: uint64
          description: "Log sequence number, same axis as the receipt's `seq` and the `x-dexos-seq` header"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "Event name (`Fill` / `OrderAccepted` / `OrderCanceled` / `Deposited` / `FundingTickSettled` …)"
        data:
          type: object
          additionalProperties: true
          description: "Depends on `kind`; events with a `market` also carry its `symbol`"
    EventsPage:
      type: object
      properties:
        epoch:
          type: string
        completeSeq:
          type: integer
          format: uint64
          description: "Log sequence number, same axis as the receipt's `seq` and the `x-dexos-seq` header"
        upper:
          type: string
        events:
          type: array
          items:
            "$ref": "#/components/schemas/Event"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
        finality:
          type: string
    Exchange:
      description: "EIP-712 signing domain and the full token table (`/config` returns a filtered one), one `deposit.tokens` row per custody asset. Token 0 is always USDC, 6 decimals; `symbol` / `decimals` are null without metadata"
      properties:
        chainId:
          type: integer
          description: Chain id of the EIP-712 signing domain
        conventions:
          type: object
          additionalProperties:
            type: string
        deposit:
          type: object
          properties:
            tokens:
              type: array
              items:
                type: object
                properties:
                  token:
                    type: integer
                  assetId:
                    type: integer
                    description: "Custody asset id; `token` is the ledger token it credits"
                  erc20:
                    type:
                      - string
                      - "null"
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "Token contract as an EVM address; null if not expressible as one"
                  symbol:
                    type:
                      - string
                      - "null"
                  decimals:
                    type:
                      - integer
                      - "null"
                  extraWeiDecimals:
                    type:
                      - integer
                      - "null"
                    description: "Legacy field; null if the decimal difference does not fit in u8. Use `extraDecimals`"
                  finalized:
                    type: boolean
                  homeChain:
                    type: integer
                    format: uint64
                    minimum: 0
                    maximum: 18446744073709552000
                  contract:
                    type: string
                    pattern: "^(0x)?[0-9a-fA-F]{64}$"
                    description: Full token contract, 32-byte hex (EVM addresses left-padded with zeros)
                  extraDecimals:
                    type: integer
                    description: Signed decimal difference between the on-chain and ledger token, -6..38
                  withdrawDests:
                    type: array
                    items:
                      type: integer
                      format: uint64
                      minimum: 0
                      maximum: 18446744073709552000
                    description: "Allowed withdrawal chains besides the home chain; listing does not imply an enabled relay route"
                  origin:
                    type: string
                    enum:
                      - legacy
                      - v2
            protocol:
              type: string
              const: v2
            routing:
              type: string
              const: /v1/exchange
            ledgerEpoch:
              type: string
          required:
            - protocol
            - routing
            - ledgerEpoch
            - tokens
        docs:
          type: string
        domain:
          type: object
          properties:
            name:
              type: string
              const: dex-os
            version:
              type: string
            verifyingContract:
              type: string
              pattern: "^0x[0-9a-f]{40}$"
              description: "EVM address; lower-case in responses, case-insensitive in requests"
        finalityMode:
          type: string
          description: "Compatibility only; not the deposit finality policy"
        fundingTickSec:
          type: integer
          description: "Funding period in seconds, the same for every perpetual market (same as `/config`); spot has no funding. Never null: until the node knows it, the whole response is 503 `GatewayUnavailable`; retry"
          minimum: 1
        serverTime:
          type: integer
          format: int64
          description: Unix ms
        vault:
          type: object
          description: "Vault economics the execution layer enforces (not in `/config`); read them here, never hard-code"
          properties:
            creationFee:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Vault creation fee charged to the creator, USDC decimal string; on top of any seed deposit"
            minDeposit:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Minimum for every vault deposit, claim and creation seed, USDC decimal string; smaller amounts fail with `VaultDepositTooSmall`"
          required:
            - creationFee
            - minDeposit
        version:
          type: object
          properties:
            pkg:
              type: string
            snapshotVer:
              type: integer
            codecVer:
              type: integer
            buildId:
              type: string
            api:
              type: string
              const: v1
      required:
        - chainId
        - domain
        - deposit
        - serverTime
        - fundingTickSec
        - vault
        - version
        - conventions
        - docs
      type: object
    Fill:
      type: object
      required:
        - id
        - symbol
        - side
        - role
        - price
        - size
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Event id `<seq>-<sub>-<idx>`; identical to the backfill cursor and the WebSocket frame `id`"
        orderId:
          type:
            - string
            - "null"
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); merchant dex markets are `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        side:
          type: string
          enum:
            - buy
            - sell
        role:
          type: string
          enum:
            - taker
            - maker
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fee:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "This side's fee in `feeToken` units; negative = maker rebate. Matches the `taker_fee` / `maker_fee` entry in `/v1/account/ledger`"
        feeToken:
          type: string
          description: "Token the fee was charged in. Spot: the token this side received (buyer → base, seller → quote). Perp: the market's settlement token (its dex's settle token)"
          examples:
            - USDC
            - ETH
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: Unix ms
        seq:
          type: integer
          format: uint64
          description: "Log sequence number (same axis as the receipt's `seq` and `x-dexos-seq`)"
    FillsPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address (lower-case in responses, case-insensitive in requests)
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request named a vault (`vault=<id>`)"
        epoch:
          type: string
        upper:
          type: string
          description: "Fixed upper bound of this walk; pass it back unchanged on later pages"
        fills:
          type: array
          items:
            "$ref": "#/components/schemas/Fill"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
          description: "**Only `false` means you have everything**"
        finality:
          type: string
    FundingPoint:
      type: object
      properties:
        ts:
          type: integer
          format: int64
          description: Unix ms
        seq:
          type: integer
          format: uint64
          description: "Log sequence number, same axis as the receipt's `seq` and the `x-dexos-seq` header"
        rate:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Rate applied at this settlement (decimal)
        index:
          type: string
          description: Cumulative funding index
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Event id `<seq>-<sub>-<idx>`; same as the backfill cursor and the `id` in WebSocket frames"
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number; same axis as the receipt's `seq` and the `x-dexos-seq` header"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "Economic kind: `deposit` / `withdraw` / `taker_fee` / `maker_fee` / `funding` / `transfer_out` / `transfer_in` / `liquidation` / `builder_fee` …"
          enum:
            - deposit
            - withdrawal
            - send_asset
            - transfer_in
            - transfer_out
            - trade
            - liquidation_trade
            - adl
            - spot_trade
            - taker_fee
            - maker_fee
            - maker_rebate
            - fee_revenue
            - rebate_paid
            - deployer_fee
            - deployer_fee_revenue
            - builder_fee
            - builder_fee_revenue
            - liquidation_fee
            - insurance_fund
            - bad_debt_cover
            - funding
            - settlement
            - vault_deposit
            - vault_redeem
            - vault_profit_share
            - vault_refund
            - vault_allocate
            - vault_retrieve
            - vault_fee
        token:
          type: string
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Signed, in token units
        symbol:
          type:
            - string
            - "null"
        signingMarketId:
          type:
            - integer
            - "null"
          description: "Market id (`signingMarketId` in `/v1/markets`); distinguishes a perp and a spot market sharing a symbol"
        order:
          type:
            - integer
            - "null"
          format: uint64
          description: "This account's order for trade / fee legs"
        counterOrder:
          type:
            - integer
            - "null"
          format: uint64
          description: "The other side's order for trade legs"
        reference:
          type:
            - string
            - "null"
          description: Escrow / outbox id for transfers and withdrawals
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: Block time of the execution, Unix ms
        outboxStatus:
          type: string
          enum:
            - pending
            - acked
          description: "`send_asset` only: whether the outbox entry is acknowledged"
        ackedAt:
          type: string
          description: "`send_asset` only: event id of the acknowledgement"
        deposit:
          type:
            - object
            - "null"
          description: "`deposit` only: the on-chain source of the credit, to confirm a specific deposit was credited; `null` for an operator or test credit; absent on other kinds"
          required:
            - chain
            - depositId
            - source
          properties:
            chain:
              type: string
              description: Chain id of the deposit, decimal string
            depositId:
              type: string
              description: Deposit dedup key, 0x-prefixed 32-byte hex (keccak of chain and source)
            source:
              oneOf:
                - type: object
                  required:
                    - kind
                    - txId
                    - indexInTx
                  properties:
                    kind:
                      type: string
                      enum:
                        - tx
                    txId:
                      type: string
                      description: Source transaction id, 0x-prefixed hex (tx hash on EVM chains)
                    indexInTx:
                      type: integer
                      description: "Index in the transaction receipt's `logs` array (not the block-wide log index)"
                - type: object
                  required:
                    - kind
                    - sourceDomain
                    - nonce
                  properties:
                    kind:
                      type: string
                      enum:
                        - cctp
                    sourceDomain:
                      type: integer
                      description: CCTP source domain
                    nonce:
                      type: string
                      description: CCTP nonce, 0x-prefixed 32-byte hex
        vault:
          type:
            - integer
            - "null"
          description: "`vault_*` only: the vault money moves with (the addressed vault when reading with `vault=`, else the counterparty's vault); `null` if the counterparty is not a vault (the creator's `vault_fee`). Absent otherwise"
    LedgerPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address, lower-case
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Replaces `address` / `subaccount` when the request named a `vault`"
        epoch:
          type: string
        upper:
          type: string
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/LedgerEntry"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
    Market:
      type: object
      required:
        - symbol
        - signingMarketId
        - kind
        - status
        - priceDecimals
        - sizeDecimals
        - tickSize
        - lotSize
        - minNotional
        - maxLeverage
        - initialMarginFraction
        - maintenanceMarginFraction
        - marginMode
        - strictIsolated
        - quotePerTickLot
        - baseToken
        - quoteToken
        - basePerLot
        - settleToken
        - lastPrice
        - oraclePrice
        - markPrice
        - bestBid
        - bestAsk
        - fundingRate
        - fundingIndex
        - lastFundingMs
        - openInterest
        - openInterestCap
        - dex
        - dexCode
        - fees
        - tags
        - priceSource
        - aggTicks
        - subticksPerTick
        - tradingRulesVersion
        - tickChangePending
      properties:
        symbol:
          type:
            - string
            - "null"
          description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive; null while the market has no catalog name (address it by `signingMarketId`)"
          examples:
            - BTC-USD
        signingMarketId:
          type: integer
          description: "**Signing only.** The `market` field of the EIP-712 structs; endpoints use `symbol`"
        kind:
          type: string
          enum:
            - perp
            - spot
        status:
          type: string
          description: "`Active` / `Paused` / `CancelOnly` / `PostOnly` / `FinalSettlement` / `Halted` / `Delisted` / `ReduceOnly` / `OracleStale`. `ReduceOnly` and `OracleStale` (no valid oracle price) accept reduce-only orders only"
        priceDecimals:
          type: integer
        sizeDecimals:
          type: integer
        tickSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price increment = `subticksPerTick` × 10^-`priceDecimals`; signed prices and `aggTicks` still use 10^-`priceDecimals` units"
        lotSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Size increment = 10^-`sizeDecimals`"
        minNotional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Minimum notional (USDC); `0` = no minimum"
        maxLeverage:
          type:
            - integer
            - "null"
          description: "`1e6 / initialMarginPpm`; `null` for spot"
        initialMarginFraction:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        maintenanceMarginFraction:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "`cross` (deployer mode `normal`) or `isolated` (`noCross` / `strictIsolated`, told apart by `strictIsolated`)"
        strictIsolated:
          type: boolean
          description: "Isolated, and leverage cannot change while a position is open. `isolated` + `false` = `noCross`; `isolated` + `true` = `strictIsolated`"
        quotePerTickLot:
          type: string
          pattern: "^[0-9]+$"
          description: "Quote atomic units per tick × lot (integer string): notional = ticks × lots × this"
        baseToken:
          type:
            - integer
            - "null"
          description: "Spot only: base token id (the `token` in `deposit.tokens[]` of `GET /v1/exchange`); `null` for perps"
        quoteToken:
          type:
            - integer
            - "null"
          description: "Spot only: quote token id; `null` for perps"
        basePerLot:
          type:
            - string
            - "null"
          pattern: "^[0-9]+$"
          description: "Spot only: base atomic units per lot (integer string); `null` for perps"
        settleToken:
          type: object
          description: "Settlement token: the dex collateral token for perps, the quote token for spot. `minNotional` and `openInterestCap.notional` are in its ledger units (`1e-6`)"
          required:
            - id
            - symbol
            - decimals
          properties:
            id:
              type: integer
              minimum: 0
              description: "Ledger token id (0 = USDC)"
            symbol:
              type:
                - string
                - "null"
              description: "Token symbol; `null` without metadata"
            decimals:
              type:
                - integer
                - "null"
              minimum: 0
              description: "Token decimals; `null` when unknown"
          additionalProperties: false
        lastPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        oraclePrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        markPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Hourly funding rate (`0.0001` = 0.01%); `null` for spot"
        fundingIndex:
          type:
            - string
            - "null"
        lastFundingMs:
          type:
            - integer
            - "null"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Open interest, base units
        openInterestCap:
          type:
            - object
            - "null"
          properties:
            size:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            notional:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
        dex:
          type: integer
          description: "Dex the market belongs to (every dex is registered; there is no dex 0)"
        dexCode:
          type: string
          description: "Ledger short name of the dex this market belongs to (the `code` of `/v1/dexes`): every symbol of a dex with a short name is `<dexCode>:BASE-QUOTE`. Platform markets carry the platform dex short name like any other."
        fees:
          type: object
          description: "For orders without builder attribution. `rateSource`: `market` = legacy, `default` = platform default, `tier` = genesis base rates. Account rates: `GET /v1/account`. Deployer / builder rates: added on attributed orders"
          properties:
            rateSource:
              type: string
              enum:
                - market
                - default
                - tier
            takerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string; platform default (`rateSource=default`) or genesis base rate (`tier`)"
            makerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Negative = rebate; platform default (`rateSource=default`) or genesis base rate (`tier`)"
            deployerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            deployerMakerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Deployer fee charged to the maker, decimal string
            builderRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. With the builder model on: the **cap** on each builder's own rates (`/v1/builder.fees`; unset = 0); before that: the flat rate on attributed taker fills"
            pendingDeployerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. Pending taker deployer rate, effective at `pendingEffectiveAtMs` (7 days after a raise). Cuts and a market's first rate before any trading apply at once; a change raising neither cancels it. `null` = none"
            pendingDeployerMakerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string; maker leg of `pendingDeployerRate`; `null` = nothing pending"
            pendingEffectiveAtMs:
              type:
                - integer
                - "null"
              format: int64
              description: "Certified Unix ms when `pendingDeployerRate` takes effect; `null` = nothing pending"
        platformLocked:
          type: boolean
          description: "`true` while the Council locks this merchant market: the dex owner and its API wallets cannot change its status. Always `false` on a Council-owned dex"
        tags:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9-]{1,24}$"
          maxItems: 8
          description: "Category codes of the market's dex, in set order; display names in `GET /v1/dexes/{id}` (behind a builder entry: `GET /v1/builder`). Display only"
        priceSource:
          type:
            - array
            - "null"
          items:
            type: object
            required:
              - source
              - symbol
            properties:
              source:
                type: string
                description: "Price source name (`coinbase`, `binance`, `kraken`, `okx`, `hyperliquid`, `hyperliquid-testnet`)"
              symbol:
                type: string
                description: "The source's own ticker, used verbatim"
          maxItems: 8
          description: "Price sources bound to this perpetual; the oracle price is their median. `null` = no binding (derived from the symbol); always `null` for spot"
        aggTicks:
          type:
            - array
            - "null"
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 6
          description: "Book aggregation levels in ticks per bucket (1 tick = 10^-`priceDecimals`), ascending; the only `aggTicks` values `GET /v1/markets/{symbol}/book` and WebSocket `book` accept. `null` = raw book only"
          examples:
            -
              - 10
              - 100
              - 1000
              - 10000
              - 100000
        subticksPerTick:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: "Price increment in base price units; `tickSize` = this × 10^-`priceDecimals`"
        tradingRulesVersion:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: "Monotonic trading-rules revision: +1 when a change goes pending, +1 when its result (even a failure) is confirmed. Decimal string"
        tickChangePending:
          type: boolean
          description: "While `true`, new orders are blocked; cancels still work"
    MyVaultPosition:
      type: object
      properties:
        vault:
          type: integer
        dex:
          type:
            - integer
            - "null"
          description: "Vault's dex: `null` = protocol vault, a dex id = that dex's merchant vault. Shares sit on the address's own account either way"
        name:
          type: string
        class:
          type: string
          enum:
            - lp
            - manager
        shares:
          type: string
          pattern: "^[0-9]+$"
          description: Share units (integer, not a token amount)
        balanceShare:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Current value of the shares, USDC
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Same as `balanceShare`, USDC"
        initialEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Principal shown to the depositor, USDC
        allTimePnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "All-time PnL in USDC: `equity − initialEquity`"
        lockUntilMs:
          type: integer
        locked:
          type: boolean
        lockedShares:
          type: string
          pattern: "^[0-9]+$"
        withdrawable:
          type: object
          properties:
            ok:
              type: boolean
            reason:
              type:
                - string
                - "null"
        nextWithdrawWindow:
          type:
            - object
            - "null"
    Nonce:
      type: object
      required:
        - scope
        - nonce
      properties:
        scope:
          type: string
          enum:
            - account
            - agent
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address (lower-case in responses, case-insensitive in requests)
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request named a vault (`vault=<id>`)"
        signer:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: EVM address (lower-case in responses, case-insensitive in requests)
        nonce:
          type:
            - integer
            - "null"
          description: "Next expected nonce; null when the lane is exhausted (`exhausted: true`) or an API-wallet read matches zero or several grants"
        signingAccountId:
          type: integer
          description: "**Signing only.** Value for `accountId` in the EIP-712 struct (and `account` of the inner command on the API-wallet path). Never use it to address an endpoint; v1 addresses accounts by wallet"
        exhausted:
          type:
            - boolean
            - "null"
          description: "true = the next value would be 2^64 - 1, which is refused (`CounterExhausted`): the lane takes no more writes. On an API-wallet read, null unless one grant matches; see `grants[]`"
    Order:
      type: object
      required:
        - orderId
        - symbol
        - side
        - price
        - size
        - status
      properties:
        orderId:
          type: string
          description: Order sequence number, decimal string
        clientOrderId:
          type:
            - string
            - "null"
          description: "Optional signed client order id, 1–36 chars of `[A-Za-z0-9._:/-]`. Reusing an admitted `cid` on the account returns 409 `GatewayDuplicateClientOrderId` (concurrent races may slip). No cancel or amend by `cid`"
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` on a merchant dex (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; a perp and a spot market may share a symbol, so `symbol` + `kind` identify the market"
        side:
          type: string
          enum:
            - buy
            - sell
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        tif:
          type:
            - string
            - "null"
          enum:
            - gtc
            - ioc
            - alo
            - fok
            - null
          description: "Time in force. Pending conditional orders: the child order's. null once the order rests on the book (a resting `alo` behaves like `gtc`)"
        reduceOnly:
          type:
            - boolean
            - "null"
          description: "Reduce-only; null only if the open-order ledger has no entry for the order"
        trigger:
          type:
            - object
            - "null"
          description: "Pending conditional order (stop / take-profit, incl. position TP/SL): enters the book as a limit order (`price`, `size`, `side`, `tif`) when the oracle price crosses `price`. null for orders on the book"
          required:
            - price
            - above
            - positionTpsl
          properties:
            price:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            above:
              type: boolean
              description: "true = triggers when the oracle price is >= `price`; false = <="
            positionTpsl:
              type: boolean
              description: "Position TP/SL; cancelled automatically when the position reaches zero"
        status:
          type: string
          enum:
            - open
            - partiallyFilled
            - filled
            - canceled
            - expired
    OrderEvent:
      type: object
      description: "One order event per row; fold by `orderId` for one row per order"
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Event id `<seq>-<sub>-<idx>`; identical to the backfill cursor and the WebSocket frame `id`"
        seq:
          type: integer
          format: uint64
          description: "Log sequence number, same axis as the receipt's `seq` and the `x-dexos-seq` header"
        orderId:
          type: string
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); merchant dex markets are `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; a perp and a spot market may share a symbol, so `symbol` + `kind` identifies one market"
        event:
          type: string
          enum:
            - accepted
            - fill
            - canceled
            - expired
            - placed
            - triggered
            - rejected
            - autocanceled
            - twapPlaced
          description: "`twapPlaced` = TWAP parent placed (`size` = total, `slices` = slice count); slices are child orders reusing the parent's `orderId`, so their `accepted` / `fill` rows fold into it"
        side:
          type:
            - string
            - "null"
          enum:
            - buy
            - sell
            - null
          description: "Order side on `accepted`, `fill` (this account's side), `placed` (child side) and `twapPlaced` rows; null otherwise (see the order's earlier rows) or if the placing command is unreadable"
        source:
          type: string
          enum:
            - twap
          description: "Only on `accepted` / `fill` rows of a TWAP slice (`twap`)"
        slices:
          type: integer
          format: uint32
          description: "Number of slices; `twapPlaced` rows only"
        startMs:
          type:
            - integer
            - "null"
          format: uint64
          description: "TWAP start, Unix ms (the placing command's `nowMs`; first slice due then); `twapPlaced` rows only; null when the placing command cannot be read"
        durationMs:
          type:
            - integer
            - "null"
          format: uint64
          description: "Planned run time = `slices` × slice interval (ms); `twapPlaced` rows only, null when the placing command cannot be read. No finish event: a TWAP without a `canceled` row ends after `startMs + durationMs`"
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: "Ledger time of the event's block, Unix ms (same clock as fill `ts`); null when unknown (no earlier block or a history gap)"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        resting:
          type: boolean
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        role:
          type: string
          enum:
            - taker
            - maker
        fillId:
          type: string
    PendingWithdrawalV2:
      type: object
      additionalProperties: false
      properties:
        outboxId:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
        token:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
        amount:
          type: string
          pattern: "^[0-9]+$"
          description: "Amount in ledger units; display only, never for the on-chain payout"
        amountWei:
          type: string
          pattern: "^[0-9]+$"
          description: "Amount in on-chain atomic units, from the withdrawal record; used for payout and reconciliation"
        recipient:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{40}$"
          description: "Last 20 bytes of `recipientBytes32`"
        homeChain:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
          description: "Custody chain holding the funds; selects the payout channel"
        tokenContract:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{64}$"
          description: "Token contract on the home chain (32-byte hex; EVM addresses left-padded with zeros)"
        destChain:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
          description: "Chain the user receives funds on; equals `homeChain` for a direct withdrawal"
        recipientBytes32:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{64}$"
          description: Full recipient address as signed (32-byte hex)
        maxBridgeFee:
          type: string
          pattern: "^[0-9]+$"
          description: Max bridge fee as signed, ledger units
        maxBridgeFeeWei:
          type: string
          pattern: "^[0-9]+$"
          description: "Max bridge fee in on-chain atomic units (rounded down); \"0\" for a direct withdrawal on the home chain"
        fallbackToHub:
          type: boolean
        routed:
          type: boolean
          description: "`true` = route recorded in the command; `false` = derived from an older-format command"
        status:
          type: string
          const: pending
          description: Debited, not yet acknowledged as paid out. Leaving this list does not prove a CCTP transfer has arrived
      required:
        - outboxId
        - token
        - amount
        - amountWei
        - recipient
        - homeChain
        - tokenContract
        - destChain
        - recipientBytes32
        - maxBridgeFee
        - maxBridgeFeeWei
        - fallbackToHub
        - routed
        - status
    Portfolio:
      type: object
      required:
        - address
        - subaccount
        - epoch
        - period
        - bucketMs
        - fromMs
        - asOfMs
        - seriesStartMs
        - total
        - perp
        - unvaluedTokens
        - gaps
      properties:
        address:
          type: string
        subaccount:
          type: integer
        epoch:
          type: string
          description: "Ledger epoch; a new epoch starts a new series"
        period:
          type: string
          enum:
            - "24h"
            - "7d"
            - "30d"
            - all
        bucketMs:
          type: integer
        fromMs:
          type:
            - integer
            - "null"
          description: "Start: max(now − period, seriesStartMs); `seriesStartMs` for `all`"
        asOfMs:
          type:
            - integer
            - "null"
          description: Latest sample time (at most one sampling period old)
        seriesStartMs:
          type:
            - integer
            - "null"
          description: "First sample of this account in this epoch; `null` = never sampled"
        total:
          "$ref": "#/components/schemas/PortfolioScope"
        perp:
          "$ref": "#/components/schemas/PortfolioScope"
        unvaluedTokens:
          type: array
          items:
            type: string
          description: "Tokens held in the window with no USDC price; not counted"
        gaps:
          type: array
          items:
            type: object
            required:
              - fromMs
              - toMs
            properties:
              fromMs:
                type: integer
              toMs:
                type: integer
          description: Intervals left out of PnL because execution history between samples is missing
    PortfolioPoint:
      type: object
      required:
        - ts
        - accountValue
        - pnl
        - netInflow
      properties:
        ts:
          type: integer
          description: "Bucket start, Unix ms; values are the bucket's last sample"
        accountValue:
          type: string
          description: USDC, decimal string
        pnl:
          type: string
          description: USDC PnL since the first point of the window
        netInflow:
          type: string
          description: USDC net inflow since the first point of the window
    PortfolioScope:
      type: object
      required:
        - history
        - pnl
        - returnRate
        - maxDrawdown
        - volume
        - fees
      properties:
        history:
          type: array
          items:
            "$ref": "#/components/schemas/PortfolioPoint"
        pnl:
          type:
            - string
            - "null"
          description: "Last point − first point (USDC); `null` if the window has no point"
        returnRate:
          type:
            - string
            - "null"
          description: "Time-weighted return, chaining `(V_k − ΔN_k) / V_{k−1}` per bucket (skips segments starting at a non-positive value); deposits and withdrawals do not move it. `null` without a usable segment"
        maxDrawdown:
          type:
            - string
            - "null"
          description: "Largest fall of the time-weighted return index from its running peak, in [0, 1]; deposits and withdrawals never cause one. `null` with < 2 points"
        volume:
          type:
            - string
            - "null"
          description: "Traded notional in the window (USDC), taker and maker; `perp` = perps only, `total` adds spot"
        fees:
          type:
            - string
            - "null"
          description: "Net trading fees in the window (USDC): taker + maker − maker rebates + builder + dex deployer fees"
    Position:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol: `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        side:
          type: string
          enum:
            - long
            - short
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Signed size in base units; positive = long, negative = short"
        entryPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        markPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        notional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Notional, USDC
        unrealizedPnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: USDC, signed
        fundingIndex:
          type: string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "`isolated`: own margin bag, liquidated on its own; its losses cannot reach the cross balance"
        rawUsd:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: bag cash incl. the opening consideration (negative for a long, positive for a short); null for cross"
        isolatedEquity:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: `rawUsd` + position at mark + accrued funding; null for cross"
        isolatedMarginUsed:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: initial margin; null for cross"
        isolatedMaintenanceMargin:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: maintenance margin; liquidated when `isolatedEquity` is below it. null for cross"
        isolatedRemovable:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: margin `POST /v1/account/isolated-margin` can remove now = max(0, `isolatedEquity` − `isolatedMarginUsed`); 0 on `strictIsolated` markets; null for cross"
        liquidationPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: mark price at which `isolatedEquity` hits `isolatedMaintenanceMargin`, truncated to price decimals. null for cross, tiered-margin markets, or when no positive price liquidates"
      required:
        - symbol
        - side
        - size
        - entryPrice
        - markPrice
        - notional
        - unrealizedPnl
        - fundingIndex
        - marginMode
        - rawUsd
        - isolatedEquity
        - isolatedMarginUsed
        - isolatedMaintenanceMargin
        - isolatedRemovable
        - liquidationPrice
    Price:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "`symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        last:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        mark:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        oracle:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingIndex:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+$"
          description: "Cumulative funding index after the latest settlement, integer string (as `fundingIndex` in `/v1/markets`); null for spot"
        lastFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "Block time of the latest funding settlement (Unix ms); null for spot and before the first settlement"
        nextFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "Next settlement due: the first multiple of `fundingTickSec` (`GET /v1/exchange`) since the Unix epoch after `lastFundingMs`; actual settlement may be one sample later. Null for spot and before the first sample"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        prevDayPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Open of the rolling 24h window (first 1-minute candle); null if no tick in the window or 24h stats unavailable"
        change24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "(close − open) / open over the rolling 24h, as a ratio (0.01 = 1%), 8 decimals truncated toward zero; null without an open"
        high24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Highest price in the rolling 24h window
        low24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Lowest price in the rolling 24h window
        volume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Size traded in the rolling 24h, base units; \"0\" if none, null if 24h stats unavailable"
        quoteVolume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size over the rolling 24h, quote units; null when unknown (no 24h stats, or only migrated candles in the window)"
    Subaccount:
      type: object
      properties:
        subaccount:
          type: integer
        isMain:
          type: boolean
        signingAccountId:
          type: integer
          description: "**Signing only.** Value for `fromAccount` / `toAccount` in `Transfer` and for `accountId` when acting as this subaccount"
        name:
          type: string
          description: "Label set at creation or via `POST /v1/account/subaccounts/name`; empty if never named"
    Ticker:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        signingMarketId:
          type: integer
          description: "**Signing only.** The market's `signingMarketId`, the same value as on its `/v1/markets` row (the `market` field in the EIP-712 structs)"
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "`symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        open:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the first trade in the window; null when no trades"
        high:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Highest trade price in the window; null when no trades"
        low:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Lowest trade price in the window; null when no trades"
        last:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the last trade in the window; null when no trades"
        volume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Total size traded in the window (base asset)
        quoteVolume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size in the window (quote asset)"
        trades:
          type: integer
          description: Number of trades in the window
    Trade:
      type: object
      properties:
        id:
          type: string
          description: "Trade id `<seq>-<sub>-<idx>`, same as in WebSocket `trades`"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        side:
          type: string
          enum:
            - buy
            - sell
          description: Taker side
        ts:
          type: integer
          format: int64
          description: Unix ms
    Vault:
      type: object
      description: "A vault. USDC amounts are decimal strings, NAV per share a ratio, shares integer strings, rates ppm. The account id a vault signs with is `signingAccountId` from `GET /v1/account/nonce?vault=`"
      required:
        - vault
        - address
        - dex
        - name
        - description
        - creator
        - creatorSubaccount
        - manager
        - managerSubaccount
        - hasManager
        - leader
        - tradingHalt
        - lpShares
        - managerShares
        - totalShares
        - lpBalance
        - managerBalance
        - lastCheckedEquity
        - hwm
        - equity
        - unattributed
        - totalDeposits
        - pnl
        - managerPortionPpm
        - navPerShare
        - navPerShareByClass
        - config
        - whitelist
        - blacklist
        - maxLeverages
        - depositorWhitelist
        - depositorCount
        - createdAtMs
        - aprPpm
        - maxDrawdownPpm
        - netReturnPpm
        - inceptionAprPpm
        - utilizationPpm
        - profitSharePpm
        - marketVaults
        - authorizedManager
        - confirmedTradingHalt
        - pendingClaim
      properties:
        vault:
          type: integer
          description: "Vault id, as in `?vault=` reads, write envelopes and WebSocket subscriptions"
        address:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "The vault's own address (no private key): `?address=<this>&subaccount=0` reads the vault, and address-level fee rules apply. Managers and their API wallets trade it by signing for this address. Read it; do not derive it"
        dex:
          type:
            - integer
            - "null"
          description: "Fixed at creation. `null` = protocol vault (created by the Council); a dex id = merchant vault that trades only that dex's markets. Everyone uses their own account balance"
        name:
          type: string
        description:
          type: string
        creator:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet of the creating account; null for an internal account"
        creatorSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the creating account under `creator`"
        manager:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Manager main wallet recorded on the funds side; may be set before `authorizedManager`, so never use it for permissions"
        managerSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the claiming account under `manager`; null while unclaimed"
        hasManager:
          type: boolean
        leader:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Legacy alias: `manager`, or `creator` while unclaimed"
        tradingHalt:
          type: boolean
          description: "Halted below the halt threshold: orders cancelled, positions closed, only cancels allowed"
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: "LP share units (integer; not a token amount)"
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: Manager share units (integer)
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: "Total shares: `lpShares + managerShares`"
        lpBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the LP class, USDC
        managerBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the manager class, USDC
        lastCheckedEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Equity at the last ledger sync, USDC
        hwm:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: High-water mark for the profit share, USDC
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Vault equity (main account net collateral), USDC
        unattributed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − lpBalance − managerBalance` (PnL not yet synced into the classes), USDC"
        totalDeposits:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Sum of the principal shown to every depositor, USDC
        pnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − totalDeposits` (signed), USDC"
        managerPortionPpm:
          type:
            - integer
            - "null"
          description: "Manager balance / attributed balance, ppm; null when nothing is attributed"
        navPerShare:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Equity per share, ratio (1 = par at the first deposit); null while there are no shares"
        navPerShareByClass:
          type: object
          required:
            - lp
            - manager
          properties:
            lp:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "LP class balance per LP share (ratio); null without shares"
            manager:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Manager class balance per manager share (ratio); null without shares"
        config:
          "$ref": "#/components/schemas/VaultConfig"
        whitelist:
          type:
            - array
            - "null"
          items:
            "$ref": "#/components/schemas/VaultMarket"
          description: "null = every market allowed; otherwise only these (empty = none)"
        blacklist:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarket"
        maxLeverages:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMaxLeverage"
          description: "Per-market leverage caps; uncapped markets are absent"
        depositorWhitelist:
          type: array
          items:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; lower-case in responses, case-insensitive in requests"
          description: "Empty = anyone may deposit"
        depositorCount:
          type: integer
        createdAtMs:
          type:
            - integer
            - "null"
          description: "Block time of the vault's creation; null before the first block"
        aprPpm:
          type:
            - integer
            - "null"
          description: "Annualised return over the metric window, ppm; null when not computable"
        maxDrawdownPpm:
          type:
            - integer
            - "null"
          description: "Max drawdown of NAV per share over the metric window, ppm; null when not computable"
        netReturnPpm:
          type:
            - integer
            - "null"
          description: "`pnl / totalDeposits`, ppm; null without principal"
        inceptionAprPpm:
          type:
            - integer
            - "null"
          description: "Net return annualised over the vault's age, ppm; null without principal or under one day old"
        utilizationPpm:
          type:
            - integer
            - "null"
          description: "Main-account IMR / equity, ppm; null when equity is not positive while margin is in use"
        profitSharePpm:
          type: integer
          description: "Legacy alias of `config.profitSharePpm`"
        marketVaults:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarketStatus"
        authorizedManager:
          type:
            - string
            - "null"
          description: "Main wallet of the manager whose authorization the ledger confirmed; null if none. Permission checks use this field"
        confirmedTradingHalt:
          type: boolean
          description: "Trading halt as last confirmed by the ledger; execution follows `tradingHalt`"
        pendingClaim:
          type:
            - object
            - "null"
          required:
            - logIdx
            - ordinal
            - slot
            - status
          properties:
            logIdx:
              type: string
              pattern: "^[0-9]+$"
              description: "Log index of the original claim request; decimal string"
            ordinal:
              type: integer
              minimum: 0
              maximum: 65535
            slot:
              type: integer
              minimum: 0
              maximum: 4095
            status:
              type: string
              enum:
                - pending
          description: "Manager claim awaiting confirmation, or null; `logIdx` / `ordinal` identify the original claim request"
    VaultConfig:
      type: object
      required:
        - profitSharePpm
        - depositMinDurationMs
        - managerMinPortionPpm
        - managerLiqPortionPpm
        - withdrawWindowS
        - withdrawDurationS
        - depositCap
      properties:
        profitSharePpm:
          type: integer
          description: "Manager's profit share, ppm"
        depositMinDurationMs:
          type: integer
          description: Lock-up of each deposit, ms
        managerMinPortionPpm:
          type:
            - integer
            - "null"
          description: "Minimum manager portion, ppm; null = none"
        managerLiqPortionPpm:
          type:
            - integer
            - "null"
          description: "Manager portion below which the vault halts (stops trading, cancels, closes out), ppm; null = none"
        withdrawWindowS:
          type:
            - integer
            - "null"
          description: "Redemption window period, seconds; null = redeem any time"
        withdrawDurationS:
          type:
            - integer
            - "null"
          description: Length of the open part of each window, seconds
        depositCap:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Deposit cap, USDC; null = none"
    VaultDepositors:
      type: object
      required:
        - vault
        - lpShares
        - managerShares
        - totalShares
        - depositors
        - count
        - truncated
      properties:
        vault:
          type: integer
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: LP share units
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: Manager share units
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: All shares
        depositors:
          type: array
          items:
            type: object
            required:
              - address
              - class
              - shares
              - equity
              - sharePpm
            properties:
              address:
                type:
                  - string
                  - "null"
                pattern: "^0x[0-9a-f]{40}$"
                description: "Depositor's main wallet; null for an internal account"
              class:
                type: string
                enum:
                  - lp
                  - manager
              shares:
                type: string
                pattern: "^[0-9]+$"
                description: Share units (integer)
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Value of the shares, USDC
              sharePpm:
                type:
                  - integer
                  - "null"
                description: "Share of its class, ppm; null when the class has no shares"
        count:
          type: integer
        truncated:
          type: boolean
    VaultDetail:
      allOf:
        - "$ref": "#/components/schemas/Vault"
        - type: object
          required:
            - nextNonce
            - availableToWithdraw
            - positions
            - nextWithdrawWindow
            - metricWindow
          properties:
            nextNonce:
              type: integer
              description: "Next nonce of the vault main account (= `GET /v1/account/nonce?vault=`)"
            availableToWithdraw:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Withdrawable from the vault main account, USDC
            positions:
              type: array
              items:
                "$ref": "#/components/schemas/Position"
              description: "Vault positions, same rows as `GET /v1/account/positions?vault=`"
            nextWithdrawWindow:
              type:
                - object
                - "null"
              description: "`{opensAtMs, closesAtMs, open}`; null = redeem any time"
            metricWindow:
              type: object
              required:
                - fromMs
                - toMs
                - bucketMs
                - points
              properties:
                fromMs:
                  type: integer
                toMs:
                  type: integer
                bucketMs:
                  type: integer
                points:
                  type: integer
    VaultList:
      type: object
      required:
        - vaults
        - metricWindowMs
      properties:
        vaults:
          type: array
          items:
            "$ref": "#/components/schemas/Vault"
        metricWindowMs:
          type: integer
          description: "Window of `aprPpm` / `maxDrawdownPpm`"
    VaultMarket:
      type: object
      required:
        - symbol
        - kind
      properties:
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); a merchant dex market is `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; a perp and a spot market may share a symbol, `symbol` + `kind` is unique"
    VaultMarketStatus:
      type: object
      required:
        - symbol
        - kind
        - status
      properties:
        symbol:
          type: string
          description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); merchant dex markets are `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; a perp and a spot market may share a symbol, so `symbol` + `kind` identifies one market"
        status:
          type: string
          description: "Per-market sub-vault status (`Quoting` / `StandBy` / `CloseOnly` / `Deactivated`)"
    VaultMaxLeverage:
      type: object
      required:
        - symbol
        - kind
        - maxLeverage
      properties:
        symbol:
          type: string
          description: "Market symbol: `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type; `symbol` + `kind` identifies one market (a perp and a spot market may share a symbol)"
        maxLeverage:
          type: integer
    VaultNav:
      type: object
      required:
        - vault
        - bucketMs
        - fromMs
        - points
        - truncated
      properties:
        vault:
          type: integer
        bucketMs:
          type: integer
        fromMs:
          type: integer
        points:
          type: array
          items:
            type: object
            required:
              - tsMs
              - equity
              - totalShares
              - navPerShare
            properties:
              tsMs:
                type: integer
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Vault equity, USDC
              totalShares:
                type: string
                pattern: "^[0-9]+$"
                description: Shares outstanding
              navPerShare:
                type:
                  - string
                  - "null"
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Equity per share; `null` without shares"
        truncated:
          type: boolean
          description: "`limit` reached: narrow `from` or widen `interval`"
    CommandAccepted:
      type: object
      required:
        - status
        - requestId
        - digest
        - commandHash
        - seq
        - sub
        - executionKnown
        - nonceConsumed
        - duplicate
        - networkId
        - genesisHash
        - manifestHash
        - ledgerEpoch
      properties:
        networkId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        genesisHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        manifestHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        ledgerEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: "Ledger epoch; decimal string"
        status:
          type: string
          enum:
            - Accepted
        requestId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        digest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        commandHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        seq:
          type: string
          pattern: "^[0-9]+$"
          description: "Log position (host log index) the command was sequenced at; decimal string"
        sub:
          type: integer
          minimum: 0
          maximum: 65535
        executionKnown:
          type: boolean
          enum:
            - false
        nonceConsumed:
          type: boolean
          nullable: true
          enum:
            - null
        duplicate:
          type: boolean
          enum:
            - false
    RequestFact:
      type: object
      required:
        - networkId
        - genesisHash
        - manifestHash
        - ledgerEpoch
        - requestId
        - status
        - executionKnown
        - nonceConsumed
        - historyComplete
        - certification
        - anchor
        - position
        - digest
        - inputSeq
        - hostLogIndex
        - inputPrefix
      properties:
        networkId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        genesisHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        manifestHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        ledgerEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: "Ledger epoch; decimal string"
        requestId:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        digest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          nullable: true
        status:
          type: string
          enum:
            - Unknown
            - Accepted
            - Executed
            - Conflict
        executionKnown:
          type: boolean
        nonceConsumed:
          type: boolean
          nullable: true
        historyComplete:
          type: boolean
          enum:
            - false
        certification:
          nullable: true
          enum:
            - null
          type: object
        anchor:
          nullable: true
          enum:
            - null
          type: object
        position:
          type: object
          nullable: true
          required:
            - inputSeq
            - hostLogIndex
            - commandOrdinal
            - relayOrdinal
          properties:
            inputSeq:
              type: string
              pattern: "^[0-9]+$"
              description: Decimal string
            hostLogIndex:
              type: string
              pattern: "^[0-9]+$"
              description: Decimal string
            commandOrdinal:
              type: integer
              minimum: 0
            relayOrdinal:
              type: integer
              nullable: true
              minimum: 0
        inputSeq:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal string
        hostLogIndex:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal string
        inputPrefix:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        source:
          type: string
          enum:
            - ActionReceipt
            - RegistrationState
            - CertifiedTimeState
        nonce:
          type: string
          pattern: "^[0-9]+$"
          description: "Request nonce; decimal string"
        outcome:
          type: string
          nullable: true
          description: "`Succeeded` or `Failed`; null while `resultsPending`. Business rejections are in `businessRejected`. 503 `result_unavailable` if a covering result source lacks the result or reports an error"
          enum:
            - Succeeded
            - Failed
            - null
        resultsPending:
          type: boolean
          description: "`true` while no result source has confirmed covering this command; `events` / `outcome` are then null, keep polling. A 503 never means the command did not execute or that resubmitting is safe"
        stableError:
          type: string
        errorCode:
          type: integer
          minimum: 0
          maximum: 255
        resultDigest:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        accountId:
          type: integer
          minimum: 0
        policyId:
          type: string
          pattern: "^[0-9]+$"
          description: "Policy id; decimal string"
        policyHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        certificateHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
        setEpoch:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal string
        globalSequence:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal string
        timestampMs:
          type: string
          pattern: "^[0-9]+$"
          description: "Unix ms; decimal string"
        error:
          type: string
    CommandError:
      allOf:
        - "$ref": "#/components/schemas/Error"
        - type: object
          required:
            - executionKnown
            - nonceConsumed
          description: "Command endpoints add the outcome fields next to `error`; reason-specific context (`clientOrderId`, the refused `leg`, …) is in `error.details`"
          properties:
            status:
              type: string
            submissionOutcome:
              type: string
              enum:
                - Unknown
            executionKnown:
              type: boolean
              enum:
                - false
            nonceConsumed:
              type: boolean
              nullable: true
            leader:
              type: string
              pattern: "^[0-9]+$"
              description: Current leader if known, decimal string
              nullable: true
            hostLogIndex:
              type: string
              pattern: "^[0-9]+$"
              description: Decimal string
            requiredSeq:
              type: string
              pattern: "^[0-9]+$"
              description: Decimal string
    CommandResubmitted:
      allOf:
        - "$ref": "#/components/schemas/RequestFact"
        - type: object
          required:
            - duplicate
            - seq
            - sub
            - source
            - nonceConsumed
          properties:
            duplicate:
              type: boolean
              enum:
                - true
            source:
              type: string
              enum:
                - ActionReceipt
            seq:
              type: string
              pattern: "^[0-9]+$"
              description: "Host log index of the first acceptance (= `position.hostLogIndex`); decimal string"
            sub:
              type: integer
              minimum: 0
              maximum: 65535
              description: "Command ordinal of the first acceptance (= `position.commandOrdinal`)"
            nonceConsumed:
              type: boolean
              enum:
                - true
            events:
              type: array
              nullable: true
              items:
                type: object
              description: "Events of the first execution; null, with `resultsPending: true`, until the result is settled"
    LedgerCut:
      type: object
      description: Published ledger snapshot all merchant reads are taken from
      required:
        - networkId
        - genesisHash
        - ledgerEpoch
        - manifestHash
        - inputSeq
        - hostLogIndex
        - inputPrefix
      properties:
        networkId:
          type: string
          description: Network id (bytes32, 0x hex)
        genesisHash:
          type: string
          description: Genesis hash (bytes32, 0x hex)
        ledgerEpoch:
          type: string
          description: Ledger epoch, decimal string
        manifestHash:
          type: string
          description: Manifest hash (bytes32, 0x hex)
        inputSeq:
          type: string
          description: Ledger input sequence of the cut, decimal string
        hostLogIndex:
          type: string
          description: Host log index of the cut, decimal string
        inputPrefix:
          type: string
          description: Ledger input prefix of the cut (bytes32, 0x hex)
    DexRegistration:
      type: object
      required:
        - dex
        - shortName
        - state
        - tradingEnabled
        - disabled
        - configVersion
        - configHash
        - currentOwner
        - ownerKind
        - registration
        - privateFeeds
        - marketCount
      properties:
        dex:
          type: integer
          description: Dex id
        shortName:
          type: string
          description: "Short name fixed at registration: 2–8 upper-case letters and digits starting with a letter, `MAIN` reserved; unique"
          pattern: "^[A-Z][A-Z0-9]{1,7}$"
        state:
          type: string
          description: Registration state
          enum:
            - Configured
        tradingEnabled:
          type: boolean
        disabled:
          type: boolean
          description: Council disabled the dex
        configVersion:
          type: string
          description: Dex config version, decimal string
        configHash:
          type: string
          description: Dex config hash (bytes32, 0x hex)
        currentOwner:
          type: object
          required:
            - account
            - policyId
            - policyEpoch
            - ownerEpoch
          properties:
            account:
              type: integer
              description: "Current owner account; 0 when the Council owns the dex"
            policyId:
              type: string
              nullable: true
              description: "Owner account policy id, decimal string; null when the Council owns the dex"
            policyEpoch:
              type: string
              nullable: true
              description: "Owner policy epoch, decimal string; null when the Council owns the dex"
            ownerEpoch:
              type: string
              description: Dex owner epoch, decimal string
        ownerKind:
          type: string
          enum:
            - account
            - council
          description: "Who owns the dex: `account` (an account owner, see the account field) or `council` (the dex was handed to the Council (`TransferDexToCouncil`); the owner account then reads 0 and the policy fields are null)."
        registration:
          type: object
          description: The immutable original registration
          required:
            - registrationId
            - originalOwnerAccount
            - originalOwnerPolicyId
            - originalOwnerPolicyEpoch
            - expectedAdmissionVersion
            - payload
            - commitment
            - resultDigest
          properties:
            registrationId:
              type: string
              description: Registration id (bytes32, 0x hex)
            originalOwnerAccount:
              type: integer
              description: Account that registered the dex
            originalOwnerPolicyId:
              type: string
              description: Policy id of the registering account, decimal string
            originalOwnerPolicyEpoch:
              type: string
              description: Policy epoch at registration, decimal string
            expectedAdmissionVersion:
              type: string
              description: Merchant admission list version at registration (audit only), decimal string
            payload:
              type: string
              description: "Canonical `RegisterDexV2` payload (0x hex)"
            commitment:
              type: string
              description: Registration commitment (bytes32, 0x hex)
            resultDigest:
              type: string
              description: Registration result digest (bytes32, 0x hex)
        privateFeeds:
          type: object
          required:
            - count
            - max
          description: "Private price feeds owned by this dex (owner `Dex(n)`); `max` = per-dex market cap (`maxMarketsPerDex`). Not drawn from the shared resource pool"
          properties:
            count:
              type: integer
            max:
              type: integer
        marketCount:
          type: integer
          description: "Markets of this dex on the ledger, frozen and final-settled included; counted against `maxMarketsPerDex` of `/v1/governance/parameters`"
    MerchantAdmission:
      type: object
      required:
        - version
        - accounts
      properties:
        version:
          type: string
          description: "Admission list version, bumped by each Council change and each dex registration; decimal string"
        accounts:
          type: array
          items:
            type: integer
          description: "Accounts allowed to register a dex (ascending); registering removes the account"
    OracleRecipe:
      type: object
      required:
        - venues
        - minVenues
        - minWeightBps
        - maxVenueDeviationBps
      properties:
        venues:
          type: array
          description: In venue number order
          items:
            type: object
            required:
              - venue
              - venueName
              - symbol
              - quote
              - weightBps
            properties:
              venue:
                type: integer
                description: Price venue number (GET /v1/oracle/venues)
              venueName:
                type:
                  - string
                  - "null"
                description: "Name of the venue in the ledger price venue table (GET /v1/oracle/venues); null if the venue is not in the table"
              symbol:
                type: string
                description: Trading pair as the venue names it, for example BTCUSDT or BTC-USDT
              quote:
                type: string
                enum:
                  - USD
                  - USDT
                  - USDC
              weightBps:
                type: integer
                description: "Weight of this venue in basis points; the weights of a recipe sum to 10000"
        minVenues:
          type: integer
        minWeightBps:
          type: integer
        maxVenueDeviationBps:
          type: integer
      description: "Price recipe of a recipe feed: which venues price it, their pairs and weights, and the thresholds a price must meet"
    RecommendedOraclePolicy:
      type: object
      required:
        - feeds
        - setOwner
        - setCurrentEpoch
        - algorithmId
        - algorithmVersion
        - minIndependentSources
        - freshnessMs
        - futureSkewMs
        - parameters
        - parametersHash
        - policyStatus
      properties:
        feeds:
          type: array
          description: "Exactly one entry: this feed at its current version, followed through the platform reporter set"
          items:
            type: object
            required:
              - feedId
              - feedVersion
              - setId
              - setEpoch
            properties:
              feedId:
                type: string
                description: Feed id (u64 as a decimal string)
              feedVersion:
                type: string
                description: "Current version of the feed (u64 as a decimal string); a listing must sign exactly this version"
              setId:
                type: string
                description: Reporter set id (u64 as a decimal string)
              setEpoch:
                type: string
                description: "\"0\" = follow the set's current epoch, so reporter rotations need no new policy"
        setOwner:
          type: string
          enum:
            - Protocol
            - Dex
          description: "Owner of the reporter set; a market policy may only use a Protocol set"
        setCurrentEpoch:
          type: string
          description: Current epoch of the reporter set (u64 as a decimal string)
        algorithmId:
          type: integer
          description: "Aggregation algorithm (2 = median)"
        algorithmVersion:
          type: integer
          description: Algorithm version
        minIndependentSources:
          type: integer
          description: Minimum number of reporters whose reports form a round
        freshnessMs:
          type: string
          description: Maximum report age in milliseconds (u64 as a decimal string)
        futureSkewMs:
          type: string
          description: Maximum clock skew into the future in milliseconds (u64 as a decimal string)
        parameters:
          type: object
          required:
            - schemaId
            - schemaVersion
            - fields
          properties:
            schemaId:
              type: integer
              description: Parameter schema id
            schemaVersion:
              type: integer
              description: Parameter schema version
            fields:
              type: array
              description: "Median parameters in field id order: 1 max deviation (ppm), 2 stale after (ms), 3 confirmation rounds, 4 confirmation window (ms), 5 minimum source families to confirm, 6 confirmation band (ppm)"
              items:
                type: object
                required:
                  - fieldId
                  - kind
                  - value
                properties:
                  fieldId:
                    type: integer
                    description: Field id
                  kind:
                    type: string
                    description: "Value type: u64, u128, i128, bool, hash or bytes"
                  value:
                    type:
                      - string
                      - boolean
                    description: "Integers as decimal strings; hash and bytes as 0x hex"
          description: Algorithm parameters, signed as listed
        parametersHash:
          type: string
          description: Hash of the parameters (bytes32, 0x hex), signed together with them
        policyStatus:
          type: integer
          description: "1 = active"
      description: "Policy a market signs to quote this feed: the platform default for a mainstream asset, built by the SDK code the platform uses. Field names match `GET /v1/oracle/markets/{id}`."
    OracleFeed:
      type: object
      required:
        - instrumentId
        - assetIdentity
        - quoteIdentity
        - priceUnit
        - evidenceSchema
        - sourceType
        - recipe
        - recipeHash
        - recommendedPolicy
        - longTailPolicy
      properties:
        instrumentId:
          type:
            - string
            - "null"
          description: "Instrument id (bytes32, 0x hex) of a named-instrument asset, else null. Platform feeds use keccak256 of the uppercase base symbol, e.g. keccak256(\"BTC\"); filter with `symbol` instead."
        assetIdentity:
          type: object
          description: "Priced asset: one of {\"namedInstrument\":{namespace,instrumentId}}, {\"cash\":{group,assetId,assetVersion}} or {\"externalToken\":{chainId,token,decimals}}"
        quoteIdentity:
          type: object
          description: Quote asset, same shape as assetIdentity
        priceUnit:
          type: object
          required:
            - numerator
            - denominator
          properties:
            numerator:
              type: string
              description: u128 as a decimal string
            denominator:
              type: string
              description: u128 as a decimal string
          description: "Value of one price atom in quote units (1/100 = one cent)"
        evidenceSchema:
          type: object
          required:
            - schemaId
            - schemaVersion
            - maxEvidenceBytes
          properties:
            schemaId:
              type: integer
              description: Evidence schema id
            schemaVersion:
              type: integer
              description: Evidence schema version
            maxEvidenceBytes:
              type: integer
              description: Maximum evidence size in bytes
        sourceType:
          type: integer
          description: "3 = recipe feed"
        recipe:
          anyOf:
            - "$ref": "#/components/schemas/OracleRecipe"
            - type: "null"
          description: Decoded price recipe of a recipe feed, null otherwise
        recipeHash:
          type:
            - string
            - "null"
          description: Hash of the recipe (bytes32, 0x hex), null when there is no recipe
        recommendedPolicy:
          anyOf:
            - "$ref": "#/components/schemas/RecommendedOraclePolicy"
            - type: "null"
          description: "Recommended market policy for a mainstream asset (deviation guard 5% at the SDK default); null when the feed has no recipe or the platform reporter set is not on the ledger"
        longTailPolicy:
          anyOf:
            - "$ref": "#/components/schemas/RecommendedOraclePolicy"
            - type: "null"
          description: "Same as recommendedPolicy for a long-tail asset: only parameter fields 1 and 6 (deviation guard 10% at the SDK default) and parametersHash differ. The market owner picks the tier"
      description: Decoded feed definition (the same content as canonicalResourceConfig)
    OracleFeedTemplate:
      type: object
      required:
        - instrumentId
        - assetIdentity
        - quoteIdentity
        - priceUnit
        - evidenceSchema
        - sourceType
        - recipe
        - recipeHash
        - owner
      properties:
        instrumentId:
          type:
            - string
            - "null"
          description: "Instrument id (bytes32, 0x hex) of a named-instrument asset, else null. Platform feeds use keccak256 of the uppercase base symbol, e.g. keccak256(\"BTC\"); filter with `symbol` instead."
        assetIdentity:
          type: object
          description: "Priced asset: one of {\"namedInstrument\":{namespace,instrumentId}}, {\"cash\":{group,assetId,assetVersion}} or {\"externalToken\":{chainId,token,decimals}}"
        quoteIdentity:
          type: object
          description: Quote asset, same shape as assetIdentity
        priceUnit:
          type: object
          required:
            - numerator
            - denominator
          properties:
            numerator:
              type: string
              description: u128 as a decimal string
            denominator:
              type: string
              description: u128 as a decimal string
          description: "Value of one price atom in quote units (1/100 = one cent)"
        evidenceSchema:
          type: object
          required:
            - schemaId
            - schemaVersion
            - maxEvidenceBytes
          properties:
            schemaId:
              type: integer
              description: Evidence schema id
            schemaVersion:
              type: integer
              description: Evidence schema version
            maxEvidenceBytes:
              type: integer
              description: Maximum evidence size in bytes
        sourceType:
          type: integer
          description: "3 = recipe feed"
        recipe:
          anyOf:
            - "$ref": "#/components/schemas/OracleRecipe"
            - type: "null"
          description: Decoded price recipe of a recipe feed, null otherwise
        recipeHash:
          type:
            - string
            - "null"
          description: Hash of the recipe (bytes32, 0x hex), null when there is no recipe
        owner:
          anyOf:
            - type: object
              required:
                - kind
                - dexId
              properties:
                kind:
                  type: string
                  enum:
                    - Dex
                dexId:
                  type: integer
            - type: "null"
          description: "Owner to sign the feed under: the dex given as dexId; null when the request has no dexId"
      description: Feed definition fields for a SetFeedDefinition proposal, built by the SDK code the platform uses for its own feeds. Add the feed id (nextFeedId) and version 1 to sign it
    OracleResource:
      type: object
      required:
        - kind
        - id
        - resourceId
        - version
        - owner
        - ownerKind
        - dexId
        - ownerAccountId
        - dexOwnerKind
        - ownerEpoch
        - authorizingDexOwnerEpoch
        - ownerApprovalCurrent
        - state
        - canonicalResourceConfig
        - configHash
        - feed
      properties:
        kind:
          type: integer
          description: "1 = Feed, 2 = ReporterSet"
        id:
          type: string
          description: "Resource key: 0x-prefixed 32-byte lowercase hex holding resourceId in its low 64 bits"
        resourceId:
          type: string
          description: "Resource id (u64 as a decimal string), for example \"101\""
        version:
          type: string
          description: "Current version (u64 as a decimal string); for a feed, the feedVersion a listing must sign"
        owner:
          type: string
          enum:
            - Protocol
            - Dex
          description: "Protocol = published by the platform; Dex = private to one dex"
        ownerKind:
          type: string
          enum:
            - Protocol
            - Dex
          description: Same as owner
        dexId:
          type:
            - integer
            - "null"
          description: Owning dex, null for Protocol
        ownerAccountId:
          type: integer
          description: "Current owner account of the dex; 0 for Protocol or for a Council-owned dex"
        dexOwnerKind:
          type:
            - string
            - "null"
          enum:
            - account
            - council
            - null
          description: "Who owns the resource's dex: `account` or `council`; null for a Protocol resource"
        ownerEpoch:
          type: string
          description: "Current owner epoch of the dex (u64 as a decimal string), \"0\" for Protocol"
        authorizingDexOwnerEpoch:
          type: string
          description: Dex owner epoch that last approved this resource (u64 as a decimal string)
        ownerApprovalCurrent:
          type: boolean
          description: The approval comes from the current dex owner (always true for Protocol)
        state:
          type: string
          enum:
            - Configured
          description: "Configured is the only state: the ledger never deletes or disables a feed or reporter set, so every listed resource can be referenced"
        canonicalResourceConfig:
          type: string
          description: Full canonical resource configuration (0x hex)
        configHash:
          type: string
          description: Hash of the configuration (bytes32, 0x hex)
        feed:
          anyOf:
            - "$ref": "#/components/schemas/OracleFeed"
            - type: "null"
          description: Decoded feed definition for kind 1, null for kind 2
    MarketLedger:
      type: object
      description: Ledger spec of a market, read from the same ledger snapshot as the top-level snapshot fields
      required:
        - signingMarketId
        - dex
        - baseSymbol
        - marketSpecVersion
        - assetVersion
        - priceDecimals
        - sizeDecimals
        - quotePerTickLot
        - admission
        - admissionVersion
        - oracleStale
        - oraclePriceAtMs
        - oraclePolicy
        - platformLock
        - accountOwned
      properties:
        signingMarketId:
          type: integer
          description: "Market id, the same as `signingMarketId` of the catalog row"
        dex:
          type: integer
        baseSymbol:
          type:
            - string
            - "null"
          description: "Perpetual name (1-16 uppercase letters and digits); null for spot and v1 specs"
        marketSpecVersion:
          type: string
        assetVersion:
          type: string
        priceDecimals:
          type: integer
        sizeDecimals:
          type: integer
        quotePerTickLot:
          type: string
        admission:
          type: integer
        admissionVersion:
          type: string
        oracleStale:
          type: boolean
          description: "Oracle-stale flag; a perpetual listed without an enabled test policy is stale until its first effective round"
        oraclePriceAtMs:
          type: string
          description: "Block time of the last effective oracle price, ms; 0 = never"
        oraclePolicy:
          type:
            - object
            - "null"
          description: "Current oracle policy; null for spot and markets without one"
          required:
            - version
            - status
            - algorithmId
            - algorithmVersion
            - feeds
          properties:
            version:
              type: string
              description: "Policy version; pass as `expectedVersion` when updating the policy"
            status:
              type: integer
              description: "0 draft / 1 enabled / 2 disabled"
            algorithmId:
              type: integer
            algorithmVersion:
              type: integer
            feeds:
              type: array
              items:
                type: object
                required:
                  - feedId
                  - feedVersion
                  - setId
                  - setEpoch
                  - feedOwner
                  - feedDex
                properties:
                  feedId:
                    type: string
                  feedVersion:
                    type: string
                  setId:
                    type: string
                  setEpoch:
                    type: string
                  feedOwner:
                    type:
                      - string
                      - "null"
                    enum:
                      - Protocol
                      - Dex
                      - null
                    description: "Feed owner; null if the feed is not configured"
                  feedDex:
                    type:
                      - integer
                      - "null"
                    description: "Owning dex when feedOwner = Dex"
        platformLock:
          type:
            - string
            - "null"
          enum:
            - paused
            - cancel_only
            - reduce_only
            - halted
            - null
          description: "Council platform lock tier on this market; null when unlocked"
        accountOwned:
          type: boolean
          description: "The market's dex is owned by an account rather than the Council"
    LedgerSnapshot:
      type: object
      description: The published ledger snapshot a ledger read was taken from
      required:
        - networkId
        - genesisHash
        - ledgerEpoch
        - manifestHash
        - inputSeq
        - hostLogIndex
      properties:
        networkId:
          type: string
          description: Network id (bytes32, 0x hex)
        genesisHash:
          type: string
          description: Genesis hash (bytes32, 0x hex)
        ledgerEpoch:
          type: string
          description: Ledger epoch, decimal string
        manifestHash:
          type: string
          description: Manifest hash (bytes32, 0x hex)
        inputSeq:
          type: string
          description: Ledger input sequence of the cut, decimal string
        hostLogIndex:
          type: string
          description: Host log index of the cut, decimal string
    DexLedgerRow:
      allOf:
        - "$ref": "#/components/schemas/DexRegistration"
        - type: object
          required:
            - authority
          properties:
            authority:
              type: string
              enum:
                - Council
                - Owner
              description: "Current governor: `Council` for a dex handed to the Council, `Owner` for an account-owned dex"
