# Generated by scripts/gen-gitbook-openapi.mjs from web/openapi-v1.json and web/gitbook/overlay-v1.json. Do not edit;
# change the source or the overlay and run: node scripts/gen-gitbook-openapi.mjs
openapi: "3.1.0"
info:
  title: DEXOS Open API v1
  version: "0.1.0"
  summary: "The standard public interface (REST + WebSocket) for builders, developers and liquidity providers"
  description: |-
    The DEXOS public API for third-party developers, builders and liquidity providers.
    **Every read endpoint, write endpoint, vault endpoint and WebSocket channel listed here is implemented.**
    The timestamp-window nonce shipped with the subaccount model v2 (`sigVersion: 2`); the only planned item
    is the builder volume projection.
    The legacy endpoints (`/order`, `/markets`, `/ws`, …, documented at `/docs`) remain available; v1 is a
    translation layer on top of them and returns bit-identical data.

    ## Quick start

    1. `GET /v1/exchange` → the EIP-712 domain (`domain` / `chainId`) and the token table (with the numeric
       `token` ids the `Withdrawal` / `Transfer` structs carry); `GET /v1/markets/BTC-USD` → `priceDecimals` /
       `sizeDecimals` and `signingMarketId` (the `market` field of the signed structs).
    2. `GET /v1/account/nonce?address=<your address>` → the next `nonce` and `signingAccountId` (the value for the
       `accountId` field of the signed struct; signing is the only thing it is for).
    3. Scale `price` and `size` to integers locally (`ticks = price × 10^priceDecimals`,
       `lots = size × 10^sizeDecimals`), sign the `Order(...)` struct (each write endpoint states its
       `x-eip712.typeString`) and `POST /v1/orders`
       `{account, nonce, signature, symbol, side, type: "limit", price, size, clientOrderId?}` →
       `200 {orderId, status: resting|filled|…}` or `422 {error}`.
    4. Programmatic trading: approve an API wallet once from the main wallet with
       `POST /v1/account/agents/approve`, then sign with it and pass its address as `signer`
       (the `AgentExec` signature covers the canonical-bytes hash of the inner command). Batch orders,
       cancels, replaces and the dead man's switch all go through the API wallet; **an API wallet cannot
       move funds**.
    5. Subscriptions: `GET /v1/ws` → `{"method":"subscribe","params":{"channel":"book","symbol":"BTC-USD"}}`.
       After a disconnect, resume from the last `id` you saw with `/v1/account/fills?after=` or
       `/v1/events?after=`.

    ## Conventions

    - Path prefix `/v1`; JSON; camelCase field names; timestamps in Unix milliseconds; lower-case enums.
    - **Prices, sizes and amounts are decimal strings**: `ticks = price × 10^priceDecimals`,
      `lots = size × 10^sizeDecimals` (both must divide exactly); USDC amounts are scaled by `10^6`.
      `priceDecimals` / `sizeDecimals` come from `GET /v1/markets`.
    - Markets are addressed by **`symbol`** (`BTC-USD` / `BTC-USDC`), accounts by **`address`**
      (+ `subaccount`, 0 = main account), vaults by **`vault`** (the vault id; v1.1 §4.3). **No v1 response addresses anything by a numeric id.** The numeric ids v1
      does return (`signingAccountId` on `/v1/account/nonce` and `/v1/account/subaccounts`, `signingMarketId` on
      `/v1/markets`, `token` on `/v1/exchange`) exist only because the EIP-712 structs carry them; they are inputs to
      signing, never addresses.
    - Every error has the shape `{error:{code, num, message, details?}}`: `code` is a stable string
      (`Gateway*` for the gateway, the `CoreError` variant name for the execution layer), `num` a stable
      number (1xxxx gateway / 2xxxx execution layer). HTTP status: 400 malformed request · 401 bad
      signature · 403 ownership / scope · 404 · 409 · 412 replica behind · 421 wrong node · 422 business
      rejection · 429 rate limited · 5xx.
    - Pagination: `?limit=&after=<cursor>` → `{…, next, hasMore}`; execution-history endpoints also
      return a fixed upper bound `upper`, which you pass back unchanged on the following pages.
    - Read consistency: write receipts carry `x-dexos-seq`; a **read after a write** sends
      `x-dexos-min-seq` and gets 412 when the replica is behind (same semantics as the legacy API).

    ## Signing (write endpoints)

    All write endpoints share one envelope: `{account, subaccount?, signer?, nonce, expiresAt?, signature,
    …business fields}`. The signature is over the existing EIP-712 typed structs (each endpoint states its
    `x-eip712.typeString`), with the domain from `GET /v1/exchange`. Prices and sizes inside the struct are
    the **scaled integers**: the SDK scales locally and signs, the gateway performs the same scaling for its
    pre-check, and the execution layer verifies the signature authoritatively. When `signer` is present the
    request is signed by an API wallet (its nonce lives in the agent scope:
    `GET /v1/account/nonce?address=&signer=`). API wallets can only trade; every fund-moving endpoint
    answers `403 AgentScopeViolation`.

    ## Write receipts

    By default (`ack=result`) the request waits for the fold (at most one epoch) and returns the business
    outcome: a single order gets `200` with the order object or `422` with the rejection reason; a batch
    always gets `200` with per-item `items[]`. `ack=sequenced` returns only `{seq, sub}` (for
    high-frequency clients). If the outcome does not arrive within the budget the response is `202`:
    **do not resend**; look it up with `GET /v1/requests/{requestId}`.
    A `421 GatewayNotLeader` on a write means it never reached the log: send it to another node (or with a new nonce).
    A `503 GatewayUnavailable` whose `details.outcome` is `"unknown"` (response header `x-dexos-outcome: unknown`)
    means the node lost the write after handing it to consensus: it may still execute, so look it up with
    `GET /v1/requests/{details.requestId}` before sending it again.

    ## Rate limiting

    Two budgets, each a fixed 60-second window counted in request weights:

    - **Per IP** — every `/v1/*` request. The IP is the TCP peer of the gateway; behind the deployment's own
      reverse proxy it is the `x-real-ip` that proxy writes. `x-forwarded-for`, and an `x-real-ip` sent by
      anyone other than a trusted proxy, are ignored.
    - **Per account** — writes only, charged **after** the signature pre-check passes, keyed by the main wallet
      of the account being acted on (subaccounts share their main wallet's budget). A request that names
      someone else's address cannot pass the pre-check, so it never touches that account's budget.

    Weights: reads 1, order book and prices 2, history endpoints 5, writes `1 + floor(n / 40)` where `n` is
    the number of orders plus cancels in the request (a replace counts both). Both budgets default to 1200
    per minute; the operator can raise either for a given IP or main wallet (market-maker tiers). Every
    `/v1/*` response carries `ratelimit: limit=…, remaining=…, reset=…` and `ratelimit-policy: <limit>;w=60`
    for the IP budget; a write that reached the account budget also carries
    `x-ratelimit-account: limit=…, remaining=…, reset=…`. Exceeding either budget returns
    `429 GatewayRateLimited` with `retry-after` and `details.bucket` = `ip` | `account`. API-wallet writes are
    pre-checked at the gateway too: a signature that does not recover to `signer` is `401
    GatewayBadSignature`; a `signer` with no grant on the account is `403 UnknownAgent`, an expired one
    `403 AgentExpired` — none of them is sequenced. Right after approving an API wallet, send
    `x-dexos-min-seq` = the approval receipt's `seq` with the first write. The legacy endpoints are not rate
    limited (except `POST /subaccount`, which shares the IP budget).

    ## Error codes

    **gateway**

    | Code | num |
    |---|---|
    | `GatewayBadRequest` | 10400 |
    | `GatewayBuilderUnknown` | 10400 |
    | `GatewayHistoryIncomplete` | 10400 |
    | `GatewayBadSignature` | 10401 |
    | `GatewayBuilderDisabled` | 10403 |
    | `GatewayBuilderMarketCloseOnly` | 10403 |
    | `GatewayBuilderMarketNotListed` | 10403 |
    | `GatewayForbidden` | 10403 |
    | `GatewayBuilderNotFound` | 10404 |
    | `GatewayNotFound` | 10404 |
    | `GatewayConflict` | 10409 |
    | `GatewayDuplicateClientOrderId` | 10409 |
    | `GatewayReplicaBehind` | 10412 |
    | `GatewayNotLeader` | 10421 |
    | `GatewayCollateralTokenMismatch` | 10422 |
    | `GatewayRateLimited` | 10429 |
    | `GatewayError` | 10500 |
    | `GatewayUnavailable` | 10503 |

    **execution**: `20000 + codec error code`; the numbering is append-only, and the string code is the execution-layer error name. Common ones: InsufficientMargin / NonceMismatch / SignatureExpired / AgentScopeViolation / MarketNotTrading / PostOnlyWouldCross / FokInsufficientLiquidity / ReduceOnlyWrongSide / OrderNotAligned / EquityTierLimitExceeded / InvalidLeverage / UnknownOrder / NotOrderOwner / SubaccountIndexMismatch / SubaccountLimitReached / AgentLimitReached / NonceOutOfWindow / UnknownAccount (sigVersion 2).
servers:
  - url: "https://{host}"
    description: DEXOS gateway
    variables:
      host:
        default: api.dexos.invalid
        description: Host of the DEXOS gateway you integrate with
tags:
  - name: Exchange
    x-page-title: Exchange
    x-page-description: Signing domain, chain and token tables, exchange-wide configuration
  - name: Market data
    x-page-title: Market data
    x-page-description: Markets, order books, trades, candles, prices and funding
  - name: Account
    x-page-title: Account
    x-page-description: Balances, positions, orders, fills, ledger, nonces, subaccounts and API wallets
  - name: Trading
    description: Signed write endpoints
    x-page-title: Trading
    x-page-description: "Place, cancel and replace orders; batch orders and the dead man's switch"
  - name: Funds
    x-page-title: Funds
    x-page-description: Deposits, withdrawals and transfers
  - name: Vaults
    x-page-title: Vaults
    x-page-description: Vault listing, deposits and redemptions
  - name: Subscriptions
    x-page-title: Subscriptions
    x-page-description: WebSocket channels for real-time data
    description: |-
      ## WebSocket

      Connect to `/v1/ws` on the API host (`wss://`).

      ### Frames

      **subscribe**

      ```json
      {
        "method": "subscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 1
      }
      ```

      **ack**

      ```json
      {
        "channel": "subscribed",
        "data": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "epoch": "<ledger epoch>",
        "seq": 593504256,
        "id": 1
      }
      ```

      **unsubscribe**

      ```json
      {
        "method": "unsubscribe",
        "params": {
          "channel": "book",
          "symbol": "BTC-USD",
          "depth": 50
        },
        "id": 2
      }
      ```

      **ping**

      ```json
      {
        "method": "ping"
      }
      ```

      **pong**

      ```json
      {
        "channel": "pong",
        "data": {
          "ts": 0
        }
      }
      ```

      **error**

      ```json
      {
        "channel": "error",
        "data": {
          "code": "GatewayNotFound",
          "message": "no such subscription on this connection",
          "method": "unsubscribe",
          "subscription": {
            "channel": "book",
            "symbol": "BTC-USD",
            "depth": 50
          }
        },
        "id": 2
      }
      ```

      **lagged**

      ```json
      {
        "channel": "lagged",
        "data": {
          "dropped": 128,
          "epoch": "<ledger epoch>",
          "upper": "<seq>-<sub>-4294967295",
          "reason": "buffer"
        }
      }
      ```

      **frame**

      ```json
      {
        "channel": "<channel>",
        "data": {},
        "seq": 0,
        "isSnapshot": false,
        "epoch": "<private channels only>"
      }
      ```

      ### Rules

      - Snapshot channels (book / bbo / prices / account / positions / orders) send one frame with `isSnapshot:true` on subscribe. book / bbo / prices / account / positions are then coalesced per block: events only mark them, and at each block boundary (`BlockBegun`, about once a second) each is read once and pushed only if its data changed (`isSnapshot:false`). account / positions of an account that holds positions are also re-read when marks or funding move, and those of any account whose ledger moved in the block (from the execution history's per-account ledger index — e.g. a vault redemption, whose events do not name the vault) are re-read at the block boundary (specification v1.1 §4.10-4).
      - Error frames answering a `subscribe` / `unsubscribe` carry the request `id` (when the request had one), `data.method` and `data.subscription` (the request's `params` verbatim), so a client can tell which request was refused. Unsubscribing a subscription the connection does not have is an error (`GatewayNotFound`), not `unsubscribed`. Error frames without `id` or `subscription` only answer malformed frames (specification v1.1 §4.10-3).
      - orders: the snapshot is all open orders across markets; after it every accept / fill / cancel / expiry is one frame with `clientOrderId` (if any) and `status` (open / filled / canceled / expired). Apply frames idempotently by `orderId`: a snapshot replaces the set, any other frame keeps the order if `status` is `open` and removes it otherwise. Order events already covered by the snapshot's view are not sent. `status` and `remaining` are always present: a taker's fill frames repeat the order's state at the end of the command (the same as its `accepted` frame); fills of protocol orders (liquidation, vault halt; `orderId` `"0"`, no `accepted`) are `filled` with `remaining` 0. When the connection cannot work them out it sends a fresh `isSnapshot:true` frame instead of an incomplete one. Pending conditional orders are part of the snapshot (rows with `trigger`); when one is placed, triggered, rejected or auto-cancelled a fresh snapshot is sent (those events carry no side / price / size), and cancelling one sends a `canceled` frame.
      - The candles channel sends one frame per fill with **the latest state of the current bar** (o/h/l/c/v accumulated; clients keep the last frame); a new bar starts automatically when the interval rolls over.
      - Time-series channels (trades / fills / ledger / events) carry `seq`; trades / fills / events send one frame per event with `data.id`, ledger one frame per command with `data.entries[]`. The fills `data.id`, and the last `data.entries[].id` of a ledger frame, are the `after` cursors of `/v1/account/fills` and `/v1/account/ledger`.
      - Resume: the subscribe ack carries the ledger `epoch` and the start position `seq`: every event after `seq` is sent on the subscription (unless a `lagged` follows); backfill time series up to `upper=<seq>-65535-4294967295` over REST and de-duplicate by `id` to join without gaps. Private frames carry `epoch` and `seq`, public book / bbo frames carry `seq`. `lagged{dropped, epoch, upper, reason}` means frames were not sent: `reason: buffer` = the server-side broadcast fell behind and `dropped` events were dropped; `reason: render` = the connection could not render time-series frames (execution history unreadable, market metadata missing; `dropped` is 0). **Frames not sent are never resent**. Right after it every snapshot subscription receives one `isSnapshot:true` frame, and fills / ledger frames at or before `upper` are no longer sent: backfill them with `after=<last id received>&epoch=<epoch>&upper=<upper>` (retry later on 400 `GatewayHistoryIncomplete`); the two parts join without gaps or duplicates. If `epoch` changed after a reconnect, rebuild state instead of resuming old cursors.
      - At most 200 subscriptions per connection; the server closes a connection that has sent no frame (pings count) for 60 s.
      - Rate limiting: REST uses fixed 60-second windows per IP and, for writes, per main wallet (weights: reads 1, order book / prices 2, history 5, writes 1 + floor(n / 40); default 1200 per minute each); every response carries `ratelimit` / `ratelimit-policy`, writes also `x-ratelimit-account`, and exceeding a budget yields 429 with `retry-after`. The WebSocket connection itself carries no weight.
      - Private channels (orders / fills / account / positions / ledger) accept `vault` instead of `address` / `subaccount` (specification v1.1 §4.3; giving both is an error frame); their frames then show `vault` in place of `address` / `subaccount`.
      - Channels that take `symbol` (book / bbo / trades / candles / funding) also take `kind` (`perp` | `spot`). A perp and a spot market may share a symbol; subscribing to such a symbol without `kind` is an error frame naming the choices (the gateway never picks one). Market frames carry `kind` next to `symbol`.

      ### Channels

      | Channel | Params | Data |
      |---|---|---|
      | `prices` | — | `{prices:[Price], ts, window24h}` (same body as `GET /v1/prices`, including the 24h fields) |
      | `book` | `symbol`, `kind?`, `depth?`, `aggTicks?` | Book (`depth` levels per side, 1..=100, default 20, echoed as `depth`; out of range is an error frame). `aggTicks` as on `GET /v1/markets/{symbol}/book`: checked once when subscribing (a value outside the allowed set is an error frame listing the allowed values), echoed in every frame's `data`; the same symbol can be subscribed raw and at several `aggTicks` on one connection |
      | `bbo` | `symbol`, `kind?` | `{symbol, kind, bid:[price,size]\|null, ask, ts}` |
      | `trades` | `symbol`, `kind?` | `{symbol, kind, id, price, size, side, ts}` |
      | `orders` | `address`, `subaccount?`, `vault?` | Snapshot: `{address, subaccount, orders:[OpenOrder]}`. Update: `{address, subaccount, orderId, clientOrderId, symbol, kind, event: accepted\|fill\|canceled\|expired, status: open\|filled\|canceled\|expired, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}` (`status` and `remaining` always present) |
      | `fills` | `address`, `subaccount?`, `vault?` | Fill (the `GET /v1/account/fills` row) + `address`, `subaccount` |
      | `account` | `address`, `subaccount?`, `vault?` | Account (the `GET /v1/account` body, same view) |
      | `positions` | `address`, `subaccount?`, `vault?` | `{address, subaccount, positions:[Position]}` (the `GET /v1/account/positions` body) |
      | `candles` | `symbol`, `kind?`, `interval` | Candle (`{symbol, kind, i, t, T, o, h, l, c, v}`); the current bar is sent on every fill. `interval` takes the same values as REST; an unknown one is an error frame |
      | `funding` | `symbol`, `kind?` | `{symbol, kind, rate, index, ts}`, one frame per funding settlement |
      | `ledger` | `address`, `subaccount?`, `vault?` | `{address, subaccount, entries:[LedgerEntry]}` (or `{vault, entries}`): the `GET /v1/account/ledger` body without the paging tail, one frame per command with all of this account's entries in it, each identical to the REST entry. Read from the execution history's per-account ledger index — every entry the REST endpoint returns after the subscribe ack's `seq` is sent (vault deposits / redemptions, ADL and fee legs included) |
      | `events` | `symbol?`, `address?` | Raw execution-layer events (Event) with `symbol` |
  - name: Security
    description: "可信Manifest下的新协议签名提交和当前请求事实。"
    x-page-title: Security
    x-page-description: Signed commands, custody, governance and cluster reads
paths:
  /v1/account:
    get:
      tags:
        - Account
      summary: Account summary
      description: "Addressed by wallet (`?address=&subaccount=`). Equity / margin / available / balances / per-group risk / fee rates / counts, all as decimal strings; the risk fields come from one view at `asOfSeq` (in `epoch`); **no account id**. An address that has never deposited is 404. `fees` = the rates this account is actually charged per market. `fees.pendingDeployer`(安全账本):本账户按账户 deployer 费覆盖(0xDA / 0xDC)排期中的上调,[{dex, symbol(dex 层行或无行情元数据时为 null), enabled(false = 删行), takerPpm, makerPpm, effectiveAtMs}],按 (dex, 交易对) 升序;到期由时间推进生效后消失。dev 账本恒为空。"
      operationId: v1_account
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read this subaccount's balance under a merchant dex (number or dex code), like Hyperliquid's `clearinghouseState{dex}`: each (address, subaccount) has one balance per merchant dex after the merchant isolation switch. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404."
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account instead of a wallet's (specification v1.1 §4.3). Mutually exclusive with `address` / `subaccount` (400); an unknown vault is 404. The response then shows `vault` instead of `address` / `subaccount`."
        - name: builder
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Builder id the `fees` block is computed for. Omitted = the builder bound to the request's entry domain (the same attribution an order placed through this entry gets); an entry with no builder = no builder leg. An unknown builder is 404 `GatewayBuilderNotFound`."
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: "Limit `fees.markets` to this market; omitted = every tradable market. An unknown symbol is 404."
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/agents:
    get:
      tags:
        - Account
      summary: Approved API wallets
      description: "The list is authoritative from the execution layer; labels come from the gateway. **Secure ledger**: the rows are the usable 141 grants (not revoked, issued under the current policy epoch) whose grantee is an API wallet and whose account set covers this account, plus the Dex-scope management grants issued by this account's policy when this account owns the dex (`dex` set, `subaccounts` empty; a grant whose dex has changed owner is dead and no longer listed): `scope: \"grant\"`, `grantId`, `grantEpoch`, `status` (`active` / `paused`), `actions` (namespace-1 action ids), `subaccounts` (every index the same grant covers), `validFrom` / `validUntil` (ms, null = unbounded), `expired` (judged on certified ledger time) and `executable`. These rows are an **inventory**, not the set of grants that can execute right now: paused, expired and not-yet-valid grants are listed with their `status` / `expired` / `validFrom`; `executable` is true only when the ledger would accept the grant itself at the current certified time (issued under the current policy epoch, `active`, inside `validFrom`..`validUntil`). A command can still be refused for its action, account or market scope or limits."
      operationId: v1_agents
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: Main wallet address
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  subaccount:
                    type: integer
                  agents:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Agent"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/account/fills:
    get:
      tags:
        - Account
      summary: Fill history
      description: "Durable execution history with cursor-based backfill: the first page fixes an upper bound `upper` that you pass back unchanged; only `hasMore=false` means you have everything. After a disconnect, use the last `id` seen in WebSocket frames as `after`."
      operationId: v1_fills
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = that account's subaccount opened with index N (0xD3)"
        - name: dex
          in: query
          required: false
          schema:
            type: string
          description: "Read under a merchant dex (number or dex code): each (address, subaccount) has one balance per merchant dex after the merchant isolation switch, same as `dex` on `/v1/account`. Omitted or 0 = the platform balance. No balance under that dex yet = 404; an unknown code = 404. Ignored when `vault` is given."
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account instead of a wallet's (specification v1.1 §4.3). Mutually exclusive with `address` / `subaccount` (400); an unknown vault is 404. The response then shows `vault` instead of `address` / `subaccount`."
        - name: symbol
          in: query
          required: false
          schema:
            type: string
