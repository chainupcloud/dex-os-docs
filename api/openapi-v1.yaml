                      to:
                        type: integer
                        format: int64
                        description: "Anchor: the latest projected block time, Unix ms"
  "/v1/requests/{requestId}":
    get:
      tags:
        - Account
      summary: Request receipt
      description: |-
        Look up the receipt of a command submitted with `POST /v1/commands`. `requestId` is the `requestId` from the
        submission response (`0x` + 64 lower-case hex). The only query parameter is `digest`. 64-bit integers in the
        response are decimal strings, and responses are never cached (`cache-control: no-store`).

        `status` values:

        - `Accepted` (200): the ledger admitted the command and consumed its nonce, but its result is not recorded
          yet. Keep polling.
        - `Executed` (200): the ledger processed the command. `outcome` is `Succeeded` or `Failed` (with
          `stableError` / `errorCode`). The business result is in `events` (the events the command produced,
          `{kind, data}`: fills, order rejections and so on), `businessRejected`, `seq` / `sub`, and for batch
          commands the per-item results in `items` (`{kind, inputIndex, state, reason?, orderId?, …}`). While the
          result is not available yet, `resultsPending` is `true` and `outcome` / `events` are `null`: keep polling.
          `Executed` only says that the command itself completed: for a governance command it does not mean the
          targeted proposal was executed, and for a withdrawal it does not mean the funds are final.
        - `AuthorizationRejected` (200): the command was sequenced but failed authorization (for example a bad
          signature, a wrong epoch, a validity window that has passed or a reused nonce). The nonce was not consumed
          (`nonceConsumed: false`); `stableError` / `errorCode` give the reason and `position` the log position. This
          is reported only while the result is in the node's recent-results window; after that the request is
          `Unknown`.
        - `Unknown` (404): this node has no record of the request. This is **not** proof that the command never
          executed (the node may be behind, or may no longer keep the record); `nonceConsumed` is `null` and
          `historyComplete` is always `false`.
        - `Conflict` (409): you passed `digest` and the ledger recorded a different signed version of the same request
          id; the response carries the recorded `digest`. Do not treat it as a success of the version you signed.

        `source` says where the receipt comes from: `ActionReceipt` for signed commands, `RegistrationState` for an
        account registration (with `accountId`, `policyId`, `policyHash`), `CertifiedTimeState` for a time
        certificate, `ResultWindow` for `AuthorizationRejected`. Send `x-dexos-min-seq` with the `seq` from the
        submission so a node that has not reached it answers 412 instead of `Unknown`. Oracle price rounds and
        chain-fact certificates have no receipt here; confirm them through their own read endpoints (for an oracle
        round, `currentRound` on `GET /v1/security/markets/{id}/oracle`).
      operationId: v1_request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            pattern: "^(account:[0-9]+|agent:0x[0-9a-fA-F]{40}|owner:0x[0-9a-fA-F]{40})$"
          description: "Not supported: sending this parameter returns 400 `unsupported_request_parameter`. Use `digest` to pin the version you signed."
        - name: nonce
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Not supported: sending this parameter returns 400 `unsupported_request_parameter`. Use `digest` to pin the version you signed."
        - name: commandHash
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "Not supported: sending this parameter returns 400 `unsupported_request_parameter`. Use `digest` to pin the version you signed."
        - name: digest
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
          description: "Optional: the `digest` that `POST /v1/commands` returned for the command you signed (`0x` + 64 lower-case hex). The same request id can be signed more than once with different validity windows, which gives different digests; with `digest` set, a receipt for a different version answers 409 `Conflict` instead of being reported as yours."
      responses:
        "200":
          description: "The request is known: `status` is `Accepted`, `Executed` or `AuthorizationRejected` (see the description)."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - executed
                          - rejected
                          - pending
                      epoch:
                        type: string
                      seq:
                        type: integer
                        format: uint64
                        description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
                      sub:
                        type: integer
                      requestId:
                        type: string
                      signer:
                        type: string
                      nonceScope:
                        type: string
                      nonce:
                        type: integer
                      nonceConsumed:
                        type: boolean
                      reason:
                        type: string
                        description: "Rejected only: the CoreError"
                      events:
                        type: array
                        items:
                          type: object
                      items:
                        type: array
                        items:
                          type: object
                      source:
                        type: string
        "400":
          description: "Malformed request id or `digest`, an unsupported query parameter or a malformed `x-dexos-min-seq` (`invalid_request_id`, `invalid_request_digest`, `unsupported_request_parameter`, `invalid_min_seq`). Says nothing about the request or its nonce."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestError"
                  - "$ref": "#/components/schemas/Error"
        "404":
          description: "`status: \"Unknown\"`: this node has no record of the request. This is not proof that the command was not executed; keep the original command and query again later or on another node."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - "$ref": "#/components/schemas/Error"
        "409":
          description: "`status: \"Conflict\"` (`request_digest_conflict`): the ledger recorded a different signed version of this request id than the `digest` you passed; the response carries the recorded `digest`. Do not treat it as a success of the version you signed."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - "$ref": "#/components/schemas/Error"
        "412":
          description: "`read_view_behind`: this node's view (`hostLogIndex`) has not reached the `x-dexos-min-seq` you sent (`requiredSeq`). Retry later or on another node."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestError"
                  - "$ref": "#/components/schemas/Error"
        "503":
          description: "The receipt cannot be read right now (`security_state_unavailable`, `security_receipt_inconsistent`, `security_result_unavailable`); the response says nothing about the outcome or the nonce. This can happen on a healthy deployment too, for example while a node restored from a snapshot is still filling in its history, when this node does not keep the history, when all read slots are busy, or when the read times out. A 503 does not mean the command did not execute and does not make it safe to sign it again with a new nonce: keep querying the same `requestId`, or check the resulting state."
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestError"
                  - "$ref": "#/components/schemas/Error"
  /v1/tickers:
    get:
      tags:
        - Market data
      summary: "24-hour trade statistics"
      description: "Rolling 24-hour window ending at the server's current time (`[windowStart, windowEnd)`, millisecond precision), computed from the trade history rather than from candles. Oracle updates do not count. Every market is listed; a market without trades in the window has `trades = 0`, zero volumes and null prices."
