  "/v1/vaults/{id}/transitions/{source}/{ordinal}":
    get:
      tags:
        - Vaults
      summary: Get vault async task status
      operationId: v1_vault_transition
      description: |-
        Status of a vault claim or deposit task, by the original request's log sequence (`source`) and logical command ordinal (`ordinal`): `pending`, or final `succeeded` / `rejected`.

        - A `wait=fold` receipt for the payment request does not mean the mint, refund or authorization is final; check here.
        - 503: history unavailable or read model not yet at `source`; retry later.
        - 404: read model past `source` but no record of the task; not a business failure.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Vault id
        - name: source
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
            description: Log sequence number, decimal string
          description: Full log sequence of the original request (not of the confirmation)
        - name: ordinal
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Logical command ordinal within the original request (not the physical record sub-index)
      responses:
        "200":
          description: Pending state or durable final state
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: Log sequence number, decimal string
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                      - errorCode
                      - confirmationSeq
                      - confirmationSub
                    properties:
                      status:
                        type: string
                        enum:
                          - succeeded
                          - rejected
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: Log sequence number, decimal string
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                      errorCode:
                        type: integer
                        minimum: 0
                        maximum: 65535
                        description: "0 on success; otherwise the original command's numeric ledger error code"
                      confirmationSeq:
                        type: string
                        pattern: "^[0-9]+$"
                        description: Log sequence number, decimal string
                      confirmationSub:
                        type: integer
                        minimum: 0
                        maximum: 65535
        "400":
          description: Invalid path parameter
        "404":
          description: "Read model past `source` but history has no record of the task; does not mean `rejected`"
        "500":
          description: Corrupt confirmation record in execution history
        "503":
          description: "Read model or history unavailable, or read model not yet at `source`; retry later"
  /v1/account/subaccounts/name:
    post:
      tags:
        - Account
      summary: Rename a subaccount
      operationId: v1_subaccount_name
      description: |-
        Sets a subaccount's display name, kept by the gateway only (not sequenced: no `seq` / `requestId`); read back as `name` in `GET /v1/account/subaccounts`.
        - Policy signatures: first `oneOf` branch; main-policy members up to the threshold sign `x-eip712.ledgerTypeString` in domain `DEXOS/SubaccountName`.
        - Legacy ledger: second branch; the owner signs `x-eip712.typeString`.
        - `nonce` must exceed the subaccount's last name write, else 409 `GatewayConflict`.

        **EIP-712 struct**

        ```
        SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ```

        **Ledger struct** (domain `DEXOS/SubaccountName`)

        ```
        SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ```
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - title: Policy signatures
                    type: object
                    required:
                      - status
                      - account
                      - subaccount
                      - name
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      account:
                        type: integer
                        format: int64
                        description: Main account id, as sent
                      subaccount:
                        type: integer
                        description: "Subaccount index, as sent (0 = main account)"
                      name:
                        type: string
                        description: The stored name, exactly as signed
                  - title: Legacy ledger
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      address:
                        type: string
                        pattern: "^0x[0-9a-f]{40}$"
                        description: EVM address (lower-case in responses, case-insensitive in requests)
                      subaccount:
                        type: integer
                      name:
                        type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          description: "`GatewayBadSignature`: below threshold, non-member or duplicate signer, more signatures than members, or wrong domain / message"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "`GatewayConflict`: nonce not above the subaccount's last name write (`details.subaccount`), or (policy signatures) stale `policyEpoch` (`details.policyEpoch` = current)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Policy signatures
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - policyEpoch
                    - signatures
                  properties:
                    account:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 4294967295
                      description: "Main (policy) account id; a subaccount or derived id is 400, an unknown account 404"
                    subaccount:
                      type: integer
                      minimum: 0
                      maximum: 65535
                      description: "Subaccount index (0 = the main account); a never-opened index is 404"
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: "1–32 Unicode scalar values; no leading/trailing whitespace, no control or format characters (`Cc` / `Cf`). Not trimmed: send exactly as signed; a violation is 400, not 401"
                    nonce:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                          maximum: 9223372036854776000
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "Integer or decimal string in [0, 2^63), above the subaccount's last accepted name write (else 409 `GatewayConflict`); Unix ms works"
                    policyEpoch:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "Signed account policy epoch (`policyEpoch` of `GET /v1/accounts/{id}`); if not current, 409 `GatewayConflict` with `details.policyEpoch` = current"
                    signatures:
                      type: array
                      minItems: 1
                      maxItems: 16
                      items:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{130}$"
                      description: "65-byte signatures (r ‖ s ‖ v, v = 27/28 or 0/1) over `x-eip712.ledgerTypeString` in `x-eip712.ledgerDomain`, any order. Threshold ≤ count ≤ members, no duplicates: else 401 `GatewayBadSignature`; over 16 is 400"
                - title: Legacy ledger
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - signature
                  properties:
                    account:
                      type: string
                      pattern: "^0x[0-9a-f]{40}$"
                      description: EVM address (lower-case in responses, case-insensitive in requests)
                    subaccount:
                      type: integer
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                    nonce:
                      type: integer
                      format: int64
                      description: Any value above the previous name write (Unix ms works)
                    signature:
                      type: string
                      pattern: "^0x[0-9a-fA-F]{130}$"
                  description: "Legacy ledger only: the owner signs `SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)` (`x-eip712.typeString`). Answers 400 on this network."
      x-eip712:
        typeString: SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ledgerTypeString: SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ledgerDomain: DEXOS/SubaccountName
  /v1/commands:
    post:
      tags:
        - Trading
      summary: Submit a signed command
      description: |-
        Submits one fully signed command, `{"command": "0x…"}` (the SDK's canonical encoding, lower-case hex). Nonce,
        validity window and signatures must already be inside. No query parameters
        (400 `unsupported_submission_parameter`).

        - `202` = sequenced only; `200` with `duplicate: true` = already admitted. 400 / 403 / 409 / 422 / 429 = refused
          before sequencing, nonce untouched (e.g. `malformed_signed_command`, `unsupported_command`,
          `invalid_signature`, `nonce_below_floor`, `grant_expired`). 421: use another node.
        - **Confirm** by polling `GET /v1/requests/{requestId}` until `Executed` or `AuthorizationRejected`. After a
          timeout (about 10 s) or a 503 with `submissionOutcome: "Unknown"`, resubmit only the identical bytes.
        - **Pinning**: send `x-dexos-expect-manifest` once; mismatch: 503 `upstream_manifest_mismatch`.
        - **Weight** `1 + floor(n / 40)` (n = orders, cancels, modifies); unverified signers use the per-IP `unverified`
          budget.
        - **`clientOrderId`**: 1-36 chars of `[A-Za-z0-9._:/-]`; reused within an account after admission: 409
          `GatewayDuplicateClientOrderId` (concurrent duplicates may both pass). None on TWAP or TP/SL; cancels and
          modifies use `orderId`. Index down: 503 `client_order_index_unavailable`.
        - **Builders**: 400 `GatewayBuilderUnknown`; 403 `GatewayBuilderDisabled`, `builder_not_approved`,
          `GatewayBuilderMarketNotListed`, `GatewayBuilderMarketCloseOnly` (non-reduce-only order; modifies use the
          original order's builder). Listing down: 503 `GatewayUnavailable`.
        - **Settlement token**: new perp orders get 422 `GatewayCollateralTokenMismatch` if the account has a balance,
          none in the settlement token, and no position there.
        - **Backpressure**: 503 `GatewayHistoryBackpressure` + `Retry-After` pauses writes except cancels.
      operationId: v1_commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command
              properties:
                command:
                  type: string
                  pattern: "^0x[0-9a-f]+$"
                  minLength: 6
                  maxLength: 2097154
                  description: "Signed command in canonical binary encoding: `0x` + lower-case hex, at most 1 MiB decoded. Non-canonical bytes: 400 `malformed_signed_command`"
      responses:
        "200":
          description: "Identical command (same `requestId` and `digest`) already admitted: the first receipt with `duplicate: true`; `seq` / `sub` / `x-dexos-seq` are the first admission's"
          headers:
            x-dexos-seq:
              "$ref": "#/components/headers/x-dexos-seq"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResubmitted"
        "202":
          description: "Sequenced (`seq`, `sub`; `seq` also in `x-dexos-seq`), not yet authorized or executed (`executionKnown: false`, `nonceConsumed: null`). Confirm with `GET /v1/requests/{requestId}`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandAccepted"
        "400":
          description: "Refused before sequencing, nonce untouched: `malformed_signed_command`, `unsupported_command`, `invalid_command_identity`, `unsupported_submission_parameter`, `invalid_signature_encoding`, `invalid_signature`, `signature_order`, `threshold_not_met`, `authority_epoch_mismatch`, `grant_revoked`, `grant_expired`, `nonce_below_floor`, `nonce_too_far_ahead`, `address_already_has_account`, `precheck_rejected`, `GatewayBuilderUnknown`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "403":
          description: "Builder pre-check, not sequenced, nonce untouched: `GatewayBuilderDisabled`, `builder_not_approved`, `GatewayBuilderMarketNotListed`, `GatewayBuilderMarketCloseOnly` (not reduce-only); `details`: `builder`, `markets`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "408":
          description: "Timed out reading the body (`command_body_timeout`); nothing submitted"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "409":
          description: "`GatewayDuplicateClientOrderId`: an admitted earlier command of this account used this `clientOrderId`; not sequenced, `nonceConsumed: false`. Resending an admitted command's bytes returns 200"
        "413":
          description: "Body or command too large (`command_too_large`, `command_body_unavailable`); nothing submitted"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "415":
          description: "`content-type` must be `application/json` (`json_content_type_required`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "421":
          description: "Node takes no writes (`read_only_replica`, `not_leader`; `leader` = leader node id, decimal string, when known); send the same command to another node"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
        "422":
          description: "`GatewayCollateralTokenMismatch` (num 10422): positive balance, none in the perp market's settlement token, no position there. Not sequenced; nonce not consumed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "`GatewayRateLimited` with `retry-after`; not sequenced. `details.bucket`: `ip`, `account` (verified signing principal) or `unverified` (smaller per-IP budget for commands whose signers are not verified yet)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "`submission_timeout` / `submission_outcome_unknown`: may still execute; resend identical bytes. Refused: `GatewayHistoryBackpressure`, `client_order_index_unavailable`, `upstream_manifest_mismatch`, `GatewayUnavailable`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandError"
  "/v1/oracle/markets/{id}":
    get:
      tags:
        - Oracle
      summary: Market oracle round parameters
      description: "Oracle round parameters for a market, for reporters and relayers. `oracle` holds everything a reporter signs (round = `currentRound + 1`; `policyVersion` / `feed` / `set` / `unitHash` must match exactly), the threshold, freshness, evidence limit, previous reference price and each member's last `reporterSequence` in `setCurrentEpoch` (the next report must use a greater one). 404 if the market does not exist or has no oracle policy; 503 if the ledger view is unavailable."
      operationId: v1_oracle_market
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Market id (u16)
      responses:
        "200":
          description: Oracle round parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  inputSeq:
                    type: string
                  hostLogIndex:
                    type: string
                  inputPrefix:
                    type: string
                  oracle:
                    type: object
                    properties:
                      marketId:
                        type: integer
                      policyVersion:
                        type: string
                      policyStatus:
                        type: integer
                      feedId:
                        type: string
                      feedVersion:
                        type: string
                      sourceType:
                        type: integer
                      setId:
                        type: string
                      setEpoch:
                        type: string
                      setCurrentEpoch:
                        type:
                          - string
                          - "null"
                        description: "Reporter set's current epoch; null if the set is missing"
                      setFollowing:
                        type: boolean
                        description: "Policy follows the reporter set's current epoch (`setEpoch` = \"0\")"
                      recipe:
                        anyOf:
                          - "$ref": "#/components/schemas/OracleRecipe"
                          - type: "null"
                        description: "Recipe of a recipe feed (`sourceType` 3); else null"
                      recipeHash:
                        type:
                          - string
                          - "null"
                        description: "Recipe hash, 0x hex (domain `DEXOS/PriceRecipe/v1`); null for other feeds"
                      algorithmId:
                        type: integer
                      algorithmVersion:
                        type: integer
                      currentRound:
                        type: string
                      unitHash:
                        type: string
                      priceDecimals:
                        type: integer
                      priceUnit:
                        type: object
                        properties:
                          numerator:
                            type: string
                          denominator:
                            type: string
                      minIndependentSources:
                        type: integer
                        description: Minimum independent source families per round
                      freshnessMs:
                        type: string
                        description: Report freshness window, ms
                      futureSkewMs:
                        type: string
                        description: Max lead of an observation timestamp over trusted time, ms
                      parameters:
                        type: object
                        description: "Algorithm parameters as stored: `schemaId` / `schemaVersion` / `fields[{fieldId, kind, value}]`; integers as decimal strings"
                      maxEvidenceBytes:
                        type: integer
                        description: Maximum evidence size, bytes
                      reference:
                        type:
                          - object
                          - "null"
                        description: "Previous effective price `{policyVersion, priceAtoms}` under this policy version; null on its first round"
                        properties:
                          policyVersion:
                            type: string
                          priceAtoms:
                            type: string
                      threshold:
                        type:
                          - integer
                          - "null"
                        description: "Reporter set threshold (min reports per round); null if the set does not exist"
                      reporters:
                        type: array
                        description: "Set members, ascending: address, last accepted sequence in the current epoch (`\"0\"` if none), bound sources and source families"
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            sequence:
                              type: string
                            sources:
                              type: array
                              items:
                                type: object
                                properties:
                                  sourceId:
                                    type: string
                                  sourceFamily:
                                    type: string
                      marketDex:
                        type: integer
                        description: "Dex owning the market; its authority sets the oracle policy"
                      oracleStale:
                        type: boolean
                        description: Ledger oracle-stale flag
                      feedOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: Owner of the policy feed
                      feedDex:
                        type:
                          - integer
                          - "null"
                      setOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: "Reporter set owner; null if the set is not configured"
                      setDex:
                        type:
                          - integer
                          - "null"
        "404":
          description: Market not found or has no oracle policy
        "503":
          description: "Ledger read view unavailable or not ready; retry"
  /v1/merchant-admission:
    get:
      tags:
        - Merchants
      summary: Merchant admission
      description: "Accounts allowed to register a dex, with the instance identity (`networkId` / `genesisHash` / `ledgerEpoch` / `manifestHash`) and snapshot position (`inputSeq` / `hostLogIndex` / `inputPrefix`), from one ledger snapshot."
      operationId: v1_merchant_admission
      parameters: []
      responses:
        "200":
          description: "Ledger snapshot view; u64 values as decimal strings"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - admission
                    properties:
                      admission:
                        "$ref": "#/components/schemas/MerchantAdmission"
        "503":
          description: "Ledger read view not ready yet; retry later"
  /v1/oracle/venues:
    get:
      tags:
        - Oracle
      summary: Price venues
      description: "The ledger's price venue table, set by Council governance, ascending by number: name (1-16 bytes of a-z, 0-9, -; unique, fixed once registered), enabled flag and version (1 for a number never registered). Pass `version` as `expectedVersion` when changing a venue. Oracle recipes reference venues by number; reporters treat a disabled venue as unavailable. Empty at genesis."
      operationId: v1_oracle_venues
      parameters: []
      responses:
        "200":
          description: Ledger snapshot view
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - venues
                    properties:
                      venues:
                        type: array
                        items:
                          type: object
                          required:
                            - venue
                            - name
                            - enabled
                            - version
                          properties:
                            venue:
                              type: integer
                              minimum: 0
                              maximum: 65535
                            name:
                              type: string
                            enabled:
                              type: boolean
                            version:
                              type: string
                              description: Decimal string
        "503":
          description: "Ledger view not ready; retry"
  /v1/governance/parameters:
    get:
      tags:
        - Governance
      summary: Business parameters
      description: |-
        Current values and versions of the business parameters, from one ledger cut. To change one, the Council passes its current `version` as `expectedVersion`.

        - Merchant registration switch, capacity, checkpoint period.
        - `custodyGroups`: withdrawal routes / CCTP evidence, finality, transfer policies, deposit staleness.
        - `feeSchedule` maker rates may be negative; `maxMarketsPerDex` counts frozen and settled markets.
        - `priceVenues`: never renamed or reused; `version` 1 for a new venue.
      operationId: v1_governance_parameters
      parameters: []
      responses:
        "200":
          description: One published ledger snapshot
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "Ledger state not ready on this node; retry later"
  "/v1/oracle/reporter-sets/{id}/followers":
    get:
      tags:
        - Oracle
      summary: Markets following a reporter set
      description: "Markets whose current oracle policy follows reporter set `id` (FeedRef `setEpoch = 0`), i.e. those affected when the set's operators change; ascending by market. Epoch-pinned policies are not listed. Response `setEpoch` is the set's current epoch, null if the set does not exist. 400 `invalid_reporter_set` if `id` is not a decimal u64."
      operationId: v1_oracle_reporter_set_followers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Reporter set id (decimal u64)
      responses:
        "200":
          description: Ledger snapshot view
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Invalid reporter set id (`invalid_reporter_set`)"
        "503":
          description: "Ledger view not ready; retry"
  /v1/oracle/resources:
    get:
      tags:
        - Oracle
      summary: Oracle resource list
      description: "Feeds or reporter sets in ascending id order from one ledger snapshot, filtered by owner and, for feeds, base symbol. Entries match `resource` of `GET /v1/oracle/resources/{kind}/{id}`; a feed entry adds its decoded definition, recipe and, for a recipe feed, the recommended market policy. To list a coin on a platform feed: `?kind=1&owner=protocol&symbol=BTC`, then sign the entry's `recommendedPolicy`. A feed has no price until a market quotes it."
      operationId: v1_oracle_resources
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
          description: "1 = Feed, 2 = ReporterSet"
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: "protocol = published by the platform; dex = private to a dex (all dexes unless dexId is given); omit for both"
        - name: dexId
          in: query
          required: false
          schema:
            type: string
          description: "Dex id (decimal); only with owner=dex"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: "Base symbol in uppercase, for example BTC (^[A-Z][A-Z0-9]{0,9}$); only with kind=1. Returns the feeds whose instrumentId is keccak256(symbol)"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "Start after this resource id (decimal); pass the response's next for the next page"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000, default 100"
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - resources
                      - next
                    properties:
                      resources:
                        type: array
                        items:
                          "$ref": "#/components/schemas/OracleResource"
                      next:
                        type:
                          - string
                          - "null"
                        description: "Pass as after for the next page; null on the last page"
        "400":
          description: "Malformed query parameter (`invalid_kind`, `invalid_owner`, `invalid_dex_id`, `invalid_symbol`, `invalid_after`, `invalid_limit` or `unsupported_parameter`)"
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  "/v1/oracle/resources/{kind}/{id}":
    get:
      tags:
        - Oracle
      summary: Oracle resource configuration
      description: "One oracle resource from one ledger snapshot: canonical configuration, its hash, versions (decimal strings) and ownership (public or a private dex). `kind` 1 = `Feed`, 2 = `ReporterSet`; `id` = 32-byte lowercase hex key, integer id in the low 64 bits. `resource` matches an entry of `GET /v1/oracle/resources`."
      operationId: v1_oracle_resource
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: integer
          description: "Resource kind: `1` = `Feed`, `2` = `ReporterSet`"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "0x-prefixed 32-byte lowercase hex key"
      responses:
        "200":
          description: "One consistent ledger snapshot; u64 values as decimal strings. For a dex-owned resource, `ownerAccountId` is 0 and `dexOwnerKind` is `council` when the Council owns the dex"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - resource
                    properties:
                      resource:
                        "$ref": "#/components/schemas/OracleResource"
        "400":
          description: "Malformed path parameter (`invalid_oracle_resource_key`)"
        "404":
          description: "Not found (`unknown_resource`)"
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/oracle/price-pairs:
    get:
      tags:
        - Oracle
      summary: Price pairs for a recipe
      description: "Pairs a recipe feed can use for one base symbol: venues enabled on the ledger that the platform price-oracle catalog lists for it, which is the catalog the reporters price from. Adds an equal-weight recipe over the chosen venues, the feed definition template and, with dexId, the dex's next feed id and feed quota from the same ledger snapshot. Reads configuration only, no prices."
      operationId: v1_oracle_price_pairs
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: "Base symbol in uppercase, for example BTC (^[A-Z][A-Z0-9]{0,9}$)"
        - name: venues
          in: query
          required: false
          schema:
            type: string
          description: "Comma-separated venue ids for recommendedRecipe (at most 16, each listed in venues); default all"
        - name: dexId
          in: query
          required: false
          schema:
            type: string
          description: "Dex id (decimal) of the merchant that will own the feed; adds nextFeedId, feedQuota and the template owner"
      responses:
        "200":
          description: Read-only view of one published ledger snapshot and the platform price-oracle catalog (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - symbol
                      - instrumentId
                      - venues
                      - recommendedRecipe
                      - feedTemplate
                      - nextFeedId
                      - feedQuota
                    properties:
                      symbol:
                        type: string
                        description: The requested base symbol
                      instrumentId:
                        type: string
                        description: keccak256(symbol), the instrument id a feed for this symbol carries (bytes32, 0x hex)
                      venues:
                        type: array
                        description: "In venue id order; empty when no enabled venue lists the symbol"
                        items:
                          type: object
                          required:
                            - venue
                            - venueName
                            - pairs
                          properties:
                            venue:
                              type: integer
                              description: Price venue id (GET /v1/oracle/venues)
                            venueName:
                              type: string
                              description: Venue name in the ledger price venue table
                            pairs:
                              type: array
                              description: "Pairs of this base in catalog order; the recommended recipe takes the first"
                              items:
                                type: object
                                required:
                                  - symbol
                                  - quote
                                properties:
                                  symbol:
                                    type: string
                                    description: Trading pair as the venue names it, for example BTCUSDT or BTC-USDT
                                  quote:
                                    type: string
                                    enum:
                                      - USD
                                      - USDT
                                      - USDC
                      recommendedRecipe:
                        anyOf:
                          - "$ref": "#/components/schemas/OracleRecipe"
                          - type: "null"
                        description: "Equal-weight recipe (SDK rule) over the chosen venues; null when no venue lists the symbol"
                      feedTemplate:
                        anyOf:
                          - "$ref": "#/components/schemas/OracleFeedTemplate"
                          - type: "null"
                        description: "Feed definition with recommendedRecipe as its recipe; null when recommendedRecipe is null"
                      nextFeedId:
                        type:
                          - string
                          - "null"
                        description: "Lowest free feed id in the dex's block dexId × 2^32 + n (n ≥ 1); null without dexId. The ledger rejects an id taken before execution"
                      feedQuota:
                        anyOf:
                          - type: object
                            required:
                              - used
                              - max
                            properties:
                              used:
                                type: integer
                                description: Feeds the dex owns
                              max:
                                type: integer
                                description: maxMarketsPerDex.max from GET /v1/governance/parameters
                          - type: "null"
                        description: "Feeds the dex owns against its limit; null without dexId"
        "400":
          description: "Malformed query parameter (`invalid_symbol`, `invalid_venues`, `invalid_dex_id` or `unsupported_parameter`); also `invalid_venues` for a chosen venue that does not list the symbol, `invalid_dex_id` for an unknown dex"
        "503":
          description: "`price_oracle_unavailable`: the node has no reachable platform price-oracle; otherwise the ledger state is not available yet, retry later"
  "/v1/builder-registrations/{id}":
    get:
      tags:
        - Merchants
      summary: Builder registration
      description: "Builder registration from one ledger snapshot: owner account and policy epoch, payout account, `configVersion`, `ownerActive` / `councilDisabled` / `active` (= `ownerActive && !councilDisabled`), `configHash`. `configVersion` and the owner's policy epoch are preconditions for governance changes to payout or status."
      operationId: v1_builder_registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Builder id (decimal, >= 1)"
      responses:
        "200":
          description: One consistent ledger snapshot
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Builder id malformed or 0 (`invalid_builder`)"
        "404":
          description: "Not registered (`unknown_resource`)"
        "503":
          description: "Ledger read view not ready; retry later"
  "/v1/dex-registrations/{id}":
    get:
      tags:
        - Merchants
      summary: Merchant DEX registration
      description: A dex registration as submitted, with its status
      operationId: v1_dex_registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Registration id (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: Published ledger snapshot (read-only)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - authority
                      - dex
                    properties:
                      authority:
                        type: string
                        enum:
                          - Council
                          - Owner
                        description: "Current governor: `Owner` for an account-owned dex, `Council` for a dex handed to the Council"
                      dex:
                        "$ref": "#/components/schemas/DexRegistration"
        "400":
          description: "Malformed path parameter (`invalid_registration_id`)"
        "404":
          description: "Not found (`unknown_resource`)"
        "503":
          description: "Ledger view not ready; retry later"
  "/v1/dex-owner-proposals/{id}":
    get:
      tags:
        - Merchants
      summary: DEX owner transfer proposal
      description: "A dex ownership transfer proposal: original proposal, first accepted envelope, digest, policy epoch and status at certified time. 404 for an unknown id or a non-transfer proposal."
      operationId: v1_dex_owner_proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Proposal id (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: "Published ledger state. `authorKind` / `oldOwnerKind` say whether an account or the Council proposed / owned; `oldOwner` is 0 for the Council"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_proposal_id`)"
        "404":
          description: Not found
        "503":
          description: "Ledger read view unavailable or not ready; retry later"
  "/v1/custody/{key}":
    get:
      tags:
        - Funds
      summary: Custody group
      description: "A custody group's ledger state: catalog version, `mode` (`normal` / `escapePending` / `frozen`), next root sequence and last cut time, cut but not yet accepted roots that include the group, the latest accepted root, escape and freeze state, chain observations, and per-asset deposit / refund / payout counts with cumulative hashes. Also `registration` (hex), `registrationHash` (= the registering operation's `configHash`) and `firstCheckpointSeq` (1 for genesis groups)."
      operationId: v1_custody_group
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the group, 0x 32-byte hex"
      responses:
        "200":
          description: Ledger snapshot view
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_custody_key_hash`)"
        "404":
          description: "Unknown custody group (`unknown_custody_group`)"
        "503":
          description: "Ledger view not ready; retry"
  /v1/checkpoints/latest:
    get:
      tags:
        - Exchange
      summary: Global checkpoint progress
      description: |-
        Global checkpoint progress and per-custody-group acceptance. Each period the ledger cuts one global root over all non-frozen custody groups; each custody chain accepts roots independently and may skip some, so `acceptedSeq` differs per group.

        - `latestCut` is null before the first cut.
        - Poll `groupCatalogVersion` to discover new custody groups; fetch a new group's registration from `/v1/custody/{key}`.
      operationId: v1_checkpoints_latest
      parameters: []
      responses:
        "200":
          description: "Ledger snapshot view; u64 values as decimal strings"
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  nextCheckpointSeq:
                    type: string
                  lastCutTimeMs:
                    type: string
                  checkpointPeriodMs:
                    type: string
                  latestCut:
                    type: object
                    nullable: true
                    properties:
                      seq:
                        type: string
                      inputEnd:
                        type: string
                      cutTimeMs:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        acceptedSeq:
                          type: string
                          nullable: true
                        acceptedCheckpointId:
                          type: string
                          nullable: true
                        mode:
                          type: string
                          enum:
                            - normal
                            - escapePending
                            - frozen
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - nextCheckpointSeq
                  - latestCut
                  - groups
        "503":
          description: "Ledger state not available on this node yet; retry later"
  /v1/network:
    get:
      tags:
        - Exchange
      summary: Network identity
      description: "The Manifest and network identity pinned by this node. Pass `canonicalManifest` to sdk-wasm `network(manifestHex)` to get each constructor's `network` argument; do not hard-code it."
      operationId: v1_network
      parameters:
        - name: x-dexos-expect-manifest
          in: header
          required: false
          description: "Expected Manifest hash (0x + 64 hex digits); 503 if it differs from this node's or the header is repeated"
          schema:
            type: string
      responses:
        "200":
          description: Manifest and network identity
          content:
            application/json:
              schema:
                type: object
                required:
                  - canonicalEncoding
                  - canonicalManifest
                  - manifestHash
                  - profile
                  - networkId
                  - genesisHash
                  - ledgerEpoch
                  - nodeChainId
                  - nodeVerifier
                  - localTrustValidated
                  - activationStatus
                  - businessReady
                properties:
                  canonicalEncoding:
                    type: string
                    enum:
                      - hex
                  canonicalManifest:
                    type: string
                    description: Canonical Manifest bytes (0x hex)
                  manifestHash:
                    type: string
                    description: Manifest hash (bytes32)
                  profile:
                    type: integer
                    description: Manifest profile number
                  networkId:
                    type: string
                    description: "Network id (`bytes32`, 0x hex)"
                  genesisHash:
                    type: string
                    description: "Genesis hash (`bytes32`, 0x hex)"
                  ledgerEpoch:
                    type: string
                    description: Ledger epoch, decimal string
                  nodeChainId:
                    type: string
                    description: "`chainId` of the EIP-712 domain (uint256, 0x hex)"
                  nodeVerifier:
                    type: string
                    description: "`verifyingContract` of the EIP-712 domain (address)"
                  localTrustValidated:
                    type: boolean
                  activationStatus:
                    type: string
                  businessReady:
                    type: boolean
        "503":
          description: "`x-dexos-expect-manifest` differs from this node's Manifest or was sent twice: `error.code` `upstream_manifest_mismatch`, `error.details.manifestHash`"
  /v1/time/certified:
    get:
      tags:
        - Exchange
      summary: Certified time
      description: "Certified time: sequence, previous certificate digest, timestamp, pause state, and the epochs and members of the chain-fact and time services."
      operationId: v1_time_certified
      parameters: []
      responses:
        "200":
          description: "Ledger snapshot view; u64 values as decimal strings"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "Ledger read view not ready yet; retry later"
  /v1/governance/council:
    get:
      tags:
        - Governance
      summary: Council
      description: "Council members, threshold and epoch; compare with the Council Safe on each custody chain."
      operationId: v1_governance_council
      parameters: []
      responses:
        "200":
          description: Published ledger snapshot (read-only)
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "Ledger state not ready on this node; retry later"
  /v1/cluster/members:
    get:
      tags:
        - Exchange
      summary: Cluster members
      description: "Current Raft members as applied by the responding node: id, role (`voter` / `learner`), certificate pin (SHA-256 of the SPKI) and kind; **no** addresses. Operator-run compute nodes serve the same shape, which `council-check --members-urls` uses to cross-check the platform."
      operationId: v1_cluster_members
      parameters: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type:
                      - integer
                      - "null"
                    format: uint64
                    description: Log index of the membership configuration
                  committed:
                    type: boolean
                  joint:
                    type: boolean
                    description: Joint consensus in progress (voters being replaced)
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: uint64
                          description: Node id (monotonic, never reused)
                        role:
                          type: string
                          enum:
                            - voter
                            - learner
                        spki:
                          type:
                            - string
                            - "null"
                          pattern: "^[0-9a-f]{64}$"
                          description: "SHA-256 of the certificate's SPKI (64 lower-case hex chars); null only in single-node mode"
                        kind:
                          type:
                            - string
                            - "null"
                          enum:
                            - core
                            - edge
                            - elastic
                            - compute
                            - null
                          description: "`#role=` suffix of the membership record; only `core` nodes can become voters; null when absent"
                      required:
                        - id
                        - role
                        - spki
                required:
                  - members
        "503":
          description: Node not ready
  /v1/accounts:
    get:
      tags:
        - Account
      summary: Accounts by policy member
      description: "Accounts whose policy members include this address, by ascending policy id and paged with `after` / `limit` → `next`: account id, policy id and epoch, threshold, members, exit address. Only `soleSigner` accounts (sole member, threshold 1) are attributed to the address via `?address=`, since anyone can add your address to a multi-member policy."
      operationId: v1_accounts_of_member
      parameters:
        - name: member
          in: query
          required: true
          schema:
            type: string
          description: "Member address (0x + 40 hex digits)"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "Policy id (decimal) from `next`; the page starts after it"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000, default 100"
      responses:
        "200":
          description: Published ledger state
          content:
            application/json:
              schema:
                type: object
                required:
                  - member
                  - accounts
                  - next
                properties:
                  member:
                    type: string
                  accounts:
                    type: array
                    items:
                      type: object
                  next:
                    type:
                      - string
                      - "null"
                    description: "Pass as `after` for the next page; null on the last page"
        "400":
          description: "Malformed query parameter: `invalid_member_address` / `invalid_after` / `invalid_limit`"
        "503":
          description: "Ledger read view unavailable or not ready on this node; retry later"
  "/v1/accounts/{id}":
    get:
      tags:
        - Account
      summary: Ledger account by id
      description: |-
        Exit policy of an account: policy id and epoch, exit address, threshold and members.

        - `id` may be a main or derived account (subaccount / merchant bucket); `account` is always the root, `queried` describes `id`, `derived` lists derived accounts and owned dex insurance funds (`dexFund`).
        - Ids with no account root (insurance funds, platform accounts, unassigned) return 404.
        - `builderApprovals`: the root account's builder fee approvals `[{builder, maxFeePpm}]`, ascending by builder.
      operationId: v1_account_by_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
      responses:
        "200":
          description: Published ledger state (read-only)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_account_id`)"
        "404":
          description: "Not found (`unknown_account`)"
        "503":
          description: "Ledger view not ready on this node; retry later"
  "/v1/accounts/{id}/tickets/{ticket}":
    get:
      tags:
        - Account
      summary: Withdrawal ticket
      description: "Whether the ledger still holds this withdrawal ticket for the account; `ticket` is null once it is cancelled or its payment settled."
      operationId: v1_account_ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
        - name: ticket
          in: path
          required: true
          schema:
            type: string
          description: Ticket id, 0x 32-byte hex
      responses:
        "200":
          description: Ledger snapshot view
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed path parameter
        "503":
          description: "Ledger view not ready; retry"
  /v1/grants:
    get:
      tags:
        - Account
      summary: Grants issued by an account policy
      description: |-
        Grants issued by an account policy, including revoked ones, with configured limits and current-window usage; plus the issuer's epoch and its unrevoked count vs. the maximum.

        - `resourceOwnerEpoch`: for a dex-scoped management grant, the dex owner epoch at issue; else 0.
        - `reclaimable`: why the slot can be reclaimed: `revoked` / `expired` / `issuerEpochStale` / `resourceOwnerEpochStale` (the dex has since changed owner).
      operationId: v1_grants
      parameters:
        - name: policy
          in: query
          required: true
          schema:
            type: string
          description: Policy id (decimal)
      responses:
        "200":
          description: "One consistent ledger snapshot; integers as decimal strings"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed query parameter (`invalid_policy_id`)"
        "404":
          description: "Policy not found (`unknown_principal`)"
        "503":
          description: "Ledger view not ready; retry later"
  /v1/nonces:
    get:
      tags:
        - Account
      summary: Nonce window
      description: "Nonce window of one lane in the principal's current epoch: `floor`, highest used `high` (null if none) and suggested `next`. `agent` / `service` principals must pass `grant`; `principal=council` returns the Council's `management` lane and takes no principal id or grant. With `nonce`, `consumed` says whether that nonce is used: true, false, or null below `floor` (no verdict)."
      operationId: v1_nonces
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
            enum:
              - account
              - agent
              - service
              - council
          description: account / agent / service / council
        - name: policy
          in: query
          required: false
          schema:
            type: string
          description: "Policy id (for `account` / `agent`)"
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: "Service id (for `service`)"
        - name: lane
          in: query
          required: true
          schema:
            type: string
          description: trade / funds / management
        - name: grant
          in: query
          required: false
          schema:
            type: string
          description: "Grant id (for `agent` / `service`)"
        - name: grantEpoch
          in: query
          required: false
          schema:
            type: string
          description: "Grant epoch (for `agent` / `service`)"
        - name: nonce
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "Optional u64 nonce to look up; adds `consumed` (`invalid_nonce` if malformed)"
      responses:
        "200":
          description: "Ledger snapshot view; u64 values as decimal strings"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed query parameter
        "404":
          description: Principal not found
        "503":
          description: "Ledger state not available on this node yet; retry later"
  "/v1/accounts/{id}/escape-preview":
    get:
      tags:
        - Account
      summary: Escape leaf preview
      description: |-
        Estimates the account's escape leaf per asset from the current ledger view: `own`, `inTransit` (cash in transit, e.g. withdrawals held in custody), `vaults[]` (share value passed through at the frozen valuation), `vaultAmount`, `ledgerTotal`, `claimable` / `withdrawReserved` / `paidObserved` (raw units, rounded down).

        - **Estimate only**: exact values come from the frozen root at escape.
        - 404 `vault_account_has_no_leaf` for vault accounts; `unknown_account` for unknown or platform accounts.
      operationId: v1_account_escape_preview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
      responses:
        "200":
          description: "Consistent ledger snapshot view; u64 values and amounts as decimal strings"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "`id` not decimal (`invalid_account_id`)"
        "404":
          description: "`unknown_account` (unknown or platform account) or `vault_account_has_no_leaf` (vault account)"
        "503":
          description: "Read view not ready, or the leaf is not computable on it (`escape_preview_unavailable`); retry later"
  /v1/custody:
    get:
      tags:
        - Funds
      summary: Custody group discovery
      description: |-
        Custody groups: contract addresses (`checkpointRegistry`, `custodyVault`, `depositInbox`), assets, routes, withdrawal fee policy, CCTP constants (536-byte deposit message) and checkpoint progress. Read addresses here; do not hard-code them.

        - Deposits open when `assets[].depositEnabled` (ledger) and `chainEnabled` (chain) are both `true`.
        - `withdrawalFee`: a cash withdrawal's `sourceFeeRaw` / `sourceFeeRecipient` must match it; pass it unchanged to the WASM library's `withdrawalFee`.
      operationId: v1_custody_groups
      parameters: []
      responses:
        "200":
          description: "Published ledger state; integers as decimal strings"
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        custodyChainId:
                          type: string
                        contracts:
                          type: object
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              assetId:
                                type: integer
                              assetVersion:
                                type: string
                                description: Decimal string
                              depositEnabled:
                                type: boolean
                                description: "Ledger side only: the accepted checkpoint has reached `enabledFromCut`. Does not read the chain; see `chainEnabled`"
                              minDepositRaw:
                                type:
                                  - string
                                  - "null"
                                description: "`DepositInbox` minimum deposit, raw units; `\"0\"` = not configured, no deposits; `null` if the chain read failed. Below it a direct deposit reverts (`DepositBelowMinimum`) and a CCTP deposit is refunded as a late deposit"
                              minDepositError:
                                type: string
                                description: "Why the minimum deposit read failed (only when `minDepositRaw` is `null`)"
                              chainRegistered:
                                type:
                                  - boolean
                                  - "null"
                                description: "`CustodyVault` has the asset registered at this `assetVersion`; `null` if the chain read failed"
                              chainDepositEnabled:
                                type:
                                  - boolean
                                  - "null"
                                description: "`CustodyVault` has deposits of the asset enabled (registered and `enableCashAsset` executed); `null` if the chain read failed"
                              chainEnabled:
                                type:
                                  - boolean
                                  - "null"
                                description: "The custody chain accepts a direct deposit of the asset: `chainDepositEnabled` and `minDepositRaw` > 0. `false` as soon as either read shows it closed; `null` if that cannot be decided"
                              chainAssetError:
                                type: string
                                description: "Why the vault read failed (only when `chainRegistered` is `null`)"
                        routes:
                          type: array
                          items:
                            type: object
                        cctp:
                          type: object
                          properties:
                            inboxMessageBytes:
                              type: integer
                              description: "CCTP deposit message length in bytes (536 = 376 + 160-byte hook)"
                            bindingType:
                              type: string
                              description: CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)
                            bindingTypehash:
                              type: string
                            beneficiaryForbidden:
                              type: array
                              items:
                                type: string
                              description: "Forbidden beneficiaries: the zero address and this group's Inbox / Vault / Registry contracts"
                        withdrawalFee:
                          type: object
                          properties:
                            version:
                              type: string
                            policyHash:
                              type: string
                            recipient:
                              type: string
                            schedules:
                              type: array
                              items:
                                type: object
                                properties:
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  fixedRaw:
                                    type: string
                                  ratePpm:
                                    type: integer
                                  capRaw:
                                    type: string
                            formula:
                              type: string
                            rounding:
                              type: string
                        policy:
                          type: object
                        status:
                          type: object
                        registration:
                          type: string
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - groups
        "400":
          description: Malformed request
        "404":
          description: "Not found (`unknown_custody_group`)"
        "503":
          description: "Ledger read view unavailable or not ready on this node; retry later"
  "/v1/custody/{key}/deposits/{asset}/{version}/{id}":
    get:
      tags:
        - Funds
      summary: Deposit status by receipt
      description: "Status of one deposit by receipt (asset, asset version, `depositId`): ledger status and any deferral reason, the containing cut, and the refund reason. The on-chain detail (escrowed / refunded / credited) is not tracked; `chain` says how to read it from `DepositInbox.depositReceipt`. Deposits are by address: the beneficiary is the receipt's `refundRecipient`, credited to its main account, which the first credited deposit opens if missing."
      operationId: v1_custody_deposit
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the group, 0x 32-byte hex"
        - name: asset
          in: path
          required: true
          schema:
            type: string
          description: "`assetId` (decimal u32)"
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: "`assetVersion` (decimal u64)"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "`depositId` (decimal u64, from 1)"
      responses:
        "200":
          description: Deposit status
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit:
                    type: object
                    properties:
                      custodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                        description: Decimal string
                      depositId:
                        type: string
                        description: Decimal string
                      nextDepositId:
                        type: string
                        description: Decimal string
                      status:
                        type: string
                        enum:
                          - awaiting
                          - credited
                          - rejected
                          - refundPending
                          - refunded
                          - refundedBeforeProcessing
                          - consumed
                        description: "`awaiting`: unprocessed; `credited`: root not yet accepted; `rejected` / `refunded`: still queued; `refundPending`: refund due (incl. `tellerRejected`); `refundedBeforeProcessing`; `consumed`: root accepted (see `chain`)"
                      queuePosition:
                        type: string
                        description: "Position in the ledger queue (0 = next)"
                      refundRequested:
                        type: boolean
                      deferral:
                        type: object
                        description: "Whether the queue-head deposit would be deferred now, and why: `wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                      accountId:
                        type:
                          - integer
                          - "null"
                        description: "Account the receipt resolves to: the credited account, or for a refused receipt the beneficiary's main account; null if none (or the receipt names an account number)"
                      amountRaw:
                        type: string
                      receiptHash:
                        type: string
                      refundRecipient:
                        type: string
                        description: "Original receipt field for the beneficiary; same as `beneficiary`"
                      includedInCut:
                        type:
                          - string
                          - "null"
                        description: "Sequence of the cut containing this row while it is taken but not yet accepted; else null"
                      confirmed:
                        type: boolean
                      reason:
                        type: string
                        enum:
                          - userRequested
                          - accountUnregistered
                          - amountUnrepresentable
                          - creditCapExceeded
                          - liabilityCapExceeded
                          - tellerRejected
                          - unknown
                      chain:
                        type: object
                        description: "Where to read the on-chain detail status (contract, call, status codes) on the custody chain; the gateway does not read it"
                      beneficiary:
                        type: string
                        description: "Beneficiary address, equal to the receipt's `refundRecipient`; refused deposits are refunded to it"
                      creditedAccountId:
                        type:
                          - integer
                          - "null"
                        description: "Credited account when `status` = `credited` (incl. an auto-opened main account); else null"
                      reasonDetail:
                        type:
                          - string
                          - "null"
                        enum:
                          - accountOpeningUnavailable
                          - explicitAccountUnsupported
                          - firstDepositOverAccountCap
                          - accountCapExceeded
                          - null
                        description: "Refines `reason`: `accountOpeningUnavailable` / `explicitAccountUnsupported` (`accountUnregistered`; null if unclear, see `deposits/by-tx/{tx}`) or `firstDepositOverAccountCap` / `accountCapExceeded` (`tellerRejected`)"
                      reasonMessage:
                        type: string
                        description: "Readable explanation of `reason` and `reasonDetail`"
                    required:
                      - custodyKeyHash
                      - assetId
                      - assetVersion
                      - depositId
                      - status
                      - chain
                required:
                  - deposit
        "400":
          description: "Malformed path parameter (`invalid_receipt`)"
        "404":
          description: "Unknown custody group or asset (`unknown_custody_asset`)"
        "503":
          description: "Ledger view not ready; retry"
  "/v1/custody/{key}/deposits/by-tx/{tx}":
    get:
      tags:
        - Funds
      summary: Deposit status by transaction
      description: "Deposits made by one custody-chain transaction: this custody group's `InboxDeposited` logs, each with its ledger status. A reverted transaction yields none."
      operationId: v1_custody_deposit_by_tx
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "Custody group's `custodyKeyHash` (0x-prefixed 32-byte hex)"
        - name: tx
          in: path
          required: true
          schema:
            type: string
          description: Custody-chain transaction hash (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: "This group's deposit receipts in the transaction, with ledger status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  success:
                    type: boolean
                  blockNumber:
                    type: string
                  source:
                    type: string
                  deposits:
                    type: array
                    items:
                      type: object
                      properties:
                        logIndex:
                          type: string
                          description: Decimal string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: Decimal string
                        depositId:
                          type: string
                          description: Decimal string
                        receiptAccountId:
                          type: integer
                          description: "Account number in the on-chain receipt; always 0, as deposits are credited by address. A non-zero one is refunded (`reason` = `accountUnregistered`, `reasonDetail` = `explicitAccountUnsupported`)"
                        beneficiary:
                          type: string
                          description: "Beneficiary address; same as the receipt's `refundRecipient`"
                        refundRecipient:
                          type: string
                          description: "Receipt's original name for the beneficiary; same value as `beneficiary`"
                        amountRaw:
                          type: string
                        sourceKind:
                          type: integer
                        sourceMessageId:
                          type: string
                        receiptHash:
                          type: string
                        deposit:
                          type: object
                          properties:
                            custodyKeyHash:
                              type: string
                            assetId:
                              type: integer
                            assetVersion:
                              type: string
                              description: Decimal string
                            depositId:
                              type: string
                              description: Decimal string
                            nextDepositId:
                              type: string
                              description: Decimal string
                            status:
                              type: string
                              enum:
                                - awaiting
                                - credited
                                - rejected
                                - refundPending
                                - refunded
                                - refundedBeforeProcessing
                                - consumed
                              description: "Ledger status: `awaiting` unprocessed; `credited` root not yet accepted; `rejected` / `refunded` still queued; `refundPending` incl. cap refusals; `consumed` confirmed or refund settled (see `chain`)"
                            queuePosition:
                              type: string
                              description: "Position in the ledger's processing queue (0 = next); decimal string"
                            refundRequested:
                              type: boolean
                            deferral:
                              type: object
                              description: "Whether the head-of-queue deposit would be deferred now, and why: `wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                            accountId:
                              type:
                                - integer
                                - "null"
                              description: "Account the receipt resolves to: the credited account, or the beneficiary's main account if refused; null if none (or the receipt names an account number)"
                            amountRaw:
                              type: string
                            receiptHash:
                              type: string
                            refundRecipient:
                              type: string
                              description: "Receipt's original name for the beneficiary; same value as `beneficiary`"
                            includedInCut:
                              type:
                                - string
                                - "null"
                              description: "Sequence number of the cut containing this row, if taken but not yet accepted; else null"
                            confirmed:
                              type: boolean
                            reason:
                              type: string
                              enum:
                                - userRequested
                                - accountUnregistered
                                - amountUnrepresentable
                                - creditCapExceeded
                                - liabilityCapExceeded
                                - tellerRejected
                                - unknown
                            chain:
                              type: object
                              description: "Where to read the on-chain detail status the ledger does not track (contract, call, status-code table); the gateway does not read it"
                            beneficiary:
                              type: string
                              description: "Beneficiary address, same as the receipt's `refundRecipient`; a refused deposit is refunded to it"
                            creditedAccountId:
                              type:
                                - integer
                                - "null"
                              description: "Credited account when `status` = `credited` (incl. a main account auto-opened by the first deposit); else null"
                            reasonDetail:
                              type:
                                - string
                                - "null"
                              enum:
                                - accountOpeningUnavailable
                                - explicitAccountUnsupported
                                - firstDepositOverAccountCap
                                - accountCapExceeded
                                - null
                              description: "`accountUnregistered`: `accountOpeningUnavailable` (no account can be opened) or `explicitAccountUnsupported` (non-zero account number); null if undecidable (by-tx lookup resolves it). `tellerRejected`: per-account cap"
                            reasonMessage:
                              type: string
                              description: "Human-readable refund reason (from `reason` and `reasonDetail`)"
                          required:
                            - custodyKeyHash
                            - assetId
                            - assetVersion
                            - depositId
                            - status
                            - chain
                required:
                  - transactionHash
                  - success
                  - deposits
        "400":
          description: "Malformed path parameter (`invalid_transaction_hash`)"
        "404":
          description: "Unknown custody group or transaction (`transaction_not_found`)"
        "502":
          description: "Custody-chain RPC error (`chain_rpc_failed`)"
        "503":
          description: "No RPC endpoint for the custody chain (`chain_rpc_unavailable`), or ledger view not ready"
  "/v1/custody/{key}/diagnostics":
    get:
      tags:
        - Funds
      summary: Stuck-funds diagnostics
      description: "Stuck-funds diagnostics for a custody group: ledger-computed values (checkpoint root age, unaccepted cuts, consumption queue and budget, pending refunds and tickets, per-asset unconfirmed credit, deferrals) with alert codes. Items only the chain or submitters know are listed in `external` with source, rule and phase."
      operationId: v1_custody_diagnostics
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` (0x-prefixed 32-byte hex)"
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  certifiedTimeMs:
                    type: string
                    description: Decimal string
                  metrics:
                    type: object
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - no_accepted_root
                            - root_stale
                            - cuts_backlog
                            - consumption_budget_full
                            - unconfirmed_headroom_low
                            - rejected_pending_refund
                            - tickets_outstanding
                            - escape_pending
                            - frozen
                        severity:
                          type: string
                          enum:
                            - info
                            - warning
                            - critical
                        message:
                          type: string
                  external:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        source:
                          type: string
                        rule:
                          type: string
                        phase:
                          type: string
                required:
                  - metrics
                  - alerts
                  - external
        "400":
          description: "Malformed path parameter (`invalid_custody_key_hash`)"
        "404":
          description: "Unknown custody group (`unknown_custody_group`)"
        "503":
          description: "Ledger view not ready on this node; retry later"
  "/v1/accounts/{id}/tickets":
    get:
      tags:
        - Account
      summary: Account withdrawal tickets
      description: "All withdrawal tickets of the account (amount, asset, custody group, cancellation plan); `groups` gives each group's root acceptance progress. On-chain status and reservation time are read on the custody chain from `CustodyVault.ticketTerminal` and `TicketReserved` (see each ticket's `chain`); payment comes no earlier than reservation + `ordinaryPaymentWaitMs`."
      operationId: v1_account_tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        ticketId:
                          type: string
                        custodyKeyHash:
                          type: string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: Decimal string
                        debitRaw:
                          type: string
                        payloadHash:
                          type: string
                        cancelPlanned:
                          type: boolean
                        cancelId:
                          type:
                            - string
                            - "null"
                        ledgerStatus:
                          type: string
                        chain:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - tickets
                  - groups
        "400":
          description: "Malformed path parameter (`invalid_account_id`)"
        "404":
          description: "Not found (`unknown_account`)"
        "503":
          description: "Ledger read view not ready; retry later"
  "/v1/accounts/{id}/funds-history":
    get:
      tags:
        - Account
      summary: Account funds history
      description: |-
        Deposit, refund and withdrawal events of an account; paging as in `/v1/events`.

        - Kinds: `CashDepositCredited`, `DepositRefundPlanned`, `DepositRefundAccounted`, `CashWithdrawalReserved`, `CashWithdrawalCancelPlanned`, `CashWithdrawalAccounted`, `CashWithdrawalCancelled`, `EscapeClaimAccounted`.
        - Refund plans carry `refund{status, reason}`; reserved withdrawals carry `ticket` checkpoint progress, with `estimatedPayableAtMs` an estimate (exact: `TicketReserved` block time).
      operationId: v1_account_funds_history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal)
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`; same as the backfill cursor and the `id` in WebSocket frames"
          description: "Cursor: `next` from the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; required with `upper` when `after` is set (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; required with `epoch` when `after` is set, else 400. Past this replica's complete history: 400 `GatewayHistoryIncomplete`, retry later"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
      responses:
        "200":
          description: One page of funds history
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        data:
                          type: object
                        ts: {}
                        refund:
                          type: object
                        ticket:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - items
        "400":
          description: Malformed path or query parameter
        "404":
          description: "Account not found (`unknown_account`)"
        "503":
          description: "Ledger state not yet available on this node; retry later"
  /v1/governance:
    get:
      tags:
        - Governance
      summary: Council governance overview
      description: "Council governance overview: the current Council (members, threshold, epoch), its nonce window on the `Management` lane (`next` = suggested next nonce), delay policy, proposal quotas, certified time and network `profile`. Send `x-dexos-min-seq` for read-your-writes."
      operationId: v1_governance
      responses:
        "200":
          description: Governance overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  council:
                    type: object
                  councilNonce:
                    type: object
                  delays:
                    type: object
                  proposals:
                    type: object
                  certifiedTimeMs:
                    type: string
                  profile:
                    type: string
        "400":
          description: Malformed parameters or request body
        "503":
          description: "Ledger view not ready; retry"
  /v1/governance/proposals:
    get:
      tags:
        - Governance
      summary: Governance proposals
      description: |-
        All proposals, including terminal ones (a new proposal may reuse a terminal one's slot).

        - `status` is derived at read time; expired / invalidated show without waiting for cleanup.
        - `etaMs` = max(eta at queueing, queueing time + current delay); the delay only increases.
        - `readiness`: `ready` / `notReady` / `expired` / `invalidated` / `terminal`.
      operationId: v1_governance_proposals
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      type: object
        "400":
          description: Malformed parameter or body
        "503":
          description: "Ledger read view unavailable or not ready on this node; retry later"
  "/v1/governance/proposals/{id}":
    get:
      tags:
        - Governance
      summary: Governance proposal detail
      description: "One governance proposal: every operation field (decoded as WASM `inspect`), preconditions, execution window, and `originalEnvelope` (the signed command, canonically encoded; anyone can recompute its digest and recover signers with the WASM SDK)."
      operationId: v1_governance_proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Proposal id (= the `actionId` of the queued envelope)"
      responses:
        "200":
          description: Proposal details
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
        "400":
          description: Malformed parameter or request body
        "404":
          description: Not found (or id reused by a newer proposal)
        "503":
          description: "Ledger state not ready on this node; retry later"
  /v1/governance/preconditions:
    post:
      tags:
        - Governance
      summary: Compute governance preconditions
      description: "Computes from current ledger state the preconditions table and hash, delay and delay class a governance operation must carry. Read-only. Body as for WASM `governanceProposal`: field-by-field JSON or `{\"canonical\": \"0x...\"}`. If not computable, `ok = false` with the reason."
      operationId: v1_governance_preconditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: object
              required:
                - operation
        description: The operation to compute preconditions for
      responses:
        "200":
          description: Preconditions and delay
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  preconditions:
                    type: array
                    items:
                      type: object
                  preconditionsHash:
                    type: string
                    description: "0x-prefixed hex"
                  delayMs:
                    type: string
                  delayClasses:
                    type: array
                    items:
                      type: string
                  operation:
                    type: object
                  error:
                    type: object
        "400":
          description: "Malformed parameter or body (`invalid_json` / `invalid_operation`)"
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/governance/simulate:
    post:
      tags:
        - Governance
      summary: Simulate a governance envelope
      description: "Dry-runs a governance envelope (propose, submit-and-execute, execute-proposal or cancel-proposal; signed or unsigned): checks fields, epoch, validity window, threshold signatures, nonce, preconditions and the operation, and reports `outcome.kind` with `etaMs` or the rejection reason. Nothing is applied."
      operationId: v1_governance_simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: "0x-prefixed hex"
              required:
                - command
        description: "One signed command, canonical encoding; other command types return 400 `not_an_authenticated_command`"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation:
                    type: object
        "400":
          description: Malformed parameters or request body
        "503":
          description: "Ledger view not ready; retry"
  /v1/governance/services:
    get:
      tags:
        - Governance
      summary: Services and Council grants
      description: Service configurations (id, epoch, purpose, members and threshold, scope) and Council-issued grants, including revoked ones, with current-window usage.
      operationId: v1_governance_services
      responses:
        "200":
          description: Services and grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                  councilGrants:
                    type: array
                    items:
                      type: object
        "400":
          description: Malformed parameter or request body
        "503":
          description: "Ledger read view unavailable or not ready on this node; retry later"
  /v1/governance/signatures:
    get:
      tags:
        - Governance
      summary: Signature collections
      description: "Originals in the Council signature inbox, newest first, with progress and status (computed on read). `councilNonce.next` = max(ledger next, highest pending nonce + 1) is the nonce for the next Council original; `limit=0` returns only that. `status=queue` lists the pending set (collecting, ready and still-live withdrawn originals) in nonce order, unpaged. Other statuses page with `after` = the previous `next`."
      operationId: v1_governance_collections
      responses:
        "200":
          description: Collection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  certifiedTimeMs:
                    type: string
                    pattern: "^[0-9]+$"
                  council:
                    type: object
                    properties:
                      epoch:
                        type: string
                        pattern: "^[0-9]+$"
                      threshold:
                        type: integer
                      members:
                        type: array
                        items:
                          type: string
                  councilNonce:
                    type: object
                    properties:
                      lane:
                        type: string
                      epoch:
                        type: string
                        pattern: "^[0-9]+$"
                      floor:
                        type: string
                        pattern: "^[0-9]+$"
                      high:
                        type: string
                        nullable: true
                      ledgerNext:
                        type: string
                        pattern: "^[0-9]+$"
                      pendingMin:
                        type: string
                        nullable: true
                      pendingMax:
                        type: string
                        nullable: true
                      next:
                        type: string
                        pattern: "^[0-9]+$"
                      maxSpan:
                        type: integer
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        requestId:
                          type: string
                          pattern: "^0x[0-9a-f]+$"
                        digest:
                          type: string
                          pattern: "^0x[0-9a-f]+$"
                        category:
                          type: string
                          enum:
                            - proposal
                            - root
                            - legacy
                        payloadKind:
                          type: string
                        operation:
                          type: string
                          nullable: true
                        proposalId:
                          type: string
                          nullable: true
                        market:
                          type: integer
                          nullable: true
                        nonce:
                          type: string
                          pattern: "^[0-9]+$"
                        validUntilMs:
                          type: string
                          pattern: "^[0-9]+$"
                        authorityEpoch:
                          type: string
                          pattern: "^[0-9]+$"
                        epochCurrent:
                          type: boolean
                        threshold:
                          type: integer
                          nullable: true
                        ready:
                          type: boolean
                        status:
                          type: string
                          enum:
                            - landed
                            - withdrawn
                            - staleEpoch
                            - expired
                            - nonceBelowFloor
                            - nonceUsed
                            - ready
                            - collecting
                        ledger:
                          type: object
                          nullable: true
                          properties:
                            status:
                              type: string
                              enum:
                                - Accepted
                                - Executed
                            outcome:
                              type: string
                              nullable: true
                            stableError:
                              type: string
                              nullable: true
                            errorCode:
                              type: integer
                              nullable: true
                            nonce:
                              type: string
                              pattern: "^[0-9]+$"
                            digestMatches:
                              type: boolean
                        nonceConsumed:
                          type: boolean
                          nullable: true
                        withdrawn:
                          type: object
                          nullable: true
                          properties:
                            reason:
                              type: string
                              enum:
                                - withdrawn
                                - superseded
                            replacedBy:
                              type: string
                              nullable: true
                            atMs:
                              type: string
                              pattern: "^[0-9]+$"
                        meta:
                          type: object
                          nullable: true
                          additionalProperties: false
                          properties:
                            reference:
                              type: string
                            kind:
                              type: string
                            label:
                              type: string
                            group:
                              type: string
                            groupIndex:
                              type: integer
                            groupSize:
                              type: integer
                            after:
                              type: array
                              items:
                                type: string
                        source:
                          type: string
                          enum:
                            - admin
                            - public
                            - migrated
                        registeredBy:
                          type: string
                          nullable: true
                        createdMs:
                          type: string
                          pattern: "^[0-9]+$"
                        updatedMs:
                          type: string
                          pattern: "^[0-9]+$"
                        signers:
                          type: array
                          items:
                            type: string
                        signatures:
                          type: integer
                        membership:
                          type: object
                          nullable: true
                        membershipSignatures:
                          type: integer
                  next:
                    type:
                      - string
                      - "null"
                    description: "Pass as `after` for the next page; null on the last page"
        "400":
          description: "Malformed query parameter (`invalid_status`, `invalid_address`, `invalid_category`, `invalid_group`, `invalid_limit`, `invalid_after`)"
        "503":
          description: "Ledger read view or signature store (`signature_store_unavailable`) unavailable; retry later"
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - queue
              - pending
              - collecting
              - ready
              - landed
              - withdrawn
              - dead
              - staleEpoch
              - expired
              - nonceBelowFloor
              - nonceUsed
          description: "`queue` = pending set in nonce order; `pending` = collecting + ready; `dead` = staleEpoch + expired + nonceBelowFloor + nonceUsed. Default `all`, or `pending` with `unsignedBy`"
        - name: unsignedBy
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "Only originals this address still has to sign (as a current Council member, or as a new member's acceptance)"
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - proposal
              - root
          description: "`proposal` (144 / 145 / 147) or `root` (154 / 0x0B / 0xDF)"
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: "Exact `meta.group` set by the proposer"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1024
            default: 100
          description: "Page size 0..1000, default 100 (`queue`: up to and default 1024); 0 returns only `councilNonce`"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "Cursor from `next` (`<createdMs>-<requestId>`); the page starts after it. Ignored with `status=queue`"
    post:
      tags:
        - Governance
      summary: Submit governance signatures
      description: "Adds member signatures to an original, or creates it with at least one current Council member signature (a `dexos-gov-signatures/v1` export is accepted too). Collects Council 144 / 145 / 147 and root actions 154 / 0x0B / 0xDF, not 146. A new original passes the same checks as a registered one: network, current Council epoch, validity of at most 72 h, nonce window, no clash with another live original. Signers are recovered server-side."
