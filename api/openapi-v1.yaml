                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: EVM address, lower-case
                  subaccount:
                    type: integer
                  vault:
                    type: integer
                    description: "Replaces `address` / `subaccount` when the request named a `vault`"
                  orders:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/account/orders/history:
    get:
      tags:
        - Account
      summary: Order history
      description: |-
        This account's order events, one per row: accepted / fill / canceled / expired, plus placed / triggered / rejected / autocanceled for conditional orders.

        - Paged with the same cursor as `/v1/events` (`after` / `upper` / `hasMore`); `order=desc` = newest first.
        - Fold by `orderId` for one row per order.
        - A TWAP's `startMs` is the ledger time its parent order executed (the row's `ts`).
      operationId: v1_order_history
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; case-insensitive, lower-case in responses"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account (lowest-numbered single-signer account); N >= 1 = subaccount opened with index N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Mutually exclusive with `address` / `subaccount` (400); unknown vault = 404. The response then has `vault` instead of `address` / `subaccount`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); merchant dex markets are `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Only this market
        - "$ref": "#/components/parameters/MarketKind"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`; identical to the backfill cursor and the WebSocket frame `id`"
          description: "Cursor: the previous page's `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; required with `upper` when `after` is given (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; required with `epoch` when `after` is given (else 400). Beyond this replica's complete history: 400 `GatewayHistoryIncomplete`, retry later"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = newest first: the first page starts at `upper` and `next` pages toward older rows. Keep the same `order` on every page of a walk"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address; case-insensitive, lower-case in responses"
                  subaccount:
                    type: integer
                  vault:
                    type: integer
                    description: "Present instead of `address` / `subaccount` when a vault was addressed (`vault=<id>`)"
                  epoch:
                    type: string
                  upper:
                    type: string
                  orders:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OrderEvent"
                  next:
                    type:
                      - string
                      - "null"
                  hasMore:
                    type: boolean
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
