      description: "CCTP 入金报价(GW-CCTP D1):给出入金按地址(AD)的 160 字节绑定 hookData `CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)` 与源链 `TokenMessengerV2.depositForBurnWithHook` 的 calldata(mintRecipient = destinationCaller = 该组 DepositInbox,minFinalityThreshold = 2000)。编码只此一份(`dex_chain_io::cctp::quote::InboxBurn`),与 `conformance/security-fixtures/security-v2/cctp-vectors.json` 金样逐字节相同。网关不代签、不代发、不登记:钱包自己在源链先 approve(`burn.approve`)再发 `burn.calldata` 给 `burn.to`。maxFeeRaw 缺省取源链 `getMinFeeAmount(amount)`(源链 RPC 取 `CUSTODY_RPC_URLS` 里该链号的上游;读不到又没给 maxFeeRaw = 503,不按 0 处理)。会在 hub 被 revert 或走 Late 退款的一律拒绝、不给 burn:受益地址为零或本组合约 400 beneficiary_forbidden;来源未在 Inbox 登记 409 cctp_source_not_registered;最低额未配置 422 min_deposit_not_configured;到账下限 minCreditRaw = amountRaw − maxFeeRaw 低于最低额 422 below_min_deposit;受益地址是合约(非 EIP-7702 委托)422 beneficiary_not_signable;maxFeeRaw 低于源链最低费 422 max_fee_below_minimum;maxFeeRaw ≥ amountRaw 422 amount_unrepresentable;组冻结 / 逃生中 409 custody_group_unavailable;资产尚未开放入金 409 deposit_not_enabled。账本侧(开户、上限)的预判见返回的 `precheck` 链接(`deposit-precheck?route=cctp`)。只读、建议性。"
