  "/v1/vaults/{id}/transitions/{source}/{ordinal}":
    get:
      tags:
        - Vaults
      summary: Get vault async task status
      operationId: v1_vault_transition
      description: "Look up a vault claim or deposit task by the original request's log sequence (`source`) and logical command ordinal (`ordinal`). `pending` comes from the vault's current task; the final states `succeeded` / `rejected` come from the confirmation command recorded in the durable execution history, not from the reusable task slot. A `wait=fold` receipt for the initial payment request does not mean the mint, refund or authorization has reached a final state; use this endpoint for that. Returns 503 when history is unavailable or the read model has not yet reached `source` (retry later); returns 404 when the read model has passed `source` but the available history has no record of the task -- this is not a business failure."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Vault id
        - name: source
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
            description: "Full u64 log sequence number as a decimal string (keeps precision beyond 2^53)."
          description: "Full log sequence number of the original request (not the confirmation's log sequence)"
        - name: ordinal
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Logical command ordinal within the original request (not the physical record sub-index)
      responses:
        "200":
          description: Current pending state or durable final state
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "Full u64 log sequence number as a decimal string (keeps precision beyond 2^53)."
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                  - type: object
                    required:
                      - status
                      - sourceLogIdx
                      - sourceOrdinal
                      - slot
                      - errorCode
                      - confirmationSeq
                      - confirmationSub
                    properties:
                      status:
                        type: string
                        enum:
                          - succeeded
                          - rejected
                      sourceLogIdx:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "Full u64 log sequence number as a decimal string (keeps precision beyond 2^53)."
                      sourceOrdinal:
                        type: integer
                        minimum: 0
                        maximum: 65535
                      slot:
                        type: integer
                        minimum: 0
                        maximum: 4095
                      errorCode:
                        type: integer
                        minimum: 0
                        maximum: 65535
                        description: "0 on success; on failure, the numeric ledger error code of the original command."
                      confirmationSeq:
                        type: string
                        pattern: "^[0-9]+$"
                        description: "Full u64 log sequence number as a decimal string (keeps precision beyond 2^53)."
                      confirmationSub:
                        type: integer
                        minimum: 0
                        maximum: 65535
        "400":
          description: Invalid path parameter
        "404":
          description: "The read model has passed `source` but the available history has no record of the task; this does not mean `rejected`"
        "500":
          description: The confirmation record in the execution history is corrupt
        "503":
          description: "The read model or execution history is unavailable, or the read model has not yet reached the original request's log sequence (`source`); retry later"
  /v1/account/subaccounts/name:
    post:
      tags:
        - Account
      summary: Rename a subaccount
      operationId: v1_subaccount_name
      description: |-
        Gateway-only (the name is not part of the ledger). Not sequenced: no `seq` / `requestId`.

        **Security ledger** (node started with a security Manifest): body `{account: main account id, subaccount: index (0 = main), name, nonce, policyEpoch, signatures: [...]}` (first `oneOf` branch). Members of the main account policy sign `x-eip712.securityTypeString` in domain `DEXOS/SubaccountName` (version 1, chainId = Manifest `nodeChainId`, verifyingContract = Manifest `nodeVerifier`) up to the policy threshold; `networkId`, `genesisHash` and `ledgerEpoch` come from the Manifest, `policyId` / `policyEpoch` from `GET /v1/security/accounts/{id}`. The SDK (`dex_sdk::offchain`) and sdk-wasm (`subaccountName`) build the digest and the `eth_signTypedData_v4` payload. Names and nonces are kept per ledger identity (`genesisHash`, `ledgerEpoch`): a new ledger starts with no names and no nonce floor. Read back as `name` in `GET /v1/account/subaccounts`.

        **Legacy ledger**: body `{account: address, subaccount, name, nonce, signature}` (second branch); the owner signs `x-eip712.typeString`.

        Either way `nonce` must be greater than the last name write of this subaccount (409 `GatewayConflict` otherwise).

        **EIP-712 struct**

        ```
        SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ```

        **Security-ledger struct** (domain `DEXOS/SubaccountName`)

        ```
        SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ```
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - title: Security ledger
                    type: object
                    required:
                      - status
                      - account
                      - subaccount
                      - name
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      account:
                        type: integer
                        format: int64
                        description: Main account id, as sent
                      subaccount:
                        type: integer
                        description: "Subaccount index, as sent (0 = main account)"
                      name:
                        type: string
                        description: The stored name, exactly as signed
                  - title: Legacy ledger
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      address:
                        type: string
                        pattern: "^0x[0-9a-f]{40}$"
                        description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                      subaccount:
                        type: integer
                      name:
                        type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          description: "Bad signature (`GatewayBadSignature`): below the policy threshold, a signer that is not a member, the same signer twice, more signatures than members, or a signature over another domain / message"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "`GatewayConflict`: the nonce is not greater than the last name write of this subaccount (`details.subaccount`), or (security ledger) `policyEpoch` is not the current policy epoch (`details.policyEpoch` = current)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Security ledger
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - policyEpoch
                    - signatures
                  properties:
                    account:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 4294967295
                      description: "Main account id (the policy account). A subaccount or other derived account id is 400; an unknown account is 404."
                    subaccount:
                      type: integer
                      minimum: 0
                      maximum: 65535
                      description: "Subaccount index of this main account; 0 names the main account itself. An index that was never opened is 404."
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: "1–32 Unicode scalar values; no leading or trailing whitespace (Unicode White_Space) and no control or format characters (Unicode Cc / Cf, e.g. NUL, newline, U+200B, U+202E, U+FEFF). Sent exactly as signed: the gateway does not trim, so a name outside this rule is 400, not 401."
                    nonce:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                          maximum: 9223372036854776000
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "JSON integer or decimal string in [0, 2^63). Must be greater than the last accepted name write of this (ledger, account, subaccount) — 409 `GatewayConflict` otherwise; a Unix-ms timestamp works."
                    policyEpoch:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "The account policy epoch that was signed (`policyEpoch` of `GET /v1/security/accounts/{id}`). Not the current epoch: 409 `GatewayConflict` with `details.policyEpoch` (decimal string) = the current one."
                    signatures:
                      type: array
                      minItems: 1
                      maxItems: 16
                      items:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{130}$"
                      description: "65-byte secp256k1 signatures (r ‖ s ‖ v) over the EIP-712 digest of `x-eip712.securityTypeString` in domain `x-eip712.securityDomain`, one per signing member of the main account policy, in any order. v may be 27/28 or 0/1; high-s is normalised to low-s. At least the policy threshold, no signer twice, every signer a member, and no more signatures than the policy has members (at most 16) — 401 `GatewayBadSignature` otherwise (more than 16 is 400)."
                - title: Legacy ledger
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - signature
                  properties:
                    account:
                      type: string
                      pattern: "^0x[0-9a-f]{40}$"
                      description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                    subaccount:
                      type: integer
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                    nonce:
                      type: integer
                      format: int64
                      description: Any value greater than the previous name write (a Unix-ms timestamp works)
                    signature:
                      type: string
                      pattern: "^0x[0-9a-fA-F]{130}$"
                  description: "Legacy ledger only: the owner address signs `SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)` (`x-eip712.typeString`). Refused with 400 on a security ledger."
      x-eip712:
        typeString: SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        securityTypeString: SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        securityDomain: DEXOS/SubaccountName
  /v1/commands:
    post:
      tags:
        - Security
      summary: Submit a signed command
      description: |-
        Submit one complete, newly signed command. The body is `{"command": "0x…"}`: the command's canonical binary
        encoding as lower-case hex, exactly as the SDK produces it. The gateway does not sign, complete or change
        anything: the nonce, the validity window and all signatures must already be in the command. Query parameters
        are not accepted (400 `unsupported_submission_parameter`).

        **Responses**

        - `202`: the command was sequenced (`status: "Accepted"`). The body carries `requestId` (the id to look up the
          receipt with), `digest` (the digest of the exact signed version), `commandHash`, `seq` / `sub` (its position in
          the log; `seq` is also in the `x-dexos-seq` header) and the network identity (`networkId`, `genesisHash`,
          `ledgerEpoch`, `manifestHash`). Sequenced is not the same as authorized or executed: `executionKnown` is
          `false` and `nonceConsumed` is `null`.
        - `200`: the identical command (same `requestId` and `digest`) was already admitted by the ledger. The body is
          the receipt of the first admission, as returned by `GET /v1/requests/{requestId}`, with `duplicate: true`;
          `seq` / `sub` and `x-dexos-seq` are those of the first admission. Nothing is sequenced again.
        - `400` / `403` / `409` / `422` / `429`: refused by the gateway before sequencing; the nonce is untouched
          (`nonceConsumed: false`). Common codes: `malformed_security_command`, `unsupported_security_command`,
          `invalid_signature`, `nonce_below_floor`, `grant_expired` (400); builder checks (400 / 403);
          `409 GatewayDuplicateClientOrderId`; `422 GatewayCollateralTokenMismatch`; `429 GatewayRateLimited`.
        - `421`: this node does not accept writes; send the same command to another node.
        - `503`: see the response below. With `submissionOutcome: "Unknown"` the command may still execute.

        **Confirming the outcome**: poll `GET /v1/requests/{requestId}` (optionally with `?digest=<digest>` and
        `x-dexos-min-seq: <seq>`) until `status` is `Executed` or `AuthorizationRejected`. If a submission times out
        (the gateway waits at most about 10 seconds) or its outcome is unknown, do not assume it failed: resubmit only
        the identical command bytes. An admitted command is answered with `200` and `duplicate: true`, and a concurrent
        duplicate is rejected by the ledger's nonce check, so the command never executes twice.

        **Network pinning**: send `x-dexos-expect-manifest: <manifestHash>` (from `GET /v1/security/network`) to make
        sure the node serves the network you signed for. A node bound to a different network answers
        `503 upstream_manifest_mismatch` with its own `manifestHash`. Send the header at most once.

        **Rate limits**: a command weighs `1 + floor(n / 40)`, where `n` counts the orders, cancels and modifications
        in it. Once its signatures are verified against the signing principal, the weight is charged to that
        principal's account budget (`429` with `details.bucket = account`). A command whose signers the gateway cannot
        verify yet is charged at full weight to a smaller per-IP `unverified` budget and, within it, still passed to the
        ledger, which decides.

        **Client order ids**: a signed order may carry a `clientOrderId` of 1-36 characters from `[A-Za-z0-9._:/-]`.
        Reusing an id that an earlier admitted command of the same account used returns
        `409 GatewayDuplicateClientOrderId` (a command rejected during authorization does not use up its id; one that
        was admitted and then failed business checks does). Two concurrent commands with the same id can both be
        admitted before either is visible. TWAP and TP/SL orders have no client order id, and cancels and
        modifications address orders by `orderId`, not by client order id. If the id index is unavailable the answer is
        `503 client_order_index_unavailable`.

        **Builder orders**: when a command routes orders through a builder, the gateway checks the builder before
        sequencing: unknown builder `400 GatewayBuilderUnknown`; disabled builder `403 GatewayBuilderDisabled`; the
        account has not approved the builder `403 builder_not_approved`; market not in the builder's listing
        `403 GatewayBuilderMarketNotListed`; an order that is not reduce-only on a market that is close-only for the
        builder `403 GatewayBuilderMarketCloseOnly` (`details` = `{builder, markets}`). Order modifications are checked
        for close-only against the original order's builder, routed or not. Orders not routed through a builder skip
        the listing checks. When the gateway cannot decide, the command is passed on and the ledger decides; if the
        builder listing is unavailable the answer is `503 GatewayUnavailable`.

        **Settlement token**: new orders on a perpetual market are refused with `422 GatewayCollateralTokenMismatch`
        when the account holds a positive balance but none of it in that market's settlement token, and has no position
        in that market (`details` = `{symbol, kind: "perp", settleToken}`). Accounts with no balance at all, or holding
        the settlement token, are not affected.

        **Backpressure**: while the node is behind on persisting execution results, new writes are paused with
        `503 GatewayHistoryBackpressure` and `Retry-After`; cancels still pass.
      operationId: v1_security_command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command
              properties:
                command:
                  type: string
                  pattern: "^0x[0-9a-f]+$"
                  minLength: 6
                  maxLength: 2097154
                  description: "The complete signed command in its canonical binary encoding: `0x` followed by an even number of lower-case hex digits (at most 1 MiB once decoded). Decoding and re-encoding the bytes must give exactly the same bytes; otherwise the answer is 400 `malformed_security_command`."
      responses:
        "200":
          description: "The identical signed command (same `requestId` and `digest`) was already admitted by the ledger: the receipt of the first admission, with `duplicate: true`. `seq` / `sub` and `x-dexos-seq` are those of the first admission; nothing is sequenced again."
          headers:
            x-dexos-seq:
              "$ref": "#/components/headers/x-dexos-seq"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityCommandResubmitted"
        "202":
          description: "Sequenced: the command has a position in the log (`seq`, `sub`; `seq` is also in `x-dexos-seq`). This does not mean it passed authorization or executed (`executionKnown: false`, `nonceConsumed: null`); confirm the outcome with `GET /v1/requests/{requestId}`."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityCommandAccepted"
        "400":
          description: "Refused before sequencing (`status: \"RejectedBeforeAdmission\"`, `nonceConsumed: false`): a malformed or non-canonical body (`malformed_security_command`), a command type this endpoint does not accept (`unsupported_security_command`), an invalid request identity (`invalid_security_identity`), a query parameter (`unsupported_submission_parameter`), a failed signature pre-check (`invalid_signature_encoding`, `invalid_signature`, `signature_order`, `threshold_not_met`, `authority_epoch_mismatch`, `grant_revoked`, `grant_expired`, `nonce_below_floor`, `address_already_has_account`, `precheck_rejected`), or a builder named in the command that is not registered (`GatewayBuilderUnknown`)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "403":
          description: "Builder pre-check refusal (`status: \"RejectedBeforeAdmission\"`, not sequenced, `nonceConsumed: false`): the builder is disabled (`GatewayBuilderDisabled`), the account has not approved the builder (`builder_not_approved`), the market is not in the builder's listing (`GatewayBuilderMarketNotListed`), or the market is close-only for the builder and the order is not reduce-only (`GatewayBuilderMarketCloseOnly`). `details` carries `builder` (and `markets` for the listing checks)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "408":
          description: "Timed out reading the request body (`security_command_body_timeout`); nothing was submitted."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "409":
          description: "GatewayDuplicateClientOrderId: an admitted earlier command for the same account used this signed cid. RejectedBeforeAdmission; nonceConsumed=false. Resubmitting the same signed payload of an admitted command returns 200 with the first receipt instead."
        "413":
          description: "The body or the command exceeds a size limit of the network (`security_command_too_large`, `security_command_body_unavailable`); nothing was submitted."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "415":
          description: "The `content-type` must be `application/json` (`json_content_type_required`)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "421":
          description: "This node does not accept writes: it is a read-only replica (`read_only_replica`) or not the current leader (`not_leader`); `leader` is the leader's node id as a decimal string when known. Send the same command to another node."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "422":
          description: "Settlement-token pre-check (`GatewayCollateralTokenMismatch`, num 10422): the account holds a positive balance but none in the perpetual market's settlement token, and has no position in that market. Not sequenced; the nonce is not consumed."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "`GatewayRateLimited` with `retry-after`; not sequenced. `details.bucket` names the exhausted budget: `ip` (the shared per-IP budget), `account` (the budget of the verified signing principal) or `unverified` (a smaller per-IP budget, charged at full weight, for commands whose signers the gateway could not verify: a signature that does not match a member, fewer signatures than the threshold, an API-wallet grant that is not available, or an account the gateway has not seen yet)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "Not processed, or outcome unknown. With `submissionOutcome: \"Unknown\"` (`submission_timeout`, `submission_outcome_unknown`; `nonceConsumed: null`) the command may still execute: look it up with `GET /v1/requests/{requestId}` and resubmit only the identical command. Other cases are refused before sequencing: `GatewayHistoryBackpressure` (writes paused, see `Retry-After`), `client_order_index_unavailable`, `upstream_manifest_mismatch` (`x-dexos-expect-manifest` does not match this node's network), `GatewayUnavailable` (a pre-check dependency such as the builder listing is unavailable)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
  "/v1/security/markets/{id}/oracle":
    get:
      tags:
        - Security
      summary: Market oracle round parameters (reporters / relays)
      description: "Oracle round parameters for a market, used by reporters to sign reports and by relayers to assemble rounds. `oracle` contains every parameter a reporter signs (a report's round = `currentRound + 1`; policyVersion / feed / set / unitHash must match exactly), plus the set threshold `threshold`, the minimum number of independent source families, the freshness window, the algorithm parameters, the evidence size limit, the previous effective reference price, and for each set member its bound sources / source families and last accepted `reporterSequence` (the next report must use a strictly greater one). Read-only view; the ledger still decides whether a round forms; u64 values are strings. 404 if the market does not exist or has no oracle policy; 503 if the security read view is unavailable. Also carries `marketDex`, `oracleStale` and the ownership of the feed and reporter set (`feedOwner` / `feedDex`, `setOwner` / `setDex`; `Protocol` or `Dex`). `setCurrentEpoch` is the reporter set's current epoch (reports sign it; sequences are read at it) and `setFollowing` says whether the policy follows the set (`setEpoch` = \"0\"). A recipe feed (`sourceType` 3) also carries its `recipe` and `recipeHash` (the hash DXR2 evidence must start with); other feeds have both null."
      operationId: v1_security_market_oracle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: Market id (u16)
      responses:
        "200":
          description: Oracle round parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  inputSeq:
                    type: string
                  hostLogIndex:
                    type: string
                  inputPrefix:
                    type: string
                  oracle:
                    type: object
                    properties:
                      marketId:
                        type: integer
                      policyVersion:
                        type: string
                      policyStatus:
                        type: integer
                      feedId:
                        type: string
                      feedVersion:
                        type: string
                      sourceType:
                        type: integer
                      setId:
                        type: string
                      setEpoch:
                        type: string
                      setCurrentEpoch:
                        type:
                          - string
                          - "null"
                        description: "Current epoch of the reporter set (u64 string); null when the set is missing"
                      setFollowing:
                        type: boolean
                        description: "The policy follows the reporter set's current epoch (setEpoch = \"0\")"
                      recipe:
                        type:
                          - object
                          - "null"
                        description: Price recipe of a recipe feed (sourceType 3), null otherwise
                        properties:
                          venues:
                            type: array
                            description: In venue number order
                            items:
                              type: object
                              properties:
                                venue:
                                  type: integer
                                  description: Price venue number (GET /v1/security/price-venues)
                                symbol:
                                  type: string
                                quote:
                                  type: string
                                  enum:
                                    - USD
                                    - USDT
                                    - USDC
                                weightBps:
                                  type: integer
                          minVenues:
                            type: integer
                          minWeightBps:
                            type: integer
                          maxVenueDeviationBps:
                            type: integer
                      recipeHash:
                        type:
                          - string
                          - "null"
                        description: "0x hex of the recipe hash (domain DEXOS/PriceRecipe/v1); null for other feeds"
                      algorithmId:
                        type: integer
                      algorithmVersion:
                        type: integer
                      currentRound:
                        type: string
                      unitHash:
                        type: string
                      priceDecimals:
                        type: integer
                      priceUnit:
                        type: object
                        properties:
                          numerator:
                            type: string
                          denominator:
                            type: string
                      minIndependentSources:
                        type: integer
                        description: Minimum number of independent source families per round
                      freshnessMs:
                        type: string
                        description: Report freshness window (ms, u64 string)
                      futureSkewMs:
                        type: string
                        description: Maximum amount an observation timestamp may be ahead of trusted time (ms)
                      parameters:
                        type: object
                        description: "Algorithm parameters as stored: `schemaId` / `schemaVersion` / `fields[{fieldId, kind, value}]` (u64 / u128 / i128 values are decimal strings)"
                      maxEvidenceBytes:
                        type: integer
                        description: Maximum evidence size in bytes
                      reference:
                        type:
                          - object
                          - "null"
                        description: "Previous effective price under the same policy version `{policyVersion, priceAtoms}`; null for the first round of a new policy version"
                        properties:
                          policyVersion:
                            type: string
                          priceAtoms:
                            type: string
                      threshold:
                        type:
                          - integer
                          - "null"
                        description: "Reporter set threshold (minimum number of reports per round); null when the set does not exist"
                      reporters:
                        type: array
                        description: "Set members (ascending): address, last accepted sequence (in the set's current epoch; `\"0\"` if none), and bound sources and source families"
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            sequence:
                              type: string
                            sources:
                              type: array
                              items:
                                type: object
                                properties:
                                  sourceId:
                                    type: string
                                  sourceFamily:
                                    type: string
                      marketDex:
                        type: integer
                        description: "Dex the market belongs to (its dex authority sets the market's oracle policy)"
                      oracleStale:
                        type: boolean
                        description: Ledger oracle-stale flag of the market
                      feedOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: Owner of the policy feed
                      feedDex:
                        type:
                          - integer
                          - "null"
                      setOwner:
                        type:
                          - string
                          - "null"
                        enum:
                          - Protocol
                          - Dex
                          - null
                        description: "Owner of the reporter set; null when the set is not configured"
                      setDex:
                        type:
                          - integer
                          - "null"
        "404":
          description: The market does not exist or has no oracle policy
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  /v1/security/merchant-admission:
    get:
      tags:
        - Security
      summary: Merchant admission
      description: "Merchant admission (the accounts allowed to register a dex) and the instance's configured identity, read from one published ledger snapshot: the instance (`networkId` / `genesisHash` / `ledgerEpoch` / `manifestHash`) and the snapshot position (`inputSeq` / `hostLogIndex` / `inputPrefix`)."
      operationId: v1_security_merchant_admission
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - admission
                    properties:
                      admission:
                        "$ref": "#/components/schemas/SecurityMerchantAdmission"
        "503":
          description: "The ledger read view is not available yet; retry later"
  /v1/security/price-venues:
    get:
      tags:
        - Security
      summary: Price venues
      description: "The ledger's price venue table, set by Council governance: every registered venue by number, ascending, with its name (1 to 16 bytes of a-z, 0-9 and -, unique, fixed once registered), whether it is enabled, and its own version (a number never registered has version 1; the Council passes `version` as `expectedVersion` when changing the venue). Oracle recipes reference venues by number; reporters treat a disabled venue as unavailable for the round. Empty at genesis; one ledger snapshot, u64 values as decimal strings."
      operationId: v1_security_price_venues
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - venues
                    properties:
                      venues:
                        type: array
                        items:
                          type: object
                          required:
                            - venue
                            - name
                            - enabled
                            - version
                          properties:
                            venue:
                              type: integer
                              minimum: 0
                              maximum: 65535
                            name:
                              type: string
                            enabled:
                              type: boolean
                            version:
                              type: string
                              description: decimal u64
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/security/business-parameters:
    get:
      tags:
        - Security
      summary: Business parameters
      description: |-
        Current values and versions of the business parameters, all read from one ledger cut; u64 values are decimal strings. When the Council changes a parameter, it passes that parameter's current `version` as `expectedVersion`.

        - The merchant registration switch, the registration capacity and the checkpoint period.
        - `custodyGroups`: per custody group, the withdrawal routes / CCTP evidence, finality policies, transfer policies and deposit credit staleness.
        - `platformFees{version, default, builders, accounts, dexes}`: platform fees. `default` = the exchange-wide default `{takerPpm, makerPpm}`, or null; `builders` = `[{builder, takerPpm, makerPpm}]`; `accounts` = `[{builder, account, takerPpm, makerPpm}]`; `dexes` = `[{dex, builder}]`, the builder whose (builder, account) and builder layers bill orders that carry no builder on that merchant dex's markets. Each list is ascending by key.
        - `vaultAdmission{version, enabled, creationFee, minDeposit}`: vault admission; amounts are decimal strings.
        - `feeSchedule{version, baseTakerPpm, baseMakerPpm, tiers: [{takerPpm, makerPpm}]}`: base fee rates and fee tiers; maker rates may be negative.
        - `maxMarketsPerDex{max, version}`: the per-dex market cap; every market of the dex counts, including frozen and final-settled ones.
        - `priceVenues` = `[{venue, name, enabled, version}]` ascending by venue: the price venue table. A venue is never renamed and its number is never reused; `version` goes into `expectedVersion` (use 1 for a venue that is not registered yet).
      operationId: v1_security_business_parameters
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  "/v1/security/reporter-sets/{id}/followers":
    get:
      tags:
        - Security
      summary: Markets following a reporter set
      description: "Markets whose current oracle policy follows reporter set `id` (a FeedRef with `setId = id` and `setEpoch = 0`); use it to see which markets a change of the set's operators affects. Returns `setId`, `setEpoch` (the set's current epoch; null when the set does not exist) and `followers` = `[{market, dex, policyVersion, policyStatus, minIndependentSources}]` ascending by market. Policies pinned to a specific epoch are not listed. 400 `invalid_reporter_set` when `id` is not a decimal u64."
      operationId: v1_security_reporter_set_followers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: reporter set id (decimal u64)
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: invalid_reporter_set
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  "/v1/security/oracle-resources/{kind}/{id}":
    get:
      tags:
        - Security
      summary: Oracle resource configuration
      description: "`kind` 1 = Feed, 2 = ReporterSet; `id` is a 32-byte lowercase hex key holding the nonzero integer id in its low 64 bits, left-padded with zeros. Returns, from one ledger snapshot, the full canonical resource configuration, its hash, versions as strings, and ownership (public, or a private dex owner)."
      operationId: v1_security_oracle_resource
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: integer
          description: "1 = Feed,2 = ReporterSet"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "0x-prefixed 32-byte lowercase hex key"
      responses:
        "200":
          description: Read-only view of one consistent ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_oracle_resource_key`)"
        "404":
          description: "Not found (`unknown_security_resource`)"
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/security/dexes:
    get:
      tags:
        - Security
      summary: Merchant DEX list
      description: "Registered dexes in ascending dex id order (the authoritative registry, from one ledger cut), optionally filtered by current owner account. Entries are the same dex object as in `/v1/security/dexes/{id}`. Once bound, dex 0 is listed first; while unbound it is not listed."
      operationId: v1_security_dexes
      parameters:
        - name: ownerAccount
          in: query
          required: false
          schema:
            type: string
          description: "Current owner account id (decimal); omit to list all dexes"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000, default 100"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "Start after this dex id (decimal); omit to start from the beginning (including dex 0 once bound). For the next page, pass the response's `next`"
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - ownerAccount
                      - dexes
                      - next
                    properties:
                      ownerAccount:
                        type:
                          - integer
                          - "null"
                        description: The ownerAccount filter, null when absent
                      dexes:
                        type: array
                        items:
                          "$ref": "#/components/schemas/SecurityMerchantDex"
                      next:
                        type:
                          - integer
                          - "null"
                        description: "Pass as `after` for the next page; null on the last page"
        "400":
          description: Malformed query parameter
        "404":
          description: Not found
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  "/v1/security/dexes/{id}":
    get:
      tags:
        - Security
      summary: Merchant DEX
      description: "The dex's governing authority, current owner and immutable original registration, all from one ledger cut. While dex 0 is unbound, its authority is the Council and `dex` is null; once the Council binds dex 0, it has the same shape as a merchant dex."
      operationId: v1_security_dex
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Dex id (decimal)
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - authority
                      - dex
                    properties:
                      authority:
                        type: string
                        enum:
                          - Council
                          - Owner
                        description: "Who governs the dex now: Council for dex 0 until the Council binds it, Owner for every registered dex"
                      dex:
                        anyOf:
                          - "$ref": "#/components/schemas/SecurityMerchantDex"
                          - type: "null"
                        description: "The registration; null for dex 0 while unbound"
        "400":
          description: Malformed path parameter
        "404":
          description: Not found
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  "/v1/security/builders/{id}":
    get:
      tags:
        - Security
      summary: Builder registration
      description: "Authoritative builder registration, from one ledger snapshot: owner account and its policy epoch, payout account, `configVersion`, `ownerActive` / `councilDisabled` / `active` (= `ownerActive && !councilDisabled`), and `configHash`. `configVersion` and the owner's policy epoch are the preconditions for the governance operations that change the builder's payout account or status."
      operationId: v1_security_builder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Builder id (decimal, >= 1)"
      responses:
        "200":
          description: Read-only view of one consistent ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Builder id malformed or 0 (`invalid_builder`)"
        "404":
          description: "Not registered (`unknown_security_resource`)"
        "503":
          description: "Ledger read view not ready; retry later"
  "/v1/security/dex-registrations/{id}":
    get:
      tags:
        - Security
      summary: Merchant DEX registration
      description: A dex registration as submitted, and its status, read from one published ledger snapshot.
      operationId: v1_security_dex_registration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Registration id (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - authority
                      - dex
                    properties:
                      authority:
                        type: string
                        enum:
                          - Owner
                        description: "Who governs the dex now: always `Owner` for a registered dex (including dex 0 once the Council's `BindPlatformDex` operation has bound it to an owner account)"
                      dex:
                        "$ref": "#/components/schemas/SecurityMerchantDex"
        "400":
          description: "Malformed path parameter (`invalid_registration_id`)"
        "404":
          description: "Not found (`unknown_security_resource`)"
        "503":
          description: "The ledger read view is not available yet; retry later"
  "/v1/security/dex-owner-proposals/{id}":
    get:
      tags:
        - Security
      summary: DEX owner transfer proposal
      description: "A dex ownership transfer proposal: the original proposal, the first accepted envelope, the digest, the policy epoch and the status as of certified time. An unknown id or a proposal that is not an ownership transfer returns 404."
      operationId: v1_security_dex_owner_proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Proposal id (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: Read-only view of the published ledger state (u64 values are decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_proposal_id`)"
        "404":
          description: Not found
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/custody/{key}":
    get:
      tags:
        - Security
      summary: Custody group
      description: "The custody group's catalog version; the group `mode` (`normal` / `escapePending` / `frozen`, the ledger-side view of the on-chain CheckpointRegistry states Normal / Pending / Frozen); the global next root sequence number and last cut time; the roots in the global cut ring that include this group and have been cut but not yet accepted on this chain (each with this group's window row count `rows`, the chain observation at cut time and the funds-verifier set generation); the latest accepted root; escape requests and freeze state; chain observations; and per-asset deposit / refund / payout counts with cumulative hashes. Chain-fact witnesses use it to confirm that a fact has taken effect. Also includes `registration` (canonical bytes of the group registration, hex), `registrationHash` (hash of the registration; equals the `configHash` of the governance operation that registered the group) and `firstCheckpointSeq` (the root from which the group enters the global cut; 1 for genesis groups). Groups registered at runtime can be queried as well."
      operationId: v1_security_custody_group
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the custody group (0x-prefixed 32-byte hex)"
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_custody_key_hash`)"
        "404":
          description: "Unknown custody group (`unknown_custody_group`)"
        "503":
          description: "The ledger read view is not available yet; retry later"
  /v1/security/checkpoints/latest:
    get:
      tags:
        - Security
      summary: Global checkpoint progress
      description: |-
        Global checkpoint root progress. Every checkpoint period the ledger cuts one global root covering all custody groups that are not frozen. Each custody chain accepts roots independently (and may skip intermediate roots), so the accepted sequence number can differ between custody groups.

        Returns the next global checkpoint sequence number `nextCheckpointSeq`, the time of the last cut, the checkpoint period, and the latest global cut `latestCut{seq, inputEnd, cutTimeMs, groups}` (`groups` = the `custodyKeyHash` values this root covers; null if no root has been cut yet). For each custody group it returns `acceptedSeq` (null if no root has been accepted), `acceptedCheckpointId`, the group mode `mode` (`normal` / `escapePending` / `frozen`), `registrationHash` and `firstCheckpointSeq`. `groupCatalogVersion` is the custody group catalog version: poll it to discover newly registered custody groups, and fetch a new group's registration from `/v1/security/custody/{key}`.

        This is a read-only view of one published ledger snapshot, not a source of trust.
      operationId: v1_security_checkpoints_latest
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  nextCheckpointSeq:
                    type: string
                  lastCutTimeMs:
                    type: string
                  checkpointPeriodMs:
                    type: string
                  latestCut:
                    type: object
                    nullable: true
                    properties:
                      seq:
                        type: string
                      inputEnd:
                        type: string
                      cutTimeMs:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        acceptedSeq:
                          type: string
                          nullable: true
                        acceptedCheckpointId:
                          type: string
                          nullable: true
                        mode:
                          type: string
                          enum:
                            - normal
                            - escapePending
                            - frozen
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - nextCheckpointSeq
                  - latestCut
                  - groups
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/security/network:
    get:
      tags:
        - Security
      summary: Network identity
      description: "The Manifest and network identity pinned by this node. Pass `canonicalManifest` to the sdk-wasm `network(manifestHex)` to get the `network` argument of each constructor; do not hard-code it."
      operationId: v1_security_network
      parameters:
        - name: x-dexos-expect-manifest
          in: header
          required: false
          description: "Optional: the Manifest hash the caller expects (0x + 64 hex digits). If it is given and differs from this node's Manifest, or the header is sent more than once, the gateway returns 503"
          schema:
            type: string
      responses:
        "200":
          description: Manifest and network identity (bytes as 0x hex, u64 as decimal strings)
          content:
            application/json:
              schema:
                type: object
                required:
                  - canonicalEncoding
                  - canonicalManifest
                  - manifestHash
                  - profile
                  - networkId
                  - genesisHash
                  - ledgerEpoch
                  - nodeChainId
                  - nodeVerifier
                  - localTrustValidated
                  - activationStatus
                  - businessReady
                properties:
                  canonicalEncoding:
                    type: string
                    enum:
                      - hex
                  canonicalManifest:
                    type: string
                    description: Canonical Manifest bytes (0x hex)
                  manifestHash:
                    type: string
                    description: Manifest hash (bytes32)
                  profile:
                    type: integer
                    description: Manifest profile number
                  networkId:
                    type: string
                    description: bytes32
                  genesisHash:
                    type: string
                    description: bytes32
                  ledgerEpoch:
                    type: string
                    description: Ledger epoch (u64 as a decimal string)
                  nodeChainId:
                    type: string
                    description: "`chainId` of the EIP-712 domain (uint256, 0x hex)"
                  nodeVerifier:
                    type: string
                    description: "`verifyingContract` of the EIP-712 domain (address)"
                  localTrustValidated:
                    type: boolean
                  activationStatus:
                    type: string
                  businessReady:
                    type: boolean
        "503":
          description: "`x-dexos-expect-manifest` does not match the Manifest pinned by this node, or was sent more than once: `{error: \"upstream_manifest_mismatch\", manifestHash}`"
  /v1/security/time:
    get:
      tags:
        - Security
      summary: Certified time
      description: "Certified time: sequence number, digest of the previous certificate, timestamp, pause state, and the epoch and members of the chain-fact and time services."
      operationId: v1_security_time
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "The ledger read view is not available yet; retry later"
  /v1/security/council:
    get:
      tags:
        - Security
      summary: Council
      description: Council members, threshold and epoch. Operators can compare this with the Council Safe on each custody chain.
      operationId: v1_security_council
      parameters: []
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/cluster/members:
    get:
      tags:
        - Security
      summary: Cluster members
      description: "The current Raft members: node id, role (`voter` / `learner`), certificate pin (SHA-256 of the certificate's SPKI) and node kind. Addresses are **not** included. Pins are recorded in the Raft membership; the manifest does not list nodes. The answer reflects the membership configuration the responding node has applied. Operators use these pins when a new node joins. The service port of an operator-run compute node answers with the same shape, and `council-check --members-urls` uses it to cross-check the platform's answer."
      operationId: v1_cluster_members
      parameters: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type:
                      - integer
                      - "null"
                    format: uint64
                    description: Log index of the membership configuration
                  committed:
                    type: boolean
                  joint:
                    type: boolean
                    description: Joint consensus in progress (the intermediate state while voters are being replaced)
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: uint64
                          description: Node id (monotonic, never reused)
                        role:
                          type: string
                          enum:
                            - voter
                            - learner
                        spki:
                          type:
                            - string
                            - "null"
                          pattern: "^[0-9a-f]{64}$"
                          description: "SHA-256 of the certificate's SPKI (64 lowercase hex characters); null only in single-node mode (no peer port, no certificate)"
                        kind:
                          type:
                            - string
                            - "null"
                          enum:
                            - core
                            - edge
                            - elastic
                            - compute
                            - null
                          description: "Node kind (the `#role=` suffix of the membership record: `core` / `edge` / `elastic` / `compute`; only `core` nodes can become voters); null when the record has none"
                      required:
                        - id
                        - role
                        - spki
                required:
                  - members
        "503":
          description: Node not ready
  /v1/security/accounts:
    get:
      tags:
        - Security
      summary: Accounts by policy member
      description: "Every account whose policy members include this address (account discovery for frontends): account id, policy id and epoch, threshold, members and exit address. `soleSigner` = the address is the only member and the threshold is 1; only such accounts are attributed to the address automatically via `?address=` (anyone can add your address to a multi-member policy without your consent)."
      operationId: v1_security_accounts_of_member
      parameters:
        - name: member
          in: query
          required: true
          schema:
            type: string
          description: "Member address (0x + 40 hex digits)"
      responses:
        "200":
          description: Read-only view of the published ledger state (u64 values are decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed query parameter
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/accounts/{id}":
    get:
      tags:
        - Security
      summary: Security account
      description: "Exit policy of an account: policy id and epoch, exit address, threshold and members. `id` can be a main account or a derived account (subaccount / merchant bucket): `account` is always the root (main) account and its policy; `queried` describes the queried id (`kind` = `main` / `subaccount` (with `index`) / `bucket` (with `parent` and `dex`)); `derived` lists every derived account under the root (subaccounts by index, the buckets of the main account and of each subaccount, and the dex insurance funds `dexFund` that the root account owns). Ids without an account root (insurance funds, platform accounts, unassigned ids) return 404. `builderApprovals` = the root account's builder fee approvals `[{builder, maxFeePpm}]`, ascending by builder; for a derived account the root account's approvals are returned (the root is `account.accountId`)."
      operationId: v1_security_account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
      responses:
        "200":
          description: Read-only view of the published ledger state (u64 values are decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed path parameter (`invalid_account_id`)"
        "404":
          description: "Not found (`unknown_account`)"
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/accounts/{id}/tickets/{ticket}":
    get:
      tags:
        - Security
      summary: Withdrawal ticket
      description: "Whether the ledger still holds this withdrawal ticket for the account. `ticket` is null when it is no longer held: a ticket is deleted when it is cancelled or its payment is settled."
      operationId: v1_security_withdrawal_ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
        - name: ticket
          in: path
          required: true
          schema:
            type: string
          description: Ticket id (32 bytes as 0x-prefixed hex)
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed path parameter
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/security/grants:
    get:
      tags:
        - Security
      summary: Grants issued by an account policy
      description: "Grants issued by an account policy, including revoked ones: grant id, epoch, status, grantee, actions, scope, validity period, the limits as configured and the usage in the current window; also the issuer's current epoch, the number of unrevoked grants and the maximum allowed. Each grant carries `resourceOwnerEpoch` (for a dex-scoped management grant, the dex owner epoch when it was issued; otherwise 0) and `reclaimable` (why its slot can be reclaimed: `revoked` / `expired` / `issuerEpochStale` / `resourceOwnerEpochStale` -- the last one is a management grant whose dex has since changed owner)."
      operationId: v1_security_grants
      parameters:
        - name: policy
          in: query
          required: true
          schema:
            type: string
          description: Policy id (decimal)
      responses:
        "200":
          description: Read-only view of one consistent ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed query parameter (`invalid_policy_id`)"
        "404":
          description: "Policy not found (`unknown_principal`)"
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/security/nonces:
    get:
      tags:
        - Security
      summary: Nonce window
      description: "The window of one nonce key (nonce lane) in the principal's current epoch: the lower bound `floor`, the highest used nonce `high` (null if none has been used) and the suggested next nonce `next`. `agent` and `service` principals must pass `grant`. `principal=council` returns the Council's window on the `management` lane (used for governance proposals) and takes no principal id or grant."
      operationId: v1_security_nonces
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
            enum:
              - account
              - agent
              - service
              - council
          description: account / agent / service / council
        - name: policy
          in: query
          required: false
          schema:
            type: string
          description: "Policy id (for `account` / `agent`)"
        - name: service
          in: query
          required: false
          schema:
            type: string
          description: "Service id (for `service`)"
        - name: lane
          in: query
          required: true
          schema:
            type: string
          description: trade / funds / management
        - name: grant
          in: query
          required: false
          schema:
            type: string
          description: grant id(agent / service)
        - name: grantEpoch
          in: query
          required: false
          schema:
            type: string
          description: "Grant epoch (for `agent` / `service`)"
      responses:
        "200":
          description: Read-only view of one published ledger snapshot (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed query parameter
        "404":
          description: Principal not found
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/security/markets:
    get:
      tags:
        - Security
      summary: Market spec versions
      description: "Per market: spec version (an API wallet grant that lists markets must carry each market's current spec version), precision, contract multiplier and admission status. Perpetuals (MarketSpec v2) carry the ledger name `baseSymbol` (unique among a dex's perpetuals that are not final-settled); null for spot markets and v1 specs. Top-level `maxMarketsPerDex` is the per-dex market cap; `dexMarketCounts` is the number of markets used by each dex that has markets (ascending by dex; a dex not listed has 0). Each market also carries `oracleStale` (the ledger's stale flag: a perpetual listed as stale stays true until its first effective oracle price; its matching state is then `OracleStale` and only reduce-only orders are accepted), `oraclePriceAtMs` (time of the latest effective price; 0 = never) and `oraclePolicy` (the current oracle policy's version, status, algorithm and per-feed ownership `feedOwner` / `feedDex`; null when there is no policy; pass `version` as `expectedVersion` when updating the market's oracle policy)."
      operationId: v1_security_markets
      parameters: []
      responses:
        "200":
          description: Read-only view of the published ledger state (u64 values are decimal strings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets:
                    type: array
                    items:
                      type: object
                      properties:
                        market:
                          type: integer
                        dex:
                          type: integer
                        baseSymbol:
                          type:
                            - string
                            - "null"
                          description: "Perpetual name (1-16 uppercase letters and digits); null for spot markets and v1 specs"
                        marketSpecVersion:
                          type: string
                        assetVersion:
                          type: string
                        priceDecimals:
                          type: integer
                        sizeDecimals:
                          type: integer
                        quotePerTickLot:
                          type: string
                        admission:
                          type: integer
                        admissionVersion:
                          type: string
                        oracleStale:
                          type: boolean
                          description: "Ledger oracle-stale flag; a perpetual listed without an enabled test policy stays stale until its first effective round"
                        oraclePriceAtMs:
                          type: string
                          description: "Block time of the last effective oracle price (ms, u64 decimal); 0 = never"
                        oraclePolicy:
                          type:
                            - object
                            - "null"
                          description: "Current market oracle policy; null for spot markets and markets without a policy"
                          required:
                            - version
                            - status
                            - algorithmId
                            - algorithmVersion
                            - feeds
                          properties:
                            version:
                              type: string
                              description: "Policy version; pass it as `expectedVersion` when updating the market's oracle policy"
                            status:
                              type: integer
                              description: "0 draft / 1 enabled / 2 disabled"
                            algorithmId:
                              type: integer
                            algorithmVersion:
                              type: integer
                            feeds:
                              type: array
                              items:
                                type: object
                                required:
                                  - feedId
                                  - feedVersion
                                  - setId
                                  - setEpoch
                                  - feedOwner
                                  - feedDex
                                properties:
                                  feedId:
                                    type: string
                                  feedVersion:
                                    type: string
                                  setId:
                                    type: string
                                  setEpoch:
                                    type: string
                                  feedOwner:
                                    type:
                                      - string
                                      - "null"
                                    enum:
                                      - Protocol
                                      - Dex
                                      - null
                                    description: "Owner of the feed resource; null when the feed is not configured"
                                  feedDex:
                                    type:
                                      - integer
                                      - "null"
                                    description: "The owning dex when feedOwner = Dex"
                      required:
                        - market
                        - dex
                        - baseSymbol
                        - marketSpecVersion
                        - oracleStale
                        - oraclePolicy
                  maxMarketsPerDex:
                    type: object
                    description: "Per-dex market cap set by governance (counts all of a dex's markets, including frozen and final-settled ones; once it is reached, listing a new market is rejected with `MarketsHardCapReached`); pass `version` as `expectedVersion` when changing it"
                    properties:
                      max:
                        type: integer
                      version:
                        type: string
                    required:
                      - max
                      - version
                  dexMarketCounts:
                    type: array
                    items:
                      type: object
                      properties:
                        dex:
                          type: integer
                        markets:
                          type: integer
                      required:
                        - dex
                        - markets
                required:
                  - markets
                  - maxMarketsPerDex
                  - dexMarketCounts
        "400":
          description: Malformed query parameter
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  /v1/security/escape-preview:
    get:
      tags:
        - Security
      summary: Escape leaf preview
      description: "Escape leaf preview. From the current folded ledger view, using the same functions that build checkpoint roots, recomputes the account's leaf composition for each asset: `own` (own equity, in ledger units), `inTransit` (cash in transit: withdrawals held in custody, the paying side of two-phase vault deposits / redemptions / claims, and the receiving side of redemption payments whose paying account is a vault account), `vaults[]` (per vault `{vault, mainAccount, role: lp|manager, shares, amount}`; the value of vault shares, at the frozen valuation, passes through into the holder's own leaf, and vault accounts themselves have no leaf), `vaultAmount` (total passed through), `ledgerTotal`, and the leaf's `claimable` / `withdrawReserved` / `paidObserved` (raw units = ledger units converted per asset, rounded down). Also returns the identity `exitAddress` / `policyHash` and the latest accepted root number `latestRootSeq` (null if none). **Estimate only**: the exact values are those computed against the frozen root at escape time. A vault account (main vault or sub-vault) returns 404 `vault_account_has_no_leaf`; an unknown account or a platform account returns 404 `unknown_account`."
      operationId: v1_security_escape_preview
      parameters:
        - name: account
          in: query
          required: true
          description: Account id (decimal)
          schema:
            type: string
      responses:
        "200":
          description: Read-only view of one consistent ledger snapshot (u64 values and amounts as decimal strings)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "`account` missing or not a decimal number (`invalid_account_id`)"
        "404":
          description: "`unknown_account` (unknown account or platform account) or `vault_account_has_no_leaf` (vault account)"
        "503":
          description: "Ledger read view not ready, or the leaf cannot be computed on this view (`escape_preview_unavailable`); retry later"
  /v1/security/custody:
    get:
      tags:
        - Security
      summary: Custody group discovery
      description: |-
        Custody group discovery. For each custody group: identity (`custodyKeyHash`, `settlementGroup`), custody chain id, the three contract addresses (`checkpointRegistry`, `custodyVault`, `depositInbox`) and their code hashes, assets, routes, the withdrawal fee policy, CCTP constants, policy parameters, finality policies, submitters and checkpoint progress. All of it comes from the published ledger state; read contract addresses here instead of hard-coding them in a frontend or SDK.

        - `assets`: includes assets registered at runtime, with `depositEnabled` and flow limits. `symbol` is the ledger asset symbol set by governance (uppercase letters, digits and `.`, unique in the ledger), null when unset. `minDepositRaw` is the group DepositInbox's minimum deposit (raw units, decimal string), read on-chain via `minDepositRaw(assetId, assetVersion)` through the gateway's chain RPC and cached for 10 seconds; `"0"` means not configured, and the contract accepts no deposits of that asset; when the chain read fails it is null and `minDepositError` is set.
        - `routes`: all fields form the preimage of `routePolicyHash`; `destinationChainId` is added: for CCTP routes (`routeKind` 3) the chain id of the destination domain in the `cctp.domains` table, for direct-payment / native-coin routes the custody chain.
        - `withdrawalFee`: the withdrawal fee policy set by the Council: `version`, `policyHash`, `recipient`, per-asset `schedules` `{assetId, assetVersion, fixedRaw, ratePpm, capRaw}`, `formula` and `rounding` (up). A cash withdrawal signed command must carry `sourceFeeRaw` / `sourceFeeRecipient` equal to the values computed from this policy; pass the object unchanged to the WASM protocol library's `withdrawalFee` / `cashWithdrawal`.
        - `cctp`: CCTP construction constants: `hubDomain`, `finalizedThreshold`, the binding type string `bindingType` and its typehash, the deposit message length of 536 bytes (160-byte hook; the binding carries only the beneficiary address), `beneficiaryForbidden` (the zero address and the group's three custody contracts), and the domain-to-chain-id table `domains`.
        - `status`: `frozen`, `escapePending`, `mode` (`normal` / `escapePending` / `frozen`), `acceptedSeq` (the global checkpoint root sequence accepted for this group) and `nextCheckpointSeq` (the next global checkpoint root sequence).
        - Groups are listed from the ledger's group registrations: the genesis groups plus groups registered later by governance. Each group carries `registration` (the canonical registration bytes, hex; build off-chain group configuration from them), its hash `registrationHash`, and `firstCheckpointSeq` (the first global checkpoint root that includes the group; 1 for genesis groups). Top-level `groupCatalogVersion` is 1 at genesis and increases by 1 with each group registration that takes effect.
      operationId: v1_security_custody_groups
      parameters: []
      responses:
        "200":
          description: Read-only view of the published ledger state (u64 values are decimal strings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        custodyChainId:
                          type: string
                        contracts:
                          type: object
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              assetId:
                                type: integer
                              assetVersion:
                                type: string
                                description: u64 decimal string
                              depositEnabled:
                                type: boolean
                              minDepositRaw:
                                type:
                                  - string
                                  - "null"
                                description: "DepositInbox minimum deposit (raw units, decimal string; `\"0\"` = not configured, deposits not accepted; null when the chain read fails). A direct deposit below it reverts with `DepositBelowMinimum`; a CCTP deposit below it becomes a Late deposit refunded to the beneficiary address"
                              minDepositError:
                                type: string
                                description: "Why reading the minimum deposit failed (present only when `minDepositRaw` is null)"
                        routes:
                          type: array
                          items:
                            type: object
                        cctp:
                          type: object
                          properties:
                            inboxMessageBytes:
                              type: integer
                              description: "Length of the CCTP deposit message in bytes (536 = 376 + 160-byte hook)"
                            bindingType:
                              type: string
                              description: CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)
                            bindingTypehash:
                              type: string
                            beneficiaryForbidden:
                              type: array
                              items:
                                type: string
                              description: "Addresses that cannot be the beneficiary: the zero address and this group's Inbox / Vault / Registry contracts"
                        withdrawalFee:
                          type: object
                          properties:
                            version:
                              type: string
                            policyHash:
                              type: string
                            recipient:
                              type: string
                            schedules:
                              type: array
                              items:
                                type: object
                                properties:
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  fixedRaw:
                                    type: string
                                  ratePpm:
                                    type: integer
                                  capRaw:
                                    type: string
                            formula:
                              type: string
                            rounding:
                              type: string
                        policy:
                          type: object
                        status:
                          type: object
                        registration:
                          type: string
                        registrationHash:
                          type: string
                        firstCheckpointSeq:
                          type: string
                  groupCatalogVersion:
                    type: string
                required:
                  - manifestHash
                  - groups
        "400":
          description: Malformed request
        "404":
          description: "Not found (`unknown_custody_group`)"
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/custody/{key}/deposits/{asset}/{version}/{id}":
    get:
      tags:
        - Security
      summary: Deposit status by receipt
      description: "Look up one deposit by its receipt (asset, asset version, `depositId`): the ledger-side status and any deferral reason, the cut that contains it, and the refund reason. The on-chain detail status (escrowed / refunded / credited) is not tracked by the ledger; `chain` says how to read it from `DepositInbox.depositReceipt`. Deposits are made by address (deposit-by-address): the receipt's account number is always 0, and the beneficiary is the receipt's `refundRecipient` (also returned as `beneficiary`). The ledger resolves the beneficiary to that address's single-signer main account; if there is none, one is opened automatically when the first deposit is credited (`accountId` / `creditedAccountId` then show the new account)."
      operationId: v1_security_deposit_by_receipt
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the custody group (0x-prefixed 32-byte hex)"
        - name: asset
          in: path
          required: true
          schema:
            type: string
          description: "`assetId` (decimal u32)"
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: "`assetVersion` (decimal u64)"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "`depositId` (decimal u64, starting at 1)"
      responses:
        "200":
          description: Deposit status
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit:
                    type: object
                    properties:
                      custodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                        description: u64 as a decimal string
                      depositId:
                        type: string
                        description: u64 as a decimal string
                      nextDepositId:
                        type: string
                        description: u64 as a decimal string
                      status:
                        type: string
                        enum:
                          - awaiting
                          - credited
                          - rejected
                          - refundPending
                          - refunded
                          - refundedBeforeProcessing
                          - consumed
                        description: "Ledger-side status: `awaiting` -- the on-chain receipt has not been processed by the ledger yet (includes `queuePosition` / `refundRequested` / `deferral`); `credited` -- credited, but the checkpoint root that contains it has not been accepted yet (`confirmed` = false); `rejected` -- rejected, the row is still in the queue waiting to be consumed; `refundPending` -- waiting for the on-chain refund (including a credit refused by the per-account cap, `tellerRejected`); `refunded` -- refunded on chain, the row is still in the queue; `refundedBeforeProcessing` -- refunded before the ledger processed it; `consumed` -- consumed by an accepted root (credit confirmed or refund settled; the ledger no longer distinguishes the two, read the on-chain detail as described in `chain`)"
                      queuePosition:
                        type: string
                        description: "Position in the ledger's processing queue (0 = next to be processed); u64 as a decimal string"
                      refundRequested:
                        type: boolean
                      deferral:
                        type: object
                        description: "Whether the deposit at the head of the queue would be deferred right now, and why: `wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                      accountId:
                        type:
                          - integer
                          - "null"
                        description: "The account the receipt resolves to: the credited account, or, for a refused receipt, the beneficiary's main account; null when the beneficiary has no main account (or the receipt names an account number)"
                      amountRaw:
                        type: string
                      receiptHash:
                        type: string
                      refundRecipient:
                        type: string
                        description: "The receipt's original field name for the beneficiary; same value as `beneficiary`"
                      includedInCut:
                        type:
                          - string
                          - "null"
                        description: "Sequence number of the cut that contains this row, if that cut has been taken but not yet accepted; otherwise null"
                      confirmed:
                        type: boolean
                      reason:
                        type: string
                        enum:
                          - userRequested
                          - accountUnregistered
                          - amountUnrepresentable
                          - creditCapExceeded
                          - liabilityCapExceeded
                          - tellerRejected
                          - unknown
                      chain:
                        type: object
                        description: "Where to read the on-chain detail status that the ledger does not track: the contract, the call and the status-code table. The source is the custody chain; the gateway does not read it for you."
                      beneficiary:
                        type: string
                        description: "Beneficiary address, equal to the receipt's `refundRecipient` (for deposits by address the contract writes the beneficiary into that field, and a refused deposit is refunded to it)"
                      creditedAccountId:
                        type:
                          - integer
                          - "null"
                        description: "The credited account (when `status` = `credited`; a main account opened automatically by the first deposit also appears here); null if not credited"
                      reasonDetail:
                        type:
                          - string
                          - "null"
                        enum:
                          - accountOpeningUnavailable
                          - explicitAccountUnsupported
                          - firstDepositOverAccountCap
                          - accountCapExceeded
                          - null
                        description: "Refinement of the refund reason. For `accountUnregistered`: `accountOpeningUnavailable` (the receipt's account number is 0, the beneficiary has no main account and none can be opened: registration closed or capacity full) or `explicitAccountUnsupported` (the receipt names a non-zero account number; deposits are credited by address only). It is null when the ledger row alone cannot tell the two apart; the by-transaction lookup (`deposits/by-tx/{tx}`) reads the receipt and always resolves it. For `tellerRejected`: `firstDepositOverAccountCap` (the first deposit to a new address exceeds the per-account cap, so no account is opened) or `accountCapExceeded` (crediting an existing account would exceed the per-account cap)."
                      reasonMessage:
                        type: string
                        description: "Human-readable explanation of the refund reason (based on `reason` and `reasonDetail`)"
                    required:
                      - custodyKeyHash
                      - assetId
                      - assetVersion
                      - depositId
                      - status
                      - chain
                required:
                  - deposit
        "400":
          description: "Malformed path parameter (`invalid_receipt`)"
        "404":
          description: "Unknown custody group or asset (`unknown_custody_asset`)"
        "503":
          description: "The ledger read view is not available yet; retry later"
  "/v1/security/custody/{key}/deposits/by-tx/{tx}":
    get:
      tags:
        - Security
      summary: Deposit status by transaction
      description: "Look up the deposits made by one custody-chain transaction. The gateway fetches the transaction receipt through the operator-configured RPC endpoint of the custody chain, keeps only the `InboxDeposited` logs emitted by this custody group's deposit inbox, and reports the ledger status of each receipt (a reverted transaction yields no deposits). Read-only; not a source of trust."
      operationId: v1_security_deposit_by_tx
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the custody group (0x-prefixed 32-byte hex)"
        - name: tx
          in: path
          required: true
          schema:
            type: string
          description: Custody-chain transaction hash (0x-prefixed 32-byte hex)
      responses:
        "200":
          description: "This custody group's deposit receipts in the transaction, each with its ledger status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  success:
                    type: boolean
                  blockNumber:
                    type: string
                  source:
                    type: string
                  deposits:
                    type: array
                    items:
                      type: object
                      properties:
                        logIndex:
                          type: string
                          description: u64 as a decimal string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: u64 as a decimal string
                        depositId:
                          type: string
                          description: u64 as a decimal string
                        receiptAccountId:
                          type: integer
                          description: "The account number in the on-chain receipt, as emitted. Deposits are credited by beneficiary address, so it is always 0; the ledger refunds any receipt with a non-zero account number (`reason` = `accountUnregistered`, `reasonDetail` = `explicitAccountUnsupported`)."
                        beneficiary:
                          type: string
                          description: "Beneficiary address; equal to the receipt's `refundRecipient`"
                        refundRecipient:
                          type: string
                          description: "The receipt's original field name for the beneficiary; same value as `beneficiary`"
                        amountRaw:
                          type: string
                        sourceKind:
                          type: integer
                        sourceMessageId:
                          type: string
                        receiptHash:
                          type: string
                        deposit:
                          type: object
                          properties:
                            custodyKeyHash:
                              type: string
                            assetId:
                              type: integer
                            assetVersion:
                              type: string
                              description: u64 as a decimal string
                            depositId:
                              type: string
                              description: u64 as a decimal string
                            nextDepositId:
                              type: string
                              description: u64 as a decimal string
                            status:
                              type: string
                              enum:
                                - awaiting
                                - credited
                                - rejected
                                - refundPending
                                - refunded
                                - refundedBeforeProcessing
                                - consumed
                              description: "Ledger-side status: `awaiting` -- the on-chain receipt has not been processed by the ledger yet (includes `queuePosition` / `refundRequested` / `deferral`); `credited` -- credited, but the checkpoint root that contains it has not been accepted yet (`confirmed` = false); `rejected` -- rejected, the row is still in the queue waiting to be consumed; `refundPending` -- waiting for the on-chain refund (including a credit refused by the per-account cap, `tellerRejected`); `refunded` -- refunded on chain, the row is still in the queue; `refundedBeforeProcessing` -- refunded before the ledger processed it; `consumed` -- consumed by an accepted root (credit confirmed or refund settled; the ledger no longer distinguishes the two, read the on-chain detail as described in `chain`)"
                            queuePosition:
                              type: string
                              description: "Position in the ledger's processing queue (0 = next to be processed); u64 as a decimal string"
                            refundRequested:
                              type: boolean
                            deferral:
                              type: object
                              description: "Whether the deposit at the head of the queue would be deferred right now, and why: `wouldDefer` / `frozen` / `assetNotEnabled` / `consumptionBudgetFull` / `noAcceptedRoot` / `rootStale` / `unconfirmedHeadroomRaw`"
                            accountId:
                              type:
                                - integer
                                - "null"
                              description: "The account the receipt resolves to: the credited account, or, for a refused receipt, the beneficiary's main account; null when the beneficiary has no main account (or the receipt names an account number)"
                            amountRaw:
                              type: string
                            receiptHash:
                              type: string
                            refundRecipient:
                              type: string
                              description: "The receipt's original field name for the beneficiary; same value as `beneficiary`"
                            includedInCut:
                              type:
                                - string
                                - "null"
                              description: "Sequence number of the cut that contains this row, if that cut has been taken but not yet accepted; otherwise null"
                            confirmed:
                              type: boolean
                            reason:
                              type: string
                              enum:
                                - userRequested
                                - accountUnregistered
                                - amountUnrepresentable
                                - creditCapExceeded
                                - liabilityCapExceeded
                                - tellerRejected
                                - unknown
                            chain:
                              type: object
                              description: "Where to read the on-chain detail status that the ledger does not track: the contract, the call and the status-code table. The source is the custody chain; the gateway does not read it for you."
                            beneficiary:
                              type: string
                              description: "Beneficiary address, equal to the receipt's `refundRecipient` (for deposits by address the contract writes the beneficiary into that field, and a refused deposit is refunded to it)"
                            creditedAccountId:
                              type:
                                - integer
                                - "null"
                              description: "The credited account (when `status` = `credited`; a main account opened automatically by the first deposit also appears here); null if not credited"
                            reasonDetail:
                              type:
                                - string
                                - "null"
                              enum:
                                - accountOpeningUnavailable
                                - explicitAccountUnsupported
                                - firstDepositOverAccountCap
                                - accountCapExceeded
                                - null
                              description: "Refinement of the refund reason. For `accountUnregistered`: `accountOpeningUnavailable` (the receipt's account number is 0, the beneficiary has no main account and none can be opened: registration closed or capacity full) or `explicitAccountUnsupported` (the receipt names a non-zero account number; deposits are credited by address only). It is null when the ledger row alone cannot tell the two apart; the by-transaction lookup (`deposits/by-tx/{tx}`) reads the receipt and always resolves it. For `tellerRejected`: `firstDepositOverAccountCap` (the first deposit to a new address exceeds the per-account cap, so no account is opened) or `accountCapExceeded` (crediting an existing account would exceed the per-account cap)."
                            reasonMessage:
                              type: string
                              description: "Human-readable explanation of the refund reason (based on `reason` and `reasonDetail`)"
                          required:
                            - custodyKeyHash
                            - assetId
                            - assetVersion
                            - depositId
                            - status
                            - chain
                required:
                  - transactionHash
                  - success
                  - deposits
        "400":
          description: "Malformed path parameter (`invalid_transaction_hash`)"
        "404":
          description: "Unknown custody group, or transaction not found (`transaction_not_found`)"
        "502":
          description: "The upstream custody-chain RPC returned an error (`chain_rpc_failed`)"
        "503":
          description: "No RPC endpoint is configured for the custody chain (`chain_rpc_unavailable`), or the ledger read view is not available yet"
  "/v1/security/custody/{key}/diagnostics":
    get:
      tags:
        - Security
      summary: Stuck-funds diagnostics
      description: "Stuck-funds diagnostics for a custody group: values the ledger can compute (checkpoint root age, cuts taken but not yet accepted, rows awaiting consumption and the consumption budget, rejected deposits and ledger refunds awaiting payout, unpaid tickets, refund requests, per-asset unconfirmed credit and deferral decisions) together with alert codes. Items that only the chain or the submitters know are listed in `external`, with their source, rule and phase."
      operationId: v1_security_custody_diagnostics
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` (0x-prefixed 32-byte hex)"
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  certifiedTimeMs:
                    type: string
                    description: u64 decimal string
                  metrics:
                    type: object
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - no_accepted_root
                            - root_stale
                            - cuts_backlog
                            - consumption_budget_full
                            - unconfirmed_headroom_low
                            - rejected_pending_refund
                            - tickets_outstanding
                            - escape_pending
                            - frozen
                        severity:
                          type: string
                          enum:
                            - info
                            - warning
                            - critical
                        message:
                          type: string
                  external:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        source:
                          type: string
                        rule:
                          type: string
                        phase:
                          type: string
                required:
                  - metrics
                  - alerts
                  - external
        "400":
          description: "Malformed path parameter (`invalid_custody_key_hash`)"
        "404":
          description: "Unknown custody group (`unknown_custody_group`)"
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/accounts/{id}/tickets":
    get:
      tags:
        - Security
      summary: Account withdrawal tickets
      description: "All withdrawal tickets held by the account: amount, asset, custody group and cancellation plan; `groups` gives each group's root acceptance progress. On-chain progress (not reserved / reserved / paid / burned via CCTP / cancelled) and the reservation time are read on the custody chain from `CustodyVault.ticketTerminal` and the `TicketReserved` event (each ticket's `chain` object names the contract, the call and the status codes); funds are paid no earlier than the reservation time + `ordinaryPaymentWaitMs`."
      operationId: v1_security_account_tickets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        ticketId:
                          type: string
                        custodyKeyHash:
                          type: string
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: u64 decimal string
                        debitRaw:
                          type: string
                        payloadHash:
                          type: string
                        cancelPlanned:
                          type: boolean
                        cancelId:
                          type:
                            - string
                            - "null"
                        ledgerStatus:
                          type: string
                        chain:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - tickets
                  - groups
        "400":
          description: "Malformed path parameter (`invalid_account_id`)"
        "404":
          description: "Not found (`unknown_account`)"
        "503":
          description: "Ledger read view not ready; retry later"
  "/v1/security/accounts/{id}/funds-history":
    get:
      tags:
        - Security
      summary: Account funds history
      description: |-
        Deposit, refund and withdrawal history of an account, from the account event index of the execution history. Paging parameters and the page tail are the same as for `/v1/events`.

        Event kinds: `CashDepositCredited`, `DepositRefundPlanned`, `DepositRefundAccounted`, `CashWithdrawalReserved`, `CashWithdrawalCancelPlanned`, `CashWithdrawalAccounted`, `CashWithdrawalCancelled`, `EscapeClaimAccounted`.

        - A refund plan is attributed to the beneficiary account through its deposit receipt and carries the current refund progress `refund{status: pending|refunded, reason}`.
        - A successfully reserved withdrawal carries the checkpoint progress of its ticket `ticket{inAcceptedRoot, acceptedSeq, cutSeq, estimatedPayableAtMs, estimateBasis}`. The estimate = the cut time of the latest accepted checkpoint root + the payment wait period; the exact time comes from the block time of the on-chain `TicketReserved` event.
      operationId: v1_security_account_funds_history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account id (decimal u32)
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Execution-layer event identity `<seq>-<sub>-<idx>`; the backfill cursor and the `id` in WebSocket frames are character-for-character the same"
          description: "Cursor: the `next` value of the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; **required together with `upper` when `after` is given** (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; **required together with `epoch` when `after` is given**, otherwise 400. Beyond this replica's complete history prefix → 400 `GatewayHistoryIncomplete` (retry later)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
      responses:
        "200":
          description: One page of funds history
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        data:
                          type: object
                        ts: {}
                        refund:
                          type: object
                        ticket:
                          type: object
                  groups:
                    type: array
                    items:
                      type: object
                required:
                  - accountId
                  - items
        "400":
          description: Malformed path or query parameter
        "404":
          description: "Account not found (`unknown_account`)"
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/security/governance:
    get:
      tags:
        - Security
      summary: Council governance overview
      description: "Council governance overview: the current Council (members, threshold, epoch), the Council's nonce window on the `Management` nonce lane (`next` = the suggested next nonce), the delay policy (8 delay classes), proposal quotas, certified time and the network `profile`. Read-only, served from one published ledger snapshot; send `x-dexos-min-seq` to read your own writes."
      operationId: v1_security_governance
      responses:
        "200":
          description: Governance overview (u64 values as decimal strings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  council:
                    type: object
                  councilNonce:
                    type: object
                  delays:
                    type: object
                  proposals:
                    type: object
                  certifiedTimeMs:
                    type: string
                  profile:
                    type: string
        "400":
          description: Malformed parameters or request body
        "503":
          description: "The ledger read view is not available yet; retry later"
  /v1/security/governance/proposals:
    get:
      tags:
        - Security
      summary: Governance proposals
      description: "All proposals, including terminal ones (when all proposal slots are in use, a new proposal reuses the slot of a terminal one). `status` is derived from the current state at read time (expired / invalidated proposals show as such without waiting for cleanup); `etaMs` = max(eta at queueing, queueing time + current delay) (the delay only ever increases); `readiness` is one of `ready` / `notReady` / `expired` / `invalidated` / `terminal`."
      operationId: v1_security_governance_proposals
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items:
                      type: object
        "400":
          description: Malformed parameter or request body
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  "/v1/security/governance/proposals/{id}":
    get:
      tags:
        - Security
      summary: Governance proposal detail
      description: "Details of one governance proposal: every field of the operation (decoded the same way as the WASM `inspect`), the precondition table, the execution window, and `originalEnvelope`, the original queued envelope (the signed command in canonical encoding; anyone can recompute its digest and recover the signers with the WASM SDK)."
      operationId: v1_security_governance_proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Proposal id (= the `actionId` of the queued envelope)"
      responses:
        "200":
          description: Proposal details
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    type: object
        "400":
          description: Malformed parameter or request body
        "404":
          description: Proposal not found (or its id has been reused by a newer proposal)
        "503":
          description: "Ledger state is not available on this node yet; retry later"
  /v1/security/governance/preconditions:
    post:
      tags:
        - Security
      summary: Compute governance preconditions
      description: "Computes, from the ledger's current state, the precondition table and hash a governance operation (GovernedOperation) must carry, plus the applicable delay and delay class, using the same functions as the ledger. Read-only. The operation is written as for the WASM `governanceProposal`: field-by-field JSON, or `{\"canonical\": \"0x...\"}`. If they cannot be computed (for example, the feature is not enabled), the reply has `ok = false` with the rejection reason."
      operationId: v1_security_governance_preconditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: object
              required:
                - operation
        description: The operation to compute preconditions for
      responses:
        "200":
          description: Preconditions and delay
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  preconditions:
                    type: array
                    items:
                      type: object
                  preconditionsHash:
                    type: string
                    description: "0x-prefixed hex"
                  delayMs:
                    type: string
                  delayClasses:
                    type: array
                    items:
                      type: string
                  operation:
                    type: object
                  error:
                    type: object
        "400":
          description: "Malformed parameter or request body (`invalid_json` / `invalid_operation`)"
        "503":
          description: "Ledger read view not ready; retry later"
  /v1/security/governance/simulate:
    post:
      tags:
        - Security
      summary: Simulate a governance envelope
      description: "Simulate a governance envelope before submitting it (propose, submit-and-execute, execute-proposal or cancel-proposal; signed or unsigned): checks the envelope fields, epoch and validity window, threshold signatures, nonce, preconditions and the operation itself, and reports how the ledger would handle it (`outcome.kind` is one of `executes` / `queued` / `notReady` / `rejected`, with `etaMs` or the rejection reason). Read-only: execution-time state changes are not applied."
      operationId: v1_security_governance_simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: "0x-prefixed hex"
              required:
                - command
        description: "Canonical encoding of one signed command; any other command type returns 400 `not_an_authenticated_command`"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation:
                    type: object
        "400":
          description: Malformed parameters or request body
        "503":
          description: "The ledger read view is not available yet; retry later"
  /v1/security/governance/services:
    get:
      tags:
        - Security
      summary: Services and Council grants
      description: Service configurations (service id, epoch, purpose, members and threshold, scope) and the grants issued by the Council (including revoked ones, with current-window usage).
      operationId: v1_security_governance_services
      responses:
        "200":
          description: Services and grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                  councilGrants:
                    type: array
                    items:
                      type: object
        "400":
          description: Malformed parameter or request body
        "503":
          description: "The security read view is unavailable on this node or not ready yet; retry later"
  /v1/security/governance/signatures:
    get:
      tags:
        - Security
      summary: Signature collections
      description: "Signature collections: the most recent 100, newest first, each with its request id, payload kind, operation name and the number of signatures collected."
      operationId: v1_security_governance_collections
      responses:
        "200":
          description: Collection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
        "400":
          description: Malformed parameters or request body
        "503":
          description: "The ledger read view or the signature store (`signature_store_unavailable`) is not available; retry later"
    post:
      tags:
        - Security
      summary: Submit governance signatures
      description: "Submit one or more governance signatures (or a whole `dexos-gov-signatures/v1` export, to import signatures collected offline). Signatures are self-authenticating and the uploader is not trusted: the server recomputes the digest from the unsigned structure (payload and envelope must be consistent, otherwise 422 `inconsistent_envelope`), recovers each signer, and accepts only signatures from members of the current signing policy (422 `not_a_member`). For a membership change, new-member acceptance signatures are accepted only from the new members (422 `not_a_new_member`). If the signing principal's epoch has passed: 409 `stale_authority_epoch`. Only one unsigned structure is accepted per request id (409 `conflicting_unsigned`). If this gateway has no signature store: 503 `signature_store_unavailable`. On success, returns the collection in export format."
      operationId: v1_security_governance_collect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unsigned:
                  type: string
                  description: "0x-prefixed hex"
                signatures:
                  type: array
                  items: {}
                membershipSignatures:
                  type: array
                  items:
                    type: string
                membership:
                  type: object
                format:
                  type: string
              required:
                - unsigned
        description: The unsigned structure and its signatures
      responses:
        "200":
          description: The collection (export format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum:
                      - dexos-gov-signatures/v1
                  requestId:
                    type: string
                    description: "0x-prefixed hex"
                  digest:
                    type: string
                    description: "0x-prefixed hex"
                  unsigned:
                    type: string
                    description: "0x-prefixed hex"
                  signatures:
                    type: array
                    items:
                      type: object
                  membership:
                    type: object
                    nullable: true
                  members:
                    type: array
                    items:
                      type: string
                  threshold:
                    type: integer
                  epochCurrent:
                    type: boolean
                  ready:
                    type: boolean
                  command:
                    type: string
                    nullable: true
                  createdMs:
                    type: string
        "400":
          description: Malformed parameters or request body
        "409":
          description: "The signing principal's epoch has passed (`stale_authority_epoch`), or the request id already has a different unsigned structure (`conflicting_unsigned`)"
        "422":
          description: "Signature not accepted: signer is not a member, signature cannot be recovered, envelope is inconsistent, or the command is not a governance command"
        "503":
          description: "The ledger read view or the signature store (`signature_store_unavailable`) is not available; retry later"
  "/v1/security/governance/signatures/{id}":
    get:
      tags:
        - Security
      summary: One signature collection (export)
      description: "One signature collection, in the export format `dexos-gov-signatures/v1`. Once the threshold is met (and all new members have accepted), `ready = true` and the assembled command is attached as `command` -- clients should reassemble it themselves with the WASM `governanceAssemble` and compare, rather than trust this value."
      operationId: v1_security_governance_collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Proposal id (= `actionId`), 0x-prefixed 32-byte hex"
      responses:
        "200":
          description: Export format
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum:
                      - dexos-gov-signatures/v1
                  requestId:
                    type: string
                    description: "0x-prefixed hex"
                  digest:
                    type: string
                    description: "0x-prefixed hex"
                  unsigned:
                    type: string
                    description: "0x-prefixed hex"
                  signatures:
                    type: array
                    items:
                      type: object
                  membership:
                    type: object
                    nullable: true
                  members:
                    type: array
                    items:
                      type: string
                  threshold:
                    type: integer
                  epochCurrent:
                    type: boolean
                  ready:
                    type: boolean
                  command:
                    type: string
                    nullable: true
                  createdMs:
                    type: string
        "400":
          description: "Malformed parameter (`invalid_request_id`)"
        "404":
          description: "No such collection (`unknown_collection`)"
        "503":
          description: "Ledger read view or signature store not ready (`signature_store_unavailable`); retry later"
  "/v1/security/custody/{key}/late-deposits":
    get:
      tags:
        - Security
      summary: Late deposit receipts
      description: "Late-deposit receipts of a custody group. A CCTP deposit is held as a late deposit -- left as-is in the group's `CustodyVault` and not credited to the ledger (`LateDepositReceived` event) -- when it arrives after the custody group is frozen and its escape wait period has expired, or when its net amount is not a whole multiple of the asset quantum, is below the asset's Inbox minimum deposit (including when no minimum is configured), or its beneficiary cannot sign (the address has code and is not an EIP-7702 delegation). The gateway reads `LateDepositReceived` logs in the block range from the custody chain and merges `LateDepositRefunded` logs. Anyone may trigger a refund; the recipient and amount come from the receipt, and the operator refunds late deposits automatically. Read-only and not a source of trust. Refunds outside the queried range are not merged (a receipt refunded after `toBlock` shows `refunded: false`); read `/late-deposits/{id}` for one receipt's current state."
      operationId: v1_security_late_deposits
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` (0x-prefixed 32-byte hex)"
        - name: fromBlock
          in: query
          required: false
          schema:
            type: string
          description: "u64 decimal; defaults to `toBlock - 9999`"
        - name: toBlock
          in: query
          required: false
          schema:
            type: string
          description: "u64 decimal; defaults to the latest custody-chain block"
        - name: beneficiary
          in: query
          required: false
          schema:
            type: string
          description: "0x-prefixed 20-byte address; list only receipts for this beneficiary (filtered on the indexed `beneficiary`)"
      responses:
        "200":
          description: Late-deposit receipts of this group in the block range
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  custodyVault:
                    type: string
                  fromBlock:
                    type: string
                    description: u64 decimal string
                  toBlock:
                    type: string
                    description: u64 decimal string
                  source:
                    type: string
                  lateDeposits:
                    type: array
                    items:
                      type: object
                      properties:
                        lateDepositId:
                          type: string
                          description: "Late-deposit receipt id = keccak256(abi.encode(keccak256(\"DEXOS/LateDeposit/v1\"), custodyKeyHash, sourceMessageId))"
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: u64 decimal string
                        beneficiary:
                          type: string
                          description: "Beneficiary: the only identity signed into the hook data (160 bytes) of the source-chain burn; a late-deposit refund is paid only to this address"
                        amountRaw:
                          type: string
                          description: "Net amount received (`amount - feeExecuted`), in the cash token's raw units"
                        sourceMessageId:
                          type: string
                        bindingHash:
                          type: string
                        blockNumber:
                          type: string
                          description: u64 decimal string
                        transactionHash:
                          type: string
                        refunded:
                          type: boolean
                          description: "`LateDepositRefunded` was seen within this block range"
                        refundBlockNumber:
                          type:
                            - string
                            - "null"
                          description: "u64 decimal string; null if not refunded"
                        refundTransactionHash:
                          type:
                            - string
                            - "null"
        "400":
          description: "`invalid_custody_key_hash` / `invalid_query` (numbers must be decimal) / `invalid_block_range` (`fromBlock` > `toBlock`) / `block_range_too_large` (at most 100,000 blocks per query)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "`unknown_custody_group`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "`chain_rpc_failed`: the upstream RPC returned an error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "`chain_rpc_unavailable`: the gateway has no RPC endpoint for this custody chain"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/security/custody/{key}/late-deposits/{id}":
    get:
      tags:
        - Security
      summary: Late deposit receipt
      description: "On-chain state of one Late deposit receipt (`CustodyVault.lateReceipt`, read through the gateway's chain RPC): the binding (asset, beneficiary account, refund address), the net amount received, the source message and final message hashes, and whether it has been refunded. Operators can also trigger the refund manually as a fallback."
      operationId: v1_security_late_deposit
      parameters:
        - name: key
          in: path
          required: true
