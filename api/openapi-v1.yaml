        signingAccountId:
          type: integer
          description: "**Signing only.** The value for `fromAccount` / `toAccount` in the `Transfer` struct and for `accountId` when acting as this subaccount"
        name:
          type: string
          description: "Gateway label set at creation or via `POST /v1/account/subaccounts/name`; empty when never named"
    Ticker:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        open:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the first trade in the window; null when the market had no trades"
        high:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Highest trade price in the window; null when no trades"
        low:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Lowest trade price in the window; null when no trades"
        last:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the last trade in the window; null when no trades"
        volume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Total traded size in the window (base asset)
        quoteVolume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size in the window (quote asset)"
        trades:
          type: integer
          description: Number of trades in the window
    Trade:
      type: object
      properties:
        id:
          type: string
          description: "Trade id `<seq>-<sub>-<idx>`; the same id as the WebSocket `trades` frame"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        side:
          type: string
          enum:
            - buy
            - sell
          description: Taker side
        ts:
          type: integer
          format: int64
          description: Unix time in milliseconds
    Vault:
      type: object
      description: "A vault. USDC amounts are decimal strings, NAV per share is a ratio, shares are integer strings, rates are ppm integers. No numeric account id appears: the account id a vault signs with is `signingAccountId` from `GET /v1/account/nonce?vault=`. Markets appear by symbol only."
      required:
        - vault
        - address
        - dex
        - name
        - description
        - creator
        - creatorSubaccount
        - manager
        - managerSubaccount
        - hasManager
        - leader
        - tradingHalt
        - lpShares
        - managerShares
        - totalShares
        - lpBalance
        - managerBalance
        - lastCheckedEquity
        - hwm
        - equity
        - unattributed
        - totalDeposits
        - pnl
        - managerPortionPpm
        - navPerShare
        - navPerShareByClass
        - config
        - whitelist
        - blacklist
        - maxLeverages
        - depositorWhitelist
        - depositorCount
        - createdAtMs
        - aprPpm
        - maxDrawdownPpm
        - netReturnPpm
        - inceptionAprPpm
        - utilizationPpm
        - profitSharePpm
        - marketVaults
        - authorizedManager
        - confirmedTradingHalt
        - pendingClaim
      properties:
        vault:
          type: integer
          description: "Vault id (the `vault` of `?vault=` reads, write envelopes and WebSocket subscriptions)"
        address:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "The vault's own address (no private key exists for it): the main account is subaccount 0 of this address, so `?address=<this>&subaccount=0` reads the vault and address-level fee rules apply to it. A manager or its API wallet trades it with a signed command whose account is this address. Derived as the last 20 bytes of `keccak256(\"dex-os/vault-address\" ‖ EIP-712 domain separator ‖ uint16 vault ‖ uint8 salt)`, salt being the first one with no account yet; read it here rather than computing it"
        dex:
          type: integer
          description: "The vault's dex, fixed at creation: `0` = platform vault (created by the platform; deposits come from the platform balance; on merchant markets it trades through its per-market sub-vaults); `>= 1` = merchant vault (created on that merchant's site; creator, manager and depositors all use their balance in that dex, and the vault trades only that dex's perps)."
        name:
          type: string
        description:
          type: string
        creator:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet of the account that created the vault; null for an internal account"
        creatorSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the creating account under `creator` (same numbering as `subaccount=`)"
        manager:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet of the manager as recorded on the vault's funds side. It can be set before `authorizedManager`; do not use it to decide who may manage the vault."
        managerSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the claiming account under `manager`; null while unclaimed"
        hasManager:
          type: boolean
        leader:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Legacy alias: `manager`, or `creator` while unclaimed"
        tradingHalt:
          type: boolean
          description: "Halted (below the halt threshold): orders cancelled, positions closed, only cancels allowed"
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: "LP share units (integer; not a token amount)"
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: Manager share units (integer)
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: "`lpShares + managerShares`"
        lpBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the LP class, USDC
        managerBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the manager class, USDC
        lastCheckedEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Equity at the last ledger sync, USDC
        hwm:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: High-water mark for the profit share, USDC
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Vault equity (main account net collateral), USDC
        unattributed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − lpBalance − managerBalance` (PnL not yet synced into the classes), USDC"
        totalDeposits:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Sum of the principal shown to every depositor, USDC
        pnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − totalDeposits` (signed), USDC"
        managerPortionPpm:
          type:
            - integer
            - "null"
          description: "Manager balance / attributed balance, ppm; null when nothing is attributed"
        navPerShare:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Equity per share as a ratio (1 = par at the first deposit); null while there are no shares"
        navPerShareByClass:
          type: object
          required:
            - lp
            - manager
          properties:
            lp:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "LP class balance per LP share (ratio); null without shares"
            manager:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Manager class balance per manager share (ratio); null without shares"
        config:
          "$ref": "#/components/schemas/VaultConfig"
        whitelist:
          type:
            - array
            - "null"
          items:
            "$ref": "#/components/schemas/VaultMarket"
          description: "null = every market allowed; otherwise only these (an empty list allows none)"
        blacklist:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarket"
        maxLeverages:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMaxLeverage"
          description: "Per-market leverage caps; markets without a cap are absent"
        depositorWhitelist:
          type: array
          items:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Empty = anyone may deposit"
        depositorCount:
          type: integer
        createdAtMs:
          type:
            - integer
            - "null"
          description: "Block time of the vault's creation; null before the first block"
        aprPpm:
          type:
            - integer
            - "null"
          description: "Annualised return over the metric window, ppm; null when it cannot be computed"
        maxDrawdownPpm:
          type:
            - integer
            - "null"
          description: "Maximum drawdown of NAV per share over the metric window, ppm; null when it cannot be computed"
        netReturnPpm:
          type:
            - integer
            - "null"
          description: "`pnl / totalDeposits`, ppm; null without principal"
        inceptionAprPpm:
          type:
            - integer
            - "null"
          description: "Net return annualised over the vault's age, ppm; null without principal or under one day old"
        utilizationPpm:
          type:
            - integer
            - "null"
          description: "Main-account IMR / equity, ppm; null when equity is not positive while margin is in use"
        profitSharePpm:
          type: integer
          description: "Legacy alias of `config.profitSharePpm`"
        marketVaults:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarketStatus"
        authorizedManager:
          type:
            - string
            - "null"
          description: "Main wallet of the manager whose authorization the ledger has confirmed; null while no manager is authorized. `manager` may already be set before this; permission checks use this field."
        confirmedTradingHalt:
          type: boolean
          description: "Trading-halt state as last confirmed by the ledger. Execution is always governed by `tradingHalt`."
        pendingClaim:
          type:
            - object
            - "null"
          required:
            - logIdx
            - ordinal
            - slot
            - status
          properties:
            logIdx:
              type: string
              pattern: "^[0-9]+$"
              description: "Log index of the original claim request (full u64 as a decimal string, so values above 2^53 keep their precision)."
            ordinal:
              type: integer
              minimum: 0
              maximum: 65535
            slot:
              type: integer
              minimum: 0
              maximum: 4095
            status:
              type: string
              enum:
                - pending
          description: "Manager claim awaiting confirmation, or null when there is none; `logIdx` / `ordinal` identify the original claim request."
    VaultConfig:
      type: object
      required:
