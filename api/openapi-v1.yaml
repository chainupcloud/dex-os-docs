      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unsigned:
                  type: string
                  description: "0x-prefixed hex"
                signatures:
                  type: array
                  items: {}
                membershipSignatures:
                  type: array
                  items:
                    type: string
                membership:
                  type: object
                format:
                  type: string
              required:
                - unsigned
