                "$ref": "#/components/schemas/Error"
  "/v1/security/custody/{key}/deposit-precheck":
    get:
      tags:
        - Security
      summary: Deposit precheck
      description: "入金前的预检(入金按地址,规格 deposit-by-address §3.3 / §3.5 / §5.4):给定资产、金额与受益地址,答这笔入金会不会被合约挡下(effect = revert:直接入金交易失败、钱不离开钱包;CCTP 入金 effect = late:源链已 burn、在 hub 按 Late 收下后退回受益地址)、会不会被账本拒收退款(effect = refund,带拒因 reason 与英文说明)、会不会暂缓(effect = defer)。链上项:受益地址非零且不是本组 Inbox / Vault / Registry(beneficiaryForbidden)、受益地址可签名(eth_getCode 为空或 EIP-7702 委托 `0xef0100‖地址`,否则 beneficiaryNotSignable)、Inbox 最低额(minDepositNotConfigured / belowMinDeposit;读不到时 chain.checked = false)。账本项按 159 的判定次序:金额不可换算 3 → 超单笔未确认上限 4 → 超负债上界 5 → 受益地址无主账户且无法开户(注册关闭、容量满)2 accountOpeningUnavailable → 新地址首笔超单账户上限 6 firstDepositOverAccountCap;已有账户的余额 + 本笔超上限另报 6 accountCapExceeded(柜员入账时拒)。ok = 没有 revert / late / refund 项。只读、建议性:合约与账本才是权威,两次读之间状态可能变化。"
      operationId: v1_security_deposit_precheck
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "custodyKeyHash(0x 开头的 32 字节十六进制)"
        - name: assetId
          in: query
          required: true
          schema:
            type: string
          description: "十进制 u32"
        - name: assetVersion
          in: query
          required: true
          schema:
            type: string
          description: "十进制 u64"
        - name: amountRaw
          in: query
          required: true
          schema:
            type: string
          description: "入金金额(raw,十进制 uint256)"
        - name: beneficiary
          in: query
          required: true
          schema:
            type: string
          description: "受益地址(0x 开头的 20 字节;缺省入口的受益 = 发交易的钱包)"
        - name: route
          in: query
          required: false
          schema:
            type: string
            enum:
              - direct
              - native
              - cctp
          description: "缺省 direct;cctp 时合约侧的拦截改为 Late 退款(effect = late)"
      responses:
        "200":
          description: "预检结果"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - beneficiaryForbidden
                            - beneficiaryNotSignable
                            - minDepositNotConfigured
                            - belowMinDeposit
                            - amountUnrepresentable
                            - creditCapExceeded
                            - liabilityCapExceeded
                            - accountOpeningUnavailable
                            - firstDepositOverAccountCap
                            - accountCapExceeded
                            - wouldDefer
                        effect:
                          type: string
                          enum:
                            - revert
                            - late
                            - refund
                            - defer
                        reason:
                          type: string
                          description: "账本拒因名(effect = refund 时)"
                        message:
                          type: string
                  chain:
                    type: object
                    properties:
                      checked:
                        type: boolean
                      minDepositRaw:
                        type:
                          - string
                          - "null"
                      beneficiarySignable:
                        type:
                          - boolean
                          - "null"
                  ledger:
                    type: object
                    properties:
                      beneficiaryAccountId:
                        type:
                          - integer
                          - "null"
                        description: "受益地址的单签主账户;没有为 null(入账时自动开户)"
                      willOpenAccount:
                        type: boolean
                      registrationEnabled:
                        type: boolean
                      maxAccountRaw:
                        type: string
                      maxUnconfirmedCreditRaw:
                        type: string
                      rawQuantum:
                        type: string
                      deferral:
                        type: object
                  route:
                    type: string
                  beneficiary:
                    type: string
                  amountRaw:
                    type: string
        "400":
          description: "invalid_custody_key_hash / invalid_query(参数缺失或格式不对、route 不认识)"
        "404":
          description: "unknown_custody_asset(组或资产不在账本里)"
        "503":
          description: security_state_unavailable
