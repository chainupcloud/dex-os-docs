  /v1/builder:
    get:
      tags:
        - Market data
      summary: The builder behind this entry
      description: |-
        Returns the builder (white-label front end) this request resolves to and its markets. `?builder=` picks one; otherwise the entry domain decides (`Host`, or `X-Forwarded-Host` behind trusted proxies).
        - A domain bound to no builder returns 200 `PlatformEntry` (`builderId: null`), not an error.
        - Only `listed` / `closeOnly` markets appear (`closeOnly` = reduce-only). Trade with `symbol`, show `display`; `fees` = front-end fee rates.
        - Unresolvable → 404 `GatewayBuilderNotFound`.
      operationId: v1_builder
      parameters:
        - name: builder
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "`builderId` (decimal); default: the entry domain"
        - name: market
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "`signingMarketId` (0–65535): adds `market` = its row in this catalog (`hidden` included), or null if absent (builder-routed orders get 403 `GatewayBuilderMarketNotListed`). Ignored on `PlatformEntry`"
      responses:
        "200":
          description: "The builder view, or `PlatformEntry` when the entry domain has no builder and no `?builder=` is given"
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/BuilderView"
                  - "$ref": "#/components/schemas/PlatformEntry"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "`GatewayBuilderNotFound` (`num` 10404): no builder for `?builder=` (`details.builder`) or for the entry domain (`details.domain`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/builders/{address}/summary":
    get:
      tags:
        - Market data
      summary: Builder fee summary
      description: "`builder_fee` ledger entries received by this builder's main account, totalled per token and filtered by `startTime` / `endTime`. Builder-attributed volume is not yet available (planned for v1.1)."
      operationId: v1_builder_summary
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; case-insensitive, lower-case in responses"
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix ms
          description: Start (inclusive)
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix ms
          description: End (exclusive)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
          description: Page size
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BuilderSummary"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/dexes:
    get:
      tags:
        - Market data
      summary: Builder dex list
      description: "Every dex, by id, paged with `after` / `limit` → `next`: owner, collateral token, insurance account, surcharge, margin table, markets and short `code` (its market symbol prefix). `markets` = perpetuals only; `spotMarkets` = spot pairs. Rows add the ledger registration (`DexLedgerRow`: owner, config, private feed quota, `marketCount`, `authority`); the ledger snapshot is at the top."
      operationId: v1_dexes
      parameters:
        - name: ownerAccount
          in: query
          required: false
          schema:
            type: string
          description: "Current owner account id (decimal); omit to list all"
        - name: shortName
          in: query
          required: false
          schema:
            type: string
            pattern: "^[A-Z][A-Z0-9]{1,7}$"
          description: "Exact short name; the list then has 0 or 1 entries. A name the ledger would reject (lower case, wrong length, reserved `MAIN`) returns 400 `invalid_short_name`"
        - name: limit
          in: query
          required: false
          schema:
            type: string
          description: "1..1000, default 100"
        - name: after
          in: query
          required: false
          schema:
            type: string
          description: "Start after this dex id (decimal); omit to start from the first. Next page: the response's `next`"
      responses:
        "200":
          description: "One published ledger snapshot; u64 values as decimal strings"
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerCut"
                  - type: object
                    required:
                      - ownerAccount
                      - dexes
                      - next
                    properties:
                      ownerAccount:
                        type:
                          - integer
                          - "null"
                        description: The ownerAccount filter, null when absent
                      dexes:
                        type: array
                        items:
                          allOf:
                            - "$ref": "#/components/schemas/Dex"
                            - "$ref": "#/components/schemas/DexLedgerRow"
                      next:
                        type:
                          - integer
                          - "null"
                        description: "Pass as `after` for the next page; null on the last page"
        "400":
          description: "Malformed query parameter: `invalid_owner_account` / `invalid_short_name` / `invalid_limit` / `invalid_after` / `unsupported_parameter`"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/dexes/{id}":
    get:
      tags:
        - Market data
      summary: Single dex
      description: "One `/v1/dexes` row (`markets` = perps, `spotMarkets` = spot) plus `categories`: the dex's own categories and the platform templates its markets' `tags` use, ordered by `sort` then code. These are the display names for `/v1/markets[].tags`. May lag up to 2 s."
      operationId: v1_dex
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Dex"
                  - type: object
                    required:
                      - dex
                      - categories
                    properties:
                      dex:
                        type: integer
                      categories:
                        type: array
                        items:
                          "$ref": "#/components/schemas/CategoryView"
                  - "$ref": "#/components/schemas/DexLedgerRow"
                  - "$ref": "#/components/schemas/LedgerCut"
        "404":
          "$ref": "#/components/responses/NotFound"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/events:
    get:
      tags:
        - Account
      summary: Event backfill
      description: |-
        Raw execution-layer events, same shape as the WebSocket `events` channel. Ascending only (`order=desc` is 400).

        - With `address`: that account's events, dense pages; `symbol` narrows to one market.
        - Without `address`: the whole log; `symbol` filters within each page, so pages may be sparse or empty. Follow `next` until `hasMore=false`.
        - `OrderAttributed` / `FillAttributed` are not published here or on WebSocket.
      operationId: v1_events
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp) or `BTC-USDC` (spot); a merchant dex market is `<code>:BTC-USD` (`:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: ""
        - "$ref": "#/components/parameters/MarketKind"
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; case-insensitive, lower-case in responses"
          description: ""
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`; same as the backfill cursor and the `id` in WebSocket frames"
          description: "Cursor: `next` from the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; required with `upper` when `after` is set (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; required with `epoch` when `after` is set, else 400. Past this replica's complete history: 400 `GatewayHistoryIncomplete`, retry later"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventsPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/exchange:
    get:
      description: "Connection parameters: EIP-712 domain, chainId, deposit address, token table, version, `serverTime`, `fundingTickSec`, vault fee and minimum deposit (`vault`), numeric conventions. **Never hard-code the domain**: after a chain or contract change every signature then fails (401)."
      operationId: v1_exchange
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Exchange"
        "503":
          "$ref": "#/components/responses/Unavailable"
      summary: Connection parameters and conventions
      tags:
        - Exchange
  /v1/fees:
    get:
      tags:
        - Market data
      summary: Fee schedule
      description: "The standard liquidity-tier table; account rates are in `GET /v1/account`, market overrides in `GET /v1/markets`. A dex deployer may use only `dexSelectableTiers` in `RegisterDexAsset`; others fail with `UnknownLiquidityTier`."
      operationId: v1_fees
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  liquidityTiers:
                    type: object
                    properties:
                      tiers:
                        type: array
                        items:
                          type: object
                          properties:
                            tier:
                              type: integer
                            initialMarginPpm:
                              type: integer
                            maintenanceFractionPpm:
                              type: integer
                              description: "MMR = IMR × this / 1e6"
                            impactNotionalQuote:
                              type: string
                            oiLowerCapQuote:
                              type: string
                              description: "\"0\" = OIMF off"
                            oiUpperCapQuote:
                              type: string
                            maxLeverage:
                              type: integer
                              description: "`1e6 / initialMarginPpm`, display only"
                            dexSelectable:
                              type: boolean
                              description: "Deployer may pick this tier in `RegisterDexAsset`"
                      defaultTier:
                        type: integer
                        description: "7 = `IML_5x`; also used when `RegisterDexAsset` names none"
                      dexSelectableTiers:
                        type: array
                        items:
                          type: integer
                        description: Tiers a deployer may pick, ascending
                  note:
                    type: string
  /v1/markets:
    get:
      tags:
        - Market data
      summary: Market table
      description: "Every ledger market, by `signingMarketId`; `symbol` is null until the market has a catalog name. Prices and sizes are exact decimal strings scaled by `priceDecimals` / `sizeDecimals`. Rows add the ledger spec (`MarketLedger`: spec and asset versions, admission, oracle state and policy); the ledger snapshot is at the top. Per-dex cap: `maxMarketsPerDex` of `/v1/governance/parameters`; used count: `marketCount` of `/v1/dexes`."
      operationId: v1_markets
      parameters:
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/LedgerSnapshot"
                  - type: object
                    required:
                      - markets
                    properties:
                      markets:
                        type: array
                        items:
                          allOf:
                            - "$ref": "#/components/schemas/Market"
                            - "$ref": "#/components/schemas/MarketLedger"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/markets/{symbol}":
    get:
      tags:
        - Market data
      summary: Single market
      description: ""
      operationId: v1_market
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` on a merchant dex (`:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Market symbol
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Market"
