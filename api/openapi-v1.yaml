      summary: Order book snapshot
      description: "`depth` levels per side (default 20, maximum 200). `seq` is the state point of this snapshot; when the read model cannot assemble a complete generation the response is 503 rather than an empty book. With `aggTicks` the server merges the **whole** book into price buckets of that many ticks (bids rounded down, asks rounded up, sizes summed, best price first) and then takes `depth` buckets per side; the response echoes `aggTicks`. Without it the response is unchanged."
      operationId: v1_book
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
            examples:
