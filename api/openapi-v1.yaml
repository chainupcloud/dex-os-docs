  /v1/security/governance/signatures:
    get:
      tags:
        - Security
      summary: Signature collections
      description: "签名收集列表(最近 100 份,新的在前):提案号、载荷种类、操作名、已收签名数。"
      operationId: v1_security_governance_collections
      responses:
        "200":
          description: "收集列表"
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
        "400":
          description: "参数 / 请求体格式错误"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
    post:
      tags:
        - Security
      summary: Submit governance signatures
      description: "交一份或几份签名(或整份导出 `dexos-gov-signatures/v1`,离线收集的导入)。签名自证、不信任上传者:服务端从待签结构重算摘要(载荷与信封须自洽,否则 422 `inconsistent_envelope`)、恢复签名者,只收当前签名策略成员的签名(422 `not_a_member`);成员变更的新成员接受只收新成员(422 `not_a_new_member`);签名主体纪元已过 409 `stale_authority_epoch`;同一提案号只认一份待签结构(409 `conflicting_unsigned`)。没配网关库时 503 `signature_store_unavailable`。成功返回这份收集(同 GET)。"
      operationId: v1_security_governance_collect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unsigned:
                  type: string
                  description: "0x 十六进制"
                signatures:
                  type: array
                  items: {}
                membershipSignatures:
                  type: array
                  items:
                    type: string
                membership:
                  type: object
                format:
                  type: string
              required:
                - unsigned
        description: "待签结构与签名"
      responses:
        "200":
          description: "这份收集(导出格式)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  format:
                    type: string
                    enum:
                      - dexos-gov-signatures/v1
                  requestId:
                    type: string
                    description: "0x 十六进制"
                  digest:
                    type: string
                    description: "0x 十六进制"
                  unsigned:
                    type: string
                    description: "0x 十六进制"
                  signatures:
                    type: array
                    items:
                      type: object
                  membership:
                    type: object
                    nullable: true
                  members:
                    type: array
                    items:
                      type: string
                  threshold:
                    type: integer
                  epochCurrent:
                    type: boolean
                  ready:
                    type: boolean
                  command:
                    type: string
                    nullable: true
                  createdMs:
                    type: string
        "400":
          description: "参数 / 请求体格式错误"
        "409":
          description: "签名主体纪元已过 / 提案号已有另一份待签结构"
        "422":
          description: "签名不合格(非成员 / 恢复不出 / 信封不自洽 / 不是治理命令)"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
