        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/governance/preconditions:
    post:
      tags:
        - Security
      summary: Compute governance preconditions
      description: "按账本当前状态算一条 GovernedOperation 该带的前提表与哈希、适用的延迟与延迟类(与 STF 同一份函数)。只读。操作的写法与 WASM `governanceProposal` 相同:按字段的 JSON,或 `{\"canonical\": \"0x…\"}`。算不出(功能未开放等)时 `ok = false` 附拒因。"
      operationId: v1_security_governance_preconditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: object
              required:
                - operation
        description: "要算前提的操作"
      responses:
        "200":
          description: "前提与延迟"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  preconditions:
                    type: array
                    items:
                      type: object
                  preconditionsHash:
                    type: string
                    description: "0x 十六进制"
                  delayMs:
                    type: string
                  delayClasses:
                    type: array
                    items:
                      type: string
                  operation:
                    type: object
                  error:
                    type: object
        "400":
          description: "参数 / 请求体格式错误"
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  /v1/security/governance/simulate:
    post:
