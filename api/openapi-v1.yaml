            maximum: 200
            default: 20
          description: Number of levels
        - name: aggTicks
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Price aggregation: ticks per bucket (1 tick = 10^-priceDecimals). Allowed values are exactly the market's `aggTicks` from `GET /v1/markets/{symbol}` (configured per market, not derived from the price). Any other value is 400 `GatewayBadRequest` with the allowed values in `details.allowed` (an empty array when the market has no levels configured). Omit for raw price levels."
        - "$ref": "#/components/parameters/MinSeq"
