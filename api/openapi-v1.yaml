  "/v1/security/custody/{key}/deposit-precheck":
    get:
      tags:
        - Security
      summary: Deposit precheck
      description: |-
        Pre-check a deposit by address before sending it. Given the asset, amount and beneficiary, it reports whether the deposit would be blocked by the contract (`effect` = `revert`: a direct deposit transaction fails and the funds never leave the wallet; for a CCTP deposit `effect` = `late`: the funds are already burned on the source chain, and the hub accepts them as a Late deposit and refunds them to the beneficiary), refused and refunded by the ledger (`effect` = `refund`, with the refund `reason` and an explanation), or deferred (`effect` = `defer`).

        On-chain checks: the beneficiary is non-zero and is not this group's Inbox / Vault / Registry contract (`beneficiaryForbidden`); the beneficiary can sign (`eth_getCode` is empty or an EIP-7702 delegation `0xef0100 || address`, otherwise `beneficiaryNotSignable`); the Inbox minimum deposit (`minDepositNotConfigured` / `belowMinDeposit`; when it cannot be read, `chain.checked` = false).

        Ledger checks, in the order the ledger applies them: amount not representable in ledger units (`amountUnrepresentable`) -> above the single unconfirmed credit cap (`creditCapExceeded`) -> above the liability cap (`liabilityCapExceeded`) -> the beneficiary has no main account and none can be opened because registration is closed or capacity is full (`accountOpeningUnavailable`) -> the first deposit to a new address exceeds the per-account cap (`firstDepositOverAccountCap`). If an existing account's balance plus this amount would exceed the per-account cap, `accountCapExceeded` is reported separately (the credit is refused when it is applied).

        `ok` is true when there is no `revert`, `late` or `refund` issue. Read-only and advisory: the contract and the ledger decide, and state can change between two reads.
      operationId: v1_security_deposit_precheck
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` of the custody group (0x-prefixed 32-byte hex)"
        - name: assetId
          in: query
          required: true
          schema:
            type: string
          description: Asset id (decimal u32)
        - name: assetVersion
          in: query
          required: true
          schema:
            type: string
          description: Asset version (decimal u64)
        - name: amountRaw
          in: query
          required: true
          schema:
            type: string
          description: Deposit amount in raw units (decimal uint256)
        - name: beneficiary
          in: query
          required: true
          schema:
            type: string
          description: "Beneficiary address (0x-prefixed, 20 bytes; with the default inbox entry point the beneficiary is the wallet that sends the transaction)"
        - name: route
          in: query
          required: false
          schema:
            type: string
            enum:
              - direct
              - native
              - cctp
          description: "Defaults to `direct`; with `cctp`, contract-side blocks become Late refunds (`effect` = `late`)"
      responses:
        "200":
          description: Pre-check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - beneficiaryForbidden
                            - beneficiaryNotSignable
                            - minDepositNotConfigured
                            - belowMinDeposit
                            - amountUnrepresentable
                            - creditCapExceeded
                            - liabilityCapExceeded
                            - accountOpeningUnavailable
                            - firstDepositOverAccountCap
                            - accountCapExceeded
                            - wouldDefer
                        effect:
                          type: string
                          enum:
                            - revert
                            - late
                            - refund
                            - defer
                        reason:
                          type: string
                          description: "Ledger refund reason name (when `effect` = `refund`)"
                        message:
                          type: string
                  chain:
                    type: object
                    properties:
                      checked:
                        type: boolean
                      minDepositRaw:
                        type:
                          - string
                          - "null"
                      beneficiarySignable:
                        type:
                          - boolean
                          - "null"
                  ledger:
                    type: object
                    properties:
                      beneficiaryAccountId:
                        type:
                          - integer
                          - "null"
                        description: "The beneficiary's single-signer main account; null if it has none (one is opened automatically when the deposit is credited)"
                      willOpenAccount:
                        type: boolean
                      registrationEnabled:
                        type: boolean
                      maxAccountRaw:
                        type: string
                      maxUnconfirmedCreditRaw:
                        type: string
                      rawQuantum:
                        type: string
                      deferral:
                        type: object
                  route:
                    type: string
                  beneficiary:
                    type: string
                  amountRaw:
                    type: string
        "400":
          description: "`invalid_custody_key_hash`, or `invalid_query` (a parameter is missing or malformed, or `route` is not recognized)"
        "404":
          description: "`unknown_custody_asset` (the custody group or asset is not in the ledger)"
        "503":
          description: security_state_unavailable
  /v1/exchange/cctp/routes:
    get:
      tags:
        - Funds
      summary: CCTP routes (deposit sources and withdrawal routes)
      description: |-
        Public CCTP read endpoint. Per custody group: the hub (custody chain id, CCTP domain, DepositInbox), the CCTP deposit sources and the withdrawal routes.

        A deposit source is the remote end of one of the group's CCTP address routes (`routeKind` 3): source domain, chain id, source-chain USDC (`burnToken`), the matching hub asset (`assetId` / `assetVersion` / `hubToken`) and the Inbox minimum deposit `minDepositRaw` (read from `DepositInbox.minDepositRaw` through the custody chain RPC). For each source the gateway also reads the Inbox's source registration (written by `configureCctpSource`) from the custody chain: `registered = true` only when the registered hub token, source token and both domains all match; `tokenMessenger` (the TokenMessenger to call on the source chain) is the registered remote messenger, null when not registered; when the read fails, `registered` is null and `registrationError` is set. `available` = the custody group is not frozen and has no pending escape, the source is registered, the asset has `depositEnabled`, and the minimum is > 0.

        Withdrawal routes list only valid address routes (`destinationInbox` / `destinationCaller` are zero, `hookDataHash` = keccak(""), not bound to an account); the fields are the same as `routes` in `/v1/security/custody`, plus `available`.

        Read-only and advisory. A source registered in the Inbox for which the group has no withdrawal route to that chain is not listed.
      operationId: v1_exchange_cctp_routes
      responses:
        "200":
          description: CCTP routes per custody group
          content:
            application/json:
              schema:
                type: object
                required:
                  - ledgerEpoch
                  - groups
                properties:
                  networkId:
                    type: string
                  genesisHash:
                    type: string
                  ledgerEpoch:
                    type: string
                  manifestHash:
                    type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        custodyKeyHash:
                          type: string
                        hub:
                          type: object
                          properties:
                            chainId:
                              type: string
                            domain:
                              type:
                                - integer
                                - "null"
                            depositInbox:
                              type: string
                        open:
                          type: boolean
                        deposit:
                          type: object
                          properties:
                            bindingType:
                              type: string
                            bindingTypehash:
                              type: string
                            inboxMessageBytes:
                              type: integer
                            sources:
                              type: array
                              items:
                                type: object
                                properties:
                                  domain:
                                    type: integer
                                  chainId:
                                    type: string
                                  burnToken:
                                    type: string
                                  tokenMessenger:
                                    type:
                                      - string
                                      - "null"
                                  registered:
                                    type:
                                      - boolean
                                      - "null"
                                  registrationError:
                                    type: string
                                  assetId:
                                    type: integer
                                  assetVersion:
                                    type: string
                                  hubToken:
                                    type: string
                                  minDepositRaw:
                                    type:
                                      - string
                                      - "null"
                                  minDepositError:
                                    type: string
                                  depositEnabled:
                                    type: boolean
                                  available:
                                    type: boolean
                        withdraw:
                          type: object
                          properties:
                            routes:
                              type: array
                              items:
                                type: object
                                properties:
                                  routeHash:
                                    type: string
                                  kind:
                                    type: string
                                  sourceToken:
                                    type: string
                                  destinationToken:
                                    type: string
                                  sourceMessenger:
                                    type: string
                                  sourceTransmitter:
                                    type: string
                                  destinationTransmitter:
                                    type: string
                                  destinationTokenMessenger:
                                    type: string
                                  destinationCaller:
                                    type: string
                                  hookDataHash:
                                    type: string
                                  destinationInbox:
                                    type: string
                                  refundRecipient:
                                    type: string
                                  maxBurnPerMessage:
                                    type: string
                                  routeConfigVersion:
                                    type: string
                                  destinationChainId:
                                    type: string
                                  routeKind:
                                    type: integer
                                  adapterVersion:
                                    type: integer
                                  sourceDomain:
                                    type: integer
                                  destinationDomain:
                                    type: integer
                                  minFinalityThreshold:
                                    type: integer
                                  beneficiaryAccountId:
                                    type: integer
                                  available:
                                    type: boolean
                  source:
                    type: string
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/exchange/cctp/quote:
    post:
      tags:
        - Funds
      summary: "Quote a CCTP deposit burn (hookData + calldata)"
      description: |-
        CCTP deposit quote. Returns the binding hookData (160 bytes) for a deposit to an address, `CctpInboxBinding(bytes32 destinationCustodyKeyHash,uint32 assetId,uint64 assetVersion,address beneficiary)`, and the calldata for `TokenMessengerV2.depositForBurnWithHook` on the source chain (`mintRecipient` = `destinationCaller` = the group's DepositInbox, `minFinalityThreshold` = 2000). The gateway does not sign, send or register anything: the wallet first approves on the source chain (`burn.approve`), then sends `burn.calldata` to `burn.to`. `maxFeeRaw` defaults to the source chain's `getMinFeeAmount(amount)`, read through the gateway's RPC endpoint for that chain; if it cannot be read and no `maxFeeRaw` is given, the reply is 503 (the fee is never assumed to be 0).

        A deposit that would revert on the hub or be held as a late deposit (and refunded) is rejected and no burn is returned:
        - 400 `beneficiary_forbidden`: the beneficiary is the zero address or one of this group's contracts;
        - 404 `unknown_cctp_source`: no CCTP deposit source for this `sourceDomain` / asset in the group;
        - 409 `cctp_source_not_registered`: the source is not registered on the Inbox;
        - 422 `min_deposit_not_configured`: no minimum deposit is configured for the asset;
        - 422 `below_min_deposit`: the minimum credit `minCreditRaw` = `amountRaw - maxFeeRaw` is below the minimum deposit;
        - 422 `beneficiary_not_signable`: the beneficiary is a contract (not an EIP-7702 delegation);
        - 422 `max_fee_below_minimum`: `maxFeeRaw` is below the source chain's minimum fee;
        - 422 `amount_unrepresentable`: `maxFeeRaw` >= `amountRaw`;
        - 409 `custody_group_unavailable`: the custody group is frozen or in escape;
        - 409 `deposit_not_enabled`: the asset is not yet open for deposits.

        Ledger-side checks (account opening, limits) are previewed by the `precheck` link in the reply (`deposit-precheck?route=cctp`). Read-only and advisory.
      operationId: v1_exchange_cctp_quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - custodyKeyHash
                - sourceDomain
                - assetId
                - assetVersion
                - amountRaw
                - beneficiary
              properties:
                custodyKeyHash:
                  type: string
                  description: "0x-prefixed 32-byte hex"
                sourceDomain:
                  type: integer
                  description: "CCTP domain of the source chain (take it from `deposit.sources[].domain` in the CCTP routes)"
                assetId:
                  type: integer
                assetVersion:
                  type: string
                  pattern: "^[0-9]+$"
                amountRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "Amount burned on the source chain, in raw units (decimal uint256, > 0)"
                beneficiary:
                  type: string
                  description: "Beneficiary address: the deposit is credited to its single-signer main account; if it has none, one is opened automatically when the deposit is credited"
                maxFeeRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "Optional; defaults to the source chain's `getMinFeeAmount(amountRaw)`"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  sourceDomain:
                    type: integer
                  assetId:
                    type: integer
                  assetVersion:
                    type: string
                  amountRaw:
                    type: string
                  beneficiary:
                    type: string
                  binding:
                    type: object
                    properties:
                      destinationCustodyKeyHash:
                        type: string
                      assetId:
                        type: integer
                      assetVersion:
                        type: string
                      beneficiary:
                        type: string
                  bindingType:
                    type: string
                  hookData:
                    type: string
                  hookDataHash:
                    type: string
                  minDepositRaw:
                    type: string
                  fee:
                    type: object
                    properties:
                      minFeeRaw:
                        type:
                          - string
                          - "null"
                      minFeeError:
                        type: string
                      maxFeeRaw:
                        type: string
                  minCreditRaw:
                    type: string
                  burn:
                    type: object
                    properties:
                      chainId:
                        type: string
                      to:
                        type: string
                      function:
                        type: string
                        enum:
                          - depositForBurnWithHook
                      args:
                        type: object
                      calldata:
                        type: string
                      approve:
                        type: object
                        properties:
                          token:
                            type: string
                          spender:
                            type: string
                          amountRaw:
                            type: string
                  precheck:
                    type: string
                  source:
                    type: string
        "400":
          description: "Invalid request body (`invalid_request`) or forbidden beneficiary (`beneficiary_forbidden`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: unknown_custody_group / unknown_cctp_source
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: cctp_source_not_registered / custody_group_unavailable / deposit_not_enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: min_deposit_not_configured / below_min_deposit / beneficiary_not_signable / max_fee_below_minimum / amount_unrepresentable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: chain_rpc_unavailable / security_state_unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/exchange/cctp/withdraw-quote:
    post:
      tags:
        - Funds
      summary: Quote a CCTP withdrawal (address routes only)
      description: |-
        Quote a CCTP withdrawal to a plain address on the destination chain (address routes only). Read-only and advisory.

        - **Route**: chosen by the same rule as the SDK `cctp_route`: source token = the asset's token, destination chain = the chain id that this custody group's domain table maps the route's destination domain to, and the highest `routeConfigVersion` wins. 404 `no_cctp_route` when the destination is the custody chain itself or no route exists.
        - **Chunks**: the principal is split into chunks exactly like the contract's `CctpCodec.split`; more than 32 chunks -> 422 `too_many_chunks`. The gateway reads Circle's `burnLimitsPerMessage` from the custody chain (a chunk above it -> 422 `above_burn_limit`) and `getMinFeeAmount` for each chunk.
        - **Bridge fee**: the recommended `maxBridgeFeeRaw` = the maximum over chunks of ceil(minimum fee x principal / chunk amount); after re-splitting, each chunk's maximum fee is checked to be at least that chunk's minimum fee. `minReceivedRaw` = principal - `maxBridgeFeeRaw`; the amounts are then checked against the route policy (not representable -> 422 `amount_unrepresentable`).
        - **Withdrawal fee**: follows the custody group's withdrawal fee policy; `debitRaw` = principal + withdrawal fee (not representable -> 422 `withdrawal_fee_unrepresentable`).
        - **Other errors**: 400 `invalid_request` for a malformed body; 404 `unknown_custody_group`; 409 `custody_group_unavailable` when the custody group is frozen or an escape is pending; 503 `chain_rpc_unavailable` when an on-chain value cannot be read (the quote never assumes 0).

        Copy `destinationChainId`, `maxBridgeFeeRaw` and `minReceivedRaw` into the CCTP route of a `RequestCashWithdrawal` signed command. The custody vault re-checks against the on-chain values at reservation and at burn time.
      operationId: v1_exchange_cctp_withdraw_quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - custodyKeyHash
                - assetId
                - destinationChainId
                - principalRaw
              properties:
                custodyKeyHash:
                  type: string
                  description: "Custody group key hash: 32 bytes as 0x-prefixed hex"
                assetId:
                  type: integer
                destinationChainId:
                  type: string
                  pattern: "^[0-9]+$"
                  description: Destination chain id (decimal)
                principalRaw:
                  type: string
                  pattern: "^[0-9]+$"
                  description: "Withdrawal principal in raw token units (decimal string, > 0, fits in u128)"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  assetId:
                    type: integer
                  assetVersion:
                    type: string
                  destinationChainId:
                    type: string
                  principalRaw:
                    type: string
                  route:
                    type: object
                    properties:
                      routeHash:
                        type: string
                      kind:
                        type: string
                      sourceToken:
                        type: string
                      destinationToken:
                        type: string
                      sourceMessenger:
                        type: string
                      sourceTransmitter:
                        type: string
                      destinationTransmitter:
                        type: string
                      destinationTokenMessenger:
                        type: string
                      destinationCaller:
                        type: string
                      hookDataHash:
                        type: string
                      destinationInbox:
                        type: string
                      refundRecipient:
                        type: string
                      maxBurnPerMessage:
                        type: string
                      routeConfigVersion:
                        type: string
                      destinationChainId:
                        type: string
                      routeKind:
                        type: integer
                      adapterVersion:
                        type: integer
                      sourceDomain:
                        type: integer
                      destinationDomain:
                        type: integer
                      minFinalityThreshold:
                        type: integer
                      beneficiaryAccountId:
                        type: integer
                  burnLimitPerMessageRaw:
                    type: string
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        amountRaw:
                          type: string
                        minFeeRaw:
                          type: string
                        maxFeeRaw:
                          type: string
                  maxBridgeFeeRaw:
                    type: string
                  minReceivedRaw:
                    type: string
                  withdrawalFee:
                    type: object
                    properties:
                      feeRaw:
                        type: string
                      recipient:
                        type: string
                  debitRaw:
                    type: string
                  rule:
                    type: string
                  source:
                    type: string
        "400":
          description: invalid_request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: unknown_custody_group / no_cctp_route
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: custody_group_unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "422":
          description: too_many_chunks / above_burn_limit / amount_unrepresentable / withdrawal_fee_unrepresentable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: chain_rpc_unavailable / security_state_unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/site:
    get:
      tags:
        - Exchange
      summary: The homepage this entry serves
      description: "The homepage content for this entry domain, used by the front end to render the homepage and the site-wide brand. Only the entry domain decides (the request `Host`, or, behind the operator's trusted reverse proxies, the single `X-Forwarded-Host` they overwrite); any query parameter returns 400 `GatewayBadRequest`. Reply `{source, defaultLayer, version, sha, schemaVersion, content, mediaOrigins}`: `source` is `tenant` (the tenant's published homepage) or `default` (a platform default); `defaultLayer` is the platform default in effect, `image` (built into the gateway) or `platform` (the platform's published online version); `version` is the tenant version, the platform version, or null for the built-in default; `content` is homepage content (schema version 1) as canonical bytes and `sha` is their SHA-256; `mediaOrigins` are the only origins media URLs may come from. The reply never says why a default is served. `ETag` is the SHA-256 of the whole body and `Cache-Control` is `no-cache`; `If-None-Match` with the current tag returns 304. A tenant homepage that is published but fails the gateway's re-check, or that cannot be read yet (site data not loaded, or not refreshed for 10 minutes), returns 503 `GatewayUnavailable`, never the platform default. Counted against the per-IP rate limit like every `/v1` read. When the operator has not enabled tenant homepages, every entry gets the built-in default."
      operationId: v1_site
      responses:
        "200":
          description: The homepage
          headers:
            ETag:
              schema:
                type: string
              description: "\"<sha256 of the body>\""
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: object
                required:
                  - source
                  - defaultLayer
                  - version
                  - sha
                  - schemaVersion
                  - content
                  - mediaOrigins
                properties:
                  source:
                    type: string
                    enum:
                      - tenant
                      - default
                  defaultLayer:
                    type: string
                    enum:
                      - image
                      - platform
                  version:
                    type:
                      - integer
                      - "null"
                  sha:
                    type: string
                    description: "SHA-256 of `content` (lowercase hex)"
                  schemaVersion:
                    type: integer
                  content:
                    type: object
                    description: Homepage content schema v1
                  mediaOrigins:
                    type: array
                    items:
                      type: string
        "304":
          description: "Not modified (`If-None-Match` matched the current `ETag`)"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "503":
          "$ref": "#/components/responses/Unavailable"
  /v1/site/preview-parents:
    get:
      tags:
        - Exchange
      summary: Who may frame the console preview
      description: "Available on every host, for the console preview page at `https://<site domain>/app/preview/`. Takes no query parameters (the Host header identifies the tenant, as for `/v1/site`); any query parameter returns 400 `GatewayBadRequest`. Returns `{parents, mediaOrigins}`: `parents` are the console origins (operator-configured, exact serialized origins) that the preview page may answer -- the same list the page's `Content-Security-Policy: frame-ancestors` carries; an empty list means nobody may frame the page and it refuses every parent. `mediaOrigins` are the only origins media URLs may come from (operator-configured, as in `/v1/site`). Sent with `Cache-Control: no-store`. Only the preview page's HTML carries a `frame-ancestors` rule; no other response allows framing. Counts against the per-IP rate limit like every `/v1` read."
      operationId: v1_site_preview_parents
      responses:
        "200":
          description: The console origins and media origins
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - parents
                  - mediaOrigins
                properties:
                  parents:
                    type: array
                    items:
                      type: string
                    description: "Serialized origins (`https://host[:port]`; `http` only on loopback), compared with the page's `?parent=` as strings"
                  mediaOrigins:
                    type: array
                    items:
                      type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
components:
  headers:
    x-dexos-seq:
      schema:
        type: integer
      description: "The applied sequence number this response was served at; on a write receipt, the commit sequence number of that write"
    ratelimit:
      schema:
        type: string
      description: "On every `/v1/*` response, for the per-IP budget: `limit=1200, remaining=1187, reset=42` (IETF draft-ietf-httpapi-ratelimit-headers)"
    ratelimit-policy:
      schema:
        type: string
      description: "`1200;w=60`: the per-IP weight budget for a fixed 60-second window. The limit is operator-configured (1200 by default)."
    x-ratelimit-account:
      schema:
        type: string
      description: "On a write that passed the signature pre-check and was charged to the per-account budget (key: the main wallet of the account acted on): `limit=1200, remaining=1197, reset=42`. Absent when the request was refused before that point."
    retry-after:
      schema:
        type: integer
      description: "On 429: seconds until the window resets"
  parameters:
    MinSeq:
      name: x-dexos-min-seq
      in: header
      required: false
      schema:
        type: integer
      description: "Read-your-writes: send the `x-dexos-seq` of a write receipt only on a **read after that write**; a replica that is behind answers 412. **Do not send it on market-data polling or on `/trades` / `/candles`** (the projection advances on its own timeline)."
    MarketKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum:
          - perp
          - spot
      description: "Market type, used together with `symbol`. A perp and a spot market may share a symbol (case-insensitive): when the symbol names both and `kind` is missing, the gateway answers 400 `GatewayBadRequest` with `details.rule = ambiguous_symbol` and `details.kinds` listing the choices, never picking one. May be omitted when the symbol names one market."
  responses:
    BadRequest:
      description: "Malformed request (`GatewayBadRequest`, num 10400). On execution-history reads, an `upper` beyond this replica's complete history prefix is `GatewayHistoryIncomplete` (num 10400): retry later"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Unknown symbol / address that never deposited / no such order (`GatewayNotFound`, num 10404; `details` says which)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ReplicaBehind:
      description: "The replica is behind `x-dexos-min-seq` (`GatewayReplicaBehind`, num 10412); `details.source` distinguishes ledger (switch replica) from projection (wait for the indexer)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: "Read model not ready / analytics unavailable (`GatewayUnavailable`, num 10503)"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Account:
      type: object
      required:
        - epoch
        - asOfSeq
        - token
        - collateral
        - equity
        - marginUsed
        - maintenanceMargin
        - openOrderMargin
        - availableToTrade
        - availableToWithdraw
        - balances
        - groups
        - feeTier
        - takerFee
        - makerFee
        - fees
        - positionsCount
        - ordersCount
        - leverage
        - nonce
        - ts
        - crossEquity
        - crossMarginUsed
        - crossMaintenanceMargin
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        subaccount:
          type: integer
        dex:
          type: integer
          description: The merchant dex whose balance was read. Present only when the request named a dex other than 0.
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`)."
        token:
          type: string
          enum:
            - USDC
          description: "Settlement token the top-level totals (`collateral`, `equity`, `marginUsed`, `maintenanceMargin`, `cross*`, `openOrderMargin`, `availableTo*`) are counted in. They cover the USDC group only and are kept for compatibility; an account holding other settlement tokens reads `groups[]`, which is authoritative per token"
        collateral:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "USDC collateral (the USDC group only; see `token` and `groups[]`)"
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Total account equity in USDC: cross net collateral (including unrealised PnL) + the equity of every USDC-settled isolated position (`crossEquity` + Σ `isolatedEquity`)"
        marginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Initial margin in use (IMR), cross + isolated positions"
        maintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Maintenance margin (MMR), cross + isolated positions"
        crossEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Cross net collateral in USDC (cash balance + cross positions at the mark price + accrued funding); isolated positions are excluded"
        crossMarginUsed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Initial margin of the cross positions
        crossMaintenanceMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Maintenance margin of the cross positions; the cross pocket is liquidatable when `crossEquity` < this"
        openOrderMargin:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Initial margin reserved by resting non-reduce-only orders
        availableToTrade:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Free cross margin for new orders = availableToWithdraw: max(0, crossEquity − crossMarginUsed − open-order margin reserve − spot holds). Resting non-reduce-only orders reserve initial margin per market (buy side and sell side aggregated separately, netted against the position, the larger side counts), isolated-market orders included: an isolated position's margin moves from cross into its bag when it fills."
        availableToWithdraw:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Same as `availableToTrade`; margin sitting in isolated positions is not withdrawable (remove it with `POST /v1/account/isolated-margin` first)"
        balances:
          type: array
          items:
            "$ref": "#/components/schemas/Balance"
        groups:
          type: array
          description: "Per collateral group (one per settlement token) from the same risk view. Authoritative for accounts that hold a settlement token other than USDC; the top-level totals cover the USDC group only"
          items:
            type: object
            properties:
              token:
                type: string
                description: Settlement token symbol
              collateral:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Cash balance of this token
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Group cross net collateral (including unrealised PnL of the cross positions); isolated positions are in `isolatedEquity`"
              imr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Initial margin requirement
              mmr:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Maintenance margin requirement
              openOrderMargin:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Initial margin reserved by resting orders in this group
              withdrawable:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Withdrawable from this group
              isolatedEquity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ equity of the isolated positions settled in this token (bag cash + position at the mark price + accrued funding)"
            required:
              - token
              - collateral
              - equity
              - imr
              - mmr
              - openOrderMargin
              - withdrawable
              - isolatedEquity
        feeTier:
          type:
            - integer
            - "null"
        takerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Effective rate of the account's fee tier (decimal); markets with market-level rates use `/v1/markets.fees` instead"
        makerFee:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fees:
          type: object
          required:
            - builder
            - markets
          description: "The rates this account is actually charged, computed by the same fee decision the matching engine bills with. Only this account's own result is shown, never another account's override table."
          properties:
            builder:
              type:
                - integer
                - "null"
              description: "Builder the rates are computed for (`?builder=` or the entry domain's); null = no builder"
            markets:
              type: array
              items:
                type: object
                required:
                  - symbol
                  - maker
                  - taker
                  - source
                properties:
                  symbol:
                    type: string
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
                  maker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - builder
                      - deployer
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Total maker rate = protocol + builder (negative = rebate)"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Protocol maker rate
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Deployer fee on the maker side (SetMarketFeeSplitV2 / SetAccountDeployerFeesV2), paid to the dex fee recipient
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Builder maker rate after the market cap (negative = subsidy; 0 on spot)"
                  taker:
                    type: object
                    required:
                      - rate
                      - protocol
                      - dex
                      - deployer
                      - builder
                    properties:
                      rate:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Total taker rate = protocol + dex + deployer + builder"
                      protocol:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Protocol taker rate
                      dex:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: "Dex surcharge = protocol taker × the dex fee scale"
                      deployer:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Market deployer share (taker side only)
                      builder:
                        type: string
                        pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                        description: Builder taker rate after the market cap
                  source:
                    type: object
                    required:
                      - protocol
                      - deployer
                      - builder
                    properties:
                      protocol:
                        type: string
                        enum:
                          - builderAddress
                          - builder
                          - marketBuilderAddress
                          - marketBuilder
                          - marketMaker
                          - market
                          - default
                          - tier
                          - base
                        description: "Where the protocol (platform) rate came from, resolved for the builder of this request's entry: `builderAddress` = the platform fee set for (this builder, the account's owner address); `builder` = this builder's platform fee layer; `marketMaker` = a remaining entry of the discontinued market-maker whitelist (the dex and deployer surcharges and the builder fee on this account's side are waived); `market` = a remaining market-level rate (market-level rates can no longer be set); `default` = the platform default layer; `tier` = the account's fee tier; `base` = the genesis base rate. `marketBuilderAddress` / `marketBuilder` = the order had no builder attribution and the market's dex is linked to a builder (`SetDexBuilder`): the (linked builder, owner address) layer / the linked builder's layer. Each side of a fill resolves its own order's builder, so an order placed through another entry can be billed at another layer."
                      deployer:
                        type: string
                        enum:
                          - address
                          - addressDex
                          - market
                          - marketMaker
                        description: "Where the taker's deployer fee came from: `address` = set for the owner address on this market; `addressDex` = set for the owner address on every market of this dex (both replace the market `deployer_ppm` and drop the dex surcharge, so `taker.dex` is 0); `market` = the market's `deployer_ppm` plus the dex surcharge; `marketMaker` = waived for a leftover whitelist entry"
                      builder:
                        type: string
                        enum:
                          - account_market
                          - account
                          - ownerMarket
                          - owner
                          - market
                          - default
                          - unset
                          - none
                          - legacy
                          - marketMaker
                        description: "Layer the builder leg came from: account×market > account > owner address×market (`ownerMarket`) > owner address (`owner`) > builder market > builder default > unset; `none` = no builder; `legacy` = builder model off (taker builder = market `builder_ppm`); `marketMaker` = waived for a whitelisted market maker"
        positionsCount:
          type: integer
        ordersCount:
          type: integer
        leverage:
          type: array
          description: "Leverage settings: markets with a custom leverage, plus every market where the account is isolated (a market without a custom leverage reports the market's base leverage)"
          items:
            type: object
            properties:
              symbol:
                type: string
                description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
                examples:
                  - BTC-USD
              kind:
                type: string
                enum:
                  - perp
                  - spot
                description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
              leverage:
                type: integer
              type:
                type: string
                enum:
                  - cross
                  - isolated
                description: "Margin mode of the account in this market: `isolated` when the account holds an isolated bag there or the market only allows isolated margin (`marginMode` `noCross` / `strictIsolated` in `/v1/markets`)"
            required:
              - symbol
              - leverage
              - type
        nonce:
          type: integer
          description: "Next nonce in the account scope (= `GET /v1/account/nonce`)"
        ts:
          type: integer
          format: int64
          description: Unix time in milliseconds
        epoch:
          type: string
          description: Ledger epoch the risk view belongs to (changes only when the node restarts / resets)
        asOfSeq:
          type: integer
          format: uint64
          description: "Log position the risk fields (`equity`, margins, `groups`) were taken at; all of them come from this one consistent view."
    AccountPnl:
      type: object
      description: "Perpetual PnL breakdown per risk group at one watermark. Amounts are decimal strings in the group's collateral token. Every ledger entry of the group falls into exactly one part, so `totalPnl = realizedPnl + unrealizedPnl + accruedFunding + settledFunding + fees + otherPnl` and `equity = netInflow + spotTransfer + totalPnl` hold exactly. Spot trades and spot-market fees paid in the collateral token count as a transfer between the perpetual and the spot side (`spotTransfer`, the same convention as the `perp` scope of `GET /v1/account/portfolio`), not as perpetual PnL."
      required:
        - epoch
        - asOfSeq
        - groups
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        subaccount:
          type: integer
        dex:
          type: integer
          description: The merchant dex whose balance was read. Present only when the request named a dex other than 0.
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`)."
        epoch:
          type: string
          description: Ledger epoch
        asOfSeq:
          type: integer
          format: uint64
          description: "Log position the snapshot covers: balances and positions come from the read-model view at it and the ledger entries are totalled up to it"
        groups:
          type: array
          items:
            type: object
            required:
              - token
              - equity
              - netInflow
              - realizedPnl
              - unrealizedPnl
              - accruedFunding
              - settledFunding
              - fees
              - otherPnl
              - spotTransfer
              - totalPnl
            properties:
              token:
                type: string
                description: Collateral token symbol of the risk group
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Total equity of the group: cross net collateral + equity of the isolated positions settled in this token (cash, fees and funding of isolated positions flow through the same ledger)"
              netInflow:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ external entries: deposits, withdrawals, transfers, vault flows"
              realizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ position consideration (trades, liquidation trades, ADL, settlement) + Σ cost basis of open positions"
              unrealizedPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ(position value at the mark price − cost basis)"
              accruedFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Funding accrued but not yet applied to the balance (settled when the position is touched)
              settledFunding:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ funding payments already applied to the balance (negative = paid)"
              fees:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ trading fees on perpetual markets: taker / maker fees, maker rebates, builder and deployer fees (negative = paid)"
              otherPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ every other non-external entry: liquidation fees, socialized losses, bad-debt cover, insurance-fund flows and fee revenue of fee-receiving accounts"
              spotTransfer:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Σ spot-trade consideration and spot-market fees in this token: a transfer between the perpetual and the spot side, not perpetual PnL"
              totalPnl:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: "Perpetual PnL since the account was opened = realizedPnl + unrealizedPnl + accruedFunding + settledFunding + fees + otherPnl = equity − netInflow − spotTransfer"
    Agent:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "null = no expiry"
        expired:
          type: boolean
        scope:
          type: string
          enum:
            - account
            - owner
          description: "`account` = legacy per-account approval; `owner` = owner-level approval (subaccount model v2) covering the subaccounts in `subaccountMask`"
        subaccountMask:
          type: string
          description: "Owner-level approvals only: decimal u64 bitmap, bit i = subaccount i (may cover subaccounts not created yet)"
        subaccounts:
          type: array
          items:
            type: integer
          description: "Owner-level approvals only: the subaccount indexes set in `subaccountMask`"
        executable:
          type: boolean
          description: "Secure ledger only. true = the ledger would accept this grant itself at the current certified time: issued under the issuing policy's current epoch, status `active`, and inside `validFrom`..`validUntil`; a Dex management grant (`dex` set) also needs its resource owner epoch to be the dex's current owner epoch (once the dex changes hands the grant leaves this list). false for paused, expired and not-yet-valid grants, which are still listed (this list is an inventory). A command under an executable grant can still be refused for its action, scope or limits"
        dex:
          type:
            - integer
            - "null"
          description: "The dex of a dex-scoped management grant: the API wallet may sign management commands (on the `management` nonce lane) for that dex only. null for account-scoped trading grants."
    AgentGrant:
      type: object
      required:
        - address
        - label
        - validUntil
        - expired
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet address of the represented account; for a vault, the manager's main wallet"
        subaccount:
          type: integer
          description: "Subaccount index under `address` (absent for a vault and for a Dex-scope management grant)"
        vault:
          type: integer
          description: "Vault id when the grant is on a vault's main account (absent otherwise)"
        label:
          type: string
        validUntil:
          type:
            - integer
            - "null"
          format: int64
          description: "null = no expiry"
        expired:
          type: boolean
          description: "Listed even when expired: renew it, it was not revoked"
        executable:
          type: boolean
          description: "Secure ledger only. true = the ledger would accept this grant itself at the current certified time: issued under the issuing policy's current epoch, status `active`, and inside `validFrom`..`validUntil`; a Dex management grant (`dex` set) also needs its resource owner epoch to be the dex's current owner epoch (once the dex changes hands the grant leaves this list). false for paused, expired and not-yet-valid grants, which are still listed (this list is an inventory). A command under an executable grant can still be refused for its action, scope or limits"
        dex:
          type:
            - integer
            - "null"
          description: "The dex of a dex-scoped management grant: the API wallet may sign management commands (on the `management` nonce lane) for that dex only. null for account-scoped trading grants."
    Balance:
      type: object
      properties:
        token:
          type: string
          description: "Token symbol (`USDC`, …)"
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        hold:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Held by resting spot orders
        available:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "amount − hold"
      required:
        - token
        - amount
        - hold
        - available
    Book:
      type: object
      required:
        - symbol
        - depth
        - bids
        - asks
        - seq
        - ts
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        depth:
          type: integer
          description: "Levels per side this snapshot was asked for (REST `depth`, or the WebSocket subscription's `depth`)"
        bids:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: Price descending
        asks:
          type: array
          items:
            "$ref": "#/components/schemas/BookLevel"
          description: Price ascending
        seq:
          type: integer
          format: uint64
          description: Log position (state sequence) this snapshot was taken at.
        ts:
          type: integer
          format: int64
          description: Unix time in milliseconds
        aggTicks:
          type: integer
          description: "Present only when the request or subscription asked for price aggregation: ticks per bucket. The levels are then bucket boundaries, merged from the whole book."
    BookLevel:
      type: array
      prefixItems:
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Price
        - type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Size
      minItems: 2
      maxItems: 2
      description: "`[price, size]`"
    BuilderSummary:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        startTime:
          type: integer
          format: int64
          description: Unix time in milliseconds
        endTime:
          type: integer
          format: int64
          description: Unix time in milliseconds
        entries:
          type: integer
        fees:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
              amount:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Decimal string
        note:
          type: string
    BuilderView:
      type: object
      required:
        - builderId
        - status
        - catalog
        - categories
        - fees
        - asOfSeq
      properties:
        builderId:
          type: integer
          format: uint32
        status:
          type: string
          enum:
            - active
            - disabled
        catalog:
          type: object
          required:
            - version
            - markets
          properties:
            version:
              type: integer
              format: uint64
              description: "Catalog version (0 = never written)"
            markets:
              type: array
              description: "Markets this builder shows, by `sort` then symbol: `listed` and `closeOnly`; hidden markets and markets without symbol metadata are not shown"
              items:
                type: object
                required:
                  - symbol
                  - display
                  - status
                  - sort
                  - tags
                properties:
                  symbol:
                    type: string
                    description: "Full market symbol (`<dex code>:BASE-QUOTE` on a merchant dex): the only key to trade, cancel or close with"
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
                  display:
                    type: string
                    description: "The name a builder front end shows: the builder's custom display name for this row when it set one (catalog view v2; `BASE-QUOTE`, e.g. `XBT-PERP`), otherwise the symbol without the `<dex code>:` prefix (`BTC-USD`, `WBTC-USDC`). Unique (case-insensitive) within one kind among the builder's listed / hidden rows, except that two rows both falling back to the prefix-stripped symbol may share it; never resolve it back to a symbol"
                    examples:
                      - BTC-USD
                  status:
                    type: string
                    enum:
                      - listed
                      - closeOnly
                    description: "`closeOnly` = only reduce-only orders are accepted (a source being switched or unshared); offer close only"
                  sort:
                    type: integer
                    format: int32
                  tags:
                    type: array
                    items:
                      type: string
                    description: "The builder's category codes for this market, in display order (empty when none); names in `categories`"
        categories:
          type: array
          items:
            "$ref": "#/components/schemas/CategoryView"
          description: "The builder's categories ∪ the platform templates its shown rows use, by `sort` then code. Front ends behind a builder's entry use these, not `/v1/markets[].tags`"
        fees:
          type: object
          required:
            - default
            - markets
          description: "The builder's own front-end fee rates, as decimal fractions of notional (like `/v1/markets[].fees.*Rate`). `default` (null = unset) applies on every market without a `markets` row; the per-account layer is not exposed. Charged only when the builder fee model is enabled, and capped per market by `/v1/markets[].fees.builderRate` (the rate charged is the smaller of the two); unset = 0. `makerRate` may be negative: a subsidy paid from the builder's payout account to the resting side on perp markets (the cap does not limit it; spot treats it as 0)."
          properties:
            default:
              type:
                - object
                - "null"
              required:
                - takerRate
                - makerRate
              properties:
                takerRate:
                  type: string
                  pattern: "^[0-9]+(\\.[0-9]+)?$"
                  description: Decimal string (fraction of notional)
                makerRate:
                  type: string
                  pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                  description: "Decimal string (fraction of notional); negative = a subsidy the builder pays the resting side (perp markets only), capped per fill at the taker's net protocol fee pro-rated by notional minus the maker's own protocol rebate"
            markets:
              type: array
              description: "Per-market overrides by symbol, ascending by symbol; markets without symbol metadata are not listed"
              items:
                type: object
                required:
                  - symbol
                  - takerRate
                  - makerRate
                properties:
                  symbol:
                    type: string
                    description: Full market symbol
                  kind:
                    type: string
                    enum:
                      - perp
                      - spot
                    description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
                  takerRate:
                    type: string
                    pattern: "^[0-9]+(\\.[0-9]+)?$"
                    description: Decimal string (fraction of notional)
                  makerRate:
                    type: string
                    pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                    description: "Decimal string (fraction of notional); negative = a subsidy the builder pays the resting side (perp markets only), capped per fill at the taker's net protocol fee pro-rated by notional minus the maker's own protocol rebate"
        asOfSeq:
          type: integer
          format: uint64
          description: Log upper bound of the read-model generation the entity was read from
        dex:
          type:
            - integer
            - "null"
          minimum: 1
          description: "The entry's home merchant dex: set when every listed or close-only market in the catalog belongs to one merchant dex (hidden entries ignored), null otherwise. A white-label front end reads the user's balance under this dex by default (merchant fund isolation)."
    PlatformEntry:
      type: object
      required:
        - builderId
        - domain
      description: "`GET /v1/builder` without `?builder=` on an entry domain bound to no builder: the platform's own entry (list markets from `/v1/markets`)"
      properties:
        builderId:
          type: "null"
        domain:
          type: string
          description: The entry domain the request resolved to
    Candle:
      type: object
      description: Same shape as Hyperliquid / Pacifica
      properties:
        t:
          type: integer
          format: int64
          description: Open time
        T:
          type: integer
          format: int64
          description: "Close time (exclusive) = next bucket's open time; for 1M / 1Y the length of that calendar month / year"
        i:
          type: string
        o:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        h:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        l:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        c:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        v:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Volume in base units
    CategoryView:
      type: object
      required:
        - code
        - names
        - sort
      properties:
        code:
          type: string
          pattern: "^[a-z0-9-]{1,24}$"
        names:
          type: object
          additionalProperties:
            type: string
          description: "Display names by language tag (`en`, `zh-CN`, …); pick the viewer's language, falling back as the front end sees fit"
        sort:
          type: integer
          format: int32
          description: "Display order (smaller first; ties by code)"
      description: "A category definition. A layer's `categories` are its own definitions plus the platform templates its references use; when an own definition has the same code as a template, the own definition wins."
    Dex:
      type: object
      properties:
        dex:
          type: integer
        code:
          type:
            - string
            - "null"
          description: "Dex short code: the prefix of the dex's market symbols (`<code>:BASE-QUOTE`); null for dex 0 and dexes without one"
        owner:
          type: string
        collateralToken:
          type: integer
        insuranceAccount:
          type: integer
        feeRecipient:
          type: integer
        status:
          type: string
          enum:
            - Active
            - Disabled
        markets:
          type: array
          items:
            type: integer
          description: Perpetual markets of this dex
        spotMarkets:
          type: array
          items:
            type: integer
          description: "Spot markets of this dex (dex 0 = platform spot pairs, dex ≥ 1 = the merchant's spot pairs)"
        insurance:
          type: object
          description: Merchant insurance fund. Dex 0 reports the platform insurance fund, with no policy.
          required:
            - balance
            - equity
            - positions
            - principal
            - minAmount
            - withdrawDelayMs
            - pendingWithdraw
            - reduceOnly
            - uncoveredLoss
          properties:
            balance:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Cash balance of the fund; negative while the fund holds positions it has taken over."
            equity:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Fund equity: cash plus the positions it took over at mark price. The reduce-only minimum and withdrawals are judged on this"
            positions:
              type: array
              description: Positions the fund took over from liquidated accounts and has not unwound yet
              items:
                type: object
                required:
                  - market
                  - lots
                  - costBasis
                properties:
                  market:
                    type: integer
                  lots:
                    type: integer
                    format: int64
                    description: "Signed size; negative = short"
                  costBasis:
                    type: string
                    pattern: "^-?[0-9]+$"
                    description: "Signed entry cost in the collateral token's smallest unit"
            principal:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Withdrawable principal (funding minus withdrawals; liquidation fees are not principal)"
            minAmount:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Minimum set by the platform; below it every perpetual market of the dex only accepts orders that reduce a position"
            withdrawDelayMs:
              type: integer
              format: uint64
              description: Timelock between requesting and executing a withdrawal
            pendingWithdraw:
              type:
                - object
                - "null"
              properties:
                to:
                  type: integer
                amount:
                  type: string
                  pattern: "^-?[0-9]+$"
                  description: "Integer string in the collateral token's smallest unit"
                unlockMs:
                  type: integer
                  format: uint64
            reduceOnly:
              type: boolean
              description: At least one perpetual market of the dex is reduce-only because the fund is below its minimum
            uncoveredLoss:
              type: string
              pattern: "^-?[0-9]+$"
              description: "Shortfall on this dex's markets the fund could not cover"
      additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - num
            - message
          properties:
            code:
              type: string
              description: "Stable string code. Gateway errors are `Gateway*`; execution-layer rejections use the `CoreError` variant name (`InsufficientMargin`, …); see `x-error-codes`"
            num:
              type: integer
              description: "Stable numeric code: 1xxxx = 10000 + HTTP status (gateway); 2xxxx = 20000 + codec error code (execution-layer rejection)"
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: "Context, e.g. `symbol` / `address`; on 412, which watermark is behind and by how much. `cause` carries the original text of an internal failure (storage, analytics) whose wording is not English; `message` itself is always English"
      description: The single shape of every non-2xx response
    Event:
      type: object
      properties:
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "Execution-layer event name (`Fill` / `OrderAccepted` / `OrderCanceled` / `Deposited` / `FundingTickSettled` …)"
        data:
          type: object
          additionalProperties: true
          description: "Depends on `kind`; events that carry a `market` also carry its `symbol`"
    EventsPage:
      type: object
      properties:
        epoch:
          type: string
        completeSeq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
        upper:
          type: string
        events:
          type: array
          items:
            "$ref": "#/components/schemas/Event"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
        finality:
          type: string
    Exchange:
      description: "EIP-712 signing domain and the full multi-chain token table (`/config` returns a filtered table). `deposit.tokens` has one row per custody asset (the same catalog as `/v1/security/custody`) with five fields: `token` (ledger token id), `assetId`, `erc20` (the token contract on the custody chain), `symbol` and `decimals`. Settlement token 0 is always USDC with 6 decimals and cannot be overridden; `symbol` and `decimals` are null for other assets without metadata."
      properties:
        chainId:
          type: integer
          description: Chain id of the EIP-712 signing domain.
        conventions:
          type: object
          additionalProperties:
            type: string
        deposit:
          type: object
          properties:
            tokens:
              type: array
              items:
                type: object
                properties:
                  token:
                    type: integer
                  assetId:
                    type: integer
                    description: "Custody asset id; `token` is the ledger token it is credited to."
                  erc20:
                    type:
                      - string
                      - "null"
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "Token contract as an EVM address; null when the contract cannot be expressed as an EVM address."
                  symbol:
                    type:
                      - string
                      - "null"
                  decimals:
                    type:
                      - integer
                      - "null"
                  extraWeiDecimals:
                    type:
                      - integer
                      - "null"
                    description: "Compatibility field; null when the decimal difference does not fit in a u8. Read `extraDecimals` instead."
                  finalized:
                    type: boolean
                  homeChain:
                    type: integer
                    format: uint64
                    minimum: 0
                    maximum: 18446744073709552000
                  contract:
                    type: string
                    pattern: "^(0x)?[0-9a-fA-F]{64}$"
                    description: "Full token contract (32 bytes hex; an EVM address is left-padded with zeros)."
                  extraDecimals:
                    type: integer
                    description: Signed decimal difference between the on-chain token and the ledger token. Range -6..38 (older token links use u8 values only).
                  withdrawDests:
                    type: array
                    items:
                      type: integer
                      format: uint64
                      minimum: 0
                      maximum: 18446744073709552000
                    description: Withdrawal destination chains allowed besides the home chain. Being on this list does not mean a relay route to that chain is enabled.
                  origin:
                    type: string
                    enum:
                      - legacy
                      - v2
            protocol:
              type: string
              const: v2
            routing:
              type: string
              const: /v1/exchange
            ledgerEpoch:
              type: string
          required:
            - protocol
            - routing
            - ledgerEpoch
            - tokens
        docs:
          type: string
        domain:
          type: object
          properties:
            name:
              type: string
              const: dex-os
            version:
              type: string
            verifyingContract:
              type: string
              pattern: "^0x[0-9a-f]{40}$"
              description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        finalityMode:
          type: string
          description: "Kept for compatibility only; it does not describe the deposit finality policy."
        fundingTickSec:
          type: integer
          description: "Funding settlement period in seconds. Global: every perpetual market settles on the same period (the matcher's funding configuration, carried in the snapshot; same value as `/config`). Spot markets have no funding. Never null: while this node does not know it yet (its read model has not assembled its first generation, right after startup) the whole response is 503 `GatewayUnavailable` — retry"
          minimum: 1
        serverTime:
          type: integer
          format: int64
          description: Unix time in milliseconds
        vault:
          type: object
          description: "Vault economics the execution layer enforces (deployment configuration, carried in the snapshot; not in `/config`). Read them from here, never hard-code them"
          properties:
            creationFee:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Fee charged to the creator when a vault is created, USDC (decimal string); on top of any seed deposit"
            minDeposit:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Minimum amount of every vault deposit, claim and creation seed, USDC (decimal string); smaller amounts are rejected with `VaultDepositTooSmall`"
          required:
            - creationFee
            - minDeposit
        version:
          type: object
          properties:
            pkg:
              type: string
            snapshotVer:
              type: integer
            codecVer:
              type: integer
            buildId:
              type: string
            api:
              type: string
              const: v1
        merchantIsolation:
          type: boolean
          description: "Whether the exchange-wide merchant isolation switch is on: when it is, orders on a merchant dex's markets use the signing subaccount's balance under that dex (merchant fund isolation)."
      required:
        - chainId
        - domain
        - deposit
        - serverTime
        - fundingTickSec
        - vault
        - version
        - conventions
        - docs
      type: object
    Fill:
      type: object
      required:
        - id
        - symbol
        - side
        - role
        - price
        - size
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Execution-layer event identity `<seq>-<sub>-<idx>`; the backfill cursor and the `id` in WebSocket frames are character-for-character the same"
        orderId:
          type:
            - string
            - "null"
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        side:
          type: string
          enum:
            - buy
            - sell
        role:
          type: string
          enum:
            - taker
            - maker
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fee:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "This side's fee in `feeToken` units (that token's decimals); negative for a maker = rebate. Equals the matching `taker_fee` / `maker_fee` entry in `/v1/account/ledger`"
        feeToken:
          type: string
          description: "Token the fee was actually charged in. Spot: the token this side received (buyer → base, seller → quote; maker and taker alike). Perp: the market's settlement token (USDC on the main dex)"
          examples:
            - USDC
            - ETH
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: Unix time in milliseconds
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
    FillsPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        subaccount:
          type: integer
        dex:
          type: integer
          description: The merchant dex whose balance was read. Present only when the request named a dex other than 0.
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`)."
        epoch:
          type: string
        upper:
          type: string
          description: "Fixed upper bound of this pass; pass it back unchanged on the following pages"
        fills:
          type: array
          items:
            "$ref": "#/components/schemas/Fill"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
          description: "**Only `false` means you have everything**"
        finality:
          type: string
    FundingPoint:
      type: object
      properties:
        ts:
          type: integer
          format: int64
          description: Unix time in milliseconds
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
        rate:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Rate applied at this settlement (decimal)
        index:
          type: string
          description: Cumulative funding index
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Execution-layer event identity `<seq>-<sub>-<idx>`; the backfill cursor and the `id` in WebSocket frames are character-for-character the same"
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
        sub:
          type: integer
        idx:
          type: integer
        kind:
          type: string
          description: "`deposit` / `withdraw` / `taker_fee` / `maker_fee` / `funding` / `transfer_out` / `transfer_in` / `liquidation` / `builder_fee` … (economic classification from the execution history)"
        token:
          type: string
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Signed, in token units
        symbol:
          type:
            - string
            - "null"
        signingMarketId:
          type:
            - integer
            - "null"
          description: "Market id of the row (`signingMarketId` in `/v1/markets`); tells apart a perp and a spot market that share a symbol."
        order:
          type:
            - integer
            - "null"
          format: uint64
          description: "This account's order for trade / fee legs"
        counterOrder:
          type:
            - integer
            - "null"
          format: uint64
          description: "The other side's order for trade legs"
        reference:
          type:
            - string
            - "null"
          description: Escrow / outbox id for transfers and withdrawals
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: Block time (unix ms) of the execution
        outboxStatus:
          type: string
          enum:
            - pending
            - acked
          description: "`send_asset` only: whether the outbox entry has been acknowledged"
        ackedAt:
          type: string
          description: "`send_asset` only: event identity of the acknowledgement"
        deposit:
          type:
            - object
            - "null"
          description: "`deposit` entries only: the on-chain source of this credit, so a client can tell that one particular deposit transaction has been credited (a balance change cannot). `null` when the credit did not come from an observed on-chain deposit (an operator or test credit). Absent on other kinds"
          required:
            - chain
            - depositId
            - source
          properties:
            chain:
              type: string
              description: Chain id the deposit was observed on (decimal string)
            depositId:
              type: string
              description: Deduplication key of the deposit, 0x-prefixed 32-byte hex (keccak of the chain and the source)
            source:
              oneOf:
                - type: object
                  required:
                    - kind
                    - txId
                    - indexInTx
                  properties:
                    kind:
                      type: string
                      enum:
                        - tx
                    txId:
                      type: string
                      description: "0x-prefixed hex of the source transaction id (the 32-byte transaction hash on EVM chains)"
                    indexInTx:
                      type: integer
                      description: "Index of the deposit log in the transaction receipt's `logs` array (not the block-wide log index)"
                - type: object
                  required:
                    - kind
                    - sourceDomain
                    - nonce
                  properties:
                    kind:
                      type: string
                      enum:
                        - cctp
                    sourceDomain:
                      type: integer
                      description: CCTP source domain
                    nonce:
                      type: string
                      description: CCTP nonce, 0x-prefixed 32-byte hex
        vault:
          type:
            - integer
            - "null"
          description: "`vault_*` entries only: the vault this entry moves money with -- the addressed vault when reading with `vault=`, otherwise the vault whose main account is the counterparty; `null` when the counterparty is not a vault (the creator's `vault_fee`, paid to the fee account). Absent on other kinds."
    LedgerPage:
      type: object
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        subaccount:
          type: integer
        dex:
          type: integer
          description: The merchant dex whose balance was read. Present only when the request named a dex other than 0.
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`)."
        epoch:
          type: string
        upper:
          type: string
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/LedgerEntry"
        next:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
    Market:
      type: object
      required:
        - symbol
        - signingMarketId
        - kind
        - status
        - priceDecimals
        - sizeDecimals
        - tickSize
        - lotSize
        - minNotional
        - maxLeverage
        - initialMarginFraction
        - maintenanceMarginFraction
        - marginMode
        - strictIsolated
        - quotePerTickLot
        - baseToken
        - quoteToken
        - basePerLot
        - settleToken
        - lastPrice
        - oraclePrice
        - markPrice
        - bestBid
        - bestAsk
        - fundingRate
        - fundingIndex
        - lastFundingMs
        - openInterest
        - openInterestCap
        - dex
        - fees
        - tags
        - priceSource
        - aggTicks
        - subticksPerTick
        - tradingRulesVersion
        - tickChangePending
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        signingMarketId:
          type: integer
          description: "**Signing only.** The value of the `market` field in the EIP-712 structs (Order / Conditional / Cancel / Leverage / Twap / TpslPair); every v1 endpoint is addressed by `symbol`"
        kind:
          type: string
          enum:
            - perp
            - spot
        status:
          type: string
          description: "`Active` / `Paused` / `CancelOnly` / `PostOnly` / `FinalSettlement` / `Halted` / `Delisted` / `ReduceOnly` / `OracleStale`. `ReduceOnly` and `OracleStale` accept reduce-only orders only; `OracleStale` is a perpetual without a valid oracle price (listed on a draft or production policy and no effective round yet, or its price went stale) — see `oracleStale` on `/v1/security/markets`."
        priceDecimals:
          type: integer
        sizeDecimals:
          type: integer
        tickSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Minimum order price increment = subticksPerTick × 10^-priceDecimals. The base price unit used for signed integers and aggTicks remains 10^-priceDecimals."
        lotSize:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Minimum size increment = 10^-sizeDecimals"
        minNotional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Minimum notional (USDC); `0` = no minimum"
        maxLeverage:
          type:
            - integer
            - "null"
          description: "= 1e6 / initialMarginPpm; null for spot"
        initialMarginFraction:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        maintenanceMarginFraction:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "Account topology the market requires: `cross` (deployer mode normal) or `isolated` (noCross / strictIsolated); `strictIsolated` tells the two isolated modes apart"
        strictIsolated:
          type: boolean
          description: "Deployer mode is `strictIsolated`: isolated, and leverage cannot change while a position is open. With `marginMode` it recovers the deployer mode: `cross` = normal, `isolated` + false = noCross, `isolated` + true = strictIsolated"
        quotePerTickLot:
          type: string
          pattern: "^[0-9]+$"
          description: "Quote-token atomic units per tick × lot (integer string): notional in atomic units = price ticks × size lots × quotePerTickLot"
        baseToken:
          type:
            - integer
            - "null"
          description: "Spot only: base token id, the `token` of `GET /v1/exchange` `deposit.tokens[]` (token display metadata lives there); null for perpetuals"
        quoteToken:
          type:
            - integer
            - "null"
          description: "Spot only: quote token id (as `baseToken`); null for perpetuals"
        basePerLot:
          type:
            - string
            - "null"
          pattern: "^[0-9]+$"
          description: "Spot only: base-token atomic units per lot (integer string); null for perpetuals"
        settleToken:
          type: object
          description: "Settlement token of the market: perpetuals settle margin, PnL, funding and fees in the collateral token of their dex; spot settles in the quote token. `minNotional` and `openInterestCap.notional` are in this token's ledger units (1e-6)."
          required:
            - id
            - symbol
            - decimals
          properties:
            id:
              type: integer
              minimum: 0
              description: "Ledger token id (0 = USDC)"
            symbol:
              type:
                - string
                - "null"
              description: "Token symbol; null when the token has no metadata yet"
            decimals:
              type:
                - integer
                - "null"
              minimum: 0
              description: "Token decimals as published in token metadata; null when unknown"
          additionalProperties: false
        lastPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        oraclePrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        markPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Current hourly funding rate as a decimal (`0.0001` = 0.01%); null for spot"
        fundingIndex:
          type:
            - string
            - "null"
        lastFundingMs:
          type:
            - integer
            - "null"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Open interest in base units
        openInterestCap:
          type:
            - object
            - "null"
          properties:
            size:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            notional:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
        dex:
          type: integer
          description: "Builder dex this market belongs to (0 = the main dex)"
        fees:
          type: object
          description: "Three-party fee split. `rateSource=market`: a leftover market-level rate (the market-level command is retired) applies to every account; `rateSource=default`: the platform default layer applies, `takerRate` / `makerRate` show it; `rateSource=tier`: no default is set, `takerRate` / `makerRate` show the genesis base rates. These are the rates for orders without builder attribution; builder and (builder, address) platform layers are not shown here — an account's actual rates are in `GET /v1/account`. The deployer and builder rates are surcharges on notional, charged only on orders attributed to them"
          properties:
            rateSource:
              type: string
              enum:
                - market
                - default
                - tier
            takerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. `rateSource=default`: the platform default; `rateSource=tier`: the genesis base rate"
            makerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Negative = rebate. `rateSource=default`: the platform default; `rateSource=tier`: the genesis base rate"
            deployerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            deployerMakerRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string. Deployer fee charged to the maker
            builderRate:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. Once the builder model is on this is the **cap** on the builder leg: each builder's own rates (`/v1/builder.fees`) are charged up to it (unset = 0); before the switch it is the flat rate charged on attributed taker fills"
            pendingDeployerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. Taker leg of a scheduled deployer fee change on the security ledger: when a change raises either `deployerRate` or `deployerMakerRate`, the rates it cuts or keeps apply at once, and the full target waits: it takes effect at `pendingEffectiveAtMs` (certified time of the change + 7 days) at the first certified time advance on or after it; until then fills pay the raised rate at its current value. A change raising neither takes effect at once and withdraws the pending change; delisting or final settlement drops it. `null` = nothing pending"
            pendingDeployerMakerRate:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Decimal string. Maker leg of the scheduled deployer fee change (see `pendingDeployerRate`); `null` = nothing pending"
            pendingEffectiveAtMs:
              type:
                - integer
                - "null"
              format: int64
              description: "Certified Unix time in milliseconds at which `pendingDeployerRate` takes effect; `null` = nothing pending"
        platformLocked:
          type: boolean
          description: "true while the Council holds a platform lock on this merchant market (security ledger): the dex owner and its agents cannot change the market's status until the Council releases the lock. Always false for dex 0 markets"
        tags:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9-]{1,24}$"
          maxItems: 8
          description: "Category codes of the dex this market belongs to, in the order they were set; empty array when none. Each code is defined for that dex or is a platform template; `GET /v1/dexes/{id}` gives the display names. Display only: never enters the execution layer or any signature. Behind a builder's entry use `GET /v1/builder` instead (the builder's own categories)."
        priceSource:
          type:
            - array
            - "null"
          items:
            type: object
            required:
              - source
              - symbol
            properties:
              source:
                type: string
                description: "Price source name (`coinbase`, `binance`, `kraken`, `okx`, `hyperliquid`, `hyperliquid-testnet`)"
              symbol:
                type: string
                description: "That source's own ticker, used verbatim"
          maxItems: 8
          description: "Price sources the platform bound to this perpetual market, in the order they were written; the oracle price is fed from their median. Null when the market has no binding (sources are then derived from the symbol), and always null for spot. Never enters the execution layer or any signature."
        aggTicks:
          type:
            - array
            - "null"
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 6
          description: "Order book price aggregation levels configured for this market, in ticks per bucket (1 tick = 10^-priceDecimals), strictly ascending; e.g. `[10, 100, 1000, 10000, 100000]` for a market with `priceDecimals` 2 means buckets of 0.1 / 1 / 10 / 100 / 1000. These are the only values `aggTicks` accepts on `GET /v1/markets/{symbol}/book` and the WebSocket `book` channel. Set by the platform or the market's dex when listing and editable later; null when the market has no aggregation levels configured (then only the raw book is available). Never enters the execution layer or any signature"
          examples:
            -
              - 10
              - 100
              - 1000
              - 10000
              - 100000
        subticksPerTick:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: "Minimum order price increment in base price units. tickSize = subticksPerTick × 10^-priceDecimals."
        tradingRulesVersion:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: Monotonic uint64 revision of the complete trading-rule state. Increments once when a request becomes pending and once when its result is confirmed, including a failed request. Never parse as a floating-point number.
        tickChangePending:
          type: boolean
          description: "New orders are blocked while true; cancellation remains available. Step, revision and pending are read from the same confirmed translation-state snapshot."
    MyVaultPosition:
      type: object
      properties:
        vault:
          type: integer
        dex:
          type: integer
          description: "The balance that holds these shares: `0` = platform balance, `>= 1` = the address's balance in that merchant dex"
        name:
          type: string
        class:
          type: string
          enum:
            - lp
            - manager
        shares:
          type: string
          pattern: "^[0-9]+$"
          description: "Share units (integer; not a token amount)"
        balanceShare:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Current value of the shares, USDC
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Same as `balanceShare`, USDC"
        initialEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Principal shown to the depositor, USDC
        allTimePnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − initialEquity`, USDC"
        lockUntilMs:
          type: integer
        locked:
          type: boolean
        lockedShares:
          type: string
          pattern: "^[0-9]+$"
        withdrawable:
          type: object
          properties:
            ok:
              type: boolean
            reason:
              type:
                - string
                - "null"
        nextWithdrawWindow:
          type:
            - object
            - "null"
    Nonce:
      type: object
      required:
        - scope
        - nonce
      properties:
        scope:
          type: string
          enum:
            - account
            - agent
        address:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        subaccount:
          type: integer
        vault:
          type: integer
          description: "Present instead of `address` / `subaccount` when the request addressed a vault (`vault=<id>`)."
        signer:
          type: string
          pattern: "^0x[0-9a-f]{40}$"
          description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        nonce:
          type:
            - integer
            - "null"
          description: "The next expected nonce. null when the nonce lane's window is exhausted (`exhausted: true`), and on an API-wallet read with zero or several matching grants."
        signingAccountId:
          type: integer
          description: "**Signing only.** The value to put in the `accountId` field of the EIP-712 struct (and in the `account` field of the inner command on the API-wallet path). It is the only numeric account id v1 exposes; never use it to address anything, every v1 endpoint is addressed by wallet address"
        exhausted:
          type:
            - boolean
            - "null"
          description: "Secure ledger only. true = the next value would be 2^64 - 1, which the ledger refuses (`CounterExhausted`); the lane takes no more writes under this principal. false otherwise. On an agent read the top-level value follows the single matching grant and is null when zero or several grants match; each `grants[]` row carries its own boolean"
    Order:
      type: object
      required:
        - orderId
        - symbol
        - side
        - price
        - size
        - status
      properties:
        orderId:
          type: string
          description: Execution-layer order sequence number as a decimal string
        clientOrderId:
          type:
            - string
            - "null"
          description: "Optional signed client order id: 1–36 characters of [A-Za-z0-9._:/-]. Only admitted ledger commands consume it, including admitted business failures. Authorization rejection does not consume it. A previously admitted cid for the same account returns 409 GatewayDuplicateClientOrderId before sequencing once visible in the derived result index. Concurrent requests can race before results become visible; the ledger permits these duplicates. Different accounts are independent. TWAP and TP-SL have no cid. The ledger does not cancel or amend by cid."
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        side:
          type: string
          enum:
            - buy
            - sell
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        tif:
          type:
            - string
            - "null"
          enum:
            - gtc
            - ioc
            - alo
            - fok
            - null
          description: "Time in force. Pending conditional orders: the child order's. Orders resting on the book: null — the execution layer's canonical state does not keep it once the order rests (a resting `alo` order behaves like `gtc`)"
        reduceOnly:
          type:
            - boolean
            - "null"
          description: "Reduce-only. Resting orders read it from the account's open-order ledger; null only if that ledger has no entry for the order"
        trigger:
          type:
            - object
            - "null"
          description: "Pending conditional order (stop / take-profit, including position TP/SL legs): the order enters the book as a limit order (`price`, `size`, `side`, `tif`) when the oracle price crosses `price`. null for orders on the book"
          required:
            - price
            - above
            - positionTpsl
          properties:
            price:
              type: string
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: Decimal string
            above:
              type: boolean
              description: "true = triggers when the oracle price is at or above `price`; false = at or below"
            positionTpsl:
              type: boolean
              description: "Position-level TP/SL: cancelled automatically when the position reaches zero"
        status:
          type: string
          enum:
            - open
            - partiallyFilled
            - filled
            - canceled
            - expired
    OrderEvent:
      type: object
      description: "One row of the order history = one order event; fold by `orderId` for one row per order"
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Execution-layer event identity `<seq>-<sub>-<idx>`; the backfill cursor and the `id` in WebSocket frames are character-for-character the same"
        seq:
          type: integer
          format: uint64
          description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
        orderId:
          type: string
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        event:
          type: string
          enum:
            - accepted
            - fill
            - canceled
            - expired
            - placed
            - triggered
            - rejected
            - autocanceled
            - twapPlaced
          description: "`twapPlaced` = a TWAP parent order was placed (`size` is the total, `slices` the number of slices); its slices are child orders that reuse the parent's `orderId`, so their `accepted` / `fill` rows fold into the same order"
        side:
          type:
            - string
            - "null"
          enum:
            - buy
            - sell
            - null
          description: "Order side, given on `accepted`, `fill` (this account's side of the fill), `placed` (the conditional order's child side) and `twapPlaced` rows; null on the others, whose events carry no side — take it from the order's earlier rows"
        source:
          type: string
          enum:
            - twap
          description: "Present only on `accepted` and `fill` rows of a TWAP slice (`twap`); absent on every other row"
        slices:
          type: integer
          format: uint32
          description: "Number of slices; present only on `twapPlaced` rows"
        startMs:
          type: integer
          format: uint64
          description: "When the TWAP was placed (Unix ms, the placing command's `nowMs`; the first slice is due then); present only on `twapPlaced` rows"
        durationMs:
          type: integer
          format: uint64
          description: "Planned run time = `slices` × the slice interval (ms); present only on `twapPlaced` rows. v1 has no TWAP-finished event: a TWAP with no `canceled` row is over once the current time passes `startMs + durationMs`"
        ts:
          type:
            - integer
            - "null"
          format: int64
          description: "Ledger time of the block the event happened in (Unix ms, the same clock as fills' `ts`); null when unknown (no block before it, or a history gap in between)"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        filled:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        resting:
          type: boolean
        remaining:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        role:
          type: string
          enum:
            - taker
            - maker
        fillId:
          type: string
    PendingWithdrawalV2:
      type: object
      additionalProperties: false
      properties:
        outboxId:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
        token:
          type: integer
          format: uint32
          minimum: 0
          maximum: 4294967295
        amount:
          type: string
          pattern: "^[0-9]+$"
          description: "Amount in ledger atomic units, for display only; never use it for the on-chain payout."
        amountWei:
          type: string
          pattern: "^[0-9]+$"
          description: "Amount in on-chain atomic units, taken from the withdrawal record. The payout and event reconciliation use this value; it is never recomputed from the current token configuration."
        recipient:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{40}$"
          description: "The last 20 bytes of `recipientBytes32`."
        homeChain:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
          description: "Custody chain holding the funds; selects the payout channel."
        tokenContract:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{64}$"
          description: "Token contract on the home chain (32 bytes hex; an EVM address is left-padded with zeros)."
        destChain:
          type: integer
          format: uint64
          minimum: 0
          maximum: 18446744073709552000
          description: "Chain the user receives the funds on; equal to `homeChain` for a direct withdrawal on the home chain."
        recipientBytes32:
          type: string
          pattern: "^(0x)?[0-9a-fA-F]{64}$"
          description: Full recipient address as signed (32 bytes hex).
        maxBridgeFee:
          type: string
          pattern: "^[0-9]+$"
          description: Maximum bridge fee as signed, in ledger units.
        maxBridgeFeeWei:
          type: string
          pattern: "^[0-9]+$"
          description: "Maximum bridge fee converted (rounded down) to on-chain atomic units for a cross-chain withdrawal. A direct withdrawal on the home chain pays no bridge fee, so this is always \"0\" there, while `maxBridgeFee` keeps the signed value."
        fallbackToHub:
          type: boolean
        routed:
          type: boolean
          description: "true = the withdrawal command recorded its route explicitly; false = the route was derived from an older-format withdrawal command."
        status:
          type: string
          const: pending
          description: Debited from the account and not yet acknowledged as paid out. An entry disappearing from this list does not prove that a CCTP transfer has arrived on the destination chain.
      required:
        - outboxId
        - token
        - amount
        - amountWei
        - recipient
        - homeChain
        - tokenContract
        - destChain
        - recipientBytes32
        - maxBridgeFee
        - maxBridgeFeeWei
        - fallbackToHub
        - routed
        - status
    Portfolio:
      type: object
      required:
        - address
        - subaccount
        - epoch
        - period
        - bucketMs
        - fromMs
        - asOfMs
        - seriesStartMs
        - total
        - perp
        - unvaluedTokens
        - gaps
      properties:
        address:
          type: string
        subaccount:
          type: integer
        epoch:
          type: string
          description: "Ledger epoch; a new epoch starts a new series"
        period:
          type: string
          enum:
            - "24h"
            - "7d"
            - "30d"
            - all
        bucketMs:
          type: integer
        fromMs:
          type:
            - integer
            - "null"
          description: "Window start: max(now − period, seriesStartMs); for `all`, seriesStartMs"
        asOfMs:
          type:
            - integer
            - "null"
          description: Time of the latest sample (at most one sampling period old)
        seriesStartMs:
          type:
            - integer
            - "null"
          description: "First sample of this account in this epoch; null = never sampled yet"
        total:
          "$ref": "#/components/schemas/PortfolioScope"
        perp:
          "$ref": "#/components/schemas/PortfolioScope"
        unvaluedTokens:
          type: array
          items:
            type: string
          description: Tokens held in the window that have no USDC price and are not counted
        gaps:
          type: array
          items:
            type: object
            required:
              - fromMs
              - toMs
            properties:
              fromMs:
                type: integer
              toMs:
                type: integer
          description: Intervals whose PnL is not counted because the execution history between two samples is missing
    PortfolioPoint:
      type: object
      required:
        - ts
        - accountValue
        - pnl
        - netInflow
      properties:
        ts:
          type: integer
          description: "Bucket start (unix ms); the values are the bucket's last sample"
        accountValue:
          type: string
          description: USDC amount as a decimal string
        pnl:
          type: string
          description: USDC PnL since the first point of the window
        netInflow:
          type: string
          description: USDC net inflow since the first point of the window
    PortfolioScope:
      type: object
      required:
        - history
        - pnl
        - returnRate
        - maxDrawdown
        - volume
        - fees
      properties:
        history:
          type: array
          items:
            "$ref": "#/components/schemas/PortfolioPoint"
        pnl:
          type:
            - string
            - "null"
          description: "Last point − first point (USDC); null when the window has no point"
        returnRate:
          type:
            - string
            - "null"
          description: "Time-weighted return over the window, chaining `(V_k − ΔN_k) / V_{k−1}` per bucket (segments starting at a non-positive value are skipped); deposits and withdrawals do not move it. Null without a usable segment"
        maxDrawdown:
          type:
            - string
            - "null"
          description: "Largest fall of the time-weighted return index from its running peak, in [0, 1]; deposits and withdrawals never cause a drawdown. Null with fewer than 2 points"
        volume:
          type:
            - string
            - "null"
          description: "Traded notional in the window (USDC), as taker or maker; `perp` counts perpetual markets only, `total` adds spot"
        fees:
          type:
            - string
            - "null"
          description: "Net trading fees paid in the window (USDC): taker + maker fees − maker rebates + builder fees + dex deployer fees"
    Position:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        side:
          type: string
          enum:
            - long
            - short
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Signed size in base units: positive = long, negative = short (the same sign as `side`)"
        entryPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        markPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        notional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: USDC
        unrealizedPnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: USDC, signed
        fundingIndex:
          type: string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "`isolated`: the position has its own margin bag; its losses cannot reach the cross balance and it is liquidated on its own"
        rawUsd:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only (HL `rawUsd`): bag cash, including the opening consideration — negative for a long, positive for a short. `null` for a cross position"
        isolatedEquity:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: `rawUsd` + position at the mark price + accrued funding. `null` for a cross position"
        isolatedMarginUsed:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: initial margin of this position. `null` for a cross position"
        isolatedMaintenanceMargin:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: maintenance margin of this position; liquidated when `isolatedEquity` < this. `null` for a cross position"
        isolatedRemovable:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: how much margin `POST /v1/account/isolated-margin` can remove now = max(0, isolatedEquity − isolatedMarginUsed); always 0 on `strictIsolated` markets. `null` for a cross position"
        liquidationPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: mark price at which `isolatedEquity` falls to `isolatedMaintenanceMargin`, solved from the bag (truncated to the price decimals). `null` for a cross position (it depends on the whole cross pocket), for tiered-margin markets, and when the bag is deep enough that no positive price liquidates it"
      required:
        - symbol
        - side
        - size
        - entryPrice
        - markPrice
        - notional
        - unrealizedPnl
        - fundingIndex
        - marginMode
        - rawUsd
        - isolatedEquity
        - isolatedMarginUsed
        - isolatedMaintenanceMargin
        - isolatedRemovable
        - liquidationPrice
    Price:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        last:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        mark:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        oracle:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingIndex:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+$"
          description: "Cumulative funding index after the latest settlement, as an integer string (the same value as `fundingIndex` in `/v1/markets` and the `index` of the funding channel); null for spot"
        lastFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "Block time of the latest funding settlement (Unix ms); null for spot and before the first settlement"
        nextFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "When the next funding settlement is due: the first period boundary after `lastFundingMs`, where boundaries are multiples of `fundingTickSec` (from `GET /v1/exchange`) since the Unix epoch, i.e. the top of every UTC hour for 3600. Settlement happens at the first funding sample whose block time reaches it, so the actual time can be one sample interval later. null for spot and before the first sample"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        prevDayPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Open of the rolling 24h window (first 1-minute candle in it). null when the market had no tick in the window, or 24h statistics are unavailable
        change24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "(close − open) / open over the rolling 24h window, as a ratio (0.01 = 1%), 8 decimals truncated toward zero. null when there is no open price"
        high24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Highest price in the rolling 24h window (same data as the 1-minute candles)
        low24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Lowest price in the rolling 24h window
        volume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Traded size in base units over the rolling 24h window. \"0\" when nothing traded; null when 24h statistics are unavailable"
        quoteVolume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size of the trades in the rolling 24h window, in quote units. null when unknown (24h statistics unavailable, or the window only holds migrated candles without per-trade ticks)"
    Subaccount:
      type: object
      properties:
        subaccount:
          type: integer
        isMain:
