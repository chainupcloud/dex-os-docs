paths:
  /v1/account:
    get:
      tags:
        - Account
      summary: Account summary
      description: |-
        Account summary by wallet (`?address=&subaccount=`): equity, margin, available balance, balances, per-group risk, fees and counts; risk fields share one view at `asOfSeq`. No account id is returned; a never-deposited address returns 404.

        - `fees`: rates actually charged, per market.
        - `fees.pendingDeployer`: scheduled deployer fee override increases, ascending by (dex, symbol); `symbol` null = dex-level row; `enabled: false` = override being removed; an entry vanishes at `effectiveAtMs`.
      operationId: v1_account
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; case-insensitive, lower-case in responses"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account (lowest-numbered single-signer account); N >= 1 = subaccount opened with index N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Mutually exclusive with `address` / `subaccount` (400); unknown vault = 404. The response then has `vault` instead of `address` / `subaccount`"
        - name: builder
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Builder id to compute `fees` for. Omitted = the builder bound to the entry domain (none = no builder fee). Unknown builder: 404 `GatewayBuilderNotFound`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: "Limit `fees.markets` to this market; omitted = all tradable markets. Unknown symbol: 404"
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/agents:
    get:
      tags:
        - Account
      summary: Approved API wallets
      description: |-
        API wallets approved for the account; labels come from the gateway.

        - Rows are unrevoked grants under the current policy epoch to API wallets covering this account, plus dex management grants (`dex` set) from this account's policy for dexes it owns.
        - The list is an **inventory**: paused, expired and not-yet-valid grants are included; check `executable`. A command can still be refused for its action, scope or limits.
      operationId: v1_agents
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address, case-insensitive
          description: Main wallet address
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account; N >= 1 = subaccount N"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: EVM address, lower-case
                  subaccount:
                    type: integer
                  agents:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Agent"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/account/fills:
    get:
      tags:
        - Account
      summary: Fill history
      description: "Durable fill history with cursor backfill. The first page fixes `upper`; pass it back unchanged. Only `hasMore=false` means you have everything. After a WebSocket disconnect, use the last frame `id` as `after`."
      operationId: v1_fills
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address; lower-case in responses, case-insensitive in requests"
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account (its lowest-numbered single-signer account); N >= 1 = its subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404. The response then has `vault` instead of `address` / `subaccount`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "Market symbol: `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Only this market
        - "$ref": "#/components/parameters/MarketKind"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`, identical to the `id` in WebSocket frames"
          description: "Cursor: the `next` value of the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; **required with `upper` when `after` is given** (409 `history_epoch_mismatch` after a ledger reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Upper bound from the first page; **required with `epoch` when `after` is given**, else 400. Beyond this replica's complete history: 400 `GatewayHistoryIncomplete` (retry later)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = newest first, `next` pages toward older rows; `epoch` / `upper` / `hasMore` as in `asc`. Keep one `order` for every page of a walk"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FillsPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/funding:
    get:
      tags:
        - Account
      summary: Funding payments
      description: "One signed USDC entry per funding settlement for this account; = `/v1/account/ledger?kind=funding`."
      operationId: v1_account_funding
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address (lower-case in responses, case-insensitive in requests)
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = the address's main account; N ≥ 1 = its subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404; the response then shows `vault`"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`; identical to the backfill cursor and the WebSocket frame `id`"
          description: "Cursor: the previous page's `next`"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; **required with `upper` when `after` is given** (409 `history_epoch_mismatch` if the ledger was reset)"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Fixed upper bound from the first page; **required with `epoch` when `after` is given** (else 400). Beyond this replica's complete history → 400 `GatewayHistoryIncomplete`; retry later"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = newest first (`next` pages toward older rows); `epoch` / `upper` / `hasMore` work as in `asc`. Keep one `order` across a walk"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LedgerPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/ledger:
    get:
      tags:
        - Account
      summary: Ledger
      description: "Deposits, withdrawals, fees, funding, transfers, liquidations and fee splits; signed amounts in token units."
      operationId: v1_ledger
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address, case-insensitive
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account; N >= 1 = subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404; the response then shows `vault`"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - deposit
              - withdrawal
              - send_asset
              - transfer_in
              - transfer_out
              - trade
              - liquidation_trade
              - adl
              - spot_trade
              - taker_fee
              - maker_fee
              - maker_rebate
              - fee_revenue
              - rebate_paid
              - deployer_fee
              - deployer_fee_revenue
              - builder_fee
              - builder_fee_revenue
              - liquidation_fee
              - insurance_fund
              - bad_debt_cover
              - funding
              - settlement
              - vault_deposit
              - vault_redeem
              - vault_profit_share
              - vault_refund
              - vault_allocate
              - vault_retrieve
              - vault_fee
          description: "Only this kind; not with `external=true`"
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: "Only this token: symbol (`USDC`) or numeric id"
        - name: external
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "`true` = only entries crossing the account boundary (deposits, withdrawals, transfers, vault deposits / redemptions); 400 with `kind`"
        - name: after
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
            description: "Event id `<seq>-<sub>-<idx>`; same as `id` in WebSocket frames"
          description: "Cursor: `next` of the previous page"
        - name: epoch
          in: query
          required: false
          schema:
            type: string
          description: "Ledger epoch from the first page; required with `upper` when `after` is set. 409 `history_epoch_mismatch` if the ledger was reset"
        - name: upper
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+-[0-9]+-[0-9]+$"
          description: "Upper bound from the first page; required with `epoch` when `after` is set (else 400). Beyond this replica's complete history: 400 `GatewayHistoryIncomplete`, retry later"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Page size
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          description: "`desc` = newest first (from `upper`; `next` goes older). Use the same `order` on every page of a walk"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LedgerPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "412":
          "$ref": "#/components/responses/ReplicaBehind"
  /v1/account/nonce:
    get:
      tags:
        - Account
      summary: Next nonce and signing account id
      description: |-
        Next nonce plus `signingAccountId` (the `accountId` to sign with).

        - `?address=` alone: account nonce (self-signed); with `&signer=<agent>`: that API wallet's nonce (delegated). Mixing them up: `NonceMismatch`.
        - Per principal and `lane`, `nonce` = `high + 1` (`floor` if unused); at 2^64 - 1 `nonce` is null and `exhausted` true (`CounterExhausted`).
        - With `signer`, `grants[]` lists its grants; top-level `grantId` / `grantEpoch` / `nonce` are set only if exactly one matches.
      operationId: v1_nonce
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address, case-insensitive
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account; N >= 1 = subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404; the response then shows `vault`"
        - name: signer
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address, case-insensitive
          description: API wallet address
        - name: lane
          in: query
          required: false
          schema:
            type: string
            enum:
              - trade
              - funds
              - management
            default: trade
          description: "Nonce lane: `trade` (orders, cancels), `funds` (withdrawals, transfers), `management` (grants, subaccounts, governance); unknown lane 400"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Nonce"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/account/orders:
    get:
      tags:
        - Account
      summary: Open orders
      description: "Open orders across all markets in one consistent view; `symbol` filters. Includes pending conditional orders (status `open`, with `trigger`), cancellable by `orderId` via `POST /v1/orders/cancel`. 503 if a `clientOrderId` cannot be resolved from execution history."
      operationId: v1_open_orders
      parameters:
        - name: address
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: EVM address, case-insensitive
          description: "Main wallet address (required unless `vault` is given)"
        - name: subaccount
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Subaccount index: 0 = main account; N >= 1 = subaccount N"
        - name: vault
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "Vault id: read the vault's own account. Exclusive with `address` / `subaccount` (400); unknown vault 404; the response then shows `vault`"
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            description: "Market symbol, e.g. `BTC-USD` (perp), `BTC-USDC` (spot), `<code>:BTC-USD` (merchant dex; `:` may be sent as `%3A`); case-insensitive"
            examples:
              - BTC-USD
          description: Only this market
        - "$ref": "#/components/parameters/MarketKind"
        - "$ref": "#/components/parameters/MinSeq"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
