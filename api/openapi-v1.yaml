                    format: int64
                    description: Unix time in milliseconds
                  window24h:
                    type:
                      - object
                      - "null"
                    description: "The rolling 24h window the statistics cover; null when 24h statistics are unavailable"
                    properties:
                      from:
                        type: integer
                        format: int64
                        description: Window start (inclusive, aligned to the minute), Unix ms
                      to:
                        type: integer
                        format: int64
                        description: "Anchor: the latest projected block time, Unix ms"
  "/v1/requests/{requestId}":
    get:
      tags:
        - Account
      summary: Request receipt
      description: |-
        可信安全profile：id是139 actionId或140/148专用域digest（0x加64小写hex）。156报价轮与链上事实证书没有请求事实，按各自读口确认（156看GET /v1/testnet/markets/{id}/oracle的currentRound到达本轮）。仅查询同一个已发布CTX的当前有界回执、永久注册、最新时间证书；200 Executed仅表示该命令完成，不表示目标提案已执行或资金终局。404 Unknown/historyComplete=false/nonceConsumed=null不证明从未执行；淘汰和旧epoch回收后不产生假Consumed。可用digest守护原件，冲突409返回实际digest。拒绝scope/nonce/commandHash参数；u64均字符串。认证和锚定尚未接线，certification/anchor始终null。x-dexos-min-seq必须由实际cut满足，否则412；query预算5s，代理8s，均no-store。 安全账本(M7-7 T7.6):账本回执在时附 `events`(本命令推导出的事件 `{kind, data}`,成交 / 拒单等业务结果只在这里)、`businessRejected`、`seq` / `sub`、批量命令的逐项结论 `items`(`{kind, inputIndex, state, reason?, orderId?, …}`,不是批量不附;结果窗口没有该行时 `events` 为 null);授权被拒的 139(不留回执、不消费 nonce)按 actionId 从结果窗口给 200 `status: "AuthorizationRejected"`、`stableError` / `errorCode`、`position`、`nonceConsumed: false`,窗口里也没有才是 404。

        仅未启用安全profile的旧接口合同：Look up the outcome of a request by its identity (`0x` + keccak(signer ‖ EIP-712 digest), the `requestId` of every write response). 200: `status` = `executed` / `rejected` (with `seq`, `sub`, `events`, `items`, `nonceConsumed`, `reason` when rejected) or `pending` (sequenced, not yet folded). Otherwise an error whose `details.status` is `not_found` (404: no execution with this id up to `details.asOfSeq`), `conflict` (409: the nonce in `scope`/`nonce` was consumed by a different request, `details.conflictingRequest`) or `history_unavailable` (503: the execution history has gaps, `details.gaps`). Pass `scope` + `nonce` to detect a conflicting nonce; for API-wallet requests add `commandHash` so that, when the history has gaps, the agent nonce can still prove the request did not execute (404 with `details.basis = agent_nonce`). Use it when `ack=result` returned 202.
      operationId: v1_request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            pattern: "^(account:[0-9]+|agent:0x[0-9a-fA-F]{40}|owner:0x[0-9a-fA-F]{40})$"
          description: "仅旧profile允许；安全profile拒绝。Nonce scope the request was signed in: `agent:0x…` (API wallet), `owner:0x…` (main wallet's primary scope) or `account:<n>`; goes together with `nonce`"
        - name: nonce
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: "仅旧profile允许；安全profile拒绝。The request's nonce; goes together with `scope`"
        - name: commandHash
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "仅旧profile允许；安全profile拒绝。API-wallet requests only (`scope=agent:0x…`): the `AgentExec.commandHash` that was signed; the gateway recomputes the request id from agent, nonce and commandHash (mismatch → 400)"
        - name: digest
          in: query
          required: false
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
          description: "安全profile的预期原件digest；同actionId的不同TTL摘要不能混作一次结果。"
      responses:
        "200":
          description: "安全profile当前事实，或旧profile回执。"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - executed
                          - rejected
                          - pending
                      epoch:
                        type: string
                      seq:
                        type: integer
                        format: uint64
                        description: "Raft log sequence number (the same axis as the write receipt's `seq` and the `x-dexos-seq` header)"
                      sub:
                        type: integer
                      requestId:
                        type: string
                      signer:
                        type: string
                      nonceScope:
                        type: string
                      nonce:
                        type: integer
                      nonceConsumed:
                        type: boolean
                      reason:
                        type: string
                        description: "Rejected only: the CoreError"
                      events:
                        type: array
                        items:
                          type: object
                      items:
                        type: array
                        items:
                          type: object
                      source:
                        type: string
        "400":
          description: "安全profile ID/digest/参数非法，无nonce结论。"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestError"
                  - "$ref": "#/components/schemas/Error"
        "404":
          description: "安全profile Unknown，不是未执行证明；旧profile按原历史合同。"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - "$ref": "#/components/schemas/Error"
        "409":
          description: "安全profile预期digest冲突，不能认作预期原件成功。"
          content:
            application/json:
              schema:
                anyOf:
                  - "$ref": "#/components/schemas/SecurityRequestFact"
                  - "$ref": "#/components/schemas/Error"
        "412":
          description: "实际读取cut小于min-seq；不以较新的节点水位掩盖。"
          content:
            application/json:
              schema:
