        - Security
      summary: Simulate a governance envelope
      description: "提交前模拟一条治理信封(144–147,签没签都行):信封字段 / 纪元 / 有效期、门限签名、nonce、前提表、操作校验,以及 STF 会怎样处理(`outcome.kind` ∈ executes / queued / notReady / rejected,附 `etaMs` 或拒因)。只读,不跑执行期的状态修改。"
      operationId: v1_security_governance_simulate
      requestBody:
        required: true
