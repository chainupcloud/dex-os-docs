        outcome:
          type: string
          nullable: true
          description: "`Succeeded` or `Failed`. null while `resultsPending` is true: no result source has yet confirmed that it covers this command, so the business result is still unknown. Once the result exists, `outcome` comes with the full business result; a business rejection is reported in `businessRejected`. If a result source covers the command but the result is missing, or a result source reports an error, the request returns 503 `security_result_unavailable`."
          enum:
            - Succeeded
            - Failed
            - null
        resultsPending:
          type: boolean
          description: |-
            Present and `true` only while no result source (local or configured remote) has yet confirmed that it covers this command, including while a remote source is temporarily unreachable or access to it is not yet granted. `events` and `outcome` are then null; keep polling. Once the result exists, the response carries `events`, `businessRejected` and the other result fields, and omits `resultsPending`.

            If the result has aged out of the local window, history is looked up asynchronously. With several remote sources, a ready source wins; if none is ready and any source reports an error, the request returns 503; it stays pending only while every source is merely unreachable or behind. A 503 is also returned when a source reports an error, or covers the command but has no result for it. The catch-up wait of a single read is at most 100 ms (not a limit on the whole HTTP request); the total budget, including the read, is 5 seconds. A healthy deployment can also return 503 after restoring from a snapshot before history is backfilled, or when it does not retain that history. A 503 never means the command did not execute, and never makes a resubmission safe.
