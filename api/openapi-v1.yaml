        Returns the 160-byte `hookData` and burn calldata for a CCTP deposit. Approve (`burn.approve`), then send `burn.calldata` to `burn.to`.

        - `maxFeeRaw` defaults to the source chain's minimum fee (503 if unreadable).
        - Errors: 400 `beneficiary_forbidden`; 404 `unknown_cctp_source`; 409 `cctp_source_not_registered`, `custody_group_unavailable`, `deposit_not_enabled`; 422 `min_deposit_not_configured`, `below_min_deposit`, `beneficiary_not_signable`, `max_fee_below_minimum`, `amount_unrepresentable`.
      operationId: v1_exchange_cctp_quote
      requestBody:
