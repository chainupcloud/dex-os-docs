          "$ref": "#/components/responses/BadRequest"
  /v1/account/vaults:
    get:
      tags:
        - Vaults
      summary: My vault positions
      description: "Amounts are decimal USDC strings like every other v1 amount (until v1.1 they were integer USDC atoms); share counts stay integers. Positions held by the address's main account and by its main account's merchant balances are listed together; `dex` says which balance holds the shares (merchant vaults are always held in their own dex)."
      operationId: v1_my_vaults
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: Main wallet address
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  positions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/MyVaultPosition"
        "400":
          "$ref": "#/components/responses/BadRequest"
  /v1/account/withdrawals:
    get:
      tags:
        - Account
      summary: Pending withdrawals
      description: "Full multi-chain list of pending withdrawals for the given address / subaccount, in the envelope `{address, subaccount, withdrawals}`. Every entry has already been debited by the ledger but not yet acknowledged, and includes the full route and amounts; `accountId` is not exposed. A CCTP entry disappearing after acknowledgement does not mean the funds have arrived on the destination chain."
      operationId: v1_withdrawals
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
