      description: "Council 治理总览(M7-8 T8.3):当前 Council(成员、门限、纪元)、Council 在 Management 通道的 nonce 窗口(`next` = 建议的下一个)、延迟政策(8 个延迟类)、提案名额、可信时间与网络 profile。只读,取同一已发布视图,带 `x-dexos-min-seq` 读自己的写。"
