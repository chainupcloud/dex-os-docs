  "/v1/agents/{address}":
    get:
      tags:
        - Account
      summary: Accounts an API wallet acts for
      description: "Reverse lookup by API wallet address: every account that authorized it, as main wallet address + subaccount index (or manager address + `vault`). Lets a client that only holds the API wallet key complete its identity. No authorization = empty list (not 404). Never contains numeric account ids. **Secure ledger**: one row per (usable 141 grant, covered account), and one row per usable Dex-scope management grant (`dex` set, `address` = the owner's main wallet, no `subaccount`), with `grantId`, `grantEpoch`, `status`, `actions`, `validFrom`, `validUntil`, `expired` and `executable`; accounts whose signing policy is not a single address are left out. These rows are an **inventory**, not the set of grants that can execute right now: paused, expired and not-yet-valid grants are listed with their `status` / `expired` / `validFrom`; `executable` is true only when the ledger would accept the grant itself at the current certified time (issued under the current policy epoch, `active`, inside `validFrom`..`validUntil`). A command can still be refused for its action, account or market scope or limits."
      operationId: v1_agent_grants
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: API wallet address
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - agent
                  - grants
                properties:
                  agent:
                    type: string
                    pattern: "^0x[0-9a-f]{40}$"
                    description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                  grants:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AgentGrant"
        "400":
          "$ref": "#/components/responses/BadRequest"
  /v1/builder:
    get:
      tags:
        - Market data
      summary: The builder behind this entry
      description: "The builder (front-end operator) this request resolves to and the markets it lists, for a white-label front end to render its market list. `?builder=<builderId>` asks for one explicitly; without it the entry domain decides (the request `Host`, or behind the operator's trusted reverse proxies the single `X-Forwarded-Host` they overwrite). An entry domain bound to no builder is the platform's own entry: the answer is 200 `{\"builderId\": null, \"domain\": \"<resolved domain>\"}` (`PlatformEntry`), not an error. Markets with symbol metadata whose status is `listed` or `closeOnly` appear (hidden markets still accept orders but are not shown); each row carries the full `symbol` (use it for every order, cancel and close), `display` (the only name a builder front end shows: the builder's custom display name when set, otherwise the symbol without the `<dex code>:` prefix; custom names are unique per kind among listed / hidden rows only, so during a source switch a `closeOnly` row and a `listed` row can share it) and `status` (`closeOnly` = only reduce-only orders, show it as close-only). Each row also carries the builder's category codes (`tags`); `categories` gives their display names (the builder's own categories ∪ the platform templates its visible rows use). `fees` is the builder's default and per-market front-end fee rates (decimal; the per-account layer is not exposed). The payout account is not exposed. Unresolvable → 404 `GatewayBuilderNotFound`."
      operationId: v1_builder
      parameters:
        - name: builder
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
          description: "builderId (decimal); without it the entry domain is used"
      responses:
        "200":
          description: "Success: the builder view, or `PlatformEntry` when the entry domain is bound to no builder (no `?builder=` given)"
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/BuilderView"
                  - "$ref": "#/components/schemas/PlatformEntry"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          description: "No builder for an explicit `?builder=` (`GatewayBuilderNotFound`, num 10404; `details.builder`), or the entry domain is bound to a builder that does not exist (`details.domain`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/v1/builders/{address}/summary":
    get:
      tags:
        - Market data
      summary: Builder fee summary
      description: "`builder_fee` ledger entries received by this builder address (its main account), totalled per token; `startTime` / `endTime` filter in Unix milliseconds. **Volume attributed to the builder** needs the ClickHouse projection and arrives in v1.1."
      operationId: v1_builder_summary
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix time in milliseconds
          description: Start (inclusive)
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Unix time in milliseconds
          description: End (exclusive)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
          description: Page size
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BuilderSummary"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
  /v1/dexes:
    get:
      tags:
        - Market data
      summary: Builder dex list
      description: "Owner / collateral token / insurance account / surcharge / margin table / market set of each builder dex, and its short code `code` (the prefix of its market symbols). `markets` lists the dex's perpetual markets only; `spotMarkets` lists its spot markets (dex 0 = platform spot pairs, dex ≥ 1 = the merchant's spot pairs)."
