          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: "0x 十六进制"
              required:
                - command
        description: "一条 139 的规范编码"
      responses:
        "200":
          description: "模拟结果"
          content:
            application/json:
