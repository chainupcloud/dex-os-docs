      description: "Markets whose current oracle policy follows reporter set `id` (a FeedRef with `setId = id` and `setEpoch = 0`, M10 6.1.5 / O11), to see what a change of operators (GovOp 13) affects: `setId`, `setEpoch` (the set's current epoch, null when the set does not exist), `followers` = [{market, dex, policyVersion, policyStatus, minIndependentSources}] ascending by market. Policies pinned to an epoch are not listed. 400 `invalid_reporter_set` when `id` is not a decimal u64."
      operationId: v1_security_reporter_set_followers
      parameters:
