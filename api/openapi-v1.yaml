            - integer
            - "null"
          description: "Window start: max(now − period, seriesStartMs); for `all`, seriesStartMs"
        asOfMs:
          type:
            - integer
            - "null"
          description: Time of the latest sample (at most one sampling period old)
        seriesStartMs:
          type:
            - integer
            - "null"
          description: "First sample of this account in this epoch; null = never sampled yet"
        total:
          "$ref": "#/components/schemas/PortfolioScope"
        perp:
          "$ref": "#/components/schemas/PortfolioScope"
        unvaluedTokens:
          type: array
          items:
            type: string
          description: Tokens held in the window that have no USDC price and are not counted
        gaps:
          type: array
          items:
            type: object
            required:
              - fromMs
              - toMs
            properties:
              fromMs:
                type: integer
              toMs:
                type: integer
          description: Intervals whose PnL is not counted because the execution history between two samples is missing
    PortfolioPoint:
      type: object
      required:
        - ts
        - accountValue
        - pnl
        - netInflow
      properties:
        ts:
          type: integer
          description: "Bucket start (unix ms); the values are the bucket's last sample"
        accountValue:
          type: string
          description: USDC amount as a decimal string
        pnl:
          type: string
          description: USDC PnL since the first point of the window
        netInflow:
          type: string
          description: USDC net inflow since the first point of the window
    PortfolioScope:
      type: object
      required:
        - history
        - pnl
        - returnRate
        - maxDrawdown
        - volume
        - fees
      properties:
        history:
          type: array
          items:
            "$ref": "#/components/schemas/PortfolioPoint"
        pnl:
          type:
            - string
            - "null"
          description: "Last point − first point (USDC); null when the window has no point"
        returnRate:
          type:
            - string
            - "null"
          description: "Time-weighted return over the window, chaining `(V_k − ΔN_k) / V_{k−1}` per bucket (segments starting at a non-positive value are skipped); deposits and withdrawals do not move it. Null without a usable segment"
        maxDrawdown:
          type:
            - string
            - "null"
          description: "Largest fall of the time-weighted return index from its running peak, in [0, 1]; deposits and withdrawals never cause a drawdown. Null with fewer than 2 points"
        volume:
          type:
            - string
            - "null"
          description: "Traded notional in the window (USDC), as taker or maker; `perp` counts perpetual markets only, `total` adds spot"
        fees:
          type:
            - string
            - "null"
          description: "Net trading fees paid in the window (USDC): taker + maker fees − maker rebates + builder fees + dex deployer fees"
    Position:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        side:
          type: string
          enum:
            - long
            - short
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Signed size in base units: positive = long, negative = short (the same sign as `side`)"
        entryPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        markPrice:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        notional:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: USDC
        unrealizedPnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: USDC, signed
        fundingIndex:
          type: string
        marginMode:
          type: string
          enum:
            - cross
            - isolated
          description: "`isolated`: the position has its own margin bag; its losses cannot reach the cross balance and it is liquidated on its own"
        rawUsd:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only (HL `rawUsd`): bag cash, including the opening consideration — negative for a long, positive for a short. `null` for a cross position"
        isolatedEquity:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: `rawUsd` + position at the mark price + accrued funding. `null` for a cross position"
        isolatedMarginUsed:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: initial margin of this position. `null` for a cross position"
        isolatedMaintenanceMargin:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: maintenance margin of this position; liquidated when `isolatedEquity` < this. `null` for a cross position"
        isolatedRemovable:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: how much margin `POST /v1/account/isolated-margin` can remove now = max(0, isolatedEquity − isolatedMarginUsed); always 0 on `strictIsolated` markets. `null` for a cross position"
        liquidationPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Isolated only: mark price at which `isolatedEquity` falls to `isolatedMaintenanceMargin`, solved from the bag (truncated to the price decimals). `null` for a cross position (it depends on the whole cross pocket), for tiered-margin markets, and when the bag is deep enough that no positive price liquidates it"
      required:
        - symbol
        - side
        - size
        - entryPrice
        - markPrice
        - notional
        - unrealizedPnl
        - fundingIndex
        - marginMode
        - rawUsd
        - isolatedEquity
        - isolatedMarginUsed
        - isolatedMaintenanceMargin
        - isolatedRemovable
        - liquidationPrice
    Price:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        last:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        mark:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        oracle:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestBid:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        bestAsk:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingRate:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        fundingIndex:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+$"
          description: "Cumulative funding index after the latest settlement, as an integer string (the same value as `fundingIndex` in `/v1/markets` and the `index` of the funding channel); null for spot"
        lastFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "Block time of the latest funding settlement (Unix ms); null for spot and before the first settlement"
        nextFundingMs:
          type:
            - integer
            - "null"
          format: int64
          description: "When the next funding settlement is due: the first period boundary after `lastFundingMs`, where boundaries are multiples of `fundingTickSec` (from `GET /v1/exchange`) since the Unix epoch, i.e. the top of every UTC hour for 3600. Settlement happens at the first funding sample whose block time reaches it, so the actual time can be one sample interval later. null for spot and before the first sample"
        openInterest:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        prevDayPrice:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Open of the rolling 24h window (first 1-minute candle in it). null when the market had no tick in the window, or 24h statistics are unavailable
        change24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "(close − open) / open over the rolling 24h window, as a ratio (0.01 = 1%), 8 decimals truncated toward zero. null when there is no open price"
        high24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Highest price in the rolling 24h window (same data as the 1-minute candles)
        low24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Lowest price in the rolling 24h window
        volume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Traded size in base units over the rolling 24h window. \"0\" when nothing traded; null when 24h statistics are unavailable"
        quoteVolume24h:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size of the trades in the rolling 24h window, in quote units. null when unknown (24h statistics unavailable, or the window only holds migrated candles without per-trade ticks)"
    Subaccount:
      type: object
      properties:
        subaccount:
          type: integer
        isMain:
          type: boolean
        signingAccountId:
          type: integer
          description: "**Signing only.** The value for `fromAccount` / `toAccount` in the `Transfer` struct and for `accountId` when acting as this subaccount"
        name:
          type: string
          description: "Gateway label set at creation (`sigVersion: 2`) or via `POST /v1/account/subaccounts/name`; empty when never named"
    Ticker:
      type: object
      properties:
        symbol:
          type: string
          description: "Market symbol such as `BTC-USD` (perpetual) or `BTC-USDC` (spot); a merchant dex's markets carry its short code, `<code>:BTC-USD` (`:` may be sent as is or percent-encoded as `%3A`); case-insensitive"
          examples:
            - BTC-USD
        kind:
          type: string
          enum:
            - perp
            - spot
          description: "Market type. A perp and a spot market may share a symbol; `symbol` + `kind` names exactly one market."
        open:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the first trade in the window; null when the market had no trades"
        high:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Highest trade price in the window; null when no trades"
        low:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Lowest trade price in the window; null when no trades"
        last:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Price of the last trade in the window; null when no trades"
        volume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Total traded size in the window (base asset)
        quoteVolume:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Σ price × size in the window (quote asset)"
        trades:
          type: integer
          description: Number of trades in the window
    Trade:
      type: object
      properties:
        id:
          type: string
          description: "Trade id `<seq>-<sub>-<idx>`; the same id as the WebSocket `trades` frame"
        price:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        size:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Decimal string
        side:
          type: string
          enum:
            - buy
            - sell
          description: Taker side
        ts:
          type: integer
          format: int64
          description: Unix time in milliseconds
    Vault:
      type: object
      description: "A vault (specification v1.1 §4.9-10): USDC amounts are decimal strings, NAV per share is a ratio, shares are integer strings, rates are ppm integers. No numeric account id appears — the account a vault signs with is `GET /v1/account/nonce?vault=` → `signingAccountId`; markets appear by symbol only"
      required:
        - vault
        - address
        - dex
        - name
        - description
        - creator
        - creatorSubaccount
        - manager
        - managerSubaccount
        - hasManager
        - leader
        - tradingHalt
        - lpShares
        - managerShares
        - totalShares
        - lpBalance
        - managerBalance
        - lastCheckedEquity
        - hwm
        - equity
        - unattributed
        - totalDeposits
        - pnl
        - managerPortionPpm
        - navPerShare
        - navPerShareByClass
        - config
        - whitelist
        - blacklist
        - maxLeverages
        - depositorWhitelist
        - depositorCount
        - createdAtMs
        - aprPpm
        - maxDrawdownPpm
        - netReturnPpm
        - inceptionAprPpm
        - utilizationPpm
        - profitSharePpm
        - marketVaults
        - authorizedManager
        - confirmedTradingHalt
        - pendingClaim
      properties:
        vault:
          type: integer
          description: "Vault id (the `vault` of `?vault=` reads, write envelopes and WebSocket subscriptions)"
        address:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "The vault's own address (no private key exists for it): the main account is subaccount 0 of this address, so `?address=<this>&subaccount=0` reads the vault and address-level fee rules apply to it. A manager or its API wallet trades it with a `sigVersion` 2 `Action` whose `account` is this address. Derived as the last 20 bytes of `keccak256(\"dex-os/vault-address\" ‖ EIP-712 domain separator ‖ uint16 vault ‖ uint8 salt)`, salt being the first one with no account yet; read it here rather than computing it"
        dex:
          type: integer
          description: "The vault's dex, fixed at creation: `0` = platform vault (created by the platform; deposits come from the platform balance; on merchant markets it trades through its per-market sub-vaults), `>= 1` = merchant vault (created on that merchant's site; creator, manager and depositors all use their balance in that dex, and the vault trades only that dex's perps)."
        name:
          type: string
        description:
          type: string
        creator:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Main wallet of the account that created the vault; null for an internal account"
        creatorSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the creating account under `creator` (same numbering as `subaccount=`)"
        manager:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "柜员资金侧manager owner地址，可能先于authorizedManager生效；不得据此判定管理权限。"
        managerSubaccount:
          type:
            - integer
            - "null"
          description: "Subaccount index of the claiming account under `manager`; null while unclaimed"
        hasManager:
          type: boolean
        leader:
          type:
            - string
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "Legacy alias: `manager`, or `creator` while unclaimed"
        tradingHalt:
          type: boolean
          description: "Halted (below the halt threshold): orders cancelled, positions closed, only cancels allowed"
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: "LP share units (integer; not a token amount)"
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: Manager share units (integer)
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: "`lpShares + managerShares`"
        lpBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the LP class, USDC
        managerBalance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Balance attributed to the manager class, USDC
        lastCheckedEquity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Equity at the last ledger sync, USDC
        hwm:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: High-water mark for the profit share, USDC
        equity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Vault equity (main account net collateral), USDC
        unattributed:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − lpBalance − managerBalance` (PnL not yet synced into the classes), USDC"
        totalDeposits:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: Sum of the principal shown to every depositor, USDC
        pnl:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "`equity − totalDeposits` (signed), USDC"
        managerPortionPpm:
          type:
            - integer
            - "null"
          description: "Manager balance / attributed balance, ppm; null when nothing is attributed"
        navPerShare:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Equity per share as a ratio (1 = par at the first deposit); null while there are no shares"
        navPerShareByClass:
          type: object
          required:
            - lp
            - manager
          properties:
            lp:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "LP class balance per LP share (ratio); null without shares"
            manager:
              type:
                - string
                - "null"
              pattern: "^-?[0-9]+(\\.[0-9]+)?$"
              description: "Manager class balance per manager share (ratio); null without shares"
        config:
          "$ref": "#/components/schemas/VaultConfig"
        whitelist:
          type:
            - array
            - "null"
          items:
            "$ref": "#/components/schemas/VaultMarket"
          description: "null = every market allowed; otherwise only these (an empty list allows none)"
        blacklist:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarket"
        maxLeverages:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMaxLeverage"
          description: "Per-market leverage caps; markets without a cap are absent"
        depositorWhitelist:
          type: array
          items:
            type: string
            pattern: "^0x[0-9a-f]{40}$"
            description: "EVM address (always lower-case in responses; case-insensitive in requests)"
          description: "Empty = anyone may deposit"
        depositorCount:
          type: integer
        createdAtMs:
          type:
            - integer
            - "null"
          description: "Block time of the vault's creation; null before the first block"
        aprPpm:
          type:
            - integer
            - "null"
          description: "Annualised return over the metric window, ppm; null when it cannot be computed"
        maxDrawdownPpm:
          type:
            - integer
            - "null"
          description: "Maximum drawdown of NAV per share over the metric window, ppm; null when it cannot be computed"
        netReturnPpm:
          type:
            - integer
            - "null"
          description: "`pnl / totalDeposits`, ppm; null without principal"
        inceptionAprPpm:
          type:
            - integer
            - "null"
          description: "Net return annualised over the vault's age, ppm; null without principal or under one day old"
        utilizationPpm:
          type:
            - integer
            - "null"
          description: "Main-account IMR / equity, ppm; null when equity is not positive while margin is in use"
        profitSharePpm:
          type: integer
          description: "Legacy alias of `config.profitSharePpm`"
        marketVaults:
          type: array
          items:
            "$ref": "#/components/schemas/VaultMarketStatus"
        authorizedManager:
          type:
            - string
            - "null"
          description: "已经日志确认生效的manager owner地址；null表示尚无授权。资金侧manager可能已经存在，权限预检使用本字段对应的权威数据。"
        confirmedTradingHalt:
          type: boolean
          description: "翻译器最后确认的熔断状态；柜员tradingHalt始终约束执行。"
        pendingClaim:
          type:
            - object
            - "null"
          required:
            - logIdx
            - ordinal
            - slot
            - status
          properties:
            logIdx:
              type: string
              pattern: "^[0-9]+$"
              description: "完整u64日志序号的十进制字符串，保留超过2^53的精度。"
            ordinal:
              type: integer
              minimum: 0
              maximum: 65535
            slot:
              type: integer
              minimum: 0
              maximum: 4095
            status:
              type: string
              enum:
                - pending
          description: "待确认认领；logIdx/ordinal指向原请求。"
    VaultConfig:
      type: object
      required:
        - profitSharePpm
        - depositMinDurationMs
        - managerMinPortionPpm
        - managerLiqPortionPpm
        - withdrawWindowS
        - withdrawDurationS
        - depositCap
      properties:
        profitSharePpm:
          type: integer
          description: "Manager's profit share, ppm"
        depositMinDurationMs:
          type: integer
          description: Lock-up of each deposit, ms
        managerMinPortionPpm:
          type:
            - integer
            - "null"
          description: "Minimum manager portion, ppm; null = none"
        managerLiqPortionPpm:
          type:
            - integer
            - "null"
          description: "Halt threshold, ppm: below this manager portion the vault stops trading, cancels and closes out; null = none"
        withdrawWindowS:
          type:
            - integer
            - "null"
          description: "Redemption window period, seconds; null = redeem any time"
        withdrawDurationS:
          type:
            - integer
            - "null"
          description: Length of the open part of each window, seconds
        depositCap:
          type:
            - string
            - "null"
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
          description: "Deposit cap, USDC; null = none"
    VaultDepositors:
      type: object
      required:
        - vault
        - lpShares
        - managerShares
        - totalShares
        - depositors
        - count
        - truncated
      properties:
        vault:
          type: integer
        lpShares:
          type: string
          pattern: "^[0-9]+$"
          description: LP share units
        managerShares:
          type: string
          pattern: "^[0-9]+$"
          description: Manager share units
        totalShares:
          type: string
          pattern: "^[0-9]+$"
          description: All shares
        depositors:
          type: array
          items:
            type: object
            required:
              - address
              - class
              - shares
              - equity
              - sharePpm
            properties:
              address:
                type:
                  - string
                  - "null"
                pattern: "^0x[0-9a-f]{40}$"
                description: "Depositor's main wallet; null for an internal account"
              class:
                type: string
                enum:
                  - lp
                  - manager
              shares:
                type: string
                pattern: "^[0-9]+$"
                description: Share units (integer)
              equity:
                type: string
                pattern: "^-?[0-9]+(\\.[0-9]+)?$"
                description: Value of the shares, USDC
              sharePpm:
                type:
                  - integer
                  - "null"
                description: "Share of its class, ppm; null when the class has no shares"
        count:
          type: integer
        truncated:
          type: boolean
    VaultDetail:
      allOf:
        - "$ref": "#/components/schemas/Vault"
        - type: object
          required:
            - nextNonce
            - availableToWithdraw
            - positions
