                    nullable: true
                    properties:
                      reason:
                        type: string
                        enum:
                          - withdrawn
                          - superseded
                      replacedBy:
                        type: string
                        nullable: true
                      atMs:
                        type: string
                        pattern: "^[0-9]+$"
                  meta:
                    type: object
                    nullable: true
                    additionalProperties: false
                    properties:
                      reference:
                        type: string
                      kind:
                        type: string
                      label:
                        type: string
                      group:
                        type: string
                      groupIndex:
                        type: integer
                      groupSize:
                        type: integer
                      after:
                        type: array
                        items:
                          type: string
                  source:
                    type: string
                    enum:
                      - admin
                      - public
                      - migrated
                  registeredBy:
                    type: string
                    nullable: true
                  createdMs:
                    type: string
                    pattern: "^[0-9]+$"
                  updatedMs:
                    type: string
                    pattern: "^[0-9]+$"
        "400":
          description: "Malformed parameter (`invalid_request_id`)"
        "404":
          description: "No such collection (`unknown_collection`)"
        "503":
          description: "Ledger view or signature store not ready (`signature_store_unavailable`); retry later"
  "/v1/custody/{key}/late-deposits":
    get:
      tags:
        - Funds
      summary: Late deposit receipts
      description: |-
        Late-deposit receipts of a custody group in a block range (custody-chain logs). A CCTP deposit is held in `CustodyVault`, uncredited, if it arrives after the group froze and its escape wait expired, is not a multiple of the asset quantum, is below the `Inbox` minimum (or none set), or its beneficiary cannot sign (has code, not EIP-7702). Anyone may trigger a refund; the operator refunds automatically.

        - `refunded` covers only refunds in the range; see `/late-deposits/{id}` for current state.
      operationId: v1_custody_late_deposits
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: "`custodyKeyHash` (0x-prefixed 32-byte hex)"
        - name: fromBlock
          in: query
          required: false
          schema:
            type: string
          description: "Decimal; default `toBlock - 9999`"
        - name: toBlock
          in: query
          required: false
          schema:
            type: string
          description: "Decimal; default the latest custody-chain block"
        - name: beneficiary
          in: query
          required: false
          schema:
            type: string
          description: Only receipts for this beneficiary (0x-prefixed 20-byte address)
      responses:
        "200":
          description: Late-deposit receipts in the block range
          content:
            application/json:
              schema:
                type: object
                properties:
                  custodyKeyHash:
                    type: string
                  custodyVault:
                    type: string
                  fromBlock:
                    type: string
                    description: Decimal string
                  toBlock:
                    type: string
                    description: Decimal string
                  source:
                    type: string
                  lateDeposits:
                    type: array
                    items:
                      type: object
                      properties:
                        lateDepositId:
                          type: string
                          description: "Receipt id = `keccak256(abi.encode(keccak256(\"DEXOS/LateDeposit/v1\"), custodyKeyHash, sourceMessageId))`"
                        assetId:
                          type: integer
                        assetVersion:
                          type: string
                          description: Decimal string
                        beneficiary:
                          type: string
                          description: "Beneficiary signed into the source-chain burn's hook data; late-deposit refunds go only to this address"
                        amountRaw:
                          type: string
                          description: "Net amount received (`amount - feeExecuted`), raw token units"
                        sourceMessageId:
                          type: string
                        bindingHash:
                          type: string
                        blockNumber:
                          type: string
                          description: Decimal string
                        transactionHash:
                          type: string
                        refunded:
                          type: boolean
                          description: "`LateDepositRefunded` seen within this block range"
                        refundBlockNumber:
                          type:
                            - string
                            - "null"
                          description: "Decimal string; null if not refunded"
                        refundTransactionHash:
                          type:
                            - string
                            - "null"
        "400":
          description: "`invalid_custody_key_hash` / `invalid_query` (numbers must be decimal) / `invalid_block_range` (`fromBlock` > `toBlock`) / `block_range_too_large` (over 100,000 blocks)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "`unknown_custody_group`"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "`chain_rpc_failed`: upstream RPC error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "`chain_rpc_unavailable`: no RPC endpoint for this custody chain"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/custody/{key}/late-deposits/{id}":
    get:
      tags:
        - Funds
      summary: Late deposit receipt
      description: "On-chain state of one late deposit receipt (`CustodyVault.lateReceipt`): asset, beneficiary account, refund address, net amount, source and final message hashes, and whether it was refunded."
