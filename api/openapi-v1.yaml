  /v1/security/price-venues:
    get:
      tags:
        - Security
      summary: Price venues
      description: "The ledger's price venue table (GovOp 27 kind 9, M10): every registered venue by number, ascending, with its name (1..=16 bytes of a-z, 0-9 and -, unique, fixed once registered), whether it is enabled and its own version (a number never registered has version 1; the Council puts `version` into `expectedVersion`). Recipes reference venues by number; reporters treat a disabled venue as unavailable for the round. Empty at genesis; one cut, u64 as decimal strings."
      operationId: v1_security_price_venues
      parameters: []
      responses:
        "200":
          description: Read-only projection of one published CTX (u64 as decimal strings)
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/SecurityMerchantCut"
                  - type: object
                    required:
                      - venues
                    properties:
                      venues:
                        type: array
                        items:
                          type: object
                          required:
                            - venue
                            - name
                            - enabled
                            - version
                          properties:
                            venue:
                              type: integer
                              minimum: 0
                              maximum: 65535
                            name:
                              type: string
                            enabled:
                              type: boolean
                            version:
                              type: string
                              description: decimal u64
        "503":
          description: Security profile off or read view not ready
  /v1/security/business-parameters:
    get:
      tags:
        - Security
      summary: Business parameters
      description: "Current values and versions of the business parameters (M9 S7, GovOp 27): merchant registration switch, registration capacity, checkpoint period, and per custody group the withdrawal routes / CCTP evidence, finality policies, transfer policies and deposit credit staleness (`custodyGroups`, S8b kinds 4–7); one cut, u64 as decimal strings. Also the current values and versions of GovOp 27 kinds 11–13 (the Council puts `version` into `expectedVersion`): `platformFees{version, default, builders, accounts, dexes}` (kind 11 platform fees: `default` = the exchange-wide default {takerPpm, makerPpm} or null, `builders` = [{builder, takerPpm, makerPpm}], `accounts` = [{builder, account, takerPpm, makerPpm}], `dexes` = [{dex, builder}], the builder whose (builder, account) and builder layers bill orders without a builder on that merchant dex's markets; each ascending by key); `vaultAdmission{version, enabled, creationFee, minDeposit}` (kind 12 vault admission, amounts as decimal strings); `feeSchedule{version, baseTakerPpm, baseMakerPpm, tiers: [{takerPpm, makerPpm}]}` (kind 13 base rates and tiers, maker may be negative). Kind 8: `maxMarketsPerDex{max, version}` (the per-dex market cap; every market of the dex counts, frozen and final-settled included). Kind 9: `priceVenues` = [{venue, name, enabled, version}] ascending by venue (the price venue table; a venue never renames and its number is never reused; `version` goes into `expectedVersion`, an unregistered venue takes 1)."
      operationId: v1_security_business_parameters
      parameters: []
      responses:
        "200":
          description: "同一已发布 CTX 的只读投影(u64 为十进制字符串)"
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "未启用安全 profile / 读视图未就绪"
  "/v1/security/reporter-sets/{id}/followers":
