  /v1/account/subaccounts/name:
    post:
      tags:
        - Account
      summary: Rename a subaccount
      operationId: v1_subaccount_name
      description: |-
        Gateway-only (the name is not part of the ledger). Not sequenced: no `seq` / `requestId`.

        **Security ledger** (node started with a security Manifest): body `{account: main account id, subaccount: index (0 = main), name, nonce, policyEpoch, signatures: [...]}` (first `oneOf` branch). Members of the main account policy sign `x-eip712.securityTypeString` in domain `DEXOS/SubaccountName` (version 1, chainId = Manifest `nodeChainId`, verifyingContract = Manifest `nodeVerifier`) up to the policy threshold; `networkId`, `genesisHash` and `ledgerEpoch` come from the Manifest, `policyId` / `policyEpoch` from `GET /v1/security/accounts/{id}`. The SDK (`dex_sdk::offchain`) and sdk-wasm (`subaccountName`) build the digest and the `eth_signTypedData_v4` payload. Names and nonces are kept per ledger identity (`genesisHash`, `ledgerEpoch`): a new ledger starts with no names and no nonce floor. Read back as `name` in `GET /v1/account/subaccounts`.

        **Legacy ledger**: body `{account: address, subaccount, name, nonce, signature}` (second branch); the owner signs `x-eip712.typeString`.

        Either way `nonce` must be greater than the last name write of this subaccount (409 `GatewayConflict` otherwise).

        **EIP-712 struct**

        ```
        SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        ```

        **Security-ledger struct** (domain `DEXOS/SubaccountName`)

        ```
        SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        ```
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - title: Security ledger
                    type: object
                    required:
                      - status
                      - account
                      - subaccount
                      - name
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      account:
                        type: integer
                        format: int64
                        description: Main account id, as sent
                      subaccount:
                        type: integer
                        description: "Subaccount index, as sent (0 = main account)"
                      name:
                        type: string
                        description: The stored name, exactly as signed
                  - title: Legacy ledger
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                      address:
                        type: string
                        pattern: "^0x[0-9a-f]{40}$"
                        description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                      subaccount:
                        type: integer
                      name:
                        type: string
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          description: "Bad signature (`GatewayBadSignature`): below the policy threshold, a signer that is not a member, the same signer twice, more signatures than members, or a signature over another domain / message"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "`GatewayConflict`: the nonce is not greater than the last name write of this subaccount (`details.subaccount`), or (security ledger) `policyEpoch` is not the current policy epoch (`details.policyEpoch` = current)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          "$ref": "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Security ledger
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - policyEpoch
                    - signatures
                  properties:
                    account:
                      type: integer
                      format: int64
                      minimum: 0
                      maximum: 4294967295
                      description: "Main account id (the policy account). A subaccount or other derived account id is 400; an unknown account is 404."
                    subaccount:
                      type: integer
                      minimum: 0
                      maximum: 65535
                      description: "Subaccount index of this main account; 0 names the main account itself. An index that was never opened is 404."
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                      description: "1–32 Unicode scalar values; no leading or trailing whitespace (Unicode White_Space) and no control or format characters (Unicode Cc / Cf, e.g. NUL, newline, U+200B, U+202E, U+FEFF). Sent exactly as signed: the gateway does not trim, so a name outside this rule is 400, not 401."
                    nonce:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                          maximum: 9223372036854776000
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "JSON integer or decimal string in [0, 2^63). Must be greater than the last accepted name write of this (ledger, account, subaccount) — 409 `GatewayConflict` otherwise; a Unix-ms timestamp works."
                    policyEpoch:
                      oneOf:
                        - type: integer
                          format: int64
                          minimum: 0
                        - type: string
                          pattern: "^[0-9]+$"
                      description: "The account policy epoch that was signed (`policyEpoch` of `GET /v1/security/accounts/{id}`). Not the current epoch: 409 `GatewayConflict` with `details.policyEpoch` (decimal string) = the current one."
                    signatures:
                      type: array
                      minItems: 1
                      maxItems: 16
                      items:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{130}$"
                      description: "65-byte secp256k1 signatures (r ‖ s ‖ v) over the EIP-712 digest of `x-eip712.securityTypeString` in domain `x-eip712.securityDomain`, one per signing member of the main account policy, in any order. v may be 27/28 or 0/1; high-s is normalised to low-s. At least the policy threshold, no signer twice, every signer a member, and no more signatures than the policy has members (at most 16) — 401 `GatewayBadSignature` otherwise (more than 16 is 400)."
                - title: Legacy ledger
                  type: object
                  required:
                    - account
                    - subaccount
                    - name
                    - nonce
                    - signature
                  properties:
                    account:
                      type: string
                      pattern: "^0x[0-9a-f]{40}$"
                      description: "EVM address (always lower-case in responses; case-insensitive in requests)"
                    subaccount:
                      type: integer
                    name:
                      type: string
                      minLength: 1
                      maxLength: 32
                    nonce:
                      type: integer
                      format: int64
                      description: Any value greater than the previous name write (a Unix-ms timestamp works)
                    signature:
                      type: string
                      pattern: "^0x[0-9a-fA-F]{130}$"
                  description: "Legacy ledger only: the owner address signs `SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)` (`x-eip712.typeString`). Refused with 400 on a security ledger."
      x-eip712:
        typeString: SubaccountName(address owner,uint16 subaccount,string name,uint64 nonce)
        securityTypeString: SubaccountName(bytes32 networkId,bytes32 genesisHash,uint64 ledgerEpoch,uint64 policyId,uint64 policyEpoch,uint32 account,uint16 subaccount,string name,uint64 nonce)
        securityDomain: DEXOS/SubaccountName
  /v1/commands:
    post:
      tags:
        - Security
      summary: "提交完整新签名命令"
      description: "仅可用于已绑定可信NetworkManifest的节点。JSON仅含command小写0x规范hex；先限制body和规范编码，不验权、不代签、不补nonce/TTL。Top收139（控制Inner 141–147、149–152、154 FreezeMarket；业务Inner按授权即结清；155 ResumeMarket只经GovOp 16）、140、148、156 SubmitOracleRound（顶层报价证书：报告数≤签名数上限、规范编码≤min(信封上限,1 MiB)，请求身份=报告集哈希，没有请求事实）、链上事实证书159/162/165/166/169/170/172/176/177，其余Top拒绝；STF独立验签与判定。投影反压期间路径放行、解码后分类：148、156、链上事实证书与139内层撤单类/资金费采样/清算/154冻结/175恢复批次照收，其余返回503带Retry-After。202只证明定序，seq为宿主位号字符串；nonceConsumed=null、duplicate=false不代表首次执行。幂等重发：leader上签名预检通过（签名者核对为声明主体）之后、扣账户桶与cid去重之前，若账本已有该requestId的ActionReceipt且摘要与本次载荷相同，返回200与第一次受理的回执（seq/sub为第一次的宿主位号与命令序，x-dexos-seq同第一次seq；status/outcome/events同GET /v1/requests/{requestId}），duplicate=true，不再定序；摘要不同或签名不过照旧。读模型尚未看到第一次受理（并发在途）时照常定序，由账本按nonce判重放，不产生新的执行。通过GET /v1/requests/{requestId}查询。请求重发必须保留完整原件；提交结果超时为Unknown，不能推断未执行。总core预算10s，代理15s；不支持wait/ack参数。正文上限2*min(Manifest.maxEnvelopeBytes,1048576)+64，签名/操作等还受Manifest预算；无pin返回503。此接口不证明SecurityActive或资金终局。账户限流（G-rate，与 v1 写口同一套参数与口径）：leader 上 139 的签名预检恢复出签名者后，按账本同一规则核对它们属于声明的主体（账户主体 = 签名策略成员且达门限；代理主体 = 该授权的被授权地址，授权须由该账户策略签发），核对通过才按签名主体扣账户桶：单一地址的策略记在 addr:<地址>，多签策略记在 policy:<策略号>，代理写记在签发授权的账户上；权重 1 + floor(n / 40)（n = 内层批量的下单 + 撤单 + 改单条数），IP 桶另扣权重 − 1；超额 429 GatewayRateLimited（details.bucket = account）。核对不通过（签名者不是成员、不够门限）与读模型判不了的主体（策略或授权尚未读到、纪元超前）：不扣账户桶，改按请求全权重扣独立 unverified IP 桶（V1_UNVERIFIED_RATE_LIMIT_PER_MIN，建议缺省 60/分钟，0 关闭，与 IP 桶使用同一 IPv6 前缀）；额度内照常定序交账本判定（网关不因成员关系拒，M7-10 T10.6），超额 429、不定序。刚开户而读模型尚未看到主体时也走此桶；已扣账户桶的请求不碰此桶。139 服务主体按读模型中当前服务的成员、门限和纪元核实，Council 按当前 Council 策略与纪元核实；通过者是已验证但无账户桶的主体，不扣账户桶或 unverified 桶，仍扣既有 IP 桶。结算币预检（与 POST /v1/orders 同一规则）：上述核对通过之后、定序之前，若 139 内层（含 Routed / RoutedBuilder 壳）是下单类（单笔、BatchPlace、BatchReplace / BatchReplace2 的新单、条件单、止盈止损、TWAP），按内层账户读风险视图：账户有正余额、却没有某个永续市场结算币的余额、且在该市场无仓位（全仓或逐仓）时返回 422 GatewayCollateralTokenMismatch（details = {symbol, kind: \"perp\", settleToken}，message 点名币种），不定序、不耗 nonce；安全账本只有一种结算资产，所以这在账户只持有非结算资产时触发。完全没有余额的账户、持有该结算币的账户照常定序；读模型答不出（或 2 s 内没答）时放行交账本。签名有效，所以 422 之前账户桶已扣。 clientOrderId：签名订单载荷可带 1–36 个 [A-Za-z0-9._:/-] 字符的 cid；有 cid 使用 0xD4–0xD9，无 cid 保持旧编码。按账户从账本受理结果派生索引，已知使用过返回 409 GatewayDuplicateClientOrderId；授权拒绝不占用，受理后业务失败占用。索引可见前并发可能都受理，账本允许跨命令重复。历史缺口返回 503 client_order_index_unavailable。订单读口与 SDK 解码保留 cid。TWAP / TP-SL 无 cid；账本不按 cid 撤改。 builder 预检(非权威,只拒不改;规格 s6-md2-builder §5.1):leader 上签名预检之后、定序之前,139 内层是 0x65 RoutedBuilder 时按签名里的 builder 读模型核对:未登记 400 GatewayBuilderUnknown;已停用(owner 停用或 Council 禁用)403 GatewayBuilderDisabled;内层账户的根账户对该 builder 没有批准 403 builder_not_approved;再按该 builder 的上架目录核新单的市场(单笔、批量、批量替换的新单、条件单、TWAP、止盈止损按只减仓计):不在目录 403 GatewayBuilderMarketNotListed,closeOnly 市场的非只减仓单 403 GatewayBuilderMarketCloseOnly(details = {builder, markets})。改单(ModifyOrder 与 BatchReplace2 的改单项,非只减仓)不论有无 0x65,一律按旧单的 builder 判 closeOnly。不带 0x65 的单不经目录闸门(与入口域名无关)。以上拒绝都是 RejectedBeforeAdmission、nonceConsumed=false,details 带 builder;读模型答不出时放行交账本(账本按 UnknownBuilder / BuilderDisabled / InvalidRouter 权威拒),目录不可用 503 GatewayUnavailable。"
      operationId: v1_security_command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command
              properties:
                command:
                  type: string
                  pattern: "^0x[0-9a-f]+$"
                  minLength: 6
                  maxLength: 2097154
                  description: "偶数个小写hex字符；解码后重编码必须逐字节相同。"
      responses:
        "200":
          description: "同一签名载荷重发：账本已受理过，返回第一次受理的回执，duplicate=true，未再定序。"
          headers:
            x-dexos-seq:
              "$ref": "#/components/headers/x-dexos-seq"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityCommandResubmitted"
        "202":
          description: "仅已接收定序，未证明授权或执行。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityCommandAccepted"
        "400":
          description: "格式/身份/关闭类型/参数在定序前拒绝，nonceConsumed=false。 含 builder 预检的 GatewayBuilderUnknown(签名里的 builder 未登记)。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "403":
          description: "builder 预检拒绝(GatewayBuilderDisabled / builder_not_approved / GatewayBuilderMarketNotListed / GatewayBuilderMarketCloseOnly):RejectedBeforeAdmission,未定序,nonceConsumed=false,details 带 builder(目录类另带 markets)。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "408":
          description: "读body超时，尚未提交。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "409":
          description: "GatewayDuplicateClientOrderId: an admitted earlier command for the same account used this signed cid. RejectedBeforeAdmission; nonceConsumed=false. Resubmitting the same signed payload of an admitted command returns 200 with the first receipt instead."
        "413":
          description: "正文或Manifest预算超限，尚未提交。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "415":
          description: "必须application/json。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "421":
          description: "只读节点或非leader；leader如存在为十进制字符串。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
        "422":
          description: "结算币预检拒绝（GatewayCollateralTokenMismatch，10422）：账户持有资产却没有该永续市场的结算币、且在该市场无仓位；未定序，nonce 未消耗。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "GatewayRateLimited：既有 v1 共享 IP 桶、签名主体账户桶或未核实主体的独立 IP 桶超额（details.bucket = ip | account | unverified），带 retry-after；未定序。unverified 桶按完整请求权重计费，涵盖签名不符、低于门限、代理授权不可用及读模型尚未看到主体；已扣账户桶的请求，以及 139 中签名通过当前服务策略或当前 Council 策略及纪元核实的请求，都不碰它；合法服务与 Council 仅扣既有 IP 桶。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "安全状态不可用，或提交等待/上游故障；提交结果可能Unknown，nonceConsumed=null。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SecurityRequestError"
  "/v1/testnet/markets/{id}/oracle":
