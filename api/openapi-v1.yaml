      data: "Snapshot: `{address, subaccount, orders:[OpenOrder]}`. Update: `{address, subaccount, orderId, clientOrderId, symbol, kind, event: accepted|fill|canceled|expired, status: open|filled|canceled|expired, remaining, side?, price?, size?, filled?, lastFilled?, fillId?, ts}` (`status` and `remaining` always present)"
    fills:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "Fill (the `GET /v1/account/fills` row) + `address`, `subaccount`"
    account:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "Account (the `GET /v1/account` body, same view)"
    positions:
      params:
        - address
        - "subaccount?"
        - "vault?"
      data: "`{address, subaccount, positions:[Position]}` (the `GET /v1/account/positions` body)"
    candles:
      params:
        - symbol
        - "kind?"
        - interval
      data: "Candle (`{symbol, kind, i, t, T, o, h, l, c, v}`); the current bar is sent on every fill. `interval` takes the same values as REST; an unknown one is an error frame"
    funding:
      params:
